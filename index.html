<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>惠海 QC ポータル</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F8FAFC;--card:#FFFFFF;--text:#0F172A;--text2:#64748B;--border:#E2E8F0;
  --common:#5e6d75;--ka1:#2478ac;--ka2:#229759;--ka3:#7e3da2;--ka4:#d66f1c;--ka5:#af3328;--ka6:#128e77;
  --radius:16px;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);
  --shadow-hover:0 8px 24px rgba(15,23,42,.10);
}
body{font-family:'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ===== Header ===== */
.header{position:sticky;top:0;z-index:100;background:rgba(15,23,42,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);padding:0 clamp(16px,3vw,40px);height:56px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-logo{font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:.5px;}
.header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.lang-sw{display:flex;align-items:center;gap:2px;font-size:.72rem;}
.lang-sw button{background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:.72rem;padding:3px 5px;border-radius:4px;transition:all .15s;}
.lang-sw button:hover,.lang-sw button.active{color:#fff;background:rgba(255,255,255,.12);}
.lang-sw .sep{color:rgba(255,255,255,.3);}
.header-user{font-size:.78rem;color:rgba(255,255,255,.8);}
.header-btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.72rem;transition:all .15s;}
.header-btn:hover{background:rgba(255,255,255,.2);}
.update-trigger{position:relative;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.72rem;transition:all .15s;}
.update-trigger:hover{background:rgba(255,255,255,.2);}

/* ===== Main Layout ===== */
.main{max-width:1680px;margin:0 auto;padding:24px clamp(16px,3vw,40px) 60px;}

/* ===== Auth ===== */
#authSection{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 56px);}
.auth-box{background:var(--card);border-radius:var(--radius);padding:32px 28px;width:400px;max-width:90vw;box-shadow:var(--shadow-hover);border:1px solid var(--border);}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;}
.auth-tab{flex:1;text-align:center;padding:10px;font-size:.9rem;font-weight:700;cursor:pointer;border:none;border-bottom:3px solid var(--border);color:var(--text2);background:none;outline:none;}
.auth-tab.active{border-bottom-color:#6366f1;color:#6366f1;}
.auth-form{display:none;flex-direction:column;gap:14px;}
.auth-form.active{display:flex;}
.auth-form input,.auth-form select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;outline:none;background:var(--bg);color:var(--text);}
.auth-form input:focus,.auth-form select:focus{border-color:#6366f1;}
.auth-form button{padding:11px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .15s;}
.auth-form button:hover{background:#4f46e5;}
.auth-msg{font-size:.82rem;min-height:20px;text-align:center;}
.auth-msg.error{color:#ef4444;}
.auth-msg.success{color:#22c55e;}
.auth-hint{font-size:.7rem;color:var(--text2);text-align:center;margin-top:4px;}

/* ===== Search ===== */
.search-area{margin-bottom:28px;}
.search-box{position:relative;max-width:640px;}
.search-input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--border);border-radius:12px;font-size:.88rem;background:var(--card);color:var(--text);outline:none;transition:all .2s;box-shadow:var(--shadow);}
.search-input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:.9rem;pointer-events:none;}
.search-kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.62rem;color:var(--text2);background:var(--bg);border:1px solid var(--border);padding:2px 6px;border-radius:4px;}
.search-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.search-tag{font-size:.68rem;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;}
.search-tag:hover{border-color:#6366f1;color:#6366f1;}
.search-count{font-size:.72rem;color:var(--text2);margin-top:8px;display:none;}
.search-empty{font-size:.82rem;color:var(--text2);margin-top:16px;display:none;text-align:center;padding:32px 0;}

/* ===== Section ===== */
.section{margin-bottom:24px;}
.section-header{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;user-select:none;}
.section-dot{width:4px;height:20px;border-radius:2px;}
.section-label{font-size:.72rem;font-weight:700;color:#fff;padding:2px 10px;border-radius:999px;letter-spacing:.5px;}
.section-title{font-size:.88rem;font-weight:700;color:var(--text);}
.section-count{font-size:.68rem;color:var(--text2);margin-left:4px;}
.section-arrow{margin-left:auto;font-size:.65rem;color:var(--text2);transition:transform .2s;}
.section.collapsed .section-arrow{transform:rotate(-90deg);}
.section.collapsed .section-grid{display:none;}
.section.collapsed .ka1-subgroups{display:none;}

/* ===== Card Grid ===== */
.section-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:4px 0 8px;}
@media(max-width:1280px){.section-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(max-width:1024px){.section-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:768px){.section-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:390px){.section-grid{grid-template-columns:1fr;}}

/* ===== 1課 Subgroups ===== */
.ka1-subgroups{display:flex;flex-direction:column;gap:16px;padding:4px 0 8px;}
.tool-subgroup{min-width:0;--subgroup-color:var(--ka1);--subgroup-tint:rgba(36,120,172,.08);--subgroup-text:#245a7a;}
.tool-subgroup-title{
  display:flex;align-items:center;gap:8px;margin-bottom:9px;padding:7px 10px;
  border-left:3px solid var(--subgroup-color);border-radius:0 7px 7px 0;
  background:var(--subgroup-tint);color:var(--subgroup-text);font-size:.75rem;font-weight:700;
}
.tool-subgroup-title::after{content:"";height:1px;background:var(--subgroup-color);opacity:.2;flex:1;}
.tool-subgroup .section-grid{padding:0;}

/* ===== Recent Grid ===== */
.recent-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:4px 0 8px;}
@media(max-width:1024px){.recent-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:768px){.recent-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:390px){.recent-grid{grid-template-columns:1fr;}}

/* ===== Card ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px;transition:all .18s;cursor:pointer;position:relative;box-shadow:var(--shadow);border-left:3px solid var(--border);min-height:110px;}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:#cbd5e1;}
.card:active{transform:scale(.985);}
.card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--bg);}
.card-name{font-size:.8rem;font-weight:700;line-height:1.3;color:var(--text);}
.card-desc{font-size:.68rem;color:var(--text2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.card-badge{font-size:.58rem;padding:2px 7px;border-radius:999px;font-weight:600;}
.badge-new{background:#ede9fe;color:#6d28d9;}
.badge-update{background:#dcfce7;color:#166534;}
.badge-dev{background:#f1f5f9;color:#64748b;}
.badge-soon{background:#fef3c7;color:#92400e;}
.badge-local{background:#e0f2fe;color:#075985;}
.card-arrow{font-size:.7rem;color:#cbd5e1;transition:all .15s;}
.card:hover .card-arrow{color:#6366f1;transform:translateX(2px);}
.card-disabled{opacity:.55;cursor:not-allowed;pointer-events:none;}
.card-disabled:hover{transform:none;box-shadow:var(--shadow);}

/* ===== Drawer ===== */
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:90vw;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:201;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 32px rgba(15,23,42,.12);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-title{font-size:.92rem;font-weight:700;}
.drawer-close{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text2);padding:4px 8px;border-radius:6px;transition:all .15s;}
.drawer-close:hover{background:var(--bg);color:var(--text);}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px;width:100%;box-sizing:border-box;}
.drawer-group{margin-bottom:16px;border:1px solid var(--border);border-radius:12px;overflow:hidden;width:100%;min-width:0;box-sizing:border-box;}
.drawer-group-header{padding:8px 14px;font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:6px;}
.dg-new{background:#f5f3ff;color:#5b21b6;border-left:3px solid #7c3aed;}
.dg-add{background:#f0fdf4;color:#166534;border-left:3px solid #22c55e;}
.dg-fix{background:#fffbeb;color:#92400e;border-left:3px solid #f59e0b;}
.drawer-item{padding:10px 14px;border-top:1px solid var(--border);cursor:pointer;transition:background .12s;width:100%;min-width:0;box-sizing:border-box;}
.drawer-item:hover{background:#f0f6fe;}
.drawer-item-meta{font-size:.62rem;color:var(--text2);display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
.drawer-item-req{background:#e0f2fe;color:#0369a1;padding:0 6px;border-radius:999px;font-size:.58rem;font-weight:600;}
.drawer-item-title{font-size:.74rem;font-weight:600;color:var(--text);line-height:1.35;word-break:break-word;overflow-wrap:anywhere;}
.drawer-item-desc{font-size:.64rem;color:var(--text2);margin-top:2px;line-height:1.3;word-break:break-word;overflow-wrap:anywhere;}
.update-badge{position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;font-size:.58rem;min-width:16px;height:16px;border-radius:999px;display:none;align-items:center;justify-content:center;font-weight:700;}
.update-badge.visible{display:flex;}

/* ===== Update Detail Modal ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card);border-radius:var(--radius);width:100%;max-width:600px;box-shadow:0 10px 40px rgba(15,23,42,.2);overflow:hidden;}
.modal-header{padding:18px 24px;background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:1rem;font-weight:bold;}
.modal-close{background:none;border:none;color:#94a3b8;font-size:1.2rem;cursor:pointer;padding:4px 8px;}
.modal-close:hover{color:#fff;}
.modal-body{padding:16px 24px 24px;max-height:70vh;overflow-y:auto;}
.modal-entry{padding:14px 0;border-bottom:1px solid var(--border);}
.modal-entry:last-child{border-bottom:none;}
.modal-entry-meta{font-size:.75rem;color:var(--text2);margin-bottom:4px;}
.modal-entry-requester{background:#6366f1;color:#fff;border-radius:3px;padding:0 6px;font-size:.65rem;margin-left:4px;}
.modal-entry-title{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:6px;}
.modal-entry-detail{font-size:.82rem;color:var(--text2);line-height:1.6;white-space:pre-wrap;}
.modal-entry-note{margin-top:8px;padding:8px 12px;background:#fffbeb;border-radius:6px;font-size:.78rem;color:#92400e;}
.upd-type-side{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:bold;margin-left:8px;color:#fff;}
.upd-type-side-new{background:#7c3aed;}
.upd-type-side-add{background:#22c55e;}
.upd-type-side-improve{background:#f59e0b;}
.upd-type-side-fix{background:#ef4444;}

/* ===== Footer ===== */
.footer{text-align:center;padding:20px;font-size:.68rem;color:var(--text2);border-top:1px solid var(--border);}

/* ===== Responsive Header ===== */
@media(max-width:768px){
  .header{height:auto;min-height:56px;padding:10px clamp(12px,3vw,24px);flex-wrap:wrap;gap:8px;}
  .header-right{gap:8px;}
}
</style>
</head>
<body>

<script src="qc-auth.js"></script>
<script src="qc-i18n.js"></script>

<!-- ===== Header ===== -->
<div class="header">
  <div class="header-left">
    <span class="header-logo" data-i18n="portalTitle">🛠️ 惠海 QC ポータル</span>
  </div>
  <div class="header-right" id="headerRight" style="display:none;">
    <span class="lang-sw"><button onclick="portalSetLang('zh-CN')" id="langZh">中文</button><span class="sep">｜</span><button onclick="portalSetLang('ja-JP')" id="langJa">日本語</button></span>
    <span class="header-user" id="headerUser"></span>
    <button class="update-trigger" onclick="openDrawer()" id="updateTriggerBtn"><span data-i18n="recentUpdates">📢 近期更新</span><span class="update-badge" id="updateCount">0</span></button>
    <button class="header-btn" onclick="logout()" data-i18n="logout">退出</button>
  </div>
</div>

<!-- ===== 登录/注册 ===== -->
<div id="authSection">
  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">登录</button>
      <button class="auth-tab" onclick="switchTab('register')">注册</button>
    </div>
    <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
      <input type="email" id="loginEmail" placeholder="公司邮箱" required>
      <input type="password" id="loginPwd" placeholder="密码" required minlength="4">
      <button type="submit" id="loginBtn">登 录</button>
      <div class="auth-msg" id="loginMsg"></div>
      <div class="auth-hint" style="margin-top:6px;">
        <a href="javascript:void(0)" onclick="showResetForm()" style="color:var(--text2);text-decoration:none;font-size:.76rem;">パスワードをお忘れですか？</a>
      </div>
    </form>
    <form class="auth-form" id="regForm" onsubmit="return false;">
      <input type="text" id="regName" placeholder="姓名" required>
      <input type="email" id="regEmail" placeholder="公司邮箱" required>
      <select id="regDept">
        <option value="">选择课室（可选）</option>
        <option value="1課">1課</option><option value="2課">2課</option><option value="3課">3課</option>
        <option value="4課">4課</option><option value="5課">5課</option><option value="6課">6課</option>
        <option value="AP財務">AP財務</option><option value="管理者">管理者</option>
      </select>
      <input type="password" id="regPwd" placeholder="设置密码（4位以上）" required minlength="4">
      <div id="regStep1">
        <button type="button" onclick="handleSendCode()">发送验证码</button>
        <div class="auth-msg" id="regMsg"></div>
        <div class="auth-hint">仅限公司邮箱注册（@hakuhodody-one / @dac / @adpro-inc / @huihai-info）</div>
      </div>
      <div id="regStep2" style="display:none;">
        <input type="text" id="regCode" placeholder="请输入6位验证码" maxlength="6" pattern="[0-9]{6}">
        <button type="button" onclick="handleVerifyCode()">验证并注册</button>
        <div class="auth-msg" id="regMsg2"></div>
        <button type="button" style="background:none;color:#6366f1;border:none;font-size:.78rem;cursor:pointer;" onclick="resetRegStep()">← 重新发送验证码</button>
      </div>
    </form>
    <form class="auth-form" id="resetForm" onsubmit="return false;">
      <div id="resetStep1">
        <p style="font-size:.82rem;color:var(--text2);margin-bottom:8px;">パスワードをお忘れですか？<br>登録済みのメールアドレスを入力してください。</p>
        <input type="email" id="resetEmail" placeholder="登録メールアドレス / 注册邮箱" required>
        <button type="button" id="resetSendCodeBtn" onclick="handleResetSendCode()">認証コード送信 / 发送验证码</button>
        <div class="auth-msg" id="resetMsg"></div>
        <button type="button" style="background:none;color:#6366f1;border:none;font-size:.78rem;cursor:pointer;" onclick="showLoginForm()">← ログインに戻る / 返回登录</button>
      </div>
      <div id="resetStep2" style="display:none;">
        <input type="email" id="resetEmailConfirm" placeholder="登録メールアドレス" readonly style="background:var(--bg);color:var(--text2);">
        <input type="text" id="resetCode" placeholder="認証コード6桁 / 请输入6位验证码" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="off">
        <input type="password" id="resetNewPwd" placeholder="新しいパスワード（8文字以上）/ 新密码（8位以上）" minlength="8" autocomplete="new-password">
        <input type="password" id="resetNewPwd2" placeholder="新しいパスワード確認 / 确认新密码" minlength="8" autocomplete="new-password">
        <button type="button" id="resetConfirmBtn" onclick="handleResetPassword()">パスワードを変更 / 确认修改</button>
        <div class="auth-msg" id="resetMsg2"></div>
        <button type="button" style="background:none;color:#6366f1;border:none;font-size:.78rem;cursor:pointer;" onclick="resetBackToStep1()">← 認証コードを再送信 / 重新发送验证码</button>
        <button type="button" style="background:none;color:var(--text2);border:none;font-size:.76rem;cursor:pointer;margin-top:4px;" onclick="showLoginForm()">← ログインに戻る / 返回登录</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== 工具列表（登录后显示） ===== -->
<div class="main" id="mainSection" style="display:none;">
  <div class="search-area">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索工具名称、课室或功能…（Ctrl + K）">
      <span class="search-kbd">Ctrl K</span>
    </div>
    <div class="search-tags" id="searchTags"></div>
    <div class="search-count" id="searchCount"></div>
    <div class="search-empty" id="searchEmpty">未找到匹配工具</div>
  </div>
  <div class="section" id="recentSection">
    <div class="section-header" style="cursor:default;">
      <span class="section-dot" style="background:#6366f1;"></span>
      <span class="section-title" id="recentTitle">⭐ 常用工具</span>
    </div>
    <div class="recent-grid" id="recentGrid"></div>
  </div>
  <div id="groupsContainer"></div>
</div>

<!-- Footer -->
<div class="footer" id="footerBar" style="display:none;">惠海 QC ポータル — BPO品質チェックツール</div>

<!-- ===== Drawer ===== -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawerTitle">📢 近期更新</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- ===== 更新履历弹窗 ===== -->
<div class="modal-overlay" id="updateModal" onclick="closeUpdateModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span id="modalTitle">📋 更新履历</span>
      <button class="modal-close" onclick="closeUpdateModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ==================== Portal i18n ====================
var PORTAL_DICT = {
  'zh-CN': {
    searchPh:'搜索工具名称、课室或功能…（Ctrl + K）', noResult:'未找到匹配工具',
    recentTitle:'⭐ 常用工具', drawerTitle:'📢 近期更新', modalTitle:'📋 更新履历',
    commonTools:'共通工具', ka1:'広告設定チェック・入稿', ka2:'2課 ツール', ka3:'3課 ツール',
    ka4:'4課 ツール', ka5:'5課 ツール', ka6:'6課 ツール', report:'定例会報告書',
    searchCount:'找到 {n} 个工具', updateBtn:'📢 近期更新'

// ==================== Auth UI Logic ====================
function switchTab(tab){
  document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.auth-form').forEach(function(f){f.classList.remove('active');});
  if(tab==='login'){document.querySelector('.auth-tab:first-child').classList.add('active');document.getElementById('loginForm').classList.add('active');}
  else{document.querySelector('.auth-tab:last-child').classList.add('active');document.getElementById('regForm').classList.add('active');}
  document.getElementById('loginMsg').textContent='';document.getElementById('regMsg').textContent='';
  if(typeof resetCooldownTimer!=='undefined'&&resetCooldownTimer){clearInterval(resetCooldownTimer);resetCooldownTimer=null;}
}
async function handleLogin(e){
  e.preventDefault();var btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMsg');
  msg.className='auth-msg';msg.textContent='⏳ 正在验证...';btn.disabled=true;btn.textContent='验证中...';
  var result=await loginUser(document.getElementById('loginEmail').value.trim(),document.getElementById('loginPwd').value);
  btn.disabled=false;btn.textContent='登 录';
  if(result.ok){msg.className='auth-msg success';msg.textContent='登录成功！';showMain();}
  else{msg.className='auth-msg error';msg.textContent=result.error||'登录失败';}
}
var regEmailTemp='';
function resetRegStep(){document.getElementById('regStep1').style.display='block';document.getElementById('regStep2').style.display='none';document.getElementById('regMsg').textContent='';document.getElementById('regMsg2').textContent='';}
async function handleSendCode(){
  var msg=document.getElementById('regMsg');msg.className='auth-msg';
  var name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim(),dept=document.getElementById('regDept').value,pwd=document.getElementById('regPwd').value;
  if(!name||!email||!pwd){msg.className='auth-msg error';msg.textContent='请填写所有必填项';return;}
  var allowed=['@hakuhodody-one.co.jp','@dac.co.jp','@adpro-inc.co.jp','@huihai-info.com'];
  if(!allowed.some(function(d){return email.toLowerCase().endsWith(d);})){msg.className='auth-msg error';msg.textContent='仅限公司邮箱注册';return;}
  msg.textContent='⏳ 正在发送验证码...';
  var result=await sendVerifyCode(email,name,pwd,dept);
  if(result.ok){msg.className='auth-msg success';msg.textContent=result.message;regEmailTemp=email;document.getElementById('regStep1').style.display='none';document.getElementById('regStep2').style.display='block';document.getElementById('regMsg2').textContent='';document.getElementById('regCode').value='';document.getElementById('regCode').focus();}
  else{msg.className='auth-msg error';msg.textContent=result.error||'发送失败';}
}
async function handleVerifyCode(){
  var msg=document.getElementById('regMsg2');msg.className='auth-msg';var code=document.getElementById('regCode').value.trim();
  if(!code||code.length!==6){msg.className='auth-msg error';msg.textContent='请输入6位验证码';return;}
  msg.textContent='验证中...';
  var result=await verifyEmailCode(regEmailTemp,code);
  if(result.ok){msg.className='auth-msg success';msg.textContent='注册成功！请切换到「登录」标签登录。';document.getElementById('regForm').reset();setTimeout(function(){resetRegStep();switchTab('login');},1500);}
  else{msg.className='auth-msg error';msg.textContent=result.error||'验证失败';}
}
var resetEmailTemp='',resetCooldownTimer=null;
function showResetForm(){
  document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.auth-form').forEach(function(f){f.classList.remove('active');});
  document.getElementById('resetForm').classList.add('active');document.getElementById('resetStep1').style.display='block';document.getElementById('resetStep2').style.display='none';
  document.getElementById('resetMsg').textContent='';document.getElementById('resetMsg2').textContent='';
  document.getElementById('resetEmail').value='';document.getElementById('resetCode').value='';document.getElementById('resetNewPwd').value='';document.getElementById('resetNewPwd2').value='';
  resetEmailTemp='';if(resetCooldownTimer){clearInterval(resetCooldownTimer);resetCooldownTimer=null;}
  var btn=document.getElementById('resetSendCodeBtn');btn.disabled=false;btn.textContent='認証コード送信 / 发送验证码';
}
function showLoginForm(){
  document.querySelectorAll('.auth-form').forEach(function(f){f.classList.remove('active');});
  document.getElementById('loginForm').classList.add('active');
  document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelector('.auth-tab:first-child').classList.add('active');
  document.getElementById('loginMsg').textContent='';document.getElementById('resetMsg').textContent='';document.getElementById('resetMsg2').textContent='';
  if(resetCooldownTimer){clearInterval(resetCooldownTimer);resetCooldownTimer=null;}
  var btn=document.getElementById('resetSendCodeBtn');btn.disabled=false;btn.textContent='認証コード送信 / 发送验证码';
}
function resetBackToStep1(){document.getElementById('resetStep1').style.display='block';document.getElementById('resetStep2').style.display='none';document.getElementById('resetMsg2').textContent='';}
async function handleResetSendCode(){
  var msg=document.getElementById('resetMsg'),btn=document.getElementById('resetSendCodeBtn');msg.className='auth-msg';
  var email=document.getElementById('resetEmail').value.trim();
  if(!email){msg.className='auth-msg error';msg.textContent='メールアドレスを入力してください / 请输入邮箱';return;}
  msg.textContent='⏳ 送信中...';btn.disabled=true;
  var result=await sendResetCode(email);
  if(result.ok){msg.className='auth-msg success';msg.textContent=result.message;resetEmailTemp=email.trim().toLowerCase();document.getElementById('resetEmailConfirm').value=resetEmailTemp;document.getElementById('resetStep1').style.display='none';document.getElementById('resetStep2').style.display='block';document.getElementById('resetMsg2').textContent='';document.getElementById('resetCode').value='';document.getElementById('resetNewPwd').value='';document.getElementById('resetNewPwd2').value='';document.getElementById('resetCode').focus();
    var seconds=60;btn.textContent='再送信 ('+seconds+'s)';resetCooldownTimer=setInterval(function(){seconds--;btn.textContent='再送信 ('+seconds+'s)';if(seconds<=0){clearInterval(resetCooldownTimer);resetCooldownTimer=null;btn.textContent='認証コード再送信 / 重新发送';btn.disabled=false;}},1000);
  }else{msg.className='auth-msg error';msg.textContent=result.error||'送信失敗 / 发送失败';btn.disabled=false;}
}
async function handleResetPassword(){
  var msg=document.getElementById('resetMsg2'),btn=document.getElementById('resetConfirmBtn');msg.className='auth-msg';
  var code=document.getElementById('resetCode').value.trim(),newPwd=document.getElementById('resetNewPwd').value,newPwd2=document.getElementById('resetNewPwd2').value;
  if(!code||code.length!==6){msg.className='auth-msg error';msg.textContent='認証コード6桁を入力してください / 请输入6位验证码';return;}
  if(!newPwd||newPwd.length<8){msg.className='auth-msg error';msg.textContent='パスワードは8文字以上必要です / 密码至少需要8位';return;}
  if(newPwd!==newPwd2){msg.className='auth-msg error';msg.textContent='パスワードが一致しません / 两次输入的密码不一致';return;}
  msg.textContent='⏳ パスワード更新中...';btn.disabled=true;
  var result=await resetPassword(resetEmailTemp,code,newPwd);
  if(result.ok){msg.className='auth-msg success';msg.textContent=result.message;document.getElementById('resetEmail').value='';document.getElementById('resetCode').value='';document.getElementById('resetNewPwd').value='';document.getElementById('resetNewPwd2').value='';resetEmailTemp='';if(resetCooldownTimer){clearInterval(resetCooldownTimer);resetCooldownTimer=null;}setTimeout(function(){showLoginForm();},2000);}
  else{btn.disabled=false;msg.className='auth-msg error';msg.textContent=result.error||'変更失敗 / 修改失败';}
}

// ==================== Main Display ====================
var currentUser=null;
function showMain(){
  document.getElementById('authSection').style.display='none';
  document.getElementById('mainSection').style.display='block';
  document.getElementById('headerRight').style.display='flex';
  document.getElementById('footerBar').style.display='block';
  currentUser=getUser();
  if(currentUser){document.getElementById('headerUser').textContent='👤 '+currentUser.name+' ('+currentUser.email+')';}
  renderGroups();renderRecent();renderDrawer();initSearch();
  updateBadge();
}

// ==================== Card Rendering ====================
function getKa1Subgroup(tool){
  if(tool.group!=='ka1')return null;
  return KA1_SUBGROUPS.find(function(subgroup){return subgroup.id===tool.subgroup;})||null;
}
function cardHTML(tool){
  var lang=isJa();
  // 权限检查：定例会报告书仅管理者可见
  if(tool.perm&&(!currentUser||currentUser.position!==tool.perm)){
    return '<div class="card card-disabled" style="border-left-color:#1a252f;"><div class="card-icon" style="background:#1a252f18;">🔒</div><span class="card-name">管理者専用</span><span class="card-desc">定例会報告書は管理者のみ閲覧可能</span><div class="card-footer"><span class="card-badge badge-dev">限定</span></div></div>';
  }
  var name=lang&&tool.name_ja?tool.name_ja:tool.name;
  var desc=lang&&tool.desc_ja?tool.desc_ja:tool.desc;
  var cls='card'+(tool.disabled?' card-disabled':'');
  var g=GROUPS.find(function(x){return x.id===tool.group;});
  var subgroup=getKa1Subgroup(tool);
  var accent=subgroup?subgroup.color:(g?g.color:'#eee');
  var border='border-left-color:'+accent+';';
  var badgeHtml='';
  if(tool.badge&&BADGE_MAP[tool.badge]){var b=BADGE_MAP[tool.badge];badgeHtml='<span class="card-badge '+b.cls+'">'+(lang?b.ja:b.zh)+'</span>';}
  var tag=tool.disabled?'div':'a';
  var hrefAttr=tool.disabled?'':' href="'+tool.href+'" target="_blank" onclick="recordRecent(\''+encodeURIComponent(tool.name)+'\')"';
  var html='<'+tag+' class="'+cls+'" style="'+border+'"'+hrefAttr+' data-name="'+tool.name+'" data-name-ja="'+(tool.name_ja||'')+'" data-desc="'+(tool.desc||'')+'" data-desc-ja="'+(tool.desc_ja||'')+'" data-group="'+tool.group+'">';
  html+='<div class="card-icon" style="background:'+accent+'18;">'+tool.icon+'</div>';
  html+='<span class="card-name">'+name+'</span>';
  if(desc)html+='<span class="card-desc">'+desc+'</span>';
  html+='<div class="card-footer">'+badgeHtml+'<span class="card-arrow">→</span></div>';
  html+='</'+tag+'>';
  return html;
}
function renderKa1Tools(tools){
  var html='<div class="ka1-subgroups">';
  KA1_SUBGROUPS.forEach(function(subgroup){
    var subgroupTools=tools.filter(function(tool){return tool.subgroup===subgroup.id;});
    html+='<section class="tool-subgroup" data-subgroup="'+subgroup.id+'" style="--subgroup-color:'+subgroup.color+';--subgroup-tint:'+subgroup.tint+';--subgroup-text:'+subgroup.textColor+';">';
    html+='<h3 class="tool-subgroup-title">'+subgroup.label+'</h3>';
    html+='<div class="section-grid">';
    subgroupTools.forEach(function(tool){html+=cardHTML(tool);});
    html+='</div></section>';
  });
  html+='</div>';
  return html;
}
function renderGroups(){
  var container=document.getElementById('groupsContainer');var html='';
  GROUPS.forEach(function(g){
    var tools=TOOLS.filter(function(t){return t.group===g.id;});
    var collapsed=g.expanded?'':' collapsed';
    html+='<div class="section'+collapsed+'" id="sec-'+g.id+'">';
    html+='<div class="section-header" onclick="toggleSection(\'sec-'+g.id+'\')">';
    html+='<span class="section-dot" style="background:'+g.color+';"></span>';
    html+='<span class="section-label" style="background:'+g.color+';">'+g.label+'</span>';
    html+='<span class="section-title">'+pt(g.labelKey)+'</span>';
    html+='<span class="section-count">'+tools.length+'</span>';
    html+='<span class="section-arrow">▼</span></div>';
    if(g.id==='ka1'){
      html+=renderKa1Tools(tools);
    }else{
      html+='<div class="section-grid">';
      tools.forEach(function(t){html+=cardHTML(t);});
      html+='</div>';
    }
    html+='</div>';
  });
  container.innerHTML=html;
}
function toggleSection(id){document.getElementById(id).classList.toggle('collapsed');}

// ==================== Recent ====================
function getToolUsage(){try{return JSON.parse(localStorage.getItem('qc_tool_usage')||'{}');}catch(e){return{};}}
function recordRecent(name){
  try{name=decodeURIComponent(name);}catch(e){}
  var usage=getToolUsage();
  if(!usage[name])usage[name]={count:0,lastUsed:0};
  usage[name].count+=1;
  usage[name].lastUsed=Date.now();
  localStorage.setItem('qc_tool_usage',JSON.stringify(usage));
}
function renderRecent(){
  var grid=document.getElementById('recentGrid');var usage=getToolUsage();
  var tools=TOOLS.filter(function(tool){return !tool.disabled&&usage[tool.name];}).sort(function(a,b){
    var ua=usage[a.name],ub=usage[b.name];
    if(ub.count!==ua.count)return ub.count-ua.count;
    return ub.lastUsed-ua.lastUsed;
  }).slice(0,4);
  if(tools.length===0){['Excel文件轻量化','Excel対比','Amazon DSP 設定チェック','地域表記変換チェック'].forEach(function(n){var t=TOOLS.find(function(x){return x.name===n;});if(t)tools.push(t);});}
  grid.innerHTML=tools.map(function(t){return cardHTML(t);}).join('');
}

// ==================== Search ====================
function initSearch(){
  var input=document.getElementById('searchInput'),tagsEl=document.getElementById('searchTags');
  tagsEl.innerHTML=SEARCH_TAGS.map(function(t){return '<span class="search-tag" onclick="quickSearch(\''+t+'\')">'+t+'</span>';}).join('');
  input.addEventListener('input',function(){doSearch(this.value);});
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();input.focus();input.select();}
    if(e.key==='Escape'){input.value='';doSearch('');input.blur();closeDrawer();closeUpdateModal();}
  });
}
function quickSearch(term){var input=document.getElementById('searchInput');input.value=term;doSearch(term);}
function doSearch(q){
  q=q.trim().toLowerCase();
  var countEl=document.getElementById('searchCount'),emptyEl=document.getElementById('searchEmpty');
  var cards=document.querySelectorAll('#groupsContainer .card');var visible=0;
  cards.forEach(function(card){
    if(!q){card.style.display='';visible++;return;}
    var hay=[card.getAttribute('data-name'),card.getAttribute('data-name-ja'),card.getAttribute('data-desc'),card.getAttribute('data-desc-ja'),card.getAttribute('data-group')].join(' ').toLowerCase();
    var match=hay.indexOf(q)>=0;card.style.display=match?'':'none';if(match)visible++;
  });
  document.querySelectorAll('.tool-subgroup').forEach(function(subgroup){
    var subgroupCards=subgroup.querySelectorAll('.card');
    var hasVisibleCard=Array.prototype.some.call(subgroupCards,function(card){return card.style.display!=='none';});
    subgroup.style.display=(q&&!hasVisibleCard)?'none':'';
  });
  document.querySelectorAll('#groupsContainer .section').forEach(function(sec){
    var vis=sec.querySelectorAll('.card:not([style*="display: none"])');
    sec.style.display=(q&&vis.length===0)?'none':'';
  });
  document.getElementById('recentSection').style.display=q?'none':'';
  if(q){countEl.style.display='block';countEl.textContent=pt('searchCount').replace('{n}',visible);emptyEl.style.display=visible===0?'block':'none';}
  else{countEl.style.display='none';emptyEl.style.display='none';}
}

// ==================== Drawer ====================
function getUpdateId(item){return item.date+'|'+item.type+'|'+item.requester+'|'+item.title;}
function getUnreadCount(){
  var sorted=UPDATE_LOG.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!sorted.length)return 0;
  var lastSeen=localStorage.getItem('qc_updates_last_seen');
  if(!lastSeen){localStorage.setItem('qc_updates_last_seen',getUpdateId(sorted[0]));return 0;}
  var count=0;
  for(var i=0;i<sorted.length;i++){if(getUpdateId(sorted[i])===lastSeen)break;count++;}
  return count;
}
function updateBadge(){
  var badge=document.getElementById('updateCount');
  var n=getUnreadCount();
  if(n>0){badge.textContent=n>99?'99+':String(n);badge.classList.add('visible');}
  else{badge.classList.remove('visible');}
}
function markUpdatesRead(){
  var sorted=UPDATE_LOG.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  if(sorted.length)localStorage.setItem('qc_updates_last_seen',getUpdateId(sorted[0]));
  updateBadge();
}
function openDrawer(){document.getElementById('drawerOverlay').classList.add('open');document.getElementById('drawer').classList.add('open');document.body.style.overflow='hidden';markUpdatesRead();}
function closeDrawer(){document.getElementById('drawerOverlay').classList.remove('open');document.getElementById('drawer').classList.remove('open');document.body.style.overflow='';}
function renderDrawer(){
  var body=document.getElementById('drawerBody'),lang=isJa();
  var sorted=UPDATE_LOG.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var groups={new:{icon:'🆕',label:lang?'新機能':'新功能',cls:'dg-new',items:[]},add:{icon:'➕',label:lang?'機能追加':'功能追加',cls:'dg-add',items:[]},fix:{icon:'🔧',label:lang?'改善・修正':'改善/修复',cls:'dg-fix',items:[]}};
  sorted.forEach(function(item){if(item.type==='new')groups.new.items.push(item);else if(item.type==='add')groups.add.items.push(item);else groups.fix.items.push(item);});
  var html='';
  ['new','add','fix'].forEach(function(k){
    var g=groups[k];if(!g.items.length)return;
    html+='<div class="drawer-group"><div class="drawer-group-header '+g.cls+'">'+g.icon+' '+g.label+'</div>';
    g.items.forEach(function(item){
      var idx=sorted.indexOf(item);
      var title=(lang&&item.title_ja)?item.title_ja:item.title;
      var summary=(lang&&item.summary_ja)?item.summary_ja:(item.summary||'');
      html+='<div class="drawer-item" onclick="openUpdateModal('+idx+')">';
      html+='<div class="drawer-item-meta"><span>'+item.date+'</span><span class="drawer-item-req">'+item.requester+'</span><span style="color:#94a3b8;">'+item.tool+'</span></div>';
      html+='<div class="drawer-item-title">'+title+'</div>';
      if(summary)html+='<div class="drawer-item-desc">'+summary+'</div>';
      html+='</div>';
    });
    html+='</div>';
  });
  body.innerHTML=html;
}

// ==================== Update Detail Modal ====================
function getTypeLabel(type){var m={'new':'🆕 新機能','add':'➕ 機能追加','improve':'🔧 改善','fix':'🐛 修正'};return m[type]||'🔧 改善';}
function getTypeClass(type){var m={'new':'new','add':'add','improve':'improve','fix':'fix'};return m[type]||'improve';}
function openUpdateModal(focusIndex){
  var overlay=document.getElementById('updateModal'),body=document.getElementById('modalBody');
  var sorted=UPDATE_LOG.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var lang=isJa();
  body.innerHTML=sorted.map(function(item,i){
    var title=(lang&&item.title_ja)?item.title_ja:item.title;
    var detail=(lang&&item.detail_ja)?item.detail_ja:item.detail;
    return '<div class="modal-entry" '+(i===focusIndex?'id="modal-focus-entry"':'')+'><div class="modal-entry-meta">'+item.date+'<span class="modal-entry-requester">'+item.requester+'</span><span class="upd-type-side upd-type-side-'+getTypeClass(item.type)+'">'+getTypeLabel(item.type)+'</span><span style="color:#94a3b8;margin-left:6px;">'+item.tool+'</span></div><div class="modal-entry-title">'+title+'</div><div class="modal-entry-detail">'+detail+'</div>'+(item.note?'<div class="modal-entry-note">⚠️ '+item.note+'</div>':'')+'</div>';
  }).join('');
  overlay.classList.add('show');document.body.style.overflow='hidden';
  setTimeout(function(){var el=document.getElementById('modal-focus-entry');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},100);
}
function closeUpdateModal(){document.getElementById('updateModal').classList.remove('show');if(!document.getElementById('drawer').classList.contains('open'))document.body.style.overflow='';}

// ==================== Init ====================
// ★ 首页 = 第一层认证入口：getValidSession() 校验 token 是否过期
// 过期 → 清除 qc_session → 保持登录页（不弹窗、不 redirect）
document.addEventListener('DOMContentLoaded',function(){
  var session=getValidSession();
  if(session){showMain();}
  applyPortalI18n();
});
</script>
