  // 仅为 comparison-only 证据测试保留的窄兜底：不改 matching 结论，且只在
  // Register 案件恰好只有一个 Setting ADG 与一个 CSV ADG、结构字段不足导致
  // matcher 未能给出候选时使用。真实多候选／多 ADG 一律不猜。
  function tverA173SingleAdGroupComparisonFallback(match, setting, settingModel, csvTree, schemaKind){
    if(schemaKind!=='register-without-ids' || !match || match.level!=='Ad Group' || match.status==='matched') return null;
    if(match.reasonCode!=='MISSING_ADGROUP_STRUCTURAL_FIELD' || !setting) return null;
    const settingAdGroups=settingModel && Array.isArray(settingModel.adGroups) ? settingModel.adGroups : [];
    const csvAdGroups=csvTree && Array.isArray(csvTree.adGroups) ? csvTree.adGroups : [];
    if(settingAdGroups.length!==1 || csvAdGroups.length!==1 || settingAdGroups[0].key!==setting.key) return null;
    return csvAdGroups[0];
  }

  function tverA17CsvAgeParse(csvEntity, schemaKind){
    const start=strictText(readTverA17TargetingCsvValue(csvEntity, schemaKind, 'start_age')).trim();
    const end=strictText(readTverA17TargetingCsvValue(csvEntity, schemaKind, 'end_age')).trim();
    if(/^\d+$/.test(start) && /^\d+$/.test(end)){
      const minAge=Number(start);
      const maxAge=Number(end);
      return { canonicalValue:`${minAge}-${maxAge}`, minAge, maxAge, upperOpen:false, ruleId:'TVER_A17_2_AGE_EXACT_RANGE' };
    }
    if(/^\d+$/.test(start) && end===''){
      const minAge=Number(start);
      return { canonicalValue:`${minAge}+`, minAge, maxAge:null, upperOpen:true, ruleId:'TVER_C3_C4_4B_AGE_OPEN_UPPER_BOUND' };
    }
    return null;
  }

  function tverA17CsvCanonical(field, csvValue, csvEntity, schemaKind){
    if(field==='age'){
      const parsed=tverA17CsvAgeParse(csvEntity, schemaKind);
      return parsed ? parsed.canonicalValue : null;
    }
    if(field==='pref') return tverA17CsvEvidenceState(schemaKind, 'pref', csvEntity)==='available'
      ? (strictText(csvValue).trim()==='' ? '' : tverA17CanonicalIdSet(csvValue, 'pref')) : null;
    if(field==='gender') return tverA17GenderCanonical(csvValue);
    if(TVER_C3_C4_4D_TARGETING_SPECS[field]) return tverA17CsvEvidenceState(schemaKind, field, csvEntity)==='available'
      ? tverC344CsvCanonical(field, csvValue) : null;
    return tverA17CanonicalIdSet(csvValue, field==='subgenre_exclude' ? 'subgenre' : field);
  }

  function tverA17CsvEvidenceState(schemaKind, logicalField, entity){
    const field=tverA17CsvEvidenceFieldName(schemaKind, logicalField);
    if(!field) return 'unavailable';
    if(['start_age', 'end_age'].includes(logicalField)){
      const startEvidence=tverA17CsvEvidence(entity, schemaKind, 'start_age');
      const endEvidence=tverA17CsvEvidence(entity, schemaKind, 'end_age');
      return startEvidence.length && endEvidence.length ? 'available' : 'unavailable';
    }
    if(TVER_C3_C4_4D_TARGETING_SPECS[logicalField]) return tverA17CsvEvidence(entity, schemaKind, logicalField).length ? 'available' : 'unavailable';
    return 'available';
  }

  function tverA17CsvHasBusinessValue(field, csv, schemaKind){
    if(field==='age') return readTverA17TargetingCsvValue(csv, schemaKind, 'start_age')!=='' || readTverA17TargetingCsvValue(csv, schemaKind, 'end_age')!=='';
    return readTverA17TargetingCsvValue(csv, schemaKind, field)!=='';
  }

  function buildTverA17TargetingComparisonInputs(setting, csv, schemaKind, base){
    const inputs=[];
    [...TVER_A17_TARGETING_COMPARE_FIELDS].forEach(field => {
      const resolved=resolveSettingTargetingForComparison(setting, field);
      const csvValue=field==='age'
        ? `${readTverA17TargetingCsvValue(csv, schemaKind, 'start_age')} / ${readTverA17TargetingCsvValue(csv, schemaKind, 'end_age')}`
        : readTverA17TargetingCsvValue(csv, schemaKind, field);
      const shouldGenerate=resolved.shouldGenerate || tverA17CsvHasBusinessValue(field, csv, schemaKind);
      const csvEvidenceState=field==='age'
        ? tverA17CsvEvidenceState(schemaKind, 'start_age', csv)
        : tverA17CsvEvidenceState(schemaKind, field, csv);
      const ageEvidenceProvided=field==='age' && (resolved.sourceEvidence.length>0 || csvEvidenceState==='available');
      const shouldGenerateWithAgeEvidence=shouldGenerate || ageEvidenceProvided;
      if(!shouldGenerateWithAgeEvidence) return;
      const csvAgeParsed=field==='age' ? tverA17CsvAgeParse(csv, schemaKind) : null;
      const csvCanonical=tverA17CsvCanonical(field, csvValue, csv, schemaKind);
      const csvEvidence=field==='age'
        ? uniqueSourceRefs([...tverA17CsvEvidence(csv, schemaKind, 'start_age'), ...tverA17CsvEvidence(csv, schemaKind, 'end_age')])
        : tverA17CsvEvidence(csv, schemaKind, field);
      const csvSource=field==='age'
        ? tverA17CsvPrimary(csv, schemaKind, 'start_age', readTverA17TargetingCsvValue(csv, schemaKind, 'start_age'))
        : tverA17CsvPrimary(csv, schemaKind, field, csvValue);
      let comparisonStatus=null;
      let conservativeReason=null;
      const isC344Field=Boolean(TVER_C3_C4_4D_TARGETING_SPECS[field]);
      const ageGuard=field==='age' && (resolved.comparable || resolved.evidenceState!=='available' || csvEvidenceState!=='available')
        ? resolveTverGpAgeGuard({ field, settingEvidenceState:resolved.evidenceState, csvEvidenceState }, resolved.rawValue, csvValue)
        : null;
      if(ageGuard){
        comparisonStatus=ageGuard.comparisonStatus;
        conservativeReason=ageGuard.reason;
      }else if(field==='uid_suffix'){
        const settingEmpty=String(resolved.rawValue ?? '').trim()==='' && (resolved.canonicalValue==='' || resolved.evidenceState==='not_provided');
        const csvEmpty=String(csvValue ?? '').trim()==='' && csvCanonical==='';
        const schemaUnavailable=csvEvidenceState!=='available';
        const settingUnknown=resolved.canonicalValue===null && !settingEmpty && resolved.evidenceState!=='not_provided';
        const csvUnknown=csvCanonical===null && !csvEmpty && csvEvidenceState==='available';
        if(schemaUnavailable && !csvEmpty){
          comparisonStatus='需确认';
          conservativeReason='UID_SUFFIX_CSV_SCHEMA_UNAVAILABLE';
        }else if(settingUnknown || csvUnknown){
          comparisonStatus='需确认';
          conservativeReason='UID_SUFFIX_EXACT_KNOWN_RULE_REQUIRED';
        }else if(settingEmpty && csvEmpty){
          comparisonStatus='一致';
          conservativeReason=null;
        }else if(settingEmpty!==csvEmpty){
          comparisonStatus='不一致';
          conservativeReason='UID_SUFFIX_ONE_SIDE_ONLY';
        }else if(String(resolved.canonicalValue)===String(csvCanonical)){
          comparisonStatus=resolved.rawValue===csvValue ? '一致' : '表記ゆれ一致';
        }else{
          comparisonStatus='不一致';
        }
      }else if(isC344Field && [resolved.evidenceState, csvEvidenceState].some(state => ['unavailable', 'not_provided'].includes(state))){
        comparisonStatus='需确认';
        conservativeReason='TARGETING_SOURCE_OR_SCHEMA_UNAVAILABLE';
      }else if(!resolved.comparable){
        comparisonStatus='需确认';
        conservativeReason=resolved.diagnostics[0] && resolved.diagnostics[0].code || 'TARGETING_EVIDENCE_UNCONFIRMED';
      }else if(field==='local_broadcaster' && csvCanonical!==resolved.canonicalValue){
        comparisonStatus='需确认';
        conservativeReason='LOCAL_BROADCASTER_FULL_SELECTION_UNPROVEN';
      }else if(csvCanonical===null){
        comparisonStatus='需确认';
        conservativeReason='CSV_TARGETING_ID_EVIDENCE_UNAVAILABLE';
      }
      const derivedFrom=field==='age' ? csvEvidence : resolved.derivedFrom;
      inputs.push({
        ...(base || {}), field, settingValue:resolved.rawValue, csvValue,
        settingSource:resolved.primarySource, csvSource,
        settingCanonical:{ value:resolved.canonicalValue, ruleId:resolved.ruleBasis, evidenceState:resolved.evidenceState, ...(resolved.ageShape || {}) },
        csvCanonical:{ value:csvCanonical, ruleId:field==='age' && csvAgeParsed ? csvAgeParsed.ruleId : field==='gender' ? 'TVER_C3_C4_3_GENDER_MAPPING' : resolved.ruleBasis, evidenceState:csvEvidenceState,
          ...(csvAgeParsed ? { minAge:csvAgeParsed.minAge, maxAge:csvAgeParsed.maxAge, upperOpen:csvAgeParsed.upperOpen } : {}) },
        settingEvidenceState:resolved.evidenceState, csvEvidenceState,
        comparable:ageGuard ? ageGuard.comparable : resolved.comparable && csvCanonical!==null
           && (!isC344Field || (resolved.evidenceState==='available' && csvEvidenceState==='available'))
           && (field!=='pref' || csvEvidenceState==='available'),
        alwaysDisplay:true, ruleBasis:resolved.ruleBasis, comparisonStatus,
        conservativeReason, sourceEvidence:{ setting:resolved.sourceEvidence, csv:csvEvidence, derivedFrom },
      });
    });
    return inputs;
  }

  function csvField(entity, matchingName, fieldName){
    if(entity && entity.matchingFields && entity.matchingFields[matchingName]!==undefined) return strictText(entity.matchingFields[matchingName]);
    if(fieldName==='budget_type' && entity && Array.isArray(entity.rawRows) && entity.rawRows[0] && entity.rawRows[0].values && Object.prototype.hasOwnProperty.call(entity.rawRows[0].values, fieldName)){
      return strictText(entity.rawRows[0].values[fieldName]);
    }
    return strictText(entity && entity.fields ? entity.fields[fieldName] : '');
  }

  function csvFieldSource(entity, fieldName){
    if(entity && entity.sourceRefs && entity.sourceRefs[fieldName]!==undefined) return entity.sourceRefs[fieldName];
    const evidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields[fieldName];
    if(Array.isArray(evidence) && evidence.length) return evidence[0];
    const row=entity && Array.isArray(entity.rawRows) ? entity.rawRows[0] : null;
    return row && row.sourceRefs && row.sourceRefs[fieldName] || null;
  }

  function settingField(entity, fieldName){
    return strictText(entity && entity.fields ? entity.fields[fieldName] : '');
  }

  // 日期时间专用归一化：仅消除 年/月/日/时/分 的零填充与分隔符差异，
  // 把「值相同、仅表记不同」的日期时间转为统一 canonical 形式（YYYY-MM-DD HH:MM）。
  // 无法解析（或非法）的值：不猜、不改写，直接返回原字符串，由上层保守处理。
  function normalizeTverDateTimeForMatching(value){
    const s=String(value ?? '').trim();
    if(!s) return s;
    const m=s.match(/^(\d{4})[/\-.](\d{1,2})[/\-.](\d{1,2})[ T](\d{1,2}):(\d{1,2})(?::\d{1,2})?$/);
    if(!m) return s; // 解析失败：保守返回原值，不猜
    const [, y, mo, d, h, mi]=m;
    const pad=n=>String(Number(n)).padStart(2,'0');
    return `${y}-${pad(mo)}-${pad(d)} ${pad(h)}:${pad(mi)}`;
  }

  // 阶段 A10/A14：名称归一化仅限已由真实案件确认的全角标点与独立 Pre token（其余一律原样）。
  // 禁止追加空格删除/全名称大小写/连字符/长音符/全角英数字/模糊匹配/相似度/alias 等泛化。
  function normalizeTverNameForMatching(value){
    return String(value ?? '')
      .replace(/（/g, '(')
      .replace(/）/g, ')')
      .replace(/＆/g, '&')
      .replace(/｜/g, '|')
      .replace(/(^|_)Pre(?=_|$)/g, '$1pre');
  }

  function optionalFieldMatches(settingValue, csvValue){
    return !settingValue || !csvValue || settingValue===csvValue;
  }

  function resolvedStructuralProfile(profile){
    if(!profile || !profile.fields || !Array.isArray(profile.requiredFields)) return { ok:false, missing:['conversionContext'] };
    const missing=profile.requiredFields.filter(field => {
      if(!Object.prototype.hasOwnProperty.call(profile.fields, field)) return true;
      const value=profile.fields[field];
      return value===null || value===undefined || (typeof value==='object' && value.state==='unknown');
    });
    return { ok:missing.length===0, missing };
  }

  function structuralProfilesMatch(settingProfile, csvProfile){
    const requiredMatch=settingProfile.requiredFields.every(field => {
      const settingValue=settingProfile.fields[field];
      const csvValue=csvProfile.fields[field];
      // unavailable = 该侧 schema 无法表达此维度（如 edit CSV 无 dmp_segment），跳过比较；unknown/缺值仍阻断。
      if(settingValue==='unavailable' || csvValue==='unavailable') return true;
      return strictText(settingValue)===strictText(csvValue);
    });
    if(!requiredMatch) return false;
    const optionalFields=Array.isArray(settingProfile.optionalFields) ? settingProfile.optionalFields : [];
    return optionalFields.every(field => {
      const settingValue=settingProfile.fields[field];
      const csvValue=csvProfile.fields[field];
      if(settingValue===null || settingValue===undefined || (typeof settingValue==='object' && settingValue.state==='unknown')) return true;
      if(csvValue===null || csvValue===undefined || (typeof csvValue==='object' && csvValue.state==='unknown')) return true;
      return strictText(settingValue)===strictText(csvValue);
    });
  }

  function makeMatch(level, setting, status, reasonCode, candidates){
    return {
      level, settingKey:setting.key, csvKey:candidates.length===1 ? candidates[0].key : null,
      status, reasonCode, candidateKeys:candidates.map(candidate => candidate.key),
    };
  }

  function resolveCandidateContention(levelMatches){
    const owners=new Map();
    levelMatches.forEach(match => {
      if(match.status==='unmatched') return;
      match.candidateKeys.forEach(candidateKey => {
        if(!owners.has(candidateKey)) owners.set(candidateKey, []);
        owners.get(candidateKey).push(match);
      });
    });
    owners.forEach(matches => {
      if(matches.length<2) return;
      matches.forEach(match => {
        match.status='ambiguous';
        match.reasonCode='CANDIDATE_CONTENTION';
        match.csvKey=null;
      });
    });
  }

  function matchTverEntities(settingModel, csvTree, options){
    const config=options || {};
    const conversionContext=config.conversionContext || null;
    const settingCampaigns=Array.isArray(settingModel && settingModel.campaigns) ? settingModel.campaigns : [];
    const settingAdGroups=Array.isArray(settingModel && settingModel.adGroups) ? settingModel.adGroups : [];
    const settingAds=Array.isArray(settingModel && settingModel.ads) ? settingModel.ads : [];
    const csvCampaigns=Array.isArray(csvTree && csvTree.campaigns) ? csvTree.campaigns : [];
    const csvAdGroups=Array.isArray(csvTree && csvTree.adGroups) ? csvTree.adGroups : [];
    const csvAds=Array.isArray(csvTree && csvTree.ads) ? csvTree.ads : [];
    const matches=[];
    const bySettingKey=new Map();

    const campaignMatches=settingCampaigns.map(setting => {
      const expectedName=strictText(setting.expectedName || settingField(setting, 'campaignName'));
      if(!expectedName) return makeMatch('Campaign', setting, 'ambiguous', 'MISSING_CAMPAIGN_NAME', []);
      const candidates=csvCampaigns.filter(csv => {
        if(normalizeTverNameForMatching(csvField(csv, 'campaignName', 'campaign_name'))!==normalizeTverNameForMatching(expectedName)) return false;
        // 日期时间：仅做零填充／分隔符归一（不影响名称严格匹配、不影响一对一占用）。
        const settingStart=normalizeTverDateTimeForMatching(settingField(setting, 'startDateTime'));
        const csvStart=normalizeTverDateTimeForMatching(csvField(csv, 'startDateTime', 'start_datetime'));
        const settingEnd=normalizeTverDateTimeForMatching(settingField(setting, 'endDateTime'));
        const csvEnd=normalizeTverDateTimeForMatching(csvField(csv, 'endDateTime', 'end_datetime'));
        return optionalFieldMatches(settingStart, csvStart)
          && optionalFieldMatches(settingEnd, csvEnd);
      });
      if(candidates.length===0) return makeMatch('Campaign', setting, 'unmatched', 'NO_HARD_CANDIDATE', candidates);
      if(candidates.length>1) return makeMatch('Campaign', setting, 'ambiguous', 'MULTIPLE_HARD_CANDIDATES', candidates);
      return makeMatch('Campaign', setting, 'matched', 'UNIQUE_HARD_CANDIDATE', candidates);
    });
    resolveCandidateContention(campaignMatches);
    campaignMatches.forEach(match => { matches.push(match); bySettingKey.set(match.settingKey, match); });

    const adGroupMatches=settingAdGroups.map(setting => {
      const parentMatch=bySettingKey.get(setting.parentKey);
      if(!parentMatch || parentMatch.status!=='matched') return makeMatch('Ad Group', setting, 'ambiguous', 'PARENT_NOT_UNIQUELY_MATCHED', []);
      const parentCsvKey=parentMatch.csvKey;
      const expectedName=strictText(setting.expectedName);
      let candidates=csvAdGroups.filter(csv => csv.parentKey===parentCsvKey);
      if(expectedName){
        candidates=candidates.filter(csv => csvField(csv, 'adGroupName', 'adgroup_name')===expectedName);
      }else{
        const settingProfile=conversionContext && typeof conversionContext.getSettingAdGroupProfile==='function'
          ? conversionContext.getSettingAdGroupProfile(setting) : null;
        const profileState=resolvedStructuralProfile(settingProfile);
        if(!profileState.ok) return makeMatch('Ad Group', setting, 'ambiguous', 'MISSING_ADGROUP_STRUCTURAL_FIELD', []);
        const unresolvedCsv=candidates.some(csv => {
          const profile=conversionContext && typeof conversionContext.getCsvAdGroupProfile==='function'
            ? conversionContext.getCsvAdGroupProfile(csv) : null;
          return !resolvedStructuralProfile(profile).ok;
        });
        if(unresolvedCsv) return makeMatch('Ad Group', setting, 'ambiguous', 'MISSING_ADGROUP_STRUCTURAL_FIELD', []);
        candidates=candidates.filter(csv => {
          const csvProfile=conversionContext.getCsvAdGroupProfile(csv);
          return structuralProfilesMatch(settingProfile, csvProfile);
        });
      }
      if(candidates.length===0) return makeMatch('Ad Group', setting, 'unmatched', 'NO_HARD_CANDIDATE', candidates);
      if(candidates.length>1) return makeMatch('Ad Group', setting, 'ambiguous', 'MULTIPLE_HARD_CANDIDATES', candidates);
      return makeMatch('Ad Group', setting, 'matched', 'UNIQUE_HARD_CANDIDATE', candidates);
    });
    resolveCandidateContention(adGroupMatches);
    adGroupMatches.forEach(match => { matches.push(match); bySettingKey.set(match.settingKey, match); });

    const adMatches=settingAds.map(setting => {
      const parentMatch=bySettingKey.get(setting.parentKey);
      if(!parentMatch || parentMatch.status!=='matched') return makeMatch('Ad', setting, 'ambiguous', 'PARENT_NOT_UNIQUELY_MATCHED', []);
      const creativeName=strictText(setting.expectedName || settingField(setting, 'creativeFileName'));
      if(!creativeName) return makeMatch('Ad', setting, 'ambiguous', 'MISSING_CREATIVE_FILE_NAME', []);
      const candidates=csvAds.filter(csv => {
        if(csv.parentKey!==parentMatch.csvKey || normalizeTverNameForMatching(csvField(csv, 'creativeName', 'creative_name'))!==normalizeTverNameForMatching(creativeName)) return false;
        return optionalFieldMatches(settingField(setting, 'landingPageUrl') || settingField(setting, 'lpUrl'), csvField(csv, 'landingPageUrl', 'url'))
          && optionalFieldMatches(settingField(setting, 'trackingUrlStart'), csvField(csv, 'trackingUrlStart', 'tracking_url_start'));
      });
      if(candidates.length===0) return makeMatch('Ad', setting, 'unmatched', 'NO_HARD_CANDIDATE', candidates);
      if(candidates.length>1) return makeMatch('Ad', setting, 'ambiguous', 'MULTIPLE_HARD_CANDIDATES', candidates);
      return makeMatch('Ad', setting, 'matched', 'UNIQUE_HARD_CANDIDATE', candidates);
    });
    resolveCandidateContention(adMatches);
    adMatches.forEach(match => { matches.push(match); bySettingKey.set(match.settingKey, match); });

    const reservations={ csvToSetting:{}, settingToCsv:{} };
    matches.filter(match => match.status==='matched').forEach(match => {
      reservations.csvToSetting[match.csvKey]=match.settingKey;
      reservations.settingToCsv[match.settingKey]=match.csvKey;
    });
    const matchedSettingKeys=new Set(matches.filter(match => match.status==='matched').map(match => match.settingKey));
    const matchedCsvKeys=new Set(Object.keys(reservations.csvToSetting));
    const unmatchedSettingKeys=new Set(matches.filter(match => match.status==='unmatched').map(match => match.settingKey));
    const unassignedSettingKeys=new Set(matches.filter(match => match.status==='ambiguous').map(match => match.settingKey));
    const unassignedCsvKeys=new Set(matches.filter(match => match.status==='ambiguous').flatMap(match => match.candidateKeys));
    const allSettingEntities=[...settingCampaigns, ...settingAdGroups, ...settingAds];
    const allCsvEntities=[...csvCampaigns, ...csvAdGroups, ...csvAds];
    const orphans=Array.isArray(csvTree && csvTree.orphans) ? csvTree.orphans : [];
    return {
      matches, reservations,
      unmatched:{
        setting:allSettingEntities.filter(entity => unmatchedSettingKeys.has(entity.key)),
        csv:allCsvEntities.filter(entity => !matchedCsvKeys.has(entity.key) && !unassignedCsvKeys.has(entity.key)),
      },
      unassigned:{
        setting:allSettingEntities.filter(entity => unassignedSettingKeys.has(entity.key)),
        csv:allCsvEntities.filter(entity => unassignedCsvKeys.has(entity.key)),
      },
      orphans,
      diagnostics:matches.filter(match => match.status!=='matched').map(match => ({ code:match.reasonCode, level:match.level, settingKey:match.settingKey, candidateKeys:match.candidateKeys })),
    };
  }

  const TVER_DEFAULT_FILTERS={ level:'all', status:'all', abnormalOnly:false, keyword:'' };
  const TVER_HORIZONTAL_LEVELS=['Campaign', 'Ad Group', 'Ad'];
  const TVER_DISPLAY_STATUSES=['一致', '不一致', '要確認'];
  const TVER_DISPLAY_STATUS_MAP={ '一致':'一致', '表記ゆれ一致':'一致', '不一致':'不一致', '需确认':'要確認', '未匹配':'要確認', '要確認':'要確認' };
  let tverPageState={ settingFile:null, csvFile:null, uploadFiles:[], recognition:null, recognitionToken:0, run:null, error:'', busy:false, activeLevel:'Campaign', filters:{ ...TVER_DEFAULT_FILTERS }, objectUrl:null };

  function getTverPageState(){
    return tverPageState;
  }

  function escapeHtml(value){
    return String(value ?? '').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
  }

  function statusDisplayLabel(status){
    return status==='需确认' ? '要確認' : String(status ?? '');
  }

  function projectTverDisplayStatus(status){
    return TVER_DISPLAY_STATUS_MAP[String(status ?? '')] || '';
  }

  function isTverHiddenBlankCampaignHourlyEntry(entry){
    if(!entry || entry.level!=='Campaign' || String(entry.field ?? '')!=='hourly_bid_weight') return false;
    return !tverHorizontalRawValuePresent(entry.settingRawValue) && !tverHorizontalRawValuePresent(entry.csvRawValue);
  }

  function projectTverEntityDisplayStatus(entries){
    const statuses=(Array.isArray(entries) ? entries : [])
      .filter(entry => !isTverHiddenBlankCampaignHourlyEntry(entry))
      .filter(entry => !entry.neutral)
      .filter(entry => !entry.deferred) // C3-C5-CR-REOPEN-3 FIX B：deferred 字段无判定，不参与行级聚合
      .map(entry => projectTverDisplayStatus(entry && (entry.displayStatus || entry.comparisonStatus)))
      .filter(Boolean);
    if(statuses.includes('不一致')) return '不一致';
    if(statuses.includes('要確認')) return '要確認';
    return '一致';
  }

  function projectTverStatusCounts(statusCounts){
    const counts=statusCounts && typeof statusCounts==='object' ? statusCounts : {};
    const count=status => { const value=Number(counts[status]); return Number.isFinite(value) && value>0 ? value : 0; };
    return {
      '一致':count('一致') + count('表記ゆれ一致'),
      '不一致':count('不一致'),
      '要確認':count('需确认') + count('未匹配'),
    };
  }

  function formatTverSource(source){
    if(!source) return '未提供';
    const parts=[];
    if(source.fileName) parts.push(source.fileName);
    if(source.sheetName) parts.push(source.sheetName);
    if(source.rowNumber!==null && source.rowNumber!==undefined) parts.push(`${source.rowNumber}行`);
    if(source.columnName) parts.push(source.columnName);
    return parts.length ? parts.join(' / ') : '未提供';
  }

  function defaultFilters(){
    return { ...TVER_DEFAULT_FILTERS };
  }

  function buildTverEntryFilterCriteria(filters){
    const criteria={ ...defaultFilters(), ...(filters || {}) };
    return { ...criteria, keyword:String(criteria.keyword ?? '').toLocaleLowerCase() };
  }

  function isExceptionStatus(status){
    return status==='不一致' || status==='需确认' || status==='未匹配';
  }

  function matchesTverEntryFilters(entry, criteria){
    if(entry.hidden) return false;
    if(criteria.level!=='all' && entry.level!==criteria.level) return false;
    if(criteria.status!=='all' && entry.displayStatus!==criteria.status) return false;
    if(criteria.abnormalOnly && !isExceptionStatus(entry.displayStatus)) return false;
    if(!criteria.keyword) return true;
    const searchable=[entry.targetName, entry.field, entry.settingRawValue, entry.csvRawValue, entry.reason, entry.conservativeReason, entry.ruleBasis].join(' ').toLocaleLowerCase();
    return searchable.includes(criteria.keyword);
  }

  function matchesTverDisplayEntryFilters(entry, criteria){
    const safeCriteria=buildTverEntryFilterCriteria(criteria);
    if(!matchesTverEntryFilters(entry, { ...safeCriteria, status:'all' })) return false;
    const requestedStatus=safeCriteria.status;
    const projectedCriteriaStatus=requestedStatus==='all' ? 'all' : projectTverDisplayStatus(requestedStatus) || requestedStatus;
    return projectedCriteriaStatus==='all' || projectTverDisplayStatus(entry && (entry.displayStatus || entry.comparisonStatus))===projectedCriteriaStatus;
  }

  function filterTverDisplayEntries(run, filters){
    const criteria=buildTverEntryFilterCriteria(filters);
    return (run && Array.isArray(run.entries) ? run.entries : []).filter(entry => matchesTverDisplayEntryFilters(entry, criteria));
  }

  function filterTverEntries(run, filters){
    const criteria=buildTverEntryFilterCriteria(filters);
    return (run && Array.isArray(run.entries) ? run.entries : []).filter(entry => matchesTverEntryFilters(entry, criteria));
  }

  function csvEscape(value){
    const text=String(value ?? '');
    return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }

  function exceptionEntries(run, filters){
    return filterTverDisplayEntries(run, filters).filter(entry => isExceptionStatus(entry.displayStatus));
  }

  function buildExceptionCsv(run, options){
    const config=options || {};
    const schemaKind=run && run.schemaKind || '';
    const role=run && run.businessRole || '';
    const lines=[];
    if(schemaKind==='register-without-ids') lines.push('注意：登録CSVは入稿内容の整合性チェックであり、管理画面に正しく登録済みであることを証明するものではありません。');
    else if(schemaKind==='edit-with-ids') lines.push('注意：編集CSVはダウンロード時点の管理画面の現在状態との比較です。');
    const headers=['Schema','業務上の意味','レベル','対象','comparisonStatus','validationIssues','displayStatus','項目','設定表値','CSV値','理由','ルール根拠','設定表ソース','CSVソース','ID展開値'];
    lines.push(headers.join(','));
    exceptionEntries(run, config.filters).forEach(entry => {
      const reason=entry.reason || entry.conservativeReason || '';
      const validation=(entry.validationIssues || []).map(issue => issue.code).join(' | ');
      const values=[schemaKind, role, entry.level || '', entry.targetName || '', entry.comparisonStatus, validation, entry.displayStatus, entry.field, entry.settingRawValue, entry.csvRawValue, reason, entry.ruleBasis || '', formatTverSource(entry.sourceRefs && entry.sourceRefs.setting), formatTverSource(entry.sourceRefs && entry.sourceRefs.csv), entry.idExpandedValue || ''];
      lines.push(values.map(csvEscape).join(','));
    });
    return `\uFEFF${lines.join('\r\n')}\r\n`;
  }

  function exceptionCopyText(run, filters){
    return exceptionEntries(run, filters).map(entry => [
      `【${entry.level || '対象'}】${entry.field || ''}`,
      `結果：${statusDisplayLabel(entry.displayStatus)}`,
      `設定表値：${entry.settingRawValue ?? ''}`,
      `CSV値：${entry.csvRawValue ?? ''}`,
      `理由：${entry.reason || entry.conservativeReason || entry.ruleBasis || ''}`,
      `設定表ソース：${formatTverSource(entry.sourceRefs && entry.sourceRefs.setting)}`,
      `CSVソース：${formatTverSource(entry.sourceRefs && entry.sourceRefs.csv)}`,
    ].join('\n')).join('\n\n');
  }

  async function copyVisibleExceptions(run, options){
    const config=options || {};
    const text=exceptionCopyText(run, config.filters);
    if(!text) return { ok:false, message:'コピーできる異常項目がありません。' };
    const writeText=config.writeText || (typeof navigator!=='undefined' && navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText.bind(navigator.clipboard) : null);
    if(!writeText) return { ok:false, message:'この環境ではクリップボードを利用できません。' };
    try{
      await writeText(text);
      return { ok:true, text };
    }catch(error){
      return { ok:false, message:'クリップボードへのコピーに失敗しました。' };
    }
  }

  function findEntityByKey(collection, key){
    return (collection || []).find(entity => entity.key===key) || null;
  }

  function entityTargetName(entity){
    if(!entity) return '未特定';
    return entity.expectedName || entity.fields && (entity.fields.campaignName || entity.fields.materialName || entity.fields.adgroupName || entity.fields.campaign_name || entity.fields.creative_name) || entity.key;
  }

  // C3-C4-2：只读取Setting证据，输出不回写实体或任何聚合／匹配字段。
  function resolveAdGroupShortDisplayName(settingEntity){
    const fields=settingEntity && settingEntity.fields || {};
    const identity=settingEntity && settingEntity.displayIdentity || {};
    const refs=settingEntity && settingEntity.sourceRefs || {};
    const name=String(identity.targetingName ?? '').trim();
    const tag=String(fields.tagAppeal ?? '').trim();
    const number=String(fields.targetingNumber ?? '').trim();
    const device=resolveSettingAdGroupDevice(settingEntity);
    const branch=device.resolved ? ({ ctv:'CTV', 'android ios pc':'SPPC', 'android ios':'SP' }[device.device] || '') : '';
    const nameSource=identity.sourceRefs && identity.sourceRefs.targetingName;
    if(name && branch){
      return { value:name.endsWith(`_${branch}`) ? name : `${name}_${branch}`, primarySource:nameSource || null,
        sourceEvidence:uniqueSourceRefs([nameSource, refs.tagAppeal, ...(device.sourceEvidence || [])]) };
    }
    if(tag && !['SPPC', 'CTV', 'SP'].includes(tag)){
      return { value:tag, primarySource:refs.tagAppeal || null, sourceEvidence:uniqueSourceRefs([refs.tagAppeal]) };
    }
    const suffix=branch || tag;
    const value=number ? `広告グループ ${number}${suffix ? `｜${suffix}` : ''}` : (suffix ? `広告グループ｜${suffix}` : '広告グループ');
    return { value, primarySource:refs.targetingNumber || refs.tagAppeal || null,
      sourceEvidence:uniqueSourceRefs([refs.targetingNumber, refs.tagAppeal, ...(device.sourceEvidence || [])]) };
  }

  function buildTverDisplayLabel(level, settingEntity, csvEntity, fallbackDisplayName){
    if(level==='Campaign'){
      const settingFields=settingEntity && settingEntity.fields || {};
      const campaignAppeal=String(settingFields.campaignAppeal ?? '').trim();
      if(campaignAppeal) return campaignAppeal;
      return fallbackDisplayName;
    }
    if(level!=='Ad Group') return fallbackDisplayName;
    if(settingEntity) return resolveAdGroupShortDisplayName(settingEntity).value;
    return 'CSV側未匹配';
  }

  // Ad tab的父组上下文沿用原显示规则；不用于GP対象名或Setting期望。
  function buildTverAdParentContextLabel(settingEntity, csvEntity){
    const csv=csvEntity && csvEntity.fields || {};
    const csvName=String(csv.adgroup_name ?? '').trim() || String(csv.adGroupName ?? '').trim();
    if(csvName) return csvName;
    const fields=settingEntity && settingEntity.fields || {};
    const number=String(fields.targetingNumber ?? '').trim();
    const tag=String(fields.tagAppeal ?? '').trim();
    return number ? `広告グループ ${number}${tag ? `｜${tag}` : ''}` : (tag ? `広告グループ｜${tag}` : '広告グループ');
  }

  // ==== 阶段 A5：Ad Group structural profile 的 canonical 解析 =====
  // device：优先 tagAppeal 明确 token；tagAppeal 为空时回退 targeting 配信デバイス清单（仅当唯一有效设备类别）。
  // price：CPM● 行安全 canonical 化（去 ¥/,/前导-/空白/重复，唯一数值集合才返回）。
  // DMP：Setting 侧 segment（DMPセグメント行）；CSV 侧 register 用 dmp_segment、edit 用名称 _DMP_ token。
  // 阶段 A8：device 由 配信デバイス● 清单（是否含 PC）+ tagAppeal 分支（SP 侧/CTV 侧）共同决定，
  // 不再让 tagAppeal 单独决定 PC 是否存在。
  function parseTverDeviceSet(deviceRaw){
    const set=new Set();
    const tokens=String(deviceRaw ?? '').split(/\s+/);
    for(const token of tokens){
      let cleaned=token.replace(/^[-]+/, '');
      cleaned=cleaned.split('※')[0].trim();
      if(!cleaned) continue;
      if(/SP[／/]PC|SP-PC/.test(cleaned)) { set.add('sp'); set.add('pc'); }
      else if(/SP/.test(cleaned)) set.add('sp');
      if(/CTV/.test(cleaned)) set.add('ctv');
    }
    return set;
  }

  function resolveTverSettingDeviceValueSource(entity){
    const fieldSources=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.device || [];
    const targetingSources=entity && entity.sourceEvidence && entity.sourceEvidence.targeting && entity.sourceEvidence.targeting['配信デバイス●'] || [];
    return uniqueSourceRefs([...(Array.isArray(fieldSources) ? fieldSources : []), ...(Array.isArray(targetingSources) ? targetingSources : [])])
      .find(source => {
        const raw=String((source && source.rawValue) ?? '').trim();
        if(!raw || raw==='-' || raw.startsWith('※')) return false;
        return parseTverDeviceSet(raw).size===1;
      }) || null;
  }

  function resolveTverSettingDeviceDisplayValue(source, fallback){
    const raw=String((source && source.rawValue) ?? '').trim();
    if(raw && parseTverDeviceSet(raw).size===1 && parseTverDeviceSet(raw).has('ctv')) return 'CTV';
    return raw || String(fallback ?? '');
  }

  // tagAppeal 判断当前 ADG 属于 SP 侧还是 CTV 侧（明确 token，不模糊）。返回 'sp' | 'ctv' | null。
  function resolveTverAdGroupSide(tagAppeal){
    const s=String(tagAppeal ?? '').trim();
    if(!s) return null;
    // CTV：明确 token 边界 (?:^|_)CTV(?:_|$)，覆盖前缀 CTV_xxx 与后缀 xxx_CTV（含 タグセット_CTV）。
    if(/(?:^|_)CTV(?:_|$)/.test(s)) return 'ctv';
    // SP：SPPC 前缀/后缀 token；SD/PC、SD-PC token；タグセット_SP token（保持独立，不受影响）。
    if(/(?:^|_)SPPC(?:_|$)/.test(s)) return 'sp';
    if(/^SD[\/\-]PC(?:_|$)/.test(s)) return 'sp';
    if(/^タグセット_SP(?:_|$)/.test(s)) return 'sp';
    return null;
  }

  // A17-1：Targeting 派生字段的 primary 必须由字段 resolver 明确选择；不允许通用 provenance helper 猜测首条来源。
  function resolveSettingTargetingField(entity, field){
    if(field==='price') return resolveTverSettingPrice(entity);
    const targeting=entity && entity.fields && entity.fields.targeting || {};
    const value=String(targeting[field] ?? '');
    const sourceEvidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields[field] || [];
    const primarySource=(sourceEvidence || []).find(source => String((source && source.rawValue) ?? '')===value) || null;
    return { value, primarySource, sourceEvidence };
  }

  function resolveSettingAdGroupDevice(entity){
    const fields=entity && entity.fields ? entity.fields : {};
    const targeting=fields.targeting || {};
    const deviceRaw=targeting.device || fields.device || '';
    const deviceSet=parseTverDeviceSet(deviceRaw);
    const tagAppeal=String(fields.tagAppeal ?? '').trim();
    const primarySource=entity && entity.sourceRefs && entity.sourceRefs.device || null;
    const sourceEvidence=entity && entity.sourceEvidence && entity.sourceEvidence.derived && entity.sourceEvidence.derived.device && entity.sourceEvidence.derived.device.derivedFrom
      || uniqueSourceRefs([primarySource, entity && entity.sourceRefs && entity.sourceRefs.tagAppeal]);
    const tagAppealSource=(entity && entity.sourceRefs && entity.sourceRefs.tagAppeal)
      || ((entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.tagAppeal) || []).find(source => source);
    const fallbackSource=resolveTverSettingDeviceValueSource(entity);
    const fallbackDisplayValue=resolveTverSettingDeviceDisplayValue(fallbackSource, fields.device);
    const tagSide=resolveTverAdGroupSide(tagAppeal);
    const result=(resolved, device) => {
      const useTagAppealSource=resolved && Boolean(tagAppeal) && Boolean(tagSide);
      const useFallbackSource=!tagAppeal && Boolean(fallbackSource);
      const selectedSource=useTagAppealSource ? tagAppealSource : useFallbackSource ? fallbackSource : primarySource;
      return {
        resolved, device, primarySource:selectedSource, sourceEvidence,
        rawValue:useTagAppealSource ? tagAppeal : useFallbackSource ? fallbackDisplayValue : String(fields.device ?? ''),
        comparisonSource:selectedSource,
        canonicalValue:resolved ? device : null,
        ruleBasis:useTagAppealSource ? `TVER_C3_C4_3_DEVICE_FROM_TAG_APPEAL_${tagSide.toUpperCase()}` : null,
      };
    };
    if(tagAppeal){
      const side=tagSide;
      // CTV 侧：tagAppeal 明确 token 即足够（配信デバイス● 清单可能不枚举 CTV，如②「SP／PC」却存在 CTV ADG）。
      if(side==='ctv') return result(true, 'ctv');
      if(side==='sp') return deviceSet.has('sp') ? result(true, deviceSet.has('pc') ? 'android ios pc' : 'android ios') : result(false, null);
      return result(false, null);
    }
    // tagAppeal 空 → 回退：targeting 清单唯一有效设备类别
    if(deviceSet.size===1){
      const only=[...deviceSet][0];
      if(only==='ctv') return result(true, 'ctv');
      if(only==='sp') return result(true, deviceSet.has('pc') ? 'android ios pc' : 'android ios');
      return result(false, null);
    }
    return result(false, null);
  }

  function normalizeTverPriceForMatching(rawValue){
    const parsed=parseTverPriceTokens(rawValue);
    if(!String(rawValue ?? '').trim() || parsed.invalid.length || parsed.candidates.length===0) return { resolved:false, value:null };
    const seen=new Set(parsed.candidates.map(candidate => candidate.canonicalValue));
    if(seen.size!==1) return { resolved:false, value:null };
    return { resolved:true, value:[...seen][0] };
  }

  function parseTverPriceTokens(rawValue){
    const tokens=String(rawValue ?? '').trim().split(/[\s/]+/).filter(Boolean);
    const candidates=[];
    const invalid=[];
    tokens.forEach(token => {
      const cleaned=token.replace(/^[-]+/, '').replace(/[¥￥,]/g, '').trim();
      if(!cleaned) return;
      if(!/^\d+$/.test(cleaned)){
        invalid.push(token);
        return;
      }
      candidates.push({ rawValue:token, canonicalValue:cleaned });
    });
    return { tokens, candidates, invalid };
  }

  function resolveTverSettingPrice(entity){
    const targeting=entity && entity.fields && entity.fields.targeting || {};
    const aggregatedRawValue=String(targeting.price ?? '');
    const sourceEvidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.price || [];
    const fallbackSource=entity && entity.sourceRefs && entity.sourceRefs.price || null;
    const sourceCandidates=[];
    let invalid=[];
    (Array.isArray(sourceEvidence) ? sourceEvidence : []).forEach(source => {
      const parsed=parseTverPriceTokens(source && source.rawValue);
      invalid=invalid.concat(parsed.invalid);
      parsed.candidates.forEach(candidate => sourceCandidates.push({ ...candidate, source }));
    });
    const rawParsed=parseTverPriceTokens(aggregatedRawValue);
    invalid=invalid.concat(rawParsed.invalid);
    const rawCandidates=rawParsed.candidates.map(candidate => ({ ...candidate, source:null }));
    const candidates=[...sourceCandidates, ...rawCandidates];
    const canonicalValues=new Set(candidates.map(candidate => candidate.canonicalValue));
    if(!candidates.length || invalid.length || canonicalValues.size!==1){
      return { value:aggregatedRawValue, primarySource:null, sourceEvidence, canonicalValue:null, ruleBasis:null };
    }
    const canonicalValue=[...canonicalValues][0];
    const selected=sourceCandidates.find(candidate => candidate.canonicalValue===canonicalValue) || rawCandidates[0];
    return {
      value:selected.rawValue,
      primarySource:selected.source || fallbackSource,
      sourceEvidence,
      canonicalValue,
      ruleBasis:'TVER_C3_C4_3_PRICE_FROM_CPM',
    };
  }

  function stripTverSegmentBoilerplate(segment){
    let s=String(segment ?? '');
    s=s.replace(/※セグメント名/g, ' ');
    s=s.replace(/※セグメントID/g, ' ');
    s=s.replace(/ADGをSPPC\/CTVで分ける/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  function extractTverSegmentId(strippedSegment){
    const tokens=String(strippedSegment ?? '').split(/\s+/);
    const ids=tokens.filter(token => /^\d+$/.test(token));
    return ids.length===1 ? ids[0] : null;
  }

  function resolveSettingDmpProfile(entity){
    const fields=entity && entity.fields ? entity.fields : {};
    const targeting=fields.targeting || {};
    const segment=String(targeting.segment ?? '');
    const stripped=stripTverSegmentBoilerplate(segment);
    if(!stripped) return { resolved:true, dmpKind:'regular', dmpSegmentId:null };
    return { resolved:true, dmpKind:'dmp', dmpSegmentId:extractTverSegmentId(stripped) };
  }

  function csvDmpSegmentFromRawRows(csv){
    const rows=csv && Array.isArray(csv.rawRows) ? csv.rawRows : [];
    for(const row of rows){
      if(!row || !row.values) continue;
      const value=String(row.values.dmp_segment ?? '').trim();
      if(value) return value;
    }
    return '';
  }

  function resolveCsvDmpProfile(csv, schemaKind, csvDmpAvailable){
    if(schemaKind==='register-without-ids'){
      const dmpSegment=csvDmpSegmentFromRawRows(csv);
      if(dmpSegment) return { resolved:true, dmpKind:'dmp', dmpSegmentId:dmpSegment };
      return { resolved:true, dmpKind:'regular', dmpSegmentId:null };
    }
    const name=csvField(csv, 'adGroupName', 'adgroup_name');
    if(/_DMP_/.test(name)) return { resolved:true, dmpKind:'dmp', dmpSegmentId:null };
    // edit schema 无 dmp_segment 列：当整案 CSV 无 DMP 维度时无法证明 regular → unavailable（区别于 unknown，skip 不冲突）。
    if(csvDmpAvailable===false) return { resolved:true, dmpKind:'unavailable', dmpSegmentId:null };
    return { resolved:true, dmpKind:'regular', dmpSegmentId:null };
  }

  // 阶段 A8：retarget 维度（独立于 DMP）。
  // Setting：データ蓄積 行有真实段 ID → store；入札セグメント 行有真实段 ID → bid；都无 → none；都有 → unresolved。
  function resolveSettingRetargetProfile(entity){
    const fields=entity && entity.fields ? entity.fields : {};
    const targeting=fields.targeting || {};
    const dataAccId=extractTverSegmentId(targeting.dataAccumulation);
    const bidSegId=extractTverSegmentId(targeting.bidSegment);
    if(dataAccId && bidSegId) return { resolved:false, retargetKind:null, retargetSegmentId:null };
    if(dataAccId) return { resolved:true, retargetKind:'store', retargetSegmentId:dataAccId };
    if(bidSegId) return { resolved:true, retargetKind:'bid', retargetSegmentId:bidSegId };
    return { resolved:true, retargetKind:'none', retargetSegmentId:null };
  }

  // CSV：store_segment 非空 → store；bid_segment 非空 → bid；都空 → none；都非空 → unresolved。
  function resolveCsvRetargetProfile(csv){
    const fields=csv && csv.fields ? csv.fields : {};
    const store=String(fields.store_segment ?? '').trim();
    const bid=String(fields.bid_segment ?? '').trim();
    if(store && bid) return { resolved:false, retargetKind:null, retargetSegmentId:null };
    if(store) return { resolved:true, retargetKind:'store', retargetSegmentId:store };
    if(bid) return { resolved:true, retargetKind:'bid', retargetSegmentId:bid };
    return { resolved:true, retargetKind:'none', retargetSegmentId:null };
  }

  function createTverConversionContext(schemaKind, csvTree){
    // edit schema 无 dmp_segment 列：DMP 维度仅当整案 CSV 任一 ADG 名称含 _DMP_ 时才可表达（④⑥），
    // 否则整案 DMP unavailable（②），比较时跳过而非当作 regular 冲突。
    const csvDmpAvailable = schemaKind==='register-without-ids'
      ? true
      : (!csvTree || (Array.isArray(csvTree.adGroups) && csvTree.adGroups.some(adGroup => /_DMP_/.test(csvField(adGroup, 'adGroupName', 'adgroup_name')))));
    function profileForSetting(entity){
      const deviceResolution=resolveSettingAdGroupDevice(entity);
      const targeting=entity && entity.fields && entity.fields.targeting || {};
      const priceResolution=normalizeTverPriceForMatching(targeting.price);
      const dmp=resolveSettingDmpProfile(entity);
      const retarget=resolveSettingRetargetProfile(entity);
      return {
        fields:{
          device:deviceResolution.resolved ? deviceResolution.device : { state:'unknown' },
          price:priceResolution.resolved ? priceResolution.value : { state:'unknown' },
          dmpKind:dmp.resolved ? dmp.dmpKind : { state:'unknown' },
          dmpSegmentId:dmp.dmpSegmentId || null,
          retargetKind:retarget.resolved ? retarget.retargetKind : { state:'unknown' },
          retargetSegmentId:retarget.retargetSegmentId || null,
        },
        requiredFields:['device','price','dmpKind','retargetKind'],
        optionalFields:['dmpSegmentId','retargetSegmentId'],
      };
    }
    function profileForCsv(entity){
      const device=normalizeTverDevice(entity && entity.fields && entity.fields.device || '').value;
      const priceResolution=normalizeTverPriceForMatching(entity && entity.fields && entity.fields.price || '');
      const dmp=resolveCsvDmpProfile(entity, schemaKind, csvDmpAvailable);
      const retarget=resolveCsvRetargetProfile(entity);
      return {
        fields:{
          device:device ? device : { state:'unknown' },
          price:priceResolution.resolved ? priceResolution.value : { state:'unknown' },
          dmpKind:dmp.resolved ? dmp.dmpKind : { state:'unknown' },
          dmpSegmentId:dmp.dmpSegmentId || null,
          retargetKind:retarget.resolved ? retarget.retargetKind : { state:'unknown' },
          retargetSegmentId:retarget.retargetSegmentId || null,
        },
        requiredFields:['device','price','dmpKind','retargetKind'],
        optionalFields:['dmpSegmentId','retargetSegmentId'],
      };
    }
    return { getSettingAdGroupProfile:profileForSetting, getCsvAdGroupProfile:profileForCsv };
  }

  function addFieldResult(inputs, base, field, settingValue, csvValue, settingSource, csvSource, extra){
    inputs.push({ ...base, field, settingValue, csvValue, settingSource, csvSource, ruleBasis:'strict', ...(extra || {}) });
  }

  function entityFieldEvidence(entity, field, fallbackSource){
    const fields=entity && entity.sourceEvidence && entity.sourceEvidence.fields || {};
    const evidence=Array.isArray(fields[field]) ? fields[field] : [];
    return evidence.length ? evidence : uniqueSourceRefs([fallbackSource]);
  }

  function entrySourceEvidence(setting, settingField, settingSource, csv, csvField, csvSource, derivedFrom){
    const derived=uniqueSourceRefs(derivedFrom || []);
    return {
      setting:derived.length ? derived : entityFieldEvidence(setting, settingField, settingSource),
      csv:entityFieldEvidence(csv, csvField, csvSource),
      derivedFrom:derived,
    };
  }

  function tverCampaignRuleSource(field){
    const rule=TVER_CAMPAIGN_CONTRACT_RULES[field];
    if(!rule) return null;
    return {
      fileName:`embedded:TVER_${TVER_TEMPLATE_VERSION}`,
      sheetName:'新規設定バルク(26.3.6時点)',
      rowNumber:8,
      columnName:field,
      rawValue:rule.value,
      ruleId:rule.ruleId,
    };
  }

  function tverSettingContractSource(setting, fieldNames){
    for(const field of fieldNames || []){
      const direct=setting && setting.sourceRefs && setting.sourceRefs[field];
      if(direct) return direct;
      const evidence=setting && setting.sourceEvidence && setting.sourceEvidence.fields && setting.sourceEvidence.fields[field];
      if(Array.isArray(evidence) && evidence.length) return evidence[0];
    }
    return null;
  }

  function tverSettingContractValue(setting, fieldNames){
    const fields=setting && setting.fields || {};
    for(const field of fieldNames || []){
      if(!Object.prototype.hasOwnProperty.call(fields, field)) continue;
      return { value:strictText(fields[field]), source:tverSettingContractSource(setting, [field]) };
    }
    return null;
  }

  function resolveTverCampaignContract(setting, field){
    const explicitFields={
      budget_type:['budgetType', 'budget_type'],
      campaign_status:['campaignStatus', 'campaign_status'],
      consumption_type:['consumptionType', 'consumption_type'],
      report_target_flag:['reportTargetFlag', 'report_target_flag'],
    };

      tver_video_duration:{
        code:'EDIT_SCHEMA_UNSUPPORTED_TVER_VIDEO_DURATION',

      },
    };
    const grouped=new Map(Object.keys(fieldConfig).map(field => [field, { settingEvidence:[], affectedEntityKeys:[] }]));
    (matching && matching.matches || []).forEach(match => {
      if(!match || match.status!=='matched' || match.level!=='Ad Group') return;
      const setting=findEntityByKey(settingAll, match.settingKey);
      const csv=findEntityByKey(csvAll, match.csvKey);
      if(!setting) return;

          if(Array.isArray(value)){ inputArrayConstructor=value.constructor; break; }
