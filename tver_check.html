  <script src="qc-auth.js"></script>
  <header class="app-header"><h1>2課 TVer 設定チェック</h1><p>摺合せシートとTVer CSVをブラウザ内で照合します。</p><div class="badges"><span class="badge">ID主データ：260605</span><span class="badge">ファイルは外部送信されません</span></div></header>
  <nav class="back-nav" aria-label="ページ移動"><a href="index.html">← トップへ戻る</a></nav>
  <main class="page" id="tver-page">
    <section class="upload-grid" aria-label="ファイル選択">
      <label class="upload-zone" id="tver-upload-zone" for="tver-file-input"><h2>設定表 + CSV</h2><p>TVer 摺合せシート（.xlsx）とTVer管理画面の登録／編集CSV（.csv）</p><p>一度に2ファイル、または順番にドラッグ＆ドロップ／クリックで選択</p><input id="tver-file-input" type="file" multiple accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" aria-describedby="setting-file-state csv-file-state upload-recognition-state"><div class="file-state" id="setting-file-state">設定表：未選択</div><div class="file-state" id="csv-file-state">CSV：未選択</div><p class="upload-recognition-state" id="upload-recognition-state" role="status">.xlsx と .csv を選択してください。</p></label>
    </section>
    <section class="control-bar tver-action-result" aria-label="チェック操作と結果"><button class="btn btn-primary" id="run-check" type="button" disabled>チェック開始</button><button class="btn btn-secondary" id="reset-check" type="button" disabled>リセット</button><div class="tver-result-summary hidden" id="tver-result-summary" aria-live="polite"></div></section>
    <p class="notice hidden" id="page-notice" role="status"></p>
    <section class="results hidden" id="results-panel" aria-live="polite"></section>
  </main>

  <script src="xlsx.full.min.js"></script>
  <script src="encoding.min.js"></script>
  <script>
  (function(){
  'use strict';

  // TVER_APP_MARKER
  const REGISTER_HEADERS_61 = [
    'campaign_name', 'start_datetime', 'end_datetime', 'budget_type', 'budget', 'daily_budget',
    'hourly_bid_weight', 'campaign_status', 'consumption_type', 'cv_point', 'report_target_flag',
    'tver_video_duration', 'adgroup_name', 'adgroup_start_datetime', 'adgroup_end_datetime',
    'daily_freq_cap', 'auction_type', 'price', 'adgroup_status', 'device', 'media',
    'local_broadcaster', 'bls_start_datetime', 'bls_end_datetime', 'contact_bls_survey_id',
    'non_contact_bls_survey_id', 'gender', 'start_age', 'end_age', 'pref', 'city', 'affinity',
    'demography', 'annual_income', 'tv_usage_tendency', 'carrier', 'uid_suffix', 'genre',
    'genre_exclude', 'subgenre', 'subgenre_exclude', 'contents_group', 'bid_segment',
    'upload_segment_expansion_threshold', 'bid_segment_exclude', 'dmp_segment',
    'dmp_segment_expansion_threshold', 'dmp_segment_exclude', 'store_segment', 'bls_store_segment',
    'creative_id', 'creative_name', 'url', 'tracking_url_start', 'tracking_url_first_quartile',
    'tracking_url_midpoint', 'tracking_url_third_quartile', 'tracking_url_complete', 'start_time',
    'end_time', 'status',
  ];
  const EDIT_HEADERS_61 = [
    ...REGISTER_HEADERS_61.filter(header => !['budget_type', 'tver_video_duration', 'dmp_segment'].includes(header)),
    'campaign_id', 'adgroup_id', 'ad_id',
  ];

  function parseCsvRows(text){
    const rows=[];
    const issues=[];
    let row=[];
    let field='';
    let inQuotes=false;
    let quoteJustClosed=false;
    let lineNumber=1;

    for(let index=0; index<text.length; index+=1){
      const character=text[index];
      if(inQuotes){
        if(character==='"'){
          if(text[index+1]==='"'){
            field+='"';
            index+=1;
          }else{
            inQuotes=false;
            quoteJustClosed=true;
          }
        }else{
          field+=character;
          if(character==='\n') lineNumber+=1;
        }
        continue;
      }
      if(quoteJustClosed && character!==',' && character!=='\r' && character!=='\n'){
        issues.push({ code:'CSV_ILLEGAL_CHARACTER_AFTER_CLOSING_QUOTE', lineNumber, character });
        quoteJustClosed=false;
      }
      if(character==='"' && field==='' && !quoteJustClosed){
        inQuotes=true;
      }else if(character===','){
        row.push(field);
        field='';
        quoteJustClosed=false;
      }else if(character==='\r' || character==='\n'){
        if(character==='\r' && text[index+1]==='\n') index+=1;
        row.push(field);
        rows.push(row);
        row=[];
        field='';
        quoteJustClosed=false;
        lineNumber+=1;
      }else{
        field+=character;
      }
    }
    if(inQuotes) issues.push({ code:'CSV_UNCLOSED_QUOTE', lineNumber });
    if(field!=='' || row.length>0){
      row.push(field);
      rows.push(row);
    }
    return { rows, issues };
  }

  function detectTverCsvSchema(headers){
    const normalizedHeaders=headers.map((header, index) => {
      const text=String(header ?? '').trim();
      return index===0 ? text.replace(/^\uFEFF/, '') : text;
    });
    const headerSet=new Set(normalizedHeaders);
    const duplicateHeaders=[...headerSet].filter(header => normalizedHeaders.filter(candidate => candidate===header).length>1).sort();
    function inspect(expectedHeaders){
      return {
        missingHeaders:expectedHeaders.filter(header => !headerSet.has(header)).sort(),
        unexpectedHeaders:[...headerSet].filter(header => !expectedHeaders.includes(header)).sort(),
      };
    }
    const editInspection=inspect(EDIT_HEADERS_61);
    const registerInspection=inspect(REGISTER_HEADERS_61);
    const editExact=normalizedHeaders.length===EDIT_HEADERS_61.length && duplicateHeaders.length===0 &&
      editInspection.missingHeaders.length===0 && editInspection.unexpectedHeaders.length===0;
    const registerExact=normalizedHeaders.length===REGISTER_HEADERS_61.length && duplicateHeaders.length===0 &&
      registerInspection.missingHeaders.length===0 && registerInspection.unexpectedHeaders.length===0;

    if(editExact){
      return {
        kind:'edit-with-ids',
        businessRole:'下载时点的后台当前状态',
        canonicalHeaders:EDIT_HEADERS_61,
        missingHeaders:[],
        unexpectedHeaders:[],
        duplicateHeaders:[],
        unavailableFields:['budget_type', 'tver_video_duration', 'dmp_segment'],
      };
    }
    if(registerExact){
      return {
        kind:'register-without-ids',
        businessRole:'入稿内容一致性检查：不能证明后台已经正确登记',
        canonicalHeaders:REGISTER_HEADERS_61,
        missingHeaders:[],
        unexpectedHeaders:[],
        duplicateHeaders:[],
        unavailableFields:[],
      };
    }
    const looksLikeEdit=normalizedHeaders.some(header => ['campaign_id', 'adgroup_id', 'ad_id'].includes(header));
    const inspection=looksLikeEdit ? editInspection : registerInspection;
    return {
      kind:null,
      businessRole:null,
      canonicalHeaders:normalizedHeaders,
      missingHeaders:inspection.missingHeaders,
      unexpectedHeaders:inspection.unexpectedHeaders,
      duplicateHeaders,
      unavailableFields:[],
    };
  }

  function parseCsvText(text, options){
    const fileName=options && options.fileName ? options.fileName : '';
    const parsed=parseCsvRows(String(text ?? ''));
    const parsedRows=parsed.rows;
    const headers=(parsedRows.shift() || []).map((header, index) => {
      const value=String(header ?? '');
      return index===0 ? value.replace(/^\uFEFF/, '') : value;
    });
    const schema=detectTverCsvSchema(headers);
    const parseIssues=[...parsed.issues];
    const rows=[];
    parsedRows.forEach((cells, rowIndex) => {
      if(cells.length===1 && cells[0]==='') return;
      if(cells.length!==headers.length){
        parseIssues.push({
          code:'CSV_COLUMN_COUNT_MISMATCH',
          rowNumber:rowIndex+2,
          expected:headers.length,
          actual:cells.length,
        });
      }
      const values={};
      const sourceRefs={};
      headers.forEach((header, columnIndex) => {
        const rawValue=columnIndex<cells.length ? cells[columnIndex] : '';
        values[header]=rawValue;
        sourceRefs[header]={ fileName, sheetName:null, rowNumber:rowIndex+2, columnName:header, rawValue };
      });
      rows.push({
        rowNumber:rowIndex+2,
        occurrenceIndex:1,
        values,
        sourceRefs,
        source:{ fileName, sheetName:null, rowNumber:rowIndex+2, columnName:null, rawValue:null },
      });
    });
    if(schema.kind===null){
      parseIssues.push({ code:'CSV_SCHEMA_UNRECOGNIZED', missingHeaders:schema.missingHeaders });
    }
    return { schema, headers, rows, parseIssues };
  }

  function isVisibleSheet(workbook, sheetName){
    const metadata=workbook && workbook.Workbook && Array.isArray(workbook.Workbook.Sheets)
      ? workbook.Workbook.Sheets.find(sheet => sheet && sheet.name===sheetName)
      : null;
    return !metadata || !metadata.Hidden;
  }

  function getSheetRows(workbook, sheetName){
    const sheet=workbook && workbook.Sheets ? workbook.Sheets[sheetName] : null;
    if(Array.isArray(sheet)) return sheet;
    if(typeof XLSX!=='undefined' && XLSX.utils && sheet){
      return expandMergedRows(XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:false }), sheet['!merges'] || []);
    }
    return [];
  }

  function expandMergedRows(rows, merges){
    const expanded=(rows || []).map(row => [...(row || [])]);
    (merges || []).forEach(merge => {
      if(!merge || !merge.s || !merge.e) return;
      const rawValue=expanded[merge.s.r] && expanded[merge.s.r][merge.s.c];
      for(let rowIndex=merge.s.r; rowIndex<=merge.e.r; rowIndex+=1){
        if(!expanded[rowIndex]) expanded[rowIndex]=[];
        for(let columnIndex=merge.s.c; columnIndex<=merge.e.c; columnIndex+=1){
          if(expanded[rowIndex][columnIndex]===undefined || expanded[rowIndex][columnIndex]==='') expanded[rowIndex][columnIndex]=rawValue;
        }
      }
    });
    return expanded;
  }

  function findSettingHeaderCandidates(workbook, options){
    const maxRows=options && Number.isInteger(options.maxRows) ? options.maxRows : 100;
    const candidates=[];
    const sheetNames=workbook && Array.isArray(workbook.SheetNames) ? workbook.SheetNames : [];
    sheetNames.forEach(sheetName => {
      if(!isVisibleSheet(workbook, sheetName)) return;
      const rows=getSheetRows(workbook, sheetName);
      const limit=Math.min(maxRows, rows.length);
      for(let rowIndex=0; rowIndex<limit; rowIndex+=1){
        const cellSet=new Set((rows[rowIndex] || []).map(value => String(value ?? '').trim()));
        if(cellSet.has('発注CPN名') && cellSet.has('ターゲティング番号')){
          candidates.push({ sheetName, rowIndex, rowNumber:rowIndex+1, headers:rows[rowIndex] });
        }
      }
    });
    return { candidates, diagnostics:[] };
  }

  function emptySettingModel(diagnostics){
    return {
      campaigns:[], adGroups:[], ads:[], diagnostics,
      sourceIndex:{ targetingByNumber:{}, creativeByMaterial:{}, evidenceBlocks:{ changeHistory:[], operationMemo:[], otherSettings:[] } }, templateVersion:null,
    };
  }

  function makeSettingSource(fileName, sheetName, rowNumber, columnName, rawValue){
    return { fileName, sheetName, rowNumber, columnName, rawValue };
  }

  const SETTING_BUSINESS_HEADERS = [
    '発注CPN名', 'CPN訴求', 'CPN予算', '開始日時(yyyy/mm/dd hh:mm)', '終了日時(yyyy/mm/dd hh:mm)',
    'ターゲティング番号', 'ADG開始日時(yyyy/mm/dd hh:mm)', 'ADG終了日時(yyyy/mm/dd hh:mm)',
    '素材名', 'LP名', 'タグ訴求', '初期設定日予算', 'その他設定', '変更履歴',
  ];

  function isSectionBoundary(row){
    return (row || []).some(value => {
      const text=String(value ?? '').trim();
      return text==='★' || text.startsWith('★');
    });
  }

  function findSectionMarker(rows, sectionName, startIndex){
    const from=Number.isInteger(startIndex) ? startIndex : 0;
    for(let rowIndex=from; rowIndex<(rows || []).length; rowIndex+=1){
      const row=rows[rowIndex] || [];
      const cells=row.map(value => String(value ?? '').trim());
      const combinedIndex=cells.findIndex(value => value===`★${sectionName}`);
      if(combinedIndex!==-1) return { rowIndex, markerColumnIndex:combinedIndex, labelColumnIndex:combinedIndex, style:'combined', sectionName };
      const markerColumnIndex=cells.findIndex(value => value==='★');
      const labelColumnIndex=markerColumnIndex===-1 ? -1 : cells.findIndex((value, index) => index>markerColumnIndex && value===sectionName);
      if(labelColumnIndex!==-1) return { rowIndex, markerColumnIndex, labelColumnIndex, style:'split', sectionName };
    }
    return null;
  }

  function locateSection(rows, sectionName){
    const marker=findSectionMarker(rows, sectionName);
    if(!marker) return null;
    let endRowIndex=rows.length;
    for(let rowIndex=marker.rowIndex+1; rowIndex<rows.length; rowIndex+=1){
      if(isSectionBoundary(rows[rowIndex])){
        endRowIndex=rowIndex;
        break;
      }
    }
    return { ...marker, endRowIndex, rows };
  }

  function blockHeaderIndex(headers){
    const index={};
    (headers || []).forEach((header, columnIndex) => {
      const text=String(header ?? '').trim();
      if(text && index[text]===undefined) index[text]=columnIndex;
    });
    return index;
  }

  function blockSource(fileName, sheetName, rowNumber, columnName, row, headerIndex){
    const columnIndex=headerIndex[columnName];
    return makeSettingSource(fileName, sheetName, rowNumber, columnName, columnIndex===undefined ? '' : row[columnIndex]);
  }

  function findSettingPairValue(rows, label, fileName, sheetName){
    for(let rowIndex=0; rowIndex<(rows || []).length; rowIndex+=1){
      const row=rows[rowIndex] || [];
      const columnIndex=row.findIndex(value => String(value ?? '').trim()===label);
      if(columnIndex===-1) continue;
      const rawValue=String(row[columnIndex+1] ?? '');
      return {
        value:rawValue,
        source:makeSettingSource(fileName, sheetName, rowIndex+1, label, rawValue),
      };
    }
    return { value:'', source:null };
  }

  function findTargetingGroupAnchors(section){
    if(!section) return [];
    const anchors=[];
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      (section.rows[rowIndex] || []).forEach((value, columnIndex) => {
        if(String(value ?? '').trim()==='ターゲティング名') anchors.push({ rowIndex, columnIndex });
      });
    }
    return anchors;
  }

  const TARGETING_FIELD_NAMES={
    'ターゲティング名':'targetingNumber', '広告再生時間●':'videoDuration', 'CPM●':'price',
    '配信デバイス●':'device', '放送局●':'media', '性別●':'gender', '年齢●':'age', 'ASR':'uid_suffix',
    '都道府県/市区町村●':'region', '興味関心●':'audience', '番組ジャンル●':'genre',
    '番組サブジャンル●':'subgenre', 'DMPセグメント':'segment', 'その他設定(ADG)':'otherSettings',
    'その他設定(AD)':'adOtherSettings',
    // 阶段 A8：retarget 维度（通常=データ蓄積→store；リタゲ=入札セグメント→bid），独立于 DMP。
    'データ蓄積':'dataAccumulation', '入札セグメント':'bidSegment',
  };

  // 判断 targeting group 是否含有「实际业务值」（参与 structural 匹配或真实设定的字段）。
  // 模板说明 / 勾选标记 / 注记不算内容：去掉前导 '-'/'○'、'※…' 注记、'ADGをSPPC/CTVで分ける' 等说明文字后是否仍有内容。
  function hasRealTargetingValue(rawValue){
    if(!rawValue) return false;
    const tokens=String(rawValue).split(/\s+/);
    return tokens.some(token => {
      let cleaned=token.replace(/^[-\s○]+/, '');
      if(!cleaned) return false;
      if(cleaned.startsWith('※')) return false;
      if(cleaned==='ADGをSPPC/CTVで分ける' || cleaned==='ADGをSP/CTVで分ける') return false;
      return true;
    });
  }

  function targetingGroupHasBusinessContent(fields){
    return ['price', 'device', 'segment'].some(key => hasRealTargetingValue(fields && fields[key]));
  }

  function addTargetingGroup(indexByNumber, group, diagnostics, sheetName){
    const number=group.fields.targetingNumber;
    if(!number){
      // 空编号：若该 group 无实际业务值（纯空模板）→ 静默忽略，不产生 diagnostic；
      // 若仍有 price/device/segment 等真实业务值 → 保留 MISSING（真实输入缺值）。
      if(targetingGroupHasBusinessContent(group.fields)){
        diagnostics.push({ code:'SETTING_TARGETING_NUMBER_MISSING', sheetName, rowNumber:group.anchor.rowIndex+1, columnNumber:group.anchor.columnIndex+1 });
      }
      return;
    }
    const existing=indexByNumber[number];
    if(!existing){
      indexByNumber[number]={ state:'unique', ...group, groups:[group] };
      return;
    }
    diagnostics.push({ code:'SETTING_TARGETING_NUMBER_DUPLICATE', targetingNumber:number, sheetName, rowNumber:group.anchor.rowIndex+1 });
    existing.groups.push(group);
    if(existing.semanticSignature!==group.semanticSignature){
      diagnostics.push({ code:'SETTING_TARGETING_NUMBER_CONFLICT', targetingNumber:number, sheetName, rowNumber:group.anchor.rowIndex+1 });
    }
    existing.state='ambiguous';
  }

  function makeTargetingGroup(section, anchor, rowEndIndex, columnEndIndex, fileName, sheetName){
    const fields={};
    const sourceRefs={};
    const rawFields={};
    for(let rowIndex=anchor.rowIndex; rowIndex<rowEndIndex; rowIndex+=1){
      const row=section.rows[rowIndex] || [];
      const label=String(row[anchor.columnIndex] ?? '').trim();
      if(!label) continue;
      const values=[];
      const refs=[];
      const slots=[];
      for(let columnIndex=anchor.columnIndex+1; columnIndex<=columnEndIndex; columnIndex+=1){
        const rawValue=String(row[columnIndex] ?? '');
        const source=makeSettingSource(fileName, sheetName, rowIndex+1, label, rawValue);
        slots.push({ rawValue, source });
        if(rawValue!==''){
          values.push(rawValue);
          refs.push(source);
        }
      }
      rawFields[label]={ values, sourceRefs:refs, slots };
      const field=TARGETING_FIELD_NAMES[label];
      if(field){
        fields[field]=values.join(' ');
        sourceRefs[field]=refs[0] || makeSettingSource(fileName, sheetName, rowIndex+1, label, '');
      }
    }
    const targetingNameField=rawFields['ターゲティング名'];
    // C3-C4-2：展示身份独立保存，不加入fields及既有semanticSignature。
    const identity={ targetingNumber:'', targetingName:'', statusHint:'', sourceRefs:{} };
    if(targetingNameField){
      const numberSlot=targetingNameField.slots[1];
      fields.targetingNumber=String(numberSlot ? numberSlot.rawValue : '').trim();
      sourceRefs.targetingNumber=(numberSlot && numberSlot.source)
        || sourceRefs.targetingNumber
        || makeSettingSource(fileName, sheetName, anchor.rowIndex+1, 'ターゲティング名', '');
      [['statusHint', 0], ['targetingNumber', 1], ['targetingName', 2]].forEach(([field, slotIndex]) => {
        const slot=targetingNameField.slots[slotIndex];
        if(!slot) return;
        const value=String(slot.rawValue ?? '').trim();
        identity[field]=field==='targetingName' && value.startsWith('※') ? '' : value;
        identity.sourceRefs[field]={ ...slot.source, columnNumber:anchor.columnIndex+slotIndex+2 };
      });
    }
    return { anchor, fields, sourceRefs, rawFields, identity, numberRuleId:'TVER_260605_TARGETING_NUMBER_RELATIVE_COLUMN_2', semanticSignature:signatureFor(fields) };
  }

  function targetingSourceEvidence(targeting){
    const fields={};
    const rawFields={};
    Object.entries(targeting && targeting.rawFields || {}).forEach(([label, value]) => {
      const sources=uniqueSourceRefs(value && value.sourceRefs || []);
      const evidenceSources=sources.length || !['世帯年収●', 'デモグラフィック●'].includes(label)
        ? sources
        : uniqueSourceRefs((value && value.slots || []).map(slot => slot && slot.source));
      rawFields[label]=evidenceSources;
      const field=TARGETING_FIELD_NAMES[label];
      if(field) fields[field]=uniqueSourceRefs([...(fields[field] || []), ...evidenceSources]);
    });
    return { fields, rawFields };
  }

  function buildLegacyTargetingIndex(section, fileName, sheetName, diagnostics, indexByNumber){
    let headerIndex=-1;
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      if((section.rows[rowIndex] || []).some(value => String(value ?? '').trim()==='ターゲティング番号')){
        headerIndex=rowIndex;
        break;
      }
    }
    if(headerIndex===-1) return;
    const headers=blockHeaderIndex(section.rows[headerIndex]);
    for(let rowIndex=headerIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const row=section.rows[rowIndex] || [];
      if(!row.some(value => String(value ?? '')!=='')) continue;
      const fields={};
      const sourceRefs={};
      const rawFields={};
      Object.keys(headers).forEach(header => {
        const rawValue=String(row[headers[header]] ?? '');
        rawFields[header]={ values:[rawValue], sourceRefs:[blockSource(fileName, sheetName, rowIndex+1, header, row, headers)] };
        fields[header]=rawValue;
        sourceRefs[header]=rawFields[header].sourceRefs[0];
      });
      fields.targetingNumber=String(row[headers['ターゲティング番号']] ?? '').trim();
      sourceRefs.targetingNumber=sourceRefs['ターゲティング番号'];
      addTargetingGroup(indexByNumber, { anchor:{ rowIndex, columnIndex:headers['ターゲティング番号'] }, fields, sourceRefs, rawFields, semanticSignature:signatureFor(fields) }, diagnostics, sheetName);
    }
  }

  function buildTargetingIndex(rows, fileName, sheetName, diagnostics){
    const indexByNumber={};
    const section=locateSection(rows, 'ターゲティング');
    if(!section) return indexByNumber;
    const anchors=findTargetingGroupAnchors(section);
    if(!anchors.length){
      buildLegacyTargetingIndex(section, fileName, sheetName, diagnostics, indexByNumber);
      return indexByNumber;
    }
    const anchorsByRow=new Map();
    anchors.forEach(anchor => {
      const rowAnchors=anchorsByRow.get(anchor.rowIndex) || [];
      rowAnchors.push(anchor);
      anchorsByRow.set(anchor.rowIndex, rowAnchors);
    });
    anchorsByRow.forEach(rowAnchors => rowAnchors.sort((left, right) => left.columnIndex-right.columnIndex));
    const anchorRows=[...anchorsByRow.keys()].sort((left, right) => left-right);
    const maxColumn=Math.max(0, ...section.rows.slice(section.rowIndex, section.endRowIndex).map(row => Math.max(0, (row || []).length-1)));
    anchors.forEach(anchor => {
      const rowAnchors=anchorsByRow.get(anchor.rowIndex);
      const indexInRow=rowAnchors.indexOf(anchor);
      const nextHorizontal=rowAnchors[indexInRow+1];
      const nextVertical=anchorRows.find(rowIndex => rowIndex>anchor.rowIndex);
      const rowEndIndex=nextVertical===undefined ? section.endRowIndex : nextVertical;
      const columnEndIndex=nextHorizontal ? nextHorizontal.columnIndex-1 : maxColumn;
      addTargetingGroup(indexByNumber, makeTargetingGroup(section, anchor, rowEndIndex, columnEndIndex, fileName, sheetName), diagnostics, sheetName);
    });
    return indexByNumber;
  }

  function buildCreativeIndex(rows, fileName, sheetName, diagnostics){
    const indexByMaterial={};
    const section=locateSection(rows, 'クリエイティブ');
    if(!section){
      diagnostics.push({ code:'SETTING_CREATIVE_SECTION_NOT_FOUND', sheetName });
      return indexByMaterial;
    }
    const required=['素材名', 'ファイル名', 'LP URL'];
    const candidates=[];
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const headers=blockHeaderIndex(section.rows[rowIndex]);
      if(required.every(header => headers[header]!==undefined)) candidates.push({ rowIndex, headers });
    }
    if(candidates.length===0){
      diagnostics.push({ code:'SETTING_CREATIVE_HEADER_NOT_FOUND', sheetName, requiredHeaders:required });
      return indexByMaterial;
    }
    if(candidates.length>1){
      diagnostics.push({ code:'SETTING_CREATIVE_HEADER_AMBIGUOUS', sheetName, rowNumbers:candidates.map(candidate => candidate.rowIndex+1) });
      return indexByMaterial;
    }
    const header=candidates[0];
    for(let rowIndex=header.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const row=section.rows[rowIndex] || [];
      if(!row.some(value => String(value ?? '')!=='')) continue;
      const materialName=String(row[header.headers['素材名']] ?? '').trim();
      if(!materialName) continue;
      const fileNameValue=String(row[header.headers['ファイル名']] ?? '');
      const landingPageUrl=String(row[header.headers['LP URL']] ?? '');
      const sourceRefs={
        materialName:blockSource(fileName, sheetName, rowIndex+1, '素材名', row, header.headers),
        fileName:blockSource(fileName, sheetName, rowIndex+1, 'ファイル名', row, header.headers),
        landingPageUrl:blockSource(fileName, sheetName, rowIndex+1, 'LP URL', row, header.headers),
      };
      const existing=indexByMaterial[materialName];
      if(!existing){
        indexByMaterial[materialName]={ state:'unique', materialName, fileName:fileNameValue, landingPageUrl, sourceRefs, mappings:[{ fileName:fileNameValue, landingPageUrl, sourceRefs }] };
        continue;
      }
      existing.mappings.push({ fileName:fileNameValue, landingPageUrl, sourceRefs });
      if(existing.fileName!==fileNameValue || existing.landingPageUrl!==landingPageUrl){
        existing.state='ambiguous';
        diagnostics.push({ code:'SETTING_CREATIVE_MAPPING_AMBIGUOUS', materialName, sheetName, rowNumber:rowIndex+1 });
      }
    }
    return indexByMaterial;
  }

  function measurementTagHeaderValue(headers, names){
    return names.find(name => headers[name]!==undefined) || null;
  }

  function measurementTagMappingSignature(mapping){
    return signatureFor({ tagUrl:mapping.tagUrl, vendor:mapping.vendor, measurementPoint:mapping.measurementPoint, newOrReuse:mapping.newOrReuse });
  }

  // 计测tag vendor 子表头标签（真实 ⑦⑧ 中「タグベンダー／…」位于 block 间隙，非 tag appeal）。
  const MEASUREMENT_TAG_VENDOR_LABELS = ['タグベンダー', 'タグ提供元', 'タグ提供会社'];

  // C3-C5-CR-REOPEN-3 FIX A：計測タグ block 明细表头上方的 vendor metadata 行
  // （真实结构：B=タグベンダー / C=vendor名 / D=「100%地点」）中，
  // 值恰为「100%地点」的单元格是 block 級計測地点（对该 block 全部 appeal 生效），
  // 不是明细列头、也不是 per-row 列值。按结构特征（行内存在该值）识别，不推测业务含义。
  function measurementTagBlockMetadata(rows, startRowIndex, headerRowIndex, fileName, sheetName){
    for(let rowIndex=headerRowIndex-1; rowIndex>=startRowIndex; rowIndex-=1){
      const row=rows[rowIndex] || [];
      const columnIndex=row.findIndex(value => String(value ?? '').trim()==='100%地点');
      if(columnIndex!==-1){
        // C3-C5-CR-REOPEN-5 FIX B：vendor list =「100%地点」cell 左侧最近的非空业务值。
        // 真实⑧「タグベンダー｜楽天,マクロミル｜100%地点」、真实⑦「設定用タグセット｜楽天BLS,マクロミル｜100%地点」
        // いずれも C 列（「100%地点」左隣）に vendor リストを持つ。タグベンダー等ラベル自体は除外。
        let vendorValue='';
        for(let searchColumn=columnIndex-1; searchColumn>=0; searchColumn-=1){
          const candidate=String(row[searchColumn] ?? '').trim();
          if(candidate && !MEASUREMENT_TAG_VENDOR_LABELS.includes(candidate) && candidate!=='100%地点'){
            vendorValue=candidate;
            break;
          }
        }
        return {
          measurementPoint:'100%地点',
          sourceRef:makeSettingSource(fileName, sheetName, rowIndex+1, '計測地点', row[columnIndex]),
          vendor:vendorValue,
          vendorSourceRef:vendorValue ? makeSettingSource(fileName, sheetName, rowIndex+1, 'タグベンダー', vendorValue) : null,
        };
      }
    }
    return { measurementPoint:'', sourceRef:null, vendor:'', vendorSourceRef:null };
  }

  function rowCarriesAdCompletePoint(row){
    return (row || []).some(value => String(value ?? '').trim()==='100%地点');
  }

  // C3-C5-CR-REOPEN-5 FIX B：タグセット関連 helpers。
  // vendor リスト（「楽天,マクロミル」等の逗号接続）を分割。
  function splitTverVendorList(vendorValue){
    return String(vendorValue ?? '')
      .split(',')
      .map(item => item.trim())
      .filter(item => item!=='');
  }

  // タグセット appeal 形態判定：⑧「SPPC_汎用_set」形態（_set 接尾辞）
  // ⑦「タグセット_SP / タグセット_CTV」形態（タグセット_ 接頭辞）。
  // 「タグセットを使用」等ラベル行は形態外（appeal として残留するが展開対象外）。
  function tverTagSetAppealPattern(appeal){
    const name=String(appeal ?? '').trim();
    if(!name) return false;
    return /_set$/.test(name) || /^タグセット_/.test(name);
  }

  // 設備型判定：SPPC/SP → SPPC、CTV → CTV（ Appeal 名中の接尾辞・接頭辞から厳格判定）。
  // 「VendorBSPPC」「マクロミルSPPC」等の連結形も含む。設備型なし → null（単一appeal block の
  // fallback 判定以外では選択されない）。
  function tverTagSetDeviceType(appeal){
    const name=String(appeal ?? '').trim();
    if(!name) return null;
    if(/_SP$/.test(name) || name.includes('SPPC')) return 'SPPC';
    if(name.includes('CTV')) return 'CTV';
    return null;
  }

  // vendor リスト項目と block vendor 名の対応判定（双向 contains：⑧「楽天」↔ block「楽天BLS」）。
  function tverVendorListMatches(vendorItem, blockVendor){
    const a=String(vendorItem ?? '').trim();
    const b=String(blockVendor ?? '').trim();
    if(!a || !b) return false;
    return a===b || b.includes(a) || a.includes(b);
  }

  // タグセット appeal 展開：base appeal URL + vendor リスト其余 vendor の同設備型 URL を
  // 業務順序（base → vendor リスト順）で組合せる。いずれか未解決（base 不在・vendor block 不在・
  // 設備型候補 0/複数かつ単一appeal fallback 不成立・URL 空）なら null（fake 展開しない）。
  function expandTverTagSetAppeal(appeal, vendorList, vendorBlocks, indexByAppeal){
    const device=tverTagSetDeviceType(appeal);
    if(!device) return null;
    let baseRecord=null;
    let baseBlock=null;
    let baseVendorIndex=-1;
    if(/_set$/.test(appeal)){
      // ⑧ 形態：接尾辞剥離 → 同名 base appeal を index から厳格 join。
      const baseName=appeal.slice(0, -'_set'.length);
      const baseEntry=indexByAppeal[baseName];
      if(!baseEntry || baseEntry.state!=='unique') return null;
      const baseUrl=String(baseEntry.tagUrl ?? '').trim();
      if(!baseUrl) return null;
      baseBlock=vendorBlocks.find(info => info.appeals.some(record => record.appeal===baseName && String(record.tagUrl ?? '').trim()===baseUrl));
      if(!baseBlock) return null;
      baseVendorIndex=vendorList.findIndex(item => tverVendorListMatches(item, baseBlock.vendorList[0]));
      if(baseVendorIndex===-1) return null;
      baseRecord={ url:baseUrl, sourceRef:baseEntry.sourceRefs.tagUrl, appeal:baseName };
    }else{
      // ⑦ 形態：vendor リスト先頭 vendor block から同設備型 appeal を厳格選択（複数候補は不展開）。
      baseBlock=vendorBlocks.find(info => tverVendorListMatches(vendorList[0], info.vendorList[0]));
      if(!baseBlock) return null;
      const deviceMatches=baseBlock.appeals.filter(record => tverTagSetDeviceType(record.appeal)===device && String(record.tagUrl ?? '').trim()!=='');
      if(deviceMatches.length!==1) return null;
      baseRecord={ url:String(deviceMatches[0].tagUrl).trim(), sourceRef:deviceMatches[0].sourceRef, appeal:deviceMatches[0].appeal };
      baseVendorIndex=0;
    }
    const members=[{ url:baseRecord.url, sourceRef:baseRecord.sourceRef, appeal:baseRecord.appeal }];
    for(let vendorIndex=0; vendorIndex<vendorList.length; vendorIndex+=1){
      if(vendorIndex===baseVendorIndex) continue;
      const vendorBlock=vendorBlocks.find(info => tverVendorListMatches(vendorList[vendorIndex], info.vendorList[0]));
      if(!vendorBlock || vendorBlock===baseBlock) return null;
      const deviceMatches=vendorBlock.appeals.filter(record => tverTagSetDeviceType(record.appeal)===device && String(record.tagUrl ?? '').trim()!=='');
      if(deviceMatches.length===1){
        members.push({ url:String(deviceMatches[0].tagUrl).trim(), sourceRef:deviceMatches[0].sourceRef, appeal:deviceMatches[0].appeal });
        continue;
      }
      // 設備型接尾なし単一appeal block（⑦ マクロミル形態）のみ fallback、それ以外は不展開。
      if(deviceMatches.length===0 && vendorBlock.appeals.length===1 && String(vendorBlock.appeals[0].tagUrl ?? '').trim()!==''){
        members.push({ url:String(vendorBlock.appeals[0].tagUrl).trim(), sourceRef:vendorBlock.appeals[0].sourceRef, appeal:vendorBlock.appeals[0].appeal });
        continue;
      }
      return null;
    }
    return { urls:members.map(member => member.url), members };
  }

  function buildMeasurementTagIndex(rows, fileName, sheetName, diagnostics){
    const indexByAppeal={};
    const section=locateSection(rows, '計測タグ');
    if(!section) return indexByAppeal;
    const required=['タグ訴求', 'タグ'];
    const candidates=[];
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const headers=blockHeaderIndex(section.rows[rowIndex]);
      if(required.every(header => headers[header]!==undefined)) candidates.push({ rowIndex, headers });
    }
    if(candidates.length===0){
      diagnostics.push({ code:'SETTING_MEASUREMENT_TAG_HEADER_NOT_FOUND', sheetName, requiredHeaders:required });
      return indexByAppeal;
    }
    // 相邻 header 紧邻（中间无数据）→ 重复表头，保持 AMBIGUOUS（保守，不猜哪个是正式表头）。
    // 有数据分隔 → 真实 multi-block，逐块独立解析后合并。
    const hasConsecutiveHeaders=candidates.some((candidate, index) => index>0 && candidate.rowIndex===candidates[index-1].rowIndex+1);
    if(hasConsecutiveHeaders){
      diagnostics.push({ code:'SETTING_MEASUREMENT_TAG_HEADER_AMBIGUOUS', sheetName, rowNumbers:candidates.map(candidate => candidate.rowIndex+1) });
      return indexByAppeal;
    }
    const blockInfos=[];
    candidates.forEach((header, blockIndex) => {
      const dataEnd=blockIndex+1<candidates.length ? candidates[blockIndex+1].rowIndex : section.endRowIndex;
      const blockStart=blockIndex===0 ? section.rowIndex+1 : candidates[blockIndex-1].rowIndex+1;
      const vendorHeader=measurementTagHeaderValue(header.headers, MEASUREMENT_TAG_VENDOR_LABELS);
      const measurementPointHeader=measurementTagHeaderValue(header.headers, ['計測地点', '計測場所']);
      const newOrReuseHeader=measurementTagHeaderValue(header.headers, ['新規/流用']);
      // FIX A：block 級計測地点 metadata（明细表头上方 vendor 行）——仅在明细行无「計測地点」列时作为 fallback。
      const blockMetadata=measurementPointHeader ? { measurementPoint:'', sourceRef:null, vendor:'', vendorSourceRef:null } : measurementTagBlockMetadata(section.rows, blockStart, header.rowIndex, fileName, sheetName);
      // C3-C5-CR-REOPEN-5 FIX B：block 毎 vendor リスト + appeal 明细を記録（タグセット展開第二遍用）。
      const blockInfo={ vendorList:splitTverVendorList(blockMetadata.vendor), appeals:[] };
      blockInfos.push(blockInfo);
      for(let rowIndex=header.rowIndex+1; rowIndex<dataEnd; rowIndex+=1){
        const row=section.rows[rowIndex] || [];
        if(!row.some(value => String(value ?? '')!=='')) continue;
        const appeal=String(row[header.headers['タグ訴求']] ?? '').trim();
        if(!appeal) continue;
        if(MEASUREMENT_TAG_VENDOR_LABELS.includes(appeal)) continue; // 跳过 vendor 子表头行
        if(rowCarriesAdCompletePoint(row)) continue; // FIX A：携带「100%地点」值的行是 block metadata 载体（例：設定用タグセット行），不作为 appeal 明细
        const mapping={
          tagUrl:String(row[header.headers['タグ']] ?? ''),
          vendor:vendorHeader ? String(row[header.headers[vendorHeader]] ?? '') : '',
          measurementPoint:measurementPointHeader ? String(row[header.headers[measurementPointHeader]] ?? '') : blockMetadata.measurementPoint,
          newOrReuse:newOrReuseHeader ? String(row[header.headers[newOrReuseHeader]] ?? '') : '',
          sourceRefs:{
            appeal:blockSource(fileName, sheetName, rowIndex+1, 'タグ訴求', row, header.headers),
            tagUrl:blockSource(fileName, sheetName, rowIndex+1, 'タグ', row, header.headers),
            vendor:vendorHeader ? blockSource(fileName, sheetName, rowIndex+1, vendorHeader, row, header.headers) : null,
            measurementPoint:measurementPointHeader ? blockSource(fileName, sheetName, rowIndex+1, measurementPointHeader, row, header.headers) : blockMetadata.sourceRef,
            newOrReuse:newOrReuseHeader ? blockSource(fileName, sheetName, rowIndex+1, newOrReuseHeader, row, header.headers) : null,
          },
        };
        const existing=indexByAppeal[appeal];
        blockInfo.appeals.push({ appeal, tagUrl:mapping.tagUrl, sourceRef:mapping.sourceRefs.tagUrl, tagSetPattern:tverTagSetAppealPattern(appeal) });
        if(!existing){
          indexByAppeal[appeal]={ state:'unique', appeal, ...mapping, mappings:[mapping] };
          continue;
        }
        existing.mappings.push(mapping);
        if(measurementTagMappingSignature(existing)!==measurementTagMappingSignature(mapping)){
          existing.state='ambiguous';
          diagnostics.push({ code:'SETTING_MEASUREMENT_TAG_MAPPING_AMBIGUOUS', sheetName, appeal, rowNumber:rowIndex+1 });
        }
      }
    });
    // C3-C5-CR-REOPEN-5 FIX B 第二遍：タグセット block（vendor リスト ≥2）内のタグセット appeal
    // （⑧ *_set / ⑦ タグセット_SP・_CTV、URL 空）を展開：base appeal + vendor リスト其余 vendor の
    // 同設備型 URL。単一 vendor block 内の空URL appeal は REOPEN3-A6 契約どおり missing 維持。
    blockInfos.forEach(blockInfo => {
      if(blockInfo.vendorList.length<2) return;
      const vendorBlocks=blockInfos.filter(info => info!==blockInfo && info.vendorList.length===1 && info.vendorList[0]);
      blockInfo.appeals.forEach(record => {
        if(!record.tagSetPattern) return;
        if(String(record.tagUrl ?? '').trim()!=='') return;
        const entry=indexByAppeal[record.appeal];
        if(!entry || entry.state!=='unique') return;
        const expansion=expandTverTagSetAppeal(record.appeal, blockInfo.vendorList, vendorBlocks, indexByAppeal);
        if(expansion) entry.tagSetExpansion=expansion;
      });
    });
    return indexByAppeal;
  }

  function completeTrackingPoint(measurementPoint){
    const point=String(measurementPoint ?? '').trim();
    // C3-C5-CR-REOPEN-3 FIX A：vendor metadata 行「100%地点」为 block 級 Complete 計測地点。
    return point==='100%' || point==='100%視聴' || point==='100%地点';
  }

  function resolveCreativeFields(ad, creativeIndex, measurementTagIndex){
    const fields=ad && ad.fields || {};
    const sourceRefs=ad && ad.sourceRefs || {};
    const materialName=String(fields.materialName ?? '');
    const tagAppeal=String(fields.tagAppeal ?? '');
    const creative=creativeIndex && creativeIndex[materialName];
    const tag=measurementTagIndex && measurementTagIndex[tagAppeal];
    const creativeDerivedFrom=creative && creative.state==='unique'
      ? uniqueSourceRefs([sourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.fileName]) : uniqueSourceRefs([sourceRefs.materialName]);
    const landingPageDerivedFrom=creative && creative.state==='unique'
      ? uniqueSourceRefs([sourceRefs.landingPageName, sourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.landingPageUrl]) : uniqueSourceRefs([sourceRefs.landingPageName, sourceRefs.materialName]);
    const missing=(reason, settingSource) => ({ state:'missing', value:null, reason, sourceRef:settingSource || null });
    const tracking={
      tracking_url_start:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_first_quartile:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_midpoint:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_third_quartile:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_complete:missing('SETTING_SOURCE_NOT_PROVIDED'),
    };
    if(tag){
      if(tag.state==='ambiguous'){
        tracking.tracking_url_complete={ state:'ambiguous', value:null, reason:'SETTING_MEASUREMENT_TAG_AMBIGUOUS', sourceRef:sourceRefs.tagAppeal || null, mappings:tag.mappings, derivedFrom:uniqueSourceRefs([sourceRefs.tagAppeal]) };
      }else if(completeTrackingPoint(tag.measurementPoint) && String(tag.tagUrl ?? '').trim()!==''){
        // C3-C5-CR-REOPEN-3：tagUrl 为空（例：タグセット未展开形态）时保持 missing，
        // 不伪造 Setting 值、不制造 fake match/mismatch（TAG_SET_EXPANSION=DEFER）。
        tracking.tracking_url_complete={ state:'unique', value:tag.tagUrl, ruleBasis:'TVER_260605_MEASUREMENT_TAG_100_PERCENT_TO_COMPLETE', sourceRef:tag.sourceRefs.tagUrl, measurementPointSourceRef:tag.sourceRefs.measurementPoint, derivedFrom:uniqueSourceRefs([sourceRefs.tagAppeal, tag.sourceRefs.appeal, tag.sourceRefs.measurementPoint, tag.sourceRefs.tagUrl]) };
      }else if(completeTrackingPoint(tag.measurementPoint) && tag.tagSetExpansion && tag.tagSetExpansion.urls.length){
        // C3-C5-CR-REOPEN-5 FIX B：タグセット展開形態（⑧ *_set / ⑦ タグセット_SP・_CTV）。
        // value = base + vendor リスト其余同設備型 URL の業務順序 collection（逗号接続）。
        // 比較層（normalizeTverTrackingUrlCollectionForComparison）で multiset 順序不敏感比較。
        const expansionMembers=tag.tagSetExpansion.members || [];
        tracking.tracking_url_complete={
          state:'unique',
          value:tag.tagSetExpansion.urls.join(','),
          ruleBasis:'TVER_260605_TAG_SET_EXPANSION',
          sourceRef:expansionMembers[0] && expansionMembers[0].sourceRef || tag.sourceRefs.tagUrl,
          measurementPointSourceRef:tag.sourceRefs.measurementPoint,
          derivedFrom:uniqueSourceRefs([sourceRefs.tagAppeal, tag.sourceRefs.appeal, tag.sourceRefs.measurementPoint, ...expansionMembers.map(member => member.sourceRef)].filter(Boolean)),
        };
      }
    }
    return {
      creative:creative ? (creative.state==='ambiguous' ? { state:'ambiguous', value:null, mappings:creative.mappings, sourceRef:sourceRefs.materialName || null, derivedFrom:creativeDerivedFrom } : { state:'unique', fileName:creative.fileName, sourceRef:creative.sourceRefs.fileName, derivedFrom:creativeDerivedFrom }) : { ...missing('SETTING_CREATIVE_NOT_FOUND', sourceRefs.materialName), derivedFrom:creativeDerivedFrom },
      landingPage:creative && creative.state==='unique' ? { state:'unique', url:creative.landingPageUrl, sourceRef:creative.sourceRefs.landingPageUrl, derivedFrom:landingPageDerivedFrom } : { ...missing(creative && creative.state==='ambiguous' ? 'SETTING_CREATIVE_AMBIGUOUS' : 'SETTING_CREATIVE_NOT_FOUND', sourceRefs.landingPageName), derivedFrom:landingPageDerivedFrom },
      tracking,
      creativeId:{ state:'setting-source-not-provided', value:null },
    };
  }

  function buildEvidenceBlocks(rows, fileName, sheetName){
    const evidenceBlocks={ changeHistory:[], operationMemo:[], otherSettings:[] };
    rows.forEach((row, rowIndex) => {
      const markerColumn=(row || []).findIndex(value => String(value ?? '').trim()==='▼運用メモ欄');
      if(markerColumn===-1) return;
      let foundValue=false;
      for(let columnIndex=markerColumn+1; columnIndex<(row || []).length; columnIndex+=1){
        const rawValue=String(row[columnIndex] ?? '');
        if(rawValue==='') continue;
        evidenceBlocks.operationMemo.push(makeSettingSource(fileName, sheetName, rowIndex+1, '▼運用メモ欄', rawValue));
        foundValue=true;
      }
      if(!foundValue) evidenceBlocks.operationMemo.push(makeSettingSource(fileName, sheetName, rowIndex+1, '▼運用メモ欄', row[markerColumn]));
    });
    const section=locateSection(rows, '変更履歴');
    if(!section) return evidenceBlocks;
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const headers=blockHeaderIndex(rows[rowIndex]);
      if(!['変更履歴', '運用メモ', 'その他設定'].some(header => headers[header]!==undefined)) continue;
      for(let dataRowIndex=rowIndex+1; dataRowIndex<section.endRowIndex; dataRowIndex+=1){
        const dataRow=rows[dataRowIndex] || [];
        if(!dataRow.some(value => String(value ?? '')!=='')) continue;
        if(headers['変更履歴']!==undefined) evidenceBlocks.changeHistory.push(blockSource(fileName, sheetName, dataRowIndex+1, '変更履歴', dataRow, headers));
        if(headers['運用メモ']!==undefined) evidenceBlocks.operationMemo.push(blockSource(fileName, sheetName, dataRowIndex+1, '運用メモ', dataRow, headers));
        if(headers['その他設定']!==undefined) evidenceBlocks.otherSettings.push(blockSource(fileName, sheetName, dataRowIndex+1, 'その他設定', dataRow, headers));
      }
      break;
    }
    return evidenceBlocks;
  }

  function campaignDateCode(value, includeYear){
    const match=String(value ?? '').match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!match) return null;
    const month=match[2].padStart(2, '0');
    const day=match[3].padStart(2, '0');
    return includeYear ? `${match[1].slice(-2)}${month}${day}` : `${month}${day}`;
  }

  function buildCampaignExpectation(fields){
    const start=campaignDateCode(fields.startDateTime, true);
    const end=campaignDateCode(fields.endDateTime, false);
    if(!fields.campaignName || !start || !end) return null;
    return `${fields.campaignName}_${start}-${end}${fields.campaignAppeal ? `_${fields.campaignAppeal}` : ''}`;
  }

  function parseTverSettingWorkbook(workbook, options){
    const fileName=options && options.fileName ? options.fileName : '';
    const found=findSettingHeaderCandidates(workbook, { maxRows:100 });
    if(found.candidates.length===0){
      return emptySettingModel([{ code:'SETTING_HEADER_NOT_FOUND', message:'発注CPN名 と ターゲティング番号 を含む表頭がありません' }]);
    }
    if(found.candidates.length!==1){
      return emptySettingModel([{ code:'SETTING_HEADER_AMBIGUOUS', message:'発注CPN名 と ターゲティング番号 を含む表頭が複数あります', candidates:found.candidates }]);
    }

    const candidate=found.candidates[0];
    const rows=getSheetRows(workbook, candidate.sheetName);
    const headerIndex={};
    const headerCounts={};
    candidate.headers.forEach((header, index) => {
      const text=String(header ?? '').trim();
      if(!text) return;
      headerCounts[text]=(headerCounts[text] || 0)+1;
      if(headerIndex[text]===undefined) headerIndex[text]=index;
    });
    const duplicateBusinessHeaders=SETTING_BUSINESS_HEADERS.filter(header => headerCounts[header]>1);
    if(duplicateBusinessHeaders.length) return emptySettingModel([{ code:'SETTING_BUSINESS_HEADER_DUPLICATE', headers:duplicateBusinessHeaders, sheetName:candidate.sheetName }]);
    const missingBusinessHeaders=SETTING_BUSINESS_HEADERS.filter(header => headerIndex[header]===undefined);
    if(missingBusinessHeaders.length) return emptySettingModel([{ code:'SETTING_BUSINESS_HEADER_MISSING', headers:missingBusinessHeaders, sheetName:candidate.sheetName }]);

    const diagnostics=[];
    const campaigns=[];
    const adGroups=[];
    const ads=[];
    const campaignBySignature=new Map();
    const adGroupBySignature=new Map();
    const sourceIndex={
      targetingByNumber:buildTargetingIndex(rows, fileName, candidate.sheetName, diagnostics),
      creativeByMaterial:buildCreativeIndex(rows, fileName, candidate.sheetName, diagnostics),
      measurementTagByAppeal:buildMeasurementTagIndex(rows, fileName, candidate.sheetName, diagnostics),
      evidenceBlocks:buildEvidenceBlocks(rows, fileName, candidate.sheetName),
    };
     const fieldHeaders={ campaignName:'発注CPN名', campaignAppeal:'CPN訴求', campaignBudget:'CPN予算', startDateTime:'開始日時(yyyy/mm/dd hh:mm)', endDateTime:'終了日時(yyyy/mm/dd hh:mm)', initialDailyBudget:'初期設定日予算', otherSettings:'その他設定', changeHistory:'変更履歴' };
     const campaignContractValues={
       cvMode:findSettingPairValue(rows, 'CV', fileName, candidate.sheetName),
       cvPoint:findSettingPairValue(rows, 'CVポイント', fileName, candidate.sheetName),
     };

    for(let rowIndex=candidate.rowIndex+1; rowIndex<rows.length; rowIndex+=1){
      const row=rows[rowIndex] || [];
      if(isSectionBoundary(row)) break;
      const campaignName=String(row[headerIndex['発注CPN名']] ?? '').trim();
      const targetingNumber=String(row[headerIndex['ターゲティング番号']] ?? '').trim();
      const materialName=String(row[headerIndex['素材名']] ?? '').trim();
      const landingPageName=String(row[headerIndex['LP名']] ?? '').trim();
      if(!campaignName && !targetingNumber && !materialName && !landingPageName) continue;
      const rowNumber=rowIndex+1;
      if(!campaignName || !targetingNumber || !materialName){
        diagnostics.push({ code:'SETTING_REQUIRED_VALUE_MISSING', rowNumber, sheetName:candidate.sheetName });
        continue;
      }
       const campaignFields=Object.fromEntries(Object.entries(fieldHeaders).map(([field, header]) => [field, String(row[headerIndex[header]] ?? '')]));
       const campaignSourceRefs={};
       Object.entries(fieldHeaders).forEach(([field, header]) => { campaignSourceRefs[field]=makeSettingSource(fileName, candidate.sheetName, rowNumber, header, row[headerIndex[header]]); });
       if(campaignContractValues.cvMode.source || campaignContractValues.cvPoint.source){
         campaignFields.cvMode=campaignContractValues.cvMode.value;
         campaignFields.cvPoint=campaignContractValues.cvPoint.value;
         campaignSourceRefs.cvMode=campaignContractValues.cvMode.source;
         campaignSourceRefs.cvPoint=campaignContractValues.cvPoint.source;
       }
      if(campaignSourceRefs.changeHistory.rawValue!=='') sourceIndex.evidenceBlocks.changeHistory.push(campaignSourceRefs.changeHistory);
      if(campaignSourceRefs.otherSettings.rawValue!=='') sourceIndex.evidenceBlocks.otherSettings.push(campaignSourceRefs.otherSettings);
      const campaignSignature=signatureFor({ campaignName:campaignFields.campaignName, campaignAppeal:campaignFields.campaignAppeal, startDateTime:campaignFields.startDateTime, endDateTime:campaignFields.endDateTime });
      let campaign=campaignBySignature.get(campaignSignature);
      if(!campaign){
        const expectedNameDerivedFrom=uniqueSourceRefs([campaignSourceRefs.campaignName, campaignSourceRefs.startDateTime, campaignSourceRefs.endDateTime, campaignSourceRefs.campaignAppeal]);
        campaign={
          key:`campaign:${campaignSignature}`, level:'Campaign', fields:campaignFields, sourceRefs:campaignSourceRefs,
          sourceEvidence:{
            fields:Object.fromEntries(Object.entries(campaignSourceRefs).map(([field, source]) => [field, uniqueSourceRefs([source])])),
            derived:{ expectedName:{ derivedFrom:expectedNameDerivedFrom, primarySource:campaignSourceRefs.campaignName || null } },
          },
          semanticSignature:campaignSignature, expectedName:buildCampaignExpectation(campaignFields),
          nameRuleId:'TVER_260605_CAMPAIGN_NAME', nameComponents:{ campaignName:campaignFields.campaignName, startDateTime:campaignFields.startDateTime, endDateTime:campaignFields.endDateTime, campaignAppeal:campaignFields.campaignAppeal },
        };
        campaignBySignature.set(campaignSignature, campaign);
        campaigns.push(campaign);
      }
      const targeting=sourceIndex.targetingByNumber[targetingNumber];
      const targetingFields=targeting && targeting.state==='unique' ? targeting.fields : {};
      const targetingSourceRefs=targeting && targeting.state==='unique' ? targeting.sourceRefs : {};
      const targetingEvidence=targeting && targeting.state==='unique' ? targetingSourceEvidence(targeting) : { fields:{}, rawFields:{} };
      if(!targeting) diagnostics.push({ code:'SETTING_TARGETING_REFERENCE_NOT_FOUND', targetingNumber, sheetName:candidate.sheetName, rowNumber });
      if(targeting && targeting.state!=='unique') diagnostics.push({ code:'SETTING_TARGETING_REFERENCE_AMBIGUOUS', targetingNumber, sheetName:candidate.sheetName, rowNumber });
      const adGroupFields={
        targetingNumber,
        tagAppeal:String(row[headerIndex['タグ訴求']] ?? ''),
        startDateTime:String(row[headerIndex['ADG開始日時(yyyy/mm/dd hh:mm)']] ?? ''),
        endDateTime:String(row[headerIndex['ADG終了日時(yyyy/mm/dd hh:mm)']] ?? ''),
        device:targetingFields.device || '', targeting:targetingFields,
      };
      const adGroupSignature=signatureFor({ parentCampaign:campaign.semanticSignature, targetingNumber, tagAppeal:adGroupFields.tagAppeal, device:adGroupFields.device, targetingSignature:targeting && targeting.semanticSignature ? targeting.semanticSignature : null, startDateTime:adGroupFields.startDateTime, endDateTime:adGroupFields.endDateTime });
      let adGroup=adGroupBySignature.get(adGroupSignature);
      if(!adGroup){
        const adGroupSourceRefs={
          targetingNumber:makeSettingSource(fileName, candidate.sheetName, rowNumber, 'ターゲティング番号', row[headerIndex['ターゲティング番号']]),
          tagAppeal:makeSettingSource(fileName, candidate.sheetName, rowNumber, 'タグ訴求', row[headerIndex['タグ訴求']]),
          startDateTime:makeSettingSource(fileName, candidate.sheetName, rowNumber, 'ADG開始日時(yyyy/mm/dd hh:mm)', row[headerIndex['ADG開始日時(yyyy/mm/dd hh:mm)']]),
          endDateTime:makeSettingSource(fileName, candidate.sheetName, rowNumber, 'ADG終了日時(yyyy/mm/dd hh:mm)', row[headerIndex['ADG終了日時(yyyy/mm/dd hh:mm)']]),
          device:targetingSourceRefs.device || null,
        };
        const adGroupFieldsEvidence={ targetingNumber:uniqueSourceRefs([adGroupSourceRefs.targetingNumber]), tagAppeal:uniqueSourceRefs([adGroupSourceRefs.tagAppeal]), startDateTime:uniqueSourceRefs([adGroupSourceRefs.startDateTime]), endDateTime:uniqueSourceRefs([adGroupSourceRefs.endDateTime]), ...targetingEvidence.fields };
        const deviceDerivedFrom=uniqueSourceRefs([...(targetingEvidence.fields.device || []), adGroupSourceRefs.tagAppeal]);
        adGroup={
          key:`adgroup:${adGroupSignature}`, level:'Ad Group', parentKey:campaign.key, fields:adGroupFields,
          displayIdentity:targeting && targeting.state==='unique' ? targeting.identity || null : null,
          sourceRefs:adGroupSourceRefs,
          sourceEvidence:{ fields:adGroupFieldsEvidence, targeting:targetingEvidence.rawFields, derived:{ device:{ derivedFrom:deviceDerivedFrom, primarySource:adGroupSourceRefs.device || null } } },
          semanticSignature:adGroupSignature, expectedName:null, nameRuleId:'TVER_260605_ADGROUP_STRUCTURE', nameGenerationStatus:'TEMPLATE_NO_ADGROUP_NAME_FORMULA', nameComponents:{ parentCampaign:campaign.expectedName, targetingNumber, tagAppeal:adGroupFields.tagAppeal, device:adGroupFields.device },
        };
        adGroupBySignature.set(adGroupSignature, adGroup);
        adGroups.push(adGroup);
      }
      const creative=sourceIndex.creativeByMaterial[materialName];
      const adSourceRefs={
        materialName:makeSettingSource(fileName, candidate.sheetName, rowNumber, '素材名', row[headerIndex['素材名']]),
        landingPageName:makeSettingSource(fileName, candidate.sheetName, rowNumber, 'LP名', row[headerIndex['LP名']]),
        tagAppeal:makeSettingSource(fileName, candidate.sheetName, rowNumber, 'タグ訴求', row[headerIndex['タグ訴求']]),
        creativeFileName:creative && creative.state==='unique' ? creative.sourceRefs.fileName : null,
        landingPageUrl:creative && creative.state==='unique' ? creative.sourceRefs.landingPageUrl : null,
      };
      const creativeDerivedFrom=creative && creative.state==='unique' ? uniqueSourceRefs([adSourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.fileName]) : [];
      const landingPageDerivedFrom=creative && creative.state==='unique' ? uniqueSourceRefs([adSourceRefs.landingPageName, adSourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.landingPageUrl]) : [];
      const ad={
        key:`${adGroup.key}|material:${materialName}|row:${rowNumber}`, level:'Ad', parentKey:adGroup.key,
        fields:{ materialName, landingPageName, tagAppeal:String(row[headerIndex['タグ訴求']] ?? ''), creativeFileName:creative && creative.state==='unique' ? creative.fileName : null, landingPageUrl:creative && creative.state==='unique' ? creative.landingPageUrl : null },
        sourceRefs:adSourceRefs,
        sourceEvidence:{ fields:Object.fromEntries(Object.entries(adSourceRefs).map(([field, source]) => [field, uniqueSourceRefs([source])])), derived:{ creativeFileName:{ derivedFrom:creativeDerivedFrom, primarySource:adSourceRefs.creativeFileName || null }, landingPageUrl:{ derivedFrom:landingPageDerivedFrom, primarySource:adSourceRefs.landingPageUrl || null } } },
        expectedName:creative && creative.state==='unique' ? creative.fileName : null, nameRuleId:'TVER_260605_AD_CREATIVE_LINK', nameComponents:{ materialName, creativeFileName:creative && creative.state==='unique' ? creative.fileName : null },
      };
      ads.push(ad);
    }
    return { campaigns, adGroups, ads, diagnostics, sourceIndex, templateVersion:'260605' };
  }

  function isValidTverId(value){
    return /^\d+$/.test(String(value ?? '').trim());
  }

  function addEntityConflict(entity, diagnostics, code, field, previousValue, nextValue, rowNumber){
    if(previousValue===nextValue) return;
    const issue={ code, field, previousValue, nextValue, rowNumber };
    entity.conflictIssues.push(issue);
    diagnostics.push({ ...issue, entityKey:entity.key });
  }

  function makeCsvEntity(key, level, fields, source, parentKey){
    return {
      key, level, id:fields.id || null, parentKey:parentKey || null, fields,
      sourceRefs:{ csv:source }, rawRows:[], occurrenceIndex:null,
      conflictIssues:[], validationIssues:[], matchable:true, orphanReason:null,
    };
  }

  const CAMPAIGN_FIELDS = [
    'campaign_name', 'start_datetime', 'end_datetime', 'budget', 'daily_budget', 'hourly_bid_weight',
    'campaign_status', 'consumption_type', 'cv_point', 'report_target_flag',
  ];
  const ADGROUP_FIELDS = [
    'adgroup_name', 'adgroup_start_datetime', 'adgroup_end_datetime', 'daily_freq_cap', 'auction_type',
    'price', 'adgroup_status', 'device', 'media', 'local_broadcaster', 'bls_start_datetime',
    'bls_end_datetime', 'contact_bls_survey_id', 'non_contact_bls_survey_id', 'gender', 'start_age',
    'end_age', 'pref', 'city', 'affinity', 'demography', 'annual_income', 'tv_usage_tendency',
    'carrier', 'uid_suffix', 'genre', 'genre_exclude', 'subgenre', 'subgenre_exclude', 'contents_group',
    'bid_segment', 'upload_segment_expansion_threshold', 'bid_segment_exclude', 'dmp_segment',
    'dmp_segment_expansion_threshold', 'dmp_segment_exclude', 'store_segment', 'bls_store_segment',
  ];
  // C3-C4-1：Register GP原始配置用于聚合及取值，与旧matchingFields独立。
  // Edit不提供视频尺，继续使用既有ADGROUP_FIELDS及ID聚合。
  const REGISTER_ADGROUP_FIELDS = ['tver_video_duration', ...ADGROUP_FIELDS];
  const AD_FIELDS = [
    'creative_id', 'creative_name', 'url', 'tracking_url_start', 'tracking_url_first_quartile',
    'tracking_url_midpoint', 'tracking_url_third_quartile', 'tracking_url_complete', 'start_time',
    'end_time', 'status',
  ];

  function fieldsForScope(values, fields){
    const output={};
    fields.forEach(field => { output[field]=String(values[field] ?? ''); });
    return output;
  }

  function sourceRefsForScope(row, fields){
    const output={};
    fields.forEach(field => { output[field]=row.sourceRefs ? row.sourceRefs[field] : row.source; });
    return output;
  }

  // A17-1：仅收集 Register 原始字段来源。这里绝不解释空值、选择业务字段值或改变实体聚合。
  function sourceRefIdentity(source){
    if(!source) return '';
    return JSON.stringify([source.fileName ?? '', source.sheetName ?? null, source.rowNumber ?? null, source.columnName ?? '', source.rawValue ?? '']);
  }

  function uniqueSourceRefs(sources){
    const seen=new Set();
    return (sources || []).filter(source => {
      if(!source) return false;
      const key=sourceRefIdentity(source);
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function collectFieldEvidence(rawRows, field){
    const sources=[];
    (rawRows || []).forEach(row => {
      const source=row && row.sourceRefs && row.sourceRefs[field];
      if(source) sources.push(source);
    });
    return uniqueSourceRefs(sources);
  }

  // Register 的 primary 只可对应当前既有 entity.fields 原文；不得用首行或首个非空值回退。
  function selectPrimaryEvidenceForRawValue(evidence, rawValue){
    const expected=String(rawValue ?? '');
    return (evidence || []).find(source => String(source.rawValue ?? '')===expected) || null;
  }

  const REGISTER_PRIMARY_FIELD_MAP={
    Campaign:{
      campaign_name:'campaignName', start_datetime:'startDateTime', end_datetime:'endDateTime', budget:'budget',
      daily_budget:'dailyBudget', hourly_bid_weight:'hourlyBidWeight', campaign_status:'campaignStatus', consumption_type:'consumptionType',
    },
    'Ad Group':{
      adgroup_name:'adGroupName', device:'device', price:'price', media:'media', local_broadcaster:'localBroadcaster', gender:'gender',
      start_age:'startAge', end_age:'endAge', pref:'pref', city:'city', affinity:'affinity', genre:'genre', genre_exclude:'genreExclude',
      subgenre:'subgenre', subgenre_exclude:'subgenreExclude', contents_group:'contentsGroup',
    },
    Ad:{
      creative_name:'creativeName', url:'landingPageUrl', tracking_url_start:'trackingUrlStart', tracking_url_first_quartile:'trackingUrlFirstQuartile',
      tracking_url_midpoint:'trackingUrlMidpoint', tracking_url_third_quartile:'trackingUrlThirdQuartile', tracking_url_complete:'trackingUrlComplete',
    },
  };

  // A17-1C：Register 原始 evidence 仅属于其 CSV 实体层级；绝不把下级字段伪装成父级原始来源。
  const REGISTER_SOURCE_FIELDS_BY_LEVEL=Object.freeze({
    Campaign:['budget_type', ...CAMPAIGN_FIELDS],
    'Ad Group':REGISTER_ADGROUP_FIELDS,
    Ad:AD_FIELDS,
  });

  function attachRegisterSourceEvidence(entity){
    const fields={};
    const ownedFields=REGISTER_SOURCE_FIELDS_BY_LEVEL[entity && entity.level] || [];
    ownedFields.forEach(field => { fields[field]=collectFieldEvidence(entity && entity.rawRows, field); });
    entity.sourceEvidence={ ...(entity.sourceEvidence || {}), fields };
    const primaryMap=REGISTER_PRIMARY_FIELD_MAP[entity && entity.level] || {};
    Object.entries(primaryMap).forEach(([csvField, entityField]) => {
      // sourceRefs.csv 是既有实体 primary，不改写；仅补齐此前不存在的字段 primary。
      if(entity.sourceRefs && entity.sourceRefs[csvField]!==undefined) return;
      const primary=selectPrimaryEvidenceForRawValue(fields[csvField], entity && entity.fields && entity.fields[entityField]);
      if(primary) entity.sourceRefs[csvField]=primary;
    });
  }

  function auditScopeConflicts(entity, row, fields, diagnostics){
    fields.forEach(field => {
      addEntityConflict(entity, diagnostics, 'DUPLICATE_ID_FIELD_CONFLICT', field, entity.fields[field], String(row.values[field] ?? ''), row.rowNumber);
    });
  }

  function buildEditTree(parsedCsv){
    const diagnostics=[];
    const campaigns=[];
    const adGroups=[];
    const ads=[];
    const orphans=[];
    const entityByKey={};
    const rowLedger={};
    const campaignById=new Map();
    const adGroupById=new Map();
    const adById=new Map();
    const rows=parsedCsv && Array.isArray(parsedCsv.rows) ? parsedCsv.rows : [];

    rows.forEach(row => {
      const values=row.values || {};
      const ids=[
        { field:'campaign_id', level:'Campaign' },
        { field:'adgroup_id', level:'Ad Group' },
        { field:'ad_id', level:'Ad' },
      ];
      const invalid=ids.find(item => !isValidTverId(values[item.field]));
      if(invalid){
        const rawValue=String(values[invalid.field] ?? '');
        const validationIssue={
          code:rawValue.trim()==='' ? 'MISSING_ID' : 'INVALID_ID',
          field:invalid.field,
          rawValue,
          source:row.source,
        };
        const orphan={
          key:`orphan:${row.rowNumber}:${invalid.level}`,
          level:invalid.level,
          id:null,
          parentKey:null,
          fields:{ ...values },
          sourceRefs:{ csv:row.source },
          rawRows:[row],
          occurrenceIndex:row.occurrenceIndex,
          conflictIssues:[],
          validationIssues:[validationIssue],
          matchable:false,
          orphanReason:validationIssue,
          displayHint:'CSV側未匹配',
        };
        orphans.push(orphan);
        entityByKey[orphan.key]=orphan;
        rowLedger[row.rowNumber]={ disposition:'orphan', entityKey:orphan.key };
        diagnostics.push({ ...validationIssue, entityKey:orphan.key });
        return;
      }

      const campaignId=String(values.campaign_id).trim();
      const adGroupId=String(values.adgroup_id).trim();
      const adId=String(values.ad_id).trim();
      let campaign=campaignById.get(campaignId);
      if(!campaign){
        campaign=makeCsvEntity(`campaign:${campaignId}`, 'Campaign', {
          id:campaignId, ...fieldsForScope(values, CAMPAIGN_FIELDS),
        }, row.source, null);
        campaign.sourceRefs={ ...sourceRefsForScope(row, CAMPAIGN_FIELDS), campaign_id:row.sourceRefs.campaign_id };
        campaignById.set(campaignId, campaign);
        campaigns.push(campaign);
        entityByKey[campaign.key]=campaign;
      }else{
        auditScopeConflicts(campaign, row, CAMPAIGN_FIELDS, diagnostics);
      }
      campaign.rawRows.push(row);

      let adGroup=adGroupById.get(adGroupId);
      if(!adGroup){
        adGroup=makeCsvEntity(`adgroup:${adGroupId}`, 'Ad Group', {
          id:adGroupId, campaignId, ...fieldsForScope(values, ADGROUP_FIELDS),
        }, row.source, campaign.key);
        adGroup.sourceRefs={ ...sourceRefsForScope(row, ADGROUP_FIELDS), campaign_id:row.sourceRefs.campaign_id, adgroup_id:row.sourceRefs.adgroup_id };
        adGroupById.set(adGroupId, adGroup);
        adGroups.push(adGroup);
        entityByKey[adGroup.key]=adGroup;
      }else{
        addEntityConflict(adGroup, diagnostics, 'EDIT_PARENT_ID_CONFLICT', 'campaign_id', adGroup.fields.campaignId, campaignId, row.rowNumber);
        auditScopeConflicts(adGroup, row, ADGROUP_FIELDS, diagnostics);
      }
      adGroup.rawRows.push(row);

      let ad=adById.get(adId);
      if(!ad){
        ad=makeCsvEntity(`ad:${adId}`, 'Ad', {
          id:adId, adGroupId, ...fieldsForScope(values, AD_FIELDS),
        }, row.source, adGroup.key);
        ad.sourceRefs={ ...sourceRefsForScope(row, AD_FIELDS), adgroup_id:row.sourceRefs.adgroup_id, ad_id:row.sourceRefs.ad_id };
        adById.set(adId, ad);
        ads.push(ad);
        entityByKey[ad.key]=ad;
      }else{
        addEntityConflict(ad, diagnostics, 'EDIT_PARENT_ID_CONFLICT', 'adgroup_id', ad.fields.adGroupId, adGroupId, row.rowNumber);
        auditScopeConflicts(ad, row, AD_FIELDS, diagnostics);
      }
      ad.rawRows.push(row);
      rowLedger[row.rowNumber]={ disposition:'normal-leaf', entityKey:ad.key };
    });

    return {
      schema:parsedCsv ? parsedCsv.schema : null,
      campaigns, adGroups, ads, entityByKey, orphans, rowLedger, diagnostics,
      comparisonInputs:{ csvEntities:ads, csvOnly:orphans },
    };
  }

  function signatureFor(fields){
    return JSON.stringify(fields);
  }

  function buildRegisterTree(parsedCsv){
    const diagnostics=[];
    const campaigns=[];
    const adGroups=[];
    const ads=[];
    const entityByKey={};
    const rowLedger={};
    const campaignBySignature=new Map();
    const adGroupBySignature=new Map();
    const occurrenceByFullRowSignature=new Map();
    const rows=parsedCsv && Array.isArray(parsedCsv.rows) ? parsedCsv.rows : [];

    rows.forEach(row => {
      const values=row.values || {};
      const campaignFields={
        campaignName:String(values.campaign_name ?? ''),
        startDateTime:String(values.start_datetime ?? ''),
        endDateTime:String(values.end_datetime ?? ''),
        budget:String(values.budget ?? ''),
        dailyBudget:String(values.daily_budget ?? ''),
        hourlyBidWeight:String(values.hourly_bid_weight ?? ''),
        campaignStatus:String(values.campaign_status ?? ''),
        consumptionType:String(values.consumption_type ?? ''),
      };
      const campaignSignature=signatureFor(campaignFields);
      let campaign=campaignBySignature.get(campaignSignature);
      if(!campaign){
        campaign=makeCsvEntity(`register-campaign:${campaignSignature}`, 'Campaign', campaignFields, row.source, null);
        campaign.candidateSignature=campaignSignature;
        campaign.matchingFields={ ...campaignFields };
        campaignBySignature.set(campaignSignature, campaign);
        campaigns.push(campaign);
        entityByKey[campaign.key]=campaign;
      }
      campaign.rawRows.push(row);

      const adGroupFields={
        parentCampaignSignature:campaignSignature,
        adGroupName:String(values.adgroup_name ?? ''),
        device:String(values.device ?? ''),
        price:String(values.price ?? ''),
        media:String(values.media ?? ''),
        localBroadcaster:String(values.local_broadcaster ?? ''),
        gender:String(values.gender ?? ''),
        startAge:String(values.start_age ?? ''),
        endAge:String(values.end_age ?? ''),
        pref:String(values.pref ?? ''),
        city:String(values.city ?? ''),
        affinity:String(values.affinity ?? ''),
        genre:String(values.genre ?? ''),
        genreExclude:String(values.genre_exclude ?? ''),
        subgenre:String(values.subgenre ?? ''),
        subgenreExclude:String(values.subgenre_exclude ?? ''),
        contentsGroup:String(values.contents_group ?? ''),
      };
      const adGroupSignature=signatureFor(adGroupFields);
      const adGroupRawFields=fieldsForScope(values, REGISTER_ADGROUP_FIELDS);
      const aggregationSignature=signatureFor({ parentCampaignSignature:campaignSignature, ...adGroupRawFields });
      let adGroup=adGroupBySignature.get(aggregationSignature);
      if(!adGroup){
        adGroup=makeCsvEntity(`register-adgroup:${aggregationSignature}`, 'Ad Group', { ...adGroupRawFields, ...adGroupFields }, row.source, campaign.key);
        adGroup.aggregationSignature=aggregationSignature;
        adGroup.candidateSignature=adGroupSignature;
        adGroup.matchingFields={ ...adGroupFields };
        adGroup.sourceRefs={ ...adGroup.sourceRefs, ...sourceRefsForScope(row, REGISTER_ADGROUP_FIELDS) };
        adGroupBySignature.set(aggregationSignature, adGroup);
        adGroups.push(adGroup);
        entityByKey[adGroup.key]=adGroup;
      }
      adGroup.rawRows.push(row);

      const adMatchingFields={
        parentAdGroupSignature:adGroupSignature,
        creativeName:String(values.creative_name ?? ''),
        landingPageUrl:String(values.url ?? ''),
        trackingUrlStart:String(values.tracking_url_start ?? ''),
        trackingUrlFirstQuartile:String(values.tracking_url_first_quartile ?? ''),
        trackingUrlMidpoint:String(values.tracking_url_midpoint ?? ''),
        trackingUrlThirdQuartile:String(values.tracking_url_third_quartile ?? ''),
        trackingUrlComplete:String(values.tracking_url_complete ?? ''),
      };
      const candidateSignature=signatureFor(adMatchingFields);
      const fullRowSignature=signatureFor(values);
      const occurrenceIndex=(occurrenceByFullRowSignature.get(fullRowSignature) || 0)+1;
      occurrenceByFullRowSignature.set(fullRowSignature, occurrenceIndex);
      // C3-C5-CR-REOPEN-3 FIX D：register Ad entity 补齐 start/end time 字段供 Ad 层比较读取
      // （snake 命名与 edit tree 的 AD_FIELDS 对齐；不改变 candidateSignature / matchingFields / 聚合语义）。
      const ad=makeCsvEntity(`register-ad:${row.rowNumber}`, 'Ad', { ...adMatchingFields, start_time:String(values.start_time ?? ''), end_time:String(values.end_time ?? '') }, row.source, adGroup.key);
      ad.candidateSignature=candidateSignature;
      ad.matchingFields={ ...adMatchingFields };
      ad.occurrenceIndex=occurrenceIndex;
      ad.rawRows.push(row);
      ads.push(ad);
      entityByKey[ad.key]=ad;
      rowLedger[row.rowNumber]={ disposition:'normal-leaf', entityKey:ad.key };
    });

    // A17-1：在 Register 建树完成后附加来源证据；不改变任何 fields／signature／matchingFields。
    [...campaigns, ...adGroups, ...ads].forEach(attachRegisterSourceEvidence);

    return {
      schema:parsedCsv ? parsedCsv.schema : null,
      campaigns, adGroups, ads, entityByKey, orphans:[], rowLedger, diagnostics,
      comparisonInputs:{ csvEntities:ads, csvOnly:[] },
    };
  }
