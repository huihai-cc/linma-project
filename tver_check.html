  <script>
  (function(){
  'use strict';

  // TVER_APP_MARKER
  const REGISTER_HEADERS_61 = [
    'campaign_name', 'start_datetime', 'end_datetime', 'budget_type', 'budget', 'daily_budget',
    'hourly_bid_weight', 'campaign_status', 'consumption_type', 'cv_point', 'report_target_flag',
    'tver_video_duration', 'adgroup_name', 'adgroup_start_datetime', 'adgroup_end_datetime',
    'daily_freq_cap', 'auction_type', 'price', 'adgroup_status', 'device', 'media',
    'local_broadcaster', 'bls_start_datetime', 'bls_end_datetime', 'contact_bls_survey_id',
    'non_contact_bls_survey_id', 'gender', 'start_age', 'end_age', 'pref', 'city', 'affinity',
    'demography', 'annual_income', 'tv_usage_tendency', 'carrier', 'uid_suffix', 'genre',
    'genre_exclude', 'subgenre', 'subgenre_exclude', 'contents_group', 'bid_segment',
    'upload_segment_expansion_threshold', 'bid_segment_exclude', 'dmp_segment',
    'dmp_segment_expansion_threshold', 'dmp_segment_exclude', 'store_segment', 'bls_store_segment',
    'creative_id', 'creative_name', 'url', 'tracking_url_start', 'tracking_url_first_quartile',
    'tracking_url_midpoint', 'tracking_url_third_quartile', 'tracking_url_complete', 'start_time',
    'end_time', 'status',
  ];
  const EDIT_HEADERS_61 = [
    ...REGISTER_HEADERS_61.filter(header => !['budget_type', 'tver_video_duration', 'dmp_segment'].includes(header)),
    'campaign_id', 'adgroup_id', 'ad_id',
  ];

  function parseCsvRows(text){
    const rows=[];
    const issues=[];
    let row=[];
    let field='';
    let inQuotes=false;
    let quoteJustClosed=false;
    let lineNumber=1;

    for(let index=0; index<text.length; index+=1){
      const character=text[index];
      if(inQuotes){
        if(character==='"'){
          if(text[index+1]==='"'){
            field+='"';
            index+=1;
          }else{
            inQuotes=false;
            quoteJustClosed=true;
          }
        }else{
          field+=character;
          if(character==='\n') lineNumber+=1;
        }
        continue;
      }
      if(quoteJustClosed && character!==',' && character!=='\r' && character!=='\n'){
        issues.push({ code:'CSV_ILLEGAL_CHARACTER_AFTER_CLOSING_QUOTE', lineNumber, character });
        quoteJustClosed=false;
      }
      if(character==='"' && field==='' && !quoteJustClosed){
        inQuotes=true;
      }else if(character===','){
        row.push(field);
        field='';
        quoteJustClosed=false;
      }else if(character==='\r' || character==='\n'){
        if(character==='\r' && text[index+1]==='\n') index+=1;
        row.push(field);
        rows.push(row);
        row=[];
        field='';
        quoteJustClosed=false;
        lineNumber+=1;
      }else{
        field+=character;
      }
    }
    if(inQuotes) issues.push({ code:'CSV_UNCLOSED_QUOTE', lineNumber });
    if(field!=='' || row.length>0){
      row.push(field);
      rows.push(row);
    }
    return { rows, issues };
  }

  function normalizeTverCsvHeader(header){
    return String(header ?? '').replace(/^\uFEFF/, '').trim().replace(/^\uFEFF/, '').trim();
  }

  function detectTverCsvSchema(headers){
    const normalizedHeaders=headers.map(normalizeTverCsvHeader);
    const headerSet=new Set(normalizedHeaders);
    const duplicateHeaders=[...headerSet].filter(header => normalizedHeaders.filter(candidate => candidate===header).length>1).sort();
    function inspect(expectedHeaders){
      return {
        missingHeaders:expectedHeaders.filter(header => !headerSet.has(header)).sort(),
        unexpectedHeaders:[...headerSet].filter(header => !expectedHeaders.includes(header)).sort(),
      };
    }
    const editInspection=inspect(EDIT_HEADERS_61);
    const registerInspection=inspect(REGISTER_HEADERS_61);
    const editExact=normalizedHeaders.length===EDIT_HEADERS_61.length && duplicateHeaders.length===0 &&
      editInspection.missingHeaders.length===0 && editInspection.unexpectedHeaders.length===0;
    const registerExact=normalizedHeaders.length===REGISTER_HEADERS_61.length && duplicateHeaders.length===0 &&
      registerInspection.missingHeaders.length===0 && registerInspection.unexpectedHeaders.length===0;

    if(editExact){
      return {
        kind:'edit-with-ids',
        businessRole:'下载时点的后台当前状态',
        canonicalHeaders:EDIT_HEADERS_61,
        missingHeaders:[],
        unexpectedHeaders:[],
        duplicateHeaders:[],
        unavailableFields:['budget_type', 'tver_video_duration', 'dmp_segment'],
      };
    }
    if(registerExact){
      return {
        kind:'register-without-ids',
        businessRole:'入稿内容一致性检查：不能证明后台已经正确登记',
        canonicalHeaders:REGISTER_HEADERS_61,
        missingHeaders:[],
        unexpectedHeaders:[],
        duplicateHeaders:[],
        unavailableFields:[],
      };
    }
    const looksLikeEdit=normalizedHeaders.some(header => ['campaign_id', 'adgroup_id', 'ad_id'].includes(header));
    const inspection=looksLikeEdit ? editInspection : registerInspection;
    return {
      kind:null,
      businessRole:null,
      canonicalHeaders:normalizedHeaders,
      missingHeaders:inspection.missingHeaders,
      unexpectedHeaders:inspection.unexpectedHeaders,
      duplicateHeaders,
      unavailableFields:[],
    };
  }

  function parseCsvText(text, options){
    const fileName=options && options.fileName ? options.fileName : '';
    const parsed=parseCsvRows(String(text ?? ''));
    const parsedRows=parsed.rows;
    const rawHeaders=(parsedRows.shift() || []).map(header => String(header ?? ''));
    const canonicalHeaders=rawHeaders.map(normalizeTverCsvHeader);
    const schema=detectTverCsvSchema(rawHeaders);
    const parseIssues=[...parsed.issues];
    const headerCounts=new Map();
    canonicalHeaders.forEach(header => headerCounts.set(header,(headerCounts.get(header)||0)+1));
    const duplicateHeaderColumns=(schema.duplicateHeaders || []).map(canonicalHeader=>({
      canonicalHeader,
      columns:canonicalHeaders.map((header,index)=>header===canonicalHeader ? {
        columnNumber:index+1,rawHeader:rawHeaders[index],sourceRef:{fileName,sheetName:null,rowNumber:1,columnName:canonicalHeader,rawValue:rawHeaders[index],columnNumber:index+1},
      } : null).filter(Boolean),
    }));
    if(duplicateHeaderColumns.length) parseIssues.push({
      code:'CSV_CANONICAL_HEADER_DUPLICATE',duplicateHeaders:schema.duplicateHeaders,columns:duplicateHeaderColumns,
    });
    const rows=[];
    parsedRows.forEach((cells, rowIndex) => {
      if(cells.length===1 && cells[0]==='') return;
      if(cells.length!==rawHeaders.length){
        parseIssues.push({
          code:'CSV_COLUMN_COUNT_MISMATCH',
          rowNumber:rowIndex+2,
          expected:rawHeaders.length,
          actual:cells.length,
        });
      }
      const values={};
      const sourceRefs={};
      const columns=Array.from({length:Math.max(rawHeaders.length,cells.length)},(_,columnIndex)=>{
        const rawHeader=columnIndex<rawHeaders.length ? rawHeaders[columnIndex] : null;
        const canonicalHeader=columnIndex<canonicalHeaders.length ? canonicalHeaders[columnIndex] : null;
        const rawValue=columnIndex<cells.length ? cells[columnIndex] : '';
        const sourceRef={fileName,sheetName:null,rowNumber:rowIndex+2,columnName:canonicalHeader,rawValue,columnNumber:columnIndex+1};
        return {columnNumber:columnIndex+1,rawHeader,canonicalHeader,rawValue,sourceRef};
      });
      columns.forEach(column=>{
        const key=column.canonicalHeader;
        if(key===null || headerCounts.get(key)!==1) return;
        values[key]=column.rawValue;
        sourceRefs[key]={fileName,sheetName:null,rowNumber:rowIndex+2,columnName:key,rawValue:column.rawValue};
      });
      rows.push({
        rowNumber:rowIndex+2,
        occurrenceIndex:1,
        values,
        sourceRefs,
        columns,
        sourceRefsByColumn:columns.map(column=>column.sourceRef),
        source:{ fileName, sheetName:null, rowNumber:rowIndex+2, columnName:null, rawValue:null },
      });
    });
    if(schema.kind===null){
      parseIssues.push({ code:'CSV_SCHEMA_UNRECOGNIZED', missingHeaders:schema.missingHeaders });
    }
    return { schema, headers:rawHeaders, rawHeaders, canonicalHeaders, rows, parseIssues };
  }

  function isVisibleSheet(workbook, sheetName){
    const metadata=workbook && workbook.Workbook && Array.isArray(workbook.Workbook.Sheets)
      ? workbook.Workbook.Sheets.find(sheet => sheet && sheet.name===sheetName)
      : null;
    return !metadata || !metadata.Hidden;
  }

  function getSheetRows(workbook, sheetName, expandMerges=true){
    const sheet=workbook && workbook.Sheets ? workbook.Sheets[sheetName] : null;
    if(Array.isArray(sheet)) return sheet;
    if(typeof XLSX!=='undefined' && XLSX.utils && sheet){
      const rows=XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', raw:false });
      return expandMerges ? expandMergedRows(rows, sheet['!merges'] || []) : rows;
    }
    return [];
  }

  function expandMergedRows(rows, merges){
    const expanded=(rows || []).map(row => [...(row || [])]);
    (merges || []).forEach(merge => {
      if(!merge || !merge.s || !merge.e) return;
      const rawValue=expanded[merge.s.r] && expanded[merge.s.r][merge.s.c];
      for(let rowIndex=merge.s.r; rowIndex<=merge.e.r; rowIndex+=1){
        if(!expanded[rowIndex]) expanded[rowIndex]=[];
        for(let columnIndex=merge.s.c; columnIndex<=merge.e.c; columnIndex+=1){
          if(expanded[rowIndex][columnIndex]===undefined || expanded[rowIndex][columnIndex]==='') expanded[rowIndex][columnIndex]=rawValue;
        }
      }
    });
    return expanded;
  }

  function findSettingHeaderCandidates(workbook, options){
    const maxRows=options && Number.isInteger(options.maxRows) ? options.maxRows : 100;
    const candidates=[];
    const sheetNames=workbook && Array.isArray(workbook.SheetNames) ? workbook.SheetNames : [];
    const selectedSheetName=options && typeof options.selectedSheetName==='string' ? options.selectedSheetName : '';
    if(!selectedSheetName) return {candidates,diagnostics:[{code:'SETTING_SHEET_REQUIRED'}]};
    if(!sheetNames.includes(selectedSheetName)) return {candidates,diagnostics:[{code:'SETTING_SHEET_NOT_FOUND',selectedSheetName}]};
    if(!isVisibleSheet(workbook,selectedSheetName)) return {candidates,diagnostics:[{code:'SETTING_SHEET_NOT_FOUND',selectedSheetName}]};
    const rows=getSheetRows(workbook,selectedSheetName);
    const limit=Math.min(maxRows,rows.length);
    for(let rowIndex=0;rowIndex<limit;rowIndex+=1){
      const cellSet=new Set((rows[rowIndex] || []).map(value=>String(value ?? '').trim()));
      if(cellSet.has('発注CPN名') && cellSet.has('ターゲティング番号')) candidates.push({sheetName:selectedSheetName,rowIndex,rowNumber:rowIndex+1,headers:rows[rowIndex]});
    }
    return {candidates,diagnostics:[]};
  }

  function emptySettingModel(diagnostics){
    return {
      campaigns:[], adGroups:[], ads:[], diagnostics,
      sourceIndex:{ targetingByNumber:{}, creativeByMaterial:{}, uploadUrlByLandingPage:{ sectionPresent:false, byLandingPageName:{} }, evidenceBlocks:{ changeHistory:[], operationMemo:[], otherSettings:[] } }, templateVersion:null,
    };
  }

  function makeSettingSource(fileName, sheetName, rowNumber, columnName, rawValue){
    return { fileName, sheetName, rowNumber, columnName, rawValue };
  }

  function makeSettingCellSource(fileName, sheetName, rowNumber, columnName, columnIndex, fallbackValue, workbook){
    const displayedCellAddress=typeof XLSX!=='undefined' && XLSX.utils && XLSX.utils.encode_cell ? XLSX.utils.encode_cell({r:rowNumber-1,c:columnIndex}) : null;
    const sheet=workbook && workbook.Sheets ? workbook.Sheets[sheetName] : null;
    let cellAddress=displayedCellAddress;
    if(sheet && displayedCellAddress && XLSX.utils.decode_cell && XLSX.utils.encode_cell){
      const requested=XLSX.utils.decode_cell(displayedCellAddress);
      const merge=(sheet['!merges'] || []).find(range=>requested.r>=range.s.r && requested.r<=range.e.r && requested.c>=range.s.c && requested.c<=range.e.c);
      if(merge) cellAddress=XLSX.utils.encode_cell(merge.s);
    }
    const cell=sheet && cellAddress ? sheet[cellAddress] : null;
    const rawValue=cell && Object.prototype.hasOwnProperty.call(cell,'v') ? cell.v : fallbackValue;
    const source=makeSettingSource(fileName,sheetName,rowNumber,columnName,rawValue);
    if(cell && cellAddress && XLSX.utils.decode_cell){const physical=XLSX.utils.decode_cell(cellAddress);source.rowNumber=physical.r+1;source.columnNumber=physical.c+1;}
    else source.columnNumber=columnIndex+1;
    if(cellAddress) source.cellAddress=cellAddress;
    if(displayedCellAddress && displayedCellAddress!==cellAddress) source.displayCellAddress=displayedCellAddress;
    if(cell && cell.t) source.cellType=cell.t;
    if(cell && cell.f) source.formula=cell.f;
    return source;
  }

  function buildTverAdGroupPeriodEvidence(headerIndex,row,rowNumber,fileName,sheetName,field,header,campaign,workbook){
    const columnIndex=headerIndex[header];
    const inheritedValue=String(campaign && campaign.fields && campaign.fields[field] || '');
    const campaignHeader=field==='startDateTime' ? '開始日時(yyyy/mm/dd hh:mm)' : '終了日時(yyyy/mm/dd hh:mm)';
    const campaignColumnIndex=headerIndex[campaignHeader];
    const campaignSource=campaignColumnIndex!==undefined
      ? makeSettingCellSource(fileName,sheetName,rowNumber,campaignHeader,campaignColumnIndex,row[campaignColumnIndex] ?? '',workbook)
      : campaign && campaign.sourceRefs && campaign.sourceRefs[field] || null;
    const derivedFrom=inheritedValue!=='' && campaignSource ? [campaignSource] : [];
    const ruleBasis=derivedFrom.length ? 'TVER_MANUAL_P25_ADGROUP_PERIOD_INHERITS_CP' : null;
    if(columnIndex===undefined) return {columnState:'column-absent',cellState:'not-present',effectiveState:derivedFrom.length?'inherited-campaign':'unresolved',rawValue:null,value:derivedFrom.length?inheritedValue:null,source:null,parentSource:campaignSource,derivedFrom,ruleBasis};
    const cellValue=row[columnIndex] ?? '';
    const source=makeSettingCellSource(fileName,sheetName,rowNumber,header,columnIndex,cellValue,workbook);
    const rawValue=source.rawValue;
    if(cellValue==='') return {columnState:'column-present',cellState:'explicit-blank',effectiveState:derivedFrom.length?'inherited-campaign':'unresolved',rawValue,value:derivedFrom.length?inheritedValue:null,source,parentSource:campaignSource,derivedFrom,ruleBasis};
    return {columnState:'column-present',cellState:'explicit-value',effectiveState:'explicit-value',rawValue,value:String(cellValue),source,parentSource:campaignSource,derivedFrom:[],ruleBasis:'TVER_SETTING_EXPLICIT_ADGROUP_PERIOD'};
  }
  const SETTING_BUSINESS_HEADERS = [
    '発注CPN名', 'CPN訴求', 'CPN予算', '開始日時(yyyy/mm/dd hh:mm)', '終了日時(yyyy/mm/dd hh:mm)',
    'ターゲティング番号', 'ADG開始日時(yyyy/mm/dd hh:mm)', 'ADG終了日時(yyyy/mm/dd hh:mm)',
    '素材名', 'LP名', 'タグ訴求', '初期設定日予算', 'その他設定', '変更履歴',
  ];
  const SETTING_OPTIONAL_ALIAS_HEADERS=['デバイス','タグ訴求(0%)','タグ訴求(100%)','ADGステータス','ADステータス','CPM','秒数','タグ訴求(25%)','タグ訴求(50%)','タグ訴求(75%)'];
  function detectTverSettingTemplateFormat(headers){
    const headerSet=new Set((headers || []).map(value=>String(value ?? '').trim()));
    const newMarkers=['デバイス','タグ訴求(0%)','タグ訴求(100%)','ADGステータス','ADステータス','CPM','秒数'];
    return newMarkers.some(header=>headerSet.has(header)) ? 'new' : 'legacy';
  }
  const TVER_SETTING_GROUP_ROW_FIELDS=Object.freeze({adgroup_status:'ADGステータス',device:'デバイス',tver_video_duration:'秒数',price:'CPM'});
  const TVER_SETTING_AD_ROW_FIELDS=Object.freeze({status:'ADステータス'});

  function parseTverSettingRowBusinessValue(field,rawValue){
    if(field==='adgroup_status' || field==='status'){
      const exactStatusMap={'有効':'1','停止':'0'};
      return Object.prototype.hasOwnProperty.call(exactStatusMap,rawValue) ? exactStatusMap[rawValue] : null;
    }
    if(field==='price'){
      if(typeof rawValue==='number') return Number.isFinite(rawValue) ? rawValue : null;
      const text=String(rawValue);
      return /^(?:0|[1-9]\d*)(?:\.\d+)?$/.test(text) ? Number(text) : null;
    }
    if(field==='tver_video_duration'){
      const match=/^(\d+)秒(?:\(\d+-\d+秒\))?$/.exec(String(rawValue));
      return match ? match[1] : null;
    }
    if(field==='device') return String(rawValue);
    return null;
  }

  function readTverSettingRowFields(workbook,headerIndex,row,rowNumber,fileName,sheetName,definitions){
    const result={};
    Object.entries(definitions || {}).forEach(([field,header])=>{
      const columnIndex=headerIndex[header];
      if(columnIndex===undefined){result[field]={state:'column-absent',rawValue:null,value:null,sources:[]};return;}
      const source=makeSettingCellSource(fileName,sheetName,rowNumber,header,columnIndex,row[columnIndex] ?? '',workbook);
      const rawValue=source.rawValue;
      if(rawValue===''){result[field]={state:'explicit-blank',rawValue,value:null,sources:[source]};return;}
      const value=parseTverSettingRowBusinessValue(field,rawValue);
      result[field]={state:value===null?'unresolved':'available',rawValue,value,sources:[source]};
    });
    return result;
  }

  function mergeTverSettingRowField(target,field,incoming){
    const current=target[field];
    if(!current){target[field]=incoming;return;}
    if(current.state===incoming.state && current.rawValue===incoming.rawValue && current.value===incoming.value){
      current.sources=[...(current.sources || []),...(incoming.sources || [])];
      return;
    }
    const currentRawValues=current.state==='conflict' ? current.rawValues : [current.rawValue];
    target[field]={state:'conflict',rawValue:null,value:null,rawValues:[...new Set([...currentRawValues,incoming.rawValue])],sources:[...(current.sources || []),...(incoming.sources || [])]};
  }

  const SETTING_HEADER_FIELD_NAMES={
    '発注CPN名':'campaignName','CPN訴求':'campaignAppeal','CPN予算':'campaignBudget',
    '開始日時(yyyy/mm/dd hh:mm)':'startDateTime','終了日時(yyyy/mm/dd hh:mm)':'endDateTime',
    'ターゲティング番号':'targetingNumber','ADG開始日時(yyyy/mm/dd hh:mm)':'adGroupStartDateTime',
    'ADG終了日時(yyyy/mm/dd hh:mm)':'adGroupEndDateTime','素材名':'materialName','LP名':'landingPageName',
    'タグ訴求':'tagAppeal','タグ訴求(0%)':'tagAppeal','タグ訴求(100%)':'tagAppeal',
    '初期設定日予算':'initialDailyBudget','その他設定':'otherSettings','変更履歴':'changeHistory','デバイス':'device',
  };

  // ===== NEW FMT（2609 以降のテンプレ）後方互換のための「構造能力検出」 =====
  // 実案件（新FMT 4 案）で確認した差分のみを扱う。判定は列/行の構造だけで行い、
  // ファイル名・日付・シート名・バージョン番号には一切依存しない。
  //   1. 主業務表に「デバイス」列（row-level authoritative device）が追加（optional）。
  //   2. 主業務表の「タグ訴求」が「タグ訴求(0%)」「タグ訴求(100%)」の 2 列に分割。
  //   3. ターゲティング block に「オークションタイプ」行（label | '-' | 業務値）が追加。
  // 旧 FMT はこれらの列/行が存在しないため、検出結果は常に従来経路へフォールバックする。
  // 注：主業務表「デバイス」は NEW FMT のみ存在する optional 列であり、
  // SETTING_BUSINESS_HEADERS（required 判定）には決して加えない。
  const SETTING_TAG_APPEAL_LEGACY_HEADER = 'タグ訴求';
  const SETTING_TAG_APPEAL_PRIMARY_HEADER = 'タグ訴求(100%)';
  const SETTING_TAG_APPEAL_SECONDARY_HEADERS = ['タグ訴求(0%)'];

  // ターゲティング block の「単一槽フィールド」：label | marker | 業務値 の 3 槽構造。
  // 業務値は valueSlotIndex の槽のみ。marker 槽の '-' はテンプレ記号であり業務値ではない。
  const TARGETING_SLOT_FIELD_NAMES = {
    'オークションタイプ': { field:'auction_type', valueSlotIndex:1 },
  };

  // 主業務表の tag appeal 列を解決する。
  // 旧 FMT に「タグ訴求」が存在すれば常にそちらを優先（旧 FMT の挙動は完全に不変）。
  // 新 FMT は「タグ訴求(100%)」を tagAppeal の primary、「タグ訴求(0%)」を supporting evidence とする。
  function resolveSettingTagAppealHeaders(headerIndex){
    if(headerIndex[SETTING_TAG_APPEAL_LEGACY_HEADER]!==undefined){
      return { variant:'legacy', primaryHeader:SETTING_TAG_APPEAL_LEGACY_HEADER, headers:[SETTING_TAG_APPEAL_LEGACY_HEADER] };
    }
    const available=[SETTING_TAG_APPEAL_PRIMARY_HEADER, ...SETTING_TAG_APPEAL_SECONDARY_HEADERS]
      .filter(header => headerIndex[header]!==undefined);
    if(!available.length) return null;
    return { variant:'new-fmt', primaryHeader:available[0], headers:available };
  }

  function isSectionBoundary(row){
    return (row || []).some(value => {
      const text=String(value ?? '').trim();
      return text==='★' || text.startsWith('★');
    });
  }

  function findSectionMarker(rows, sectionName, startIndex){
    const from=Number.isInteger(startIndex) ? startIndex : 0;
    for(let rowIndex=from; rowIndex<(rows || []).length; rowIndex+=1){
      const row=rows[rowIndex] || [];
      const cells=row.map(value => String(value ?? '').trim());
      const combinedIndex=cells.findIndex(value => value===`★${sectionName}`);
      if(combinedIndex!==-1) return { rowIndex, markerColumnIndex:combinedIndex, labelColumnIndex:combinedIndex, style:'combined', sectionName };
      const markerColumnIndex=cells.findIndex(value => value==='★');
      const labelColumnIndex=markerColumnIndex===-1 ? -1 : cells.findIndex((value, index) => index>markerColumnIndex && value===sectionName);
      if(labelColumnIndex!==-1) return { rowIndex, markerColumnIndex, labelColumnIndex, style:'split', sectionName };
    }
    return null;
  }

  function locateSection(rows, sectionName){
    const marker=findSectionMarker(rows, sectionName);
    if(!marker) return null;
    let endRowIndex=rows.length;
    for(let rowIndex=marker.rowIndex+1; rowIndex<rows.length; rowIndex+=1){
      if(isSectionBoundary(rows[rowIndex])){
        endRowIndex=rowIndex;
        break;
      }
    }
    return { ...marker, endRowIndex, rows };
  }

  function blockHeaderIndex(headers){
    const index={};
    (headers || []).forEach((header, columnIndex) => {
      const text=String(header ?? '').trim();
      if(text && index[text]===undefined) index[text]=columnIndex;
    });
    return index;
  }

  function blockSource(fileName, sheetName, rowNumber, columnName, row, headerIndex){
    const columnIndex=headerIndex[columnName];
    return makeSettingSource(fileName, sheetName, rowNumber, columnName, columnIndex===undefined ? '' : row[columnIndex]);
  }

  function findSettingPairValue(rows, label, fileName, sheetName){
    for(let rowIndex=0; rowIndex<(rows || []).length; rowIndex+=1){
      const row=rows[rowIndex] || [];
      const columnIndex=row.findIndex(value => String(value ?? '').trim()===label);
      if(columnIndex===-1) continue;
      const rawValue=String(row[columnIndex+1] ?? '');
      return {
        value:rawValue,
        source:makeSettingSource(fileName, sheetName, rowIndex+1, label, rawValue),
      };
    }
    return { value:'', source:null };
  }

  // FIX4-A：仅从主业务表之前的基本信息读取CV，不把报表开放指标区的CV列当作启用模式。
  function findSettingCvValues(rows, fileName, sheetName, businessHeaderIndex){
    const section=locateSection(rows, '基本情報');
    const start=section ? section.rowIndex+1 : 0;
    const end=Math.min(businessHeaderIndex, section ? section.endRowIndex : businessHeaderIndex);
    const modeSources=[], pointSources=[];
    for(let rowIndex=start; rowIndex<end; rowIndex+=1){
      const row=rows[rowIndex] || [];
      const first=row.findIndex(value => String(value ?? '').trim()!=='');
      if(first<0) continue;
      const label=String(row[first] ?? '').trim();
      if(label!=='CV' && label!=='CVポイント') continue;
      const add=(sources, column, name)=>sources.push({
        ...makeSettingSource(fileName, sheetName, rowIndex+1, name, row[column+1]), columnNumber:column+2,
      });
      if(label==='CV') add(modeSources, first, 'CV');
      row.forEach((value, column) => {
        if(String(value ?? '').trim()==='CVポイント') add(pointSources, column, 'CVポイント');
      });
    }
    const result=sources=>({
      value:sources.length ? String(sources[0].rawValue) : '', source:sources[0] || null,
      sources:uniqueSourceRefs(sources),
      state:!sources.length ? 'not_provided' : new Set(sources.map(source=>String(source.rawValue).trim())).size>1 ? 'ambiguous' : 'available',
    });
    return { cvMode:result(modeSources), cvPoint:result(pointSources) };
  }

  function findTargetingGroupAnchors(section){
    if(!section) return [];
    const anchors=[];
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      (section.rows[rowIndex] || []).forEach((value, columnIndex) => {
        if(String(value ?? '').trim()==='ターゲティング名') anchors.push({ rowIndex, columnIndex });
      });
    }
    return anchors;
  }

  const TARGETING_FIELD_NAMES={
    'ターゲティング名':'targetingNumber', '広告再生時間●':'videoDuration', 'CPM●':'price',
    '配信デバイス●':'device', '放送局●':'media', '性別●':'gender', '年齢●':'age', 'ASR':'uid_suffix',
    '都道府県/市区町村●':'region', '興味関心●':'audience', '番組ジャンル●':'genre',
    '番組サブジャンル●':'subgenre', 'DMPセグメント':'segment', 'その他設定(ADG)':'otherSettings',
    'その他設定(AD)':'adOtherSettings',
    // NEW FMT（2609 以降）：ターゲティング block に「オークションタイプ」行が追加。
    // 値の採用槽は TARGETING_SLOT_FIELD_NAMES で別途制御する（marker 槽の '-' を業務値にしない）。
    'オークションタイプ':'auction_type',
    // 阶段 A8：retarget 维度（通常=データ蓄積→store；リタゲ=入札セグメント→bid），独立于 DMP。
    'データ蓄積':'dataAccumulation', '入札セグメント':'bidSegment',
  };

  // 判断 targeting group 是否含有「实际业务值」（参与 structural 匹配或真实设定的字段）。
  // 模板说明 / 勾选标记 / 注记不算内容：去掉前导 '-'/'○'、'※…' 注记、'ADGをSPPC/CTVで分ける' 等说明文字后是否仍有内容。
  function hasRealTargetingValue(rawValue){
    if(!rawValue) return false;
    const tokens=String(rawValue).split(/\s+/);
    return tokens.some(token => {
      let cleaned=token.replace(/^[-\s○]+/, '');
      if(!cleaned) return false;
      if(cleaned.startsWith('※')) return false;
      if(cleaned==='ADGをSPPC/CTVで分ける' || cleaned==='ADGをSP/CTVで分ける') return false;
      return true;
    });
  }

  function targetingGroupHasBusinessContent(fields){
    return ['price', 'device', 'segment'].some(key => hasRealTargetingValue(fields && fields[key]));
  }

  // ターゲティング番号の参照キー専用：全角数字だけを半角数字へ変換する。
  function canonicalizeTverTargetingNumber(value){
    return String(value ?? '').replace(/[０-９]/g, digit => String.fromCharCode(digit.charCodeAt(0)-0xFEE0));
  }

  function addTargetingGroup(indexByNumber, group, diagnostics, sheetName){
    const rawNumber=String(group.fields.targetingNumber ?? '').trim();
    if(!rawNumber){
      // 空编号：若该 group 无实际业务值（纯空模板）→ 静默忽略，不产生 diagnostic；
      // 若仍有 price/device/segment 等真实业务值 → 保留 MISSING（真实输入缺值）。
      if(targetingGroupHasBusinessContent(group.fields)){
        diagnostics.push({ code:'SETTING_TARGETING_NUMBER_MISSING', sheetName, rowNumber:group.anchor.rowIndex+1, columnNumber:group.anchor.columnIndex+1 });
      }
      return;
    }
    const number=canonicalizeTverTargetingNumber(rawNumber);
    const existing=indexByNumber[number];
    if(!existing){
      indexByNumber[number]={ state:'unique', canonicalNumber:number, originalNumbers:[rawNumber], ...group, groups:[group] };
      return;
    }
    existing.originalNumbers=[...new Set([...(existing.originalNumbers || []), rawNumber])];
    diagnostics.push({ code:'SETTING_TARGETING_NUMBER_DUPLICATE', targetingNumber:rawNumber, canonicalNumber:number, originalNumbers:existing.originalNumbers, sheetName, rowNumber:group.anchor.rowIndex+1 });
    existing.groups.push(group);
    if(existing.semanticSignature!==group.semanticSignature){
      diagnostics.push({ code:'SETTING_TARGETING_NUMBER_CONFLICT', targetingNumber:rawNumber, canonicalNumber:number, originalNumbers:existing.originalNumbers, sheetName, rowNumber:group.anchor.rowIndex+1 });
    }
    existing.state='ambiguous';
  }

  function makeTargetingGroup(section, anchor, rowEndIndex, columnEndIndex, fileName, sheetName, diagnostics){
    const fields={};
    const sourceRefs={};
    const rawFields={};
    const fieldStates={};
    const duplicateValueOccurrences={};
    for(let rowIndex=anchor.rowIndex; rowIndex<rowEndIndex; rowIndex+=1){
      const row=section.rows[rowIndex] || [];
      const label=String(row[anchor.columnIndex] ?? '').trim();
      if(!label) continue;
      const values=[];
      const refs=[];
      const slots=[];
      for(let columnIndex=anchor.columnIndex+1; columnIndex<=columnEndIndex; columnIndex+=1){
        const rawValue=String(row[columnIndex] ?? '');
        const source=makeSettingCellSource(fileName,sheetName,rowIndex+1,label,columnIndex,rawValue,null);
        slots.push({ rawValue, source });
        if(rawValue!==''){
          values.push(rawValue);
          refs.push(source);
        }
      }
      const occurrence={rowNumber:rowIndex+1,rawValue:values.join(' '),sourceRefs:refs,slots,valueSource:slots[0] && slots[0].source || null};
      if(!rawFields[label]) rawFields[label]={ values:[...values], sourceRefs:[...refs], slots:[...slots], occurrences:[occurrence] };
      else{
        rawFields[label].values.push(...values);
        rawFields[label].sourceRefs=uniqueSourceRefs([...rawFields[label].sourceRefs,...refs]);
        rawFields[label].slots.push(...slots);
        rawFields[label].occurrences.push(occurrence);
      }
      const field=TARGETING_FIELD_NAMES[label];
      if(field){
        fields[field]=values.join(' ');
        sourceRefs[field]=refs[0] || makeSettingSource(fileName, sheetName, rowIndex+1, label, '');
        if(field==='device' || field==='price') (duplicateValueOccurrences[field] ||= []).push({label,...occurrence});
      }
    }
    Object.entries(duplicateValueOccurrences).forEach(([field,occurrences])=>{
      const rawValues=occurrences.map(item=>String(item.rawValue ?? '').trim());
      const nonEmpty=rawValues.filter(value=>value!=='');
      const uniqueValues=[...new Set(nonEmpty)];
      const hasBlank=rawValues.some(value=>value==='');
      const conflicting=(field==='device' && occurrences.length>1) || uniqueValues.length>1 || (hasBlank && nonEmpty.length>0);
      const evidence=uniqueSourceRefs(occurrences.flatMap(item=>item.sourceRefs.length ? item.sourceRefs : [item.valueSource].filter(Boolean)));
      if(occurrences.length>1){
        diagnostics.push({code:'SETTING_TARGETING_FIELD_DUPLICATE',field,labels:[...new Set(occurrences.map(item=>item.label))],values:rawValues,sources:evidence,sheetName,rowNumber:occurrences[1].rowNumber});
      }
      if(conflicting){
        fields[field]='';sourceRefs[field]=null;fieldStates[field]='ambiguous';
        diagnostics.push({code:'SETTING_TARGETING_FIELD_CONFLICT',field,labels:[...new Set(occurrences.map(item=>item.label))],values:rawValues,sources:evidence,sheetName,rowNumber:occurrences[1].rowNumber});
      }else if(uniqueValues.length===1){
        fields[field]=nonEmpty[0];
        sourceRefs[field]=occurrences.flatMap(item=>item.sourceRefs).find(source=>String(source.rawValue ?? '').trim()===nonEmpty[0]) || occurrences[0].valueSource;
        fieldStates[field]='available';
      }else{
        fields[field]='';sourceRefs[field]=evidence[0] || null;fieldStates[field]='missing';
      }
    });
    // NEW FMT single-slot field; evaluate every occurrence's actual business-value slot.
    Object.entries(TARGETING_SLOT_FIELD_NAMES).forEach(([label,spec])=>{
      const rawField=rawFields[label];
      if(!rawField) return;
      const occurrences=(rawField.occurrences || []).map(occurrence=>{
        const slot=occurrence.slots[spec.valueSlotIndex];
        const source=slot && slot.source || makeSettingSource(fileName,sheetName,occurrence.rowNumber,label,'');
        const rawValue=String(slot ? slot.rawValue : '').trim();
        const value=!rawValue || rawValue==='-' ? '' : rawValue;
        return {label,rowNumber:occurrence.rowNumber,rawValue:value,sourceRefs:[source],valueSource:source};
      });
      const rawValues=occurrences.map(item=>item.rawValue);
      const nonEmpty=rawValues.filter(value=>value!=='');
      const uniqueValues=[...new Set(nonEmpty)];
      const hasBlank=rawValues.some(value=>value==='');
      const conflicting=occurrences.length>1 && (uniqueValues.length>1 || (hasBlank && nonEmpty.length>0));
      const evidence=uniqueSourceRefs(occurrences.map(item=>item.valueSource));
      rawField.values=nonEmpty;
      rawField.sourceRefs=evidence;
      if(occurrences.length>1) diagnostics.push({code:'SETTING_TARGETING_FIELD_DUPLICATE',field:spec.field,labels:[label],values:rawValues,sources:evidence,sheetName,rowNumber:occurrences[1].rowNumber});
      if(conflicting){
        fields[spec.field]='';sourceRefs[spec.field]=null;fieldStates[spec.field]='ambiguous';
        diagnostics.push({code:'SETTING_TARGETING_FIELD_CONFLICT',field:spec.field,labels:[label],values:rawValues,sources:evidence,sheetName,rowNumber:occurrences[1].rowNumber});
      }else if(uniqueValues.length===1){
        fields[spec.field]=nonEmpty[0];sourceRefs[spec.field]=occurrences.find(item=>item.rawValue===nonEmpty[0]).valueSource;fieldStates[spec.field]='available';
      }else{
        fields[spec.field]='';sourceRefs[spec.field]=evidence[0] || null;fieldStates[spec.field]='missing';
      }
    });
    const targetingNameField=rawFields['ターゲティング名'];
    const identity={ targetingNumber:'', targetingName:'', statusHint:'', sourceRefs:{} };
    if(targetingNameField){
      const numberSlot=targetingNameField.slots[1];
      fields.targetingNumber=String(numberSlot ? numberSlot.rawValue : '').trim();
      sourceRefs.targetingNumber=(numberSlot && numberSlot.source)
        || sourceRefs.targetingNumber
        || makeSettingSource(fileName, sheetName, anchor.rowIndex+1, 'ターゲティング名', '');
      [['statusHint', 0], ['targetingNumber', 1], ['targetingName', 2]].forEach(([field, slotIndex]) => {
        const slot=targetingNameField.slots[slotIndex];
        if(!slot) return;
        const value=String(slot.rawValue ?? '').trim();
        identity[field]=field==='targetingName' && value.startsWith('※') ? '' : value;
        identity.sourceRefs[field]={ ...slot.source, columnNumber:anchor.columnIndex+slotIndex+2 };
      });
    }
    return { anchor, fields, sourceRefs, rawFields, identity, fieldStates, numberRuleId:'TVER_260605_TARGETING_NUMBER_RELATIVE_COLUMN_2', semanticSignature:signatureFor(fields) };
  }

  function targetingSourceEvidence(targeting){
    const fields={};
    const rawFields={};
    Object.entries(targeting && targeting.rawFields || {}).forEach(([label, value]) => {
      const field=TARGETING_FIELD_NAMES[label] || (TARGETING_SLOT_FIELD_NAMES[label] && TARGETING_SLOT_FIELD_NAMES[label].field);
      const state=field && targeting.fieldStates && targeting.fieldStates[field];
      const occurrenceSources=Array.isArray(value && value.occurrences)
        ? uniqueSourceRefs(value.occurrences.flatMap(occurrence=>occurrence.sourceRefs && occurrence.sourceRefs.length ? occurrence.sourceRefs : [occurrence.valueSource].filter(Boolean)))
        : [];
      const sources=uniqueSourceRefs(value && value.sourceRefs || []);
      const evidenceSources=state==='ambiguous' && occurrenceSources.length ? occurrenceSources : (sources.length || !['世帯年収●', 'デモグラフィック●'].includes(label)
        ? sources
        : uniqueSourceRefs((value && value.slots || []).map(slot => slot && slot.source)));
      rawFields[label]=evidenceSources;
      if(field) fields[field]=uniqueSourceRefs([...(fields[field] || []), ...evidenceSources]);
    });
    return { fields, rawFields };
  }

  function buildLegacyTargetingIndex(section, fileName, sheetName, diagnostics, indexByNumber){
    let headerIndex=-1;
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      if((section.rows[rowIndex] || []).some(value => String(value ?? '').trim()==='ターゲティング番号')){
        headerIndex=rowIndex;
        break;
      }
    }
    if(headerIndex===-1) return;
    const headers=blockHeaderIndex(section.rows[headerIndex]);
    for(let rowIndex=headerIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const row=section.rows[rowIndex] || [];
      if(!row.some(value => String(value ?? '')!=='')) continue;
      const fields={};
      const sourceRefs={};
      const rawFields={};
      Object.keys(headers).forEach(header => {
        const rawValue=String(row[headers[header]] ?? '');
        rawFields[header]={ values:[rawValue], sourceRefs:[blockSource(fileName, sheetName, rowIndex+1, header, row, headers)] };
        fields[header]=rawValue;
        sourceRefs[header]=rawFields[header].sourceRefs[0];
      });
      fields.targetingNumber=String(row[headers['ターゲティング番号']] ?? '').trim();
      sourceRefs.targetingNumber=sourceRefs['ターゲティング番号'];
      addTargetingGroup(indexByNumber, { anchor:{ rowIndex, columnIndex:headers['ターゲティング番号'] }, fields, sourceRefs, rawFields, semanticSignature:signatureFor(fields) }, diagnostics, sheetName);
    }
  }

  function buildTargetingIndex(rows, fileName, sheetName, diagnostics){
    const indexByNumber={};
    const section=locateSection(rows, 'ターゲティング');
    if(!section) return indexByNumber;
    const anchors=findTargetingGroupAnchors(section);
    if(!anchors.length){
      buildLegacyTargetingIndex(section, fileName, sheetName, diagnostics, indexByNumber);
      return indexByNumber;
    }
    const anchorsByRow=new Map();
    anchors.forEach(anchor => {
      const rowAnchors=anchorsByRow.get(anchor.rowIndex) || [];
      rowAnchors.push(anchor);
      anchorsByRow.set(anchor.rowIndex, rowAnchors);
    });
    anchorsByRow.forEach(rowAnchors => rowAnchors.sort((left, right) => left.columnIndex-right.columnIndex));
    const anchorRows=[...anchorsByRow.keys()].sort((left, right) => left-right);
    const rawMaxColumn=Math.max(0, ...section.rows.slice(section.rowIndex, section.endRowIndex).map(row => Math.max(0, (row || []).length-1)));
    // NEW FMT：ターゲティング block の右側に「▼デバイス変換」注記列ブロックが追加された。
    // これはターゲティング grid の一部ではないため、最後のグループの列範囲から除外する
    // （除外しないと price / device 等が注記テキストを吸収して unresolved になる）。
    // 旧 FMT のターゲティング block には '▼' 注記列が存在しないため、この補正は旧 FMT の挙動を一切変えない。
    const lastAnchorColumn=Math.max(...anchors.map(anchor => anchor.columnIndex));
    let annotationStartColumn=null;
    section.rows.slice(section.rowIndex, section.endRowIndex).forEach(row => {
      (row || []).forEach((value, columnIndex) => {
        if(columnIndex<=lastAnchorColumn) return;
        if(!String(value ?? '').trim().startsWith('▼')) return;
        if(annotationStartColumn===null || columnIndex<annotationStartColumn) annotationStartColumn=columnIndex;
      });
    });
    const maxColumn=annotationStartColumn===null ? rawMaxColumn : Math.min(rawMaxColumn, annotationStartColumn-1);
    anchors.forEach(anchor => {
      const rowAnchors=anchorsByRow.get(anchor.rowIndex);
      const indexInRow=rowAnchors.indexOf(anchor);
      const nextHorizontal=rowAnchors[indexInRow+1];
      const nextVertical=anchorRows.find(rowIndex => rowIndex>anchor.rowIndex);
      const rowEndIndex=nextVertical===undefined ? section.endRowIndex : nextVertical;
      const columnEndIndex=nextHorizontal ? nextHorizontal.columnIndex-1 : maxColumn;
      addTargetingGroup(indexByNumber, makeTargetingGroup(section, anchor, rowEndIndex, columnEndIndex, fileName, sheetName, diagnostics), diagnostics, sheetName);
    });
    return indexByNumber;
  }

  // NO021 confirmed Creative rule: remove only one terminal known video extension from Setting.
  function deriveTverCreativeName(rawValue){
    return String(rawValue ?? '').replace(/^([\s\S]+)\.(?:mp4|mov|m4v|avi|wmv|mpg|mpeg|webm)$/i,'$1');
  }

  function buildCreativeIndex(rows, fileName, sheetName, diagnostics){
    const indexByMaterial={};
    const section=locateSection(rows, 'クリエイティブ');
    if(!section){
      diagnostics.push({ code:'SETTING_CREATIVE_SECTION_NOT_FOUND', sheetName });
      return indexByMaterial;
    }
    const required=['素材名', 'ファイル名', 'LP URL'];
    const candidates=[];
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const headers=blockHeaderIndex(section.rows[rowIndex]);
      if(required.every(header => headers[header]!==undefined)) candidates.push({ rowIndex, headers });
    }
    if(candidates.length===0){
      diagnostics.push({ code:'SETTING_CREATIVE_HEADER_NOT_FOUND', sheetName, requiredHeaders:required });
      return indexByMaterial;
    }
    if(candidates.length>1){
      diagnostics.push({ code:'SETTING_CREATIVE_HEADER_AMBIGUOUS', sheetName, rowNumbers:candidates.map(candidate => candidate.rowIndex+1) });
      return indexByMaterial;
    }
    const header=candidates[0];
    for(let rowIndex=header.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const row=section.rows[rowIndex] || [];
      if(!row.some(value => String(value ?? '')!=='')) continue;
      const materialName=String(row[header.headers['素材名']] ?? '').trim();
      if(!materialName) continue;
      const fileNameValue=String(row[header.headers['ファイル名']] ?? '');
      const landingPageUrl=String(row[header.headers['LP URL']] ?? '');
      const sourceRefs={
        materialName:blockSource(fileName, sheetName, rowIndex+1, '素材名', row, header.headers),
        fileName:blockSource(fileName, sheetName, rowIndex+1, 'ファイル名', row, header.headers),
        landingPageUrl:blockSource(fileName, sheetName, rowIndex+1, 'LP URL', row, header.headers),
      };
      const existing=indexByMaterial[materialName];
      if(!existing){
        indexByMaterial[materialName]={ state:'unique', materialName, fileName:fileNameValue, landingPageUrl, sourceRefs, mappings:[{ fileName:fileNameValue, landingPageUrl, sourceRefs }] };
        continue;
      }
      existing.mappings.push({ fileName:fileNameValue, landingPageUrl, sourceRefs });
      if(existing.fileName!==fileNameValue || existing.landingPageUrl!==landingPageUrl){
        existing.state='ambiguous';
        diagnostics.push({ code:'SETTING_CREATIVE_MAPPING_AMBIGUOUS', materialName, sheetName, rowNumber:rowIndex+1 });
      }
    }
    return indexByMaterial;
  }

  function buildUploadUrlIndex(rows, fileName, sheetName, diagnostics){
    const section=locateSection(rows, 'URL');
    const index={ sectionPresent:Boolean(section), byLandingPageName:{} };
    if(!section) return index;
    const required=['LP名', '入稿用URL'];
    const headers=[];
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const headerIndex=blockHeaderIndex(section.rows[rowIndex]);
      if(required.every(header => headerIndex[header]!==undefined)) headers.push({ rowIndex, headerIndex });
    }
    if(headers.length!==1){
      diagnostics.push({ code:headers.length ? 'SETTING_UPLOAD_URL_HEADER_AMBIGUOUS' : 'SETTING_UPLOAD_URL_HEADER_NOT_FOUND', sheetName, rowNumbers:headers.map(item => item.rowIndex+1) });
      index.headerState=headers.length ? 'ambiguous' : 'missing';
      return index;
    }
    const header=headers[0];
    for(let rowIndex=header.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const row=section.rows[rowIndex] || [];
      const landingPageName=String(row[header.headerIndex['LP名']] ?? '').trim();
      if(!landingPageName) continue;
      const uploadUrl=String(row[header.headerIndex['入稿用URL']] ?? '').trim();
      const sourceRefs={
        landingPageName:blockSource(fileName, sheetName, rowIndex+1, 'LP名', row, header.headerIndex),
        uploadUrl:blockSource(fileName, sheetName, rowIndex+1, '入稿用URL', row, header.headerIndex),
      };
      const existing=index.byLandingPageName[landingPageName];
      if(!existing){
        index.byLandingPageName[landingPageName]={ state:uploadUrl ? 'unique' : 'missing', landingPageName, uploadUrl:uploadUrl || null, sourceRefs, mappings:[{ uploadUrl:uploadUrl || null, sourceRefs }] };
        continue;
      }
      existing.mappings.push({ uploadUrl:uploadUrl || null, sourceRefs });
      existing.state='ambiguous';
      existing.uploadUrl=null;
      diagnostics.push({ code:'SETTING_UPLOAD_URL_MAPPING_AMBIGUOUS', landingPageName, sheetName, rowNumber:rowIndex+1 });
    }
    return index;
  }

  function measurementTagHeaderValue(headers, names){
    return names.find(name => headers[name]!==undefined) || null;
  }

  function measurementTagMappingSignature(mapping){
    return signatureFor({ tagUrl:mapping.tagUrl, vendor:mapping.vendor, measurementPoint:mapping.measurementPoint, newOrReuse:mapping.newOrReuse });
  }

  // 计测tag vendor 子表头标签（真实 ⑦⑧ 中「タグベンダー／…」位于 block 间隙，非 tag appeal）。
  const MEASUREMENT_TAG_VENDOR_LABELS = ['タグベンダー', 'タグ提供元', 'タグ提供会社'];

  // C3-C5-CR-REOPEN-3 FIX A：計測タグ block 明细表头上方的 vendor metadata 行
  // （真实结构：B=タグベンダー / C=vendor名 / D=「100%地点」）中，
  // 值恰为「100%地点」的单元格是 block 級計測地点（对该 block 全部 appeal 生效），
  // 不是明细列头、也不是 per-row 列值。按结构特征（行内存在该值）识别，不推测业务含义。
  function measurementTagBlockMetadata(rows, startRowIndex, headerRowIndex, fileName, sheetName){
    for(let rowIndex=headerRowIndex-1; rowIndex>=startRowIndex; rowIndex-=1){
      const row=rows[rowIndex] || [];
      const columnIndex=row.findIndex(value => String(value ?? '').trim()==='100%地点');
      if(columnIndex!==-1){
        // C3-C5-CR-REOPEN-5 FIX B：vendor list =「100%地点」cell 左侧最近的非空业务值。
        // 真实⑧「タグベンダー｜楽天,マクロミル｜100%地点」、真实⑦「設定用タグセット｜楽天BLS,マクロミル｜100%地点」
        // いずれも C 列（「100%地点」左隣）に vendor リストを持つ。タグベンダー等ラベル自体は除外。
        const rowValues=row.map(value => String(value ?? '').trim());
        const tagSetLabelIndex=rowValues.findIndex(value => value.startsWith('設定用タグセット') || value==='タグセット');
        let vendorValue='',vendorColumn=-1;
        for(let searchColumn=columnIndex-1; searchColumn>=0; searchColumn-=1){
          const candidate=String(row[searchColumn] ?? '').trim();
          if(candidate && !MEASUREMENT_TAG_VENDOR_LABELS.includes(candidate) && candidate!=='100%地点'){
            vendorValue=candidate;vendorColumn=searchColumn;
            break;
          }
        }
        return {
          measurementPoint:'100%地点',
          sourceRef:{...makeSettingSource(fileName, sheetName, rowIndex+1, '計測地点', row[columnIndex]),columnNumber:columnIndex+1},
          vendor:vendorValue,
          vendorSourceRef:vendorValue ? {...makeSettingSource(fileName, sheetName, rowIndex+1, 'タグベンダー', vendorValue),columnNumber:vendorColumn+1} : null,
          blockRowNumber:rowIndex+1,
          blockLabels:rowValues.filter(Boolean),
          tagSetBlock:tagSetLabelIndex!==-1,
          blockSourceRef:{...makeSettingSource(fileName, sheetName, rowIndex+1, '計測タグブロック', tagSetLabelIndex!==-1 ? row[tagSetLabelIndex] : row[columnIndex]),columnNumber:tagSetLabelIndex!==-1 ? tagSetLabelIndex+1 : columnIndex+1},
        };
      }
    }
    return { measurementPoint:'', sourceRef:null, vendor:'', vendorSourceRef:null, blockRowNumber:null, blockLabels:[], tagSetBlock:false, blockSourceRef:null };
  }

  function rowCarriesAdCompletePoint(row){
    return (row || []).some(value => String(value ?? '').trim()==='100%地点');
  }

  // C3-C5-CR-REOPEN-5 FIX B：タグセット関連 helpers。
  // vendor リスト（「楽天,マクロミル」等の逗号接続）を分割。
  function splitTverVendorList(vendorValue){
    return String(vendorValue ?? '')
      .split(',')
      .map(item => item.trim())
      .filter(item => item!=='');
  }

  // タグセット appeal 形態判定：⑧「SPPC_汎用_set」形態（_set 接尾辞）
  // ⑦「タグセット_SP / タグセット_CTV」形態（タグセット_ 接頭辞）。
  // 「タグセットを使用」等ラベル行は形態外（appeal として残留するが展開対象外）。
  function tverTagSetAppealPattern(appeal){
    const name=String(appeal ?? '').trim();
    if(!name) return false;
    return /_set$/.test(name) || /^タグセット_/.test(name);
  }

  // 設備型判定：SPPC/SP → SPPC、CTV → CTV（ Appeal 名中の接尾辞・接頭辞から厳格判定）。
  // 「VendorBSPPC」「マクロミルSPPC」等の連結形も含む。設備型なし → null（単一appeal block の
  // fallback 判定以外では選択されない）。
  function tverTagSetDeviceType(appeal){
    const name=String(appeal ?? '').trim();
    if(!name) return null;
    if(/_SP$/.test(name) || name.includes('SPPC')) return 'SPPC';
    if(name.includes('CTV')) return 'CTV';
    return null;
  }

  // vendor リスト項目と block vendor 名の対応判定（双向 contains：⑧「楽天」↔ block「楽天BLS」）。
  function tverVendorListMatches(vendorItem, blockVendor){
    const a=String(vendorItem ?? '').trim();
    const b=String(blockVendor ?? '').trim();
    if(!a || !b) return false;
    return a===b || b.includes(a) || a.includes(b);
  }

  // タグセット appeal 展開：base appeal URL + vendor リスト其余 vendor の同設備型 URL を
  // 業務順序（base → vendor リスト順）で組合せる。いずれか未解決（base 不在・vendor block 不在・
  // 設備型候補 0/複数かつ単一appeal fallback 不成立・URL 空）なら null（fake 展開しない）。
  function expandTverTagSetAppeal(appeal, vendorList, vendorBlocks, indexByAppeal){
    const device=tverTagSetDeviceType(appeal);
    if(!device) return null;
    let baseRecord=null;
    let baseBlock=null;
    let baseVendorIndex=-1;
    if(/_set$/.test(appeal)){
      // ⑧ 形態：接尾辞剥離 → 同名 base appeal を index から厳格 join。
      const baseName=appeal.slice(0, -'_set'.length);
      const baseEntry=indexByAppeal[baseName];
      if(!baseEntry || baseEntry.state!=='unique') return null;
      const baseUrl=String(baseEntry.tagUrl ?? '').trim();
      if(!baseUrl) return null;
      baseBlock=vendorBlocks.find(info => info.appeals.some(record => record.appeal===baseName && String(record.tagUrl ?? '').trim()===baseUrl));
      if(!baseBlock) return null;
      baseVendorIndex=vendorList.findIndex(item => tverVendorListMatches(item, baseBlock.vendorList[0]));
      if(baseVendorIndex===-1) return null;
      baseRecord={ url:baseUrl, sourceRef:baseEntry.sourceRefs.tagUrl, vendorSourceRef:baseEntry.sourceRefs.vendor || null, appeal:baseName };
    }else{
      // ⑦ 形態：vendor リスト先頭 vendor block から同設備型 appeal を厳格選択（複数候補は不展開）。
      baseBlock=vendorBlocks.find(info => tverVendorListMatches(vendorList[0], info.vendorList[0]));
      if(!baseBlock) return null;
      const deviceMatches=baseBlock.appeals.filter(record => tverTagSetDeviceType(record.appeal)===device && String(record.tagUrl ?? '').trim()!=='');
      if(deviceMatches.length!==1) return null;
      baseRecord={ url:String(deviceMatches[0].tagUrl).trim(), sourceRef:deviceMatches[0].sourceRef, vendorSourceRef:deviceMatches[0].vendorSourceRef || baseBlock.vendorSourceRef || null, appeal:deviceMatches[0].appeal };
      baseVendorIndex=0;
    }
    const members=[{ url:baseRecord.url, sourceRef:baseRecord.sourceRef, vendorSourceRef:baseRecord.vendorSourceRef || null, appeal:baseRecord.appeal }];
    for(let vendorIndex=0; vendorIndex<vendorList.length; vendorIndex+=1){
      if(vendorIndex===baseVendorIndex) continue;
      const vendorBlock=vendorBlocks.find(info => tverVendorListMatches(vendorList[vendorIndex], info.vendorList[0]));
      if(!vendorBlock || vendorBlock===baseBlock) return null;
      const deviceMatches=vendorBlock.appeals.filter(record => tverTagSetDeviceType(record.appeal)===device && String(record.tagUrl ?? '').trim()!=='');
      if(deviceMatches.length===1){
        members.push({ url:String(deviceMatches[0].tagUrl).trim(), sourceRef:deviceMatches[0].sourceRef, vendorSourceRef:deviceMatches[0].vendorSourceRef || vendorBlock.vendorSourceRef || null, appeal:deviceMatches[0].appeal });
        continue;
      }
      // 設備型接尾なし単一appeal block（⑦ マクロミル形態）のみ fallback、それ以外は不展開。
      if(deviceMatches.length===0 && vendorBlock.appeals.length===1 && String(vendorBlock.appeals[0].tagUrl ?? '').trim()!==''){
        members.push({ url:String(vendorBlock.appeals[0].tagUrl).trim(), sourceRef:vendorBlock.appeals[0].sourceRef, vendorSourceRef:vendorBlock.appeals[0].vendorSourceRef || vendorBlock.vendorSourceRef || null, appeal:vendorBlock.appeals[0].appeal });
        continue;
      }
      return null;
    }
    return { urls:members.map(member => member.url), members };
  }

  // NEW FMT Start: only the observed vendor block 「タグベンダー / vendor / 0%地点」.
  // Index it independently: the same appeal label can be used at a different progress point.
  function collectTverStartTags(index, rows, start, header, end, fileName, sheetName){
    const text=value=>String(value ?? '').trim();
    const source=(r,c,label)=>({ ...makeSettingSource(fileName,sheetName,r+1,label,rows[r][c] ?? ''),columnNumber:c+1 });
    const vendorRows=[];
    for(let r=start;r<header;r+=1){
      (rows[r] || []).forEach((value,c)=>{
        if(text(value)==='タグベンダー') vendorRows.push({r,c,point:text(rows[r][c+2]),vendor:text(rows[r][c+1])});
      });
    }
    const zero=vendorRows.filter(record=>record.point==='0%地点');
    if(!zero.length) return;
    const points=zero.map(({r,c})=>source(r,c+2,'計測地点'));
    const vendors=zero.map(({r,c})=>source(r,c+1,'タグベンダー'));
    const columns=label=>(rows[header] || []).flatMap((value,c)=>text(value)===label ? [c] : []);
    const appealCols=columns('タグ訴求'), urlCols=columns('タグ');
    const uniqueBlock=vendorRows.length===1 && !!zero[0].vendor && !zero[0].vendor.includes(',')
      && appealCols.length===1 && urlCols.length===1 && !columns('計測地点').length && !columns('計測場所').length;
    for(let r=header+1;r<end;r+=1){
      const row=rows[r] || [];
      if(row.some(value=>text(value)==='タグベンダー' || text(value)==='設定用タグセット')) break;
      const appealSources=appealCols.map(c=>source(r,c,'タグ訴求'));
      const urls=urlCols.map(c=>source(r,c,'タグ'));
      const sources=[...vendors,...points,...appealSources,...urls];
      for(const appeal of new Set(appealSources.map(s=>text(s.rawValue)).filter(Boolean))){
        const previous=index.get(appeal);
        const ambiguous=!!previous || !uniqueBlock;
        const urlSource=!ambiguous && text(urls[0].rawValue) ? urls[0] : null;
        index.set(appeal,{state:ambiguous ? 'ambiguous' : urlSource ? 'available' : 'not_provided',
          urlSource,sources:[...(previous ? previous.sources : []),...sources]});
      }
    }
  }

  // NO028：主業務表「タグ訴求(100%)」列の上方にあるタグセット使用指示を判定する。
  // 指示は 100% 列そのもの（結合セルは展開後の同列）にあるものだけをその列の指示として扱い、
  // 他の列の近接文字列から帰属を推定しない。肯定指示のみを採用し、否定語・無関係な説明・
  // 解釈できない記述は「確認不能」として扱う（「セット」の単純部分一致では判定しない）。
  const TVER_TAG_SET_INSTRUCTION_POSITIVE=/^タグセット(?:のタグ)?(?:を|は|に)?(?:使用|設置|設定|適用)(?:する|します|してください|下さい|あり)?$/;
  const TVER_TAG_SET_INSTRUCTION_NEGATIVE=/^タグセット(?:を|は)?(?:使用しない|使用しません|不使用|未使用|使用せず|不要)$/;
  function normalizeTverTagSetInstruction(value){
    return String(value ?? '').replace(/^[\s▼▽■□●○◆◇※＊*・\-ー→↓↑]+/,'').replace(/\s+/g,'');
  }
  function resolveTverTagSetUsageIndicator(rows, headerRowIndex, columnIndex, fileName, sheetName){
    const notApplicable={ state:'not-applicable', reason:null, sourceRef:null, rawValue:'', scopedCells:[], outOfScopeCells:[] };
    if(!Number.isInteger(headerRowIndex) || !Number.isInteger(columnIndex) || columnIndex<0) return notApplicable;
    const scopedCells=[];
    const outOfScopeCells=[];
    for(let rowIndex=headerRowIndex-1; rowIndex>=0; rowIndex-=1){
      const row=rows[rowIndex] || [];
      if(isSectionBoundary(row)) break;
      const ownValue=String(row[columnIndex] ?? '').trim();
      if(ownValue.includes('セット')) scopedCells.push({ rowIndex, columnIndex, cellValue:ownValue });
      const rowTexts=new Set();
      row.forEach((value, index) => {
        if(index===columnIndex) return;
        const cellText=String(value ?? '').trim();
        if(!cellText.includes('タグセット')) return;
        if(ownValue && cellText===ownValue) return;
        if(rowTexts.has(cellText)) return;
        rowTexts.add(cellText);
        outOfScopeCells.push({ rowIndex, columnIndex:index, cellValue:cellText });
      });
    }
    const classify=item => {
      const normalized=normalizeTverTagSetInstruction(item.cellValue);
      if(TVER_TAG_SET_INSTRUCTION_POSITIVE.test(normalized)) return 'positive';
      if(TVER_TAG_SET_INSTRUCTION_NEGATIVE.test(normalized)) return 'negative';
      return 'unclassified';
    };
    const positive=scopedCells.filter(item => classify(item)==='positive');
    const negative=scopedCells.filter(item => classify(item)==='negative');
    const unclassified=scopedCells.filter(item => classify(item)==='unclassified');
    const toRef=item=>({ ...makeSettingSource(fileName, sheetName, item.rowIndex+1, 'タグセット使用指示', rows[item.rowIndex] ? rows[item.rowIndex][item.columnIndex] : ''), columnNumber:item.columnIndex+1 });
    const scopedRefs=scopedCells.map(toRef);
    const outOfScopeRefs=outOfScopeCells.map(item => ({ ...makeSettingSource(fileName, sheetName, item.rowIndex+1, 'タグセット関連記載', item.cellValue), columnNumber:item.columnIndex+1 }));
    const base={ scopedCells:scopedRefs, outOfScopeCells:outOfScopeRefs };
    if(positive.length && !negative.length && !unclassified.length && !outOfScopeCells.length){
      return { ...base, state:'set', reason:null, rawValue:positive[0].cellValue, sourceRef:toRef(positive[0]) };
    }
    if(!positive.length && !unclassified.length && !outOfScopeCells.length){
      const negativeRef=negative.length ? toRef(negative[0]) : null;
      return { ...base, state:'regular', reason:null, rawValue:negative.length ? negative[0].cellValue : '', sourceRef:negativeRef };
    }
    const reason=outOfScopeCells.length ? 'SETTING_TAG_SET_INSTRUCTION_OUT_OF_SCOPE' : 'SETTING_TAG_SET_INSTRUCTION_AMBIGUOUS';
    return { ...base, state:'ambiguous', reason,
      rawValue:(scopedCells[0] || outOfScopeCells[0] || {}).cellValue || '',
      sourceRef:scopedCells.length ? toRef(scopedCells[0]) : outOfScopeRefs[0] || null };
  }
  function buildMeasurementTagIndex(rows, fileName, sheetName, diagnostics, startIndex, physicalRows, tagSetUsage){
    const indexByAppeal={};
    const tagSetSelection=tagSetUsage && ['set','regular'].includes(tagSetUsage.state) ? tagSetUsage.state : null;
    const section=locateSection(rows, '計測タグ');
    if(!section) return indexByAppeal;
    const required=['タグ訴求', 'タグ'];
    const candidates=[];
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const headers=blockHeaderIndex(section.rows[rowIndex]);
      if(required.every(header => headers[header]!==undefined)) candidates.push({ rowIndex, headers });
    }
    if(candidates.length===0){
      diagnostics.push({ code:'SETTING_MEASUREMENT_TAG_HEADER_NOT_FOUND', sheetName, requiredHeaders:required });
      return indexByAppeal;
    }
    // 相邻 header 紧邻（中间无数据）→ 重复表头，保持 AMBIGUOUS（保守，不猜哪个是正式表头）。
    // 有数据分隔 → 真实 multi-block，逐块独立解析后合并。
    const hasConsecutiveHeaders=candidates.some((candidate, index) => index>0 && candidate.rowIndex===candidates[index-1].rowIndex+1);
    if(hasConsecutiveHeaders){
      diagnostics.push({ code:'SETTING_MEASUREMENT_TAG_HEADER_AMBIGUOUS', sheetName, rowNumbers:candidates.map(candidate => candidate.rowIndex+1) });
      return indexByAppeal;
    }
    const blockInfos=[];
    candidates.forEach((header, blockIndex) => {
      const dataEnd=blockIndex+1<candidates.length ? candidates[blockIndex+1].rowIndex : section.endRowIndex;
      const blockStart=blockIndex===0 ? section.rowIndex+1 : candidates[blockIndex-1].rowIndex+1;
      if(startIndex) collectTverStartTags(startIndex, physicalRows, blockStart, header.rowIndex, dataEnd, fileName, sheetName);
      const vendorHeader=measurementTagHeaderValue(header.headers, MEASUREMENT_TAG_VENDOR_LABELS);
      const measurementPointHeader=measurementTagHeaderValue(header.headers, ['計測地点', '計測場所']);
      const newOrReuseHeader=measurementTagHeaderValue(header.headers, ['新規/流用']);
      // FIX A：block 級計測地点 metadata（明细表头上方 vendor 行）——仅在明细行无「計測地点」列时作为 fallback。
      const rawBlockMetadata=measurementTagBlockMetadata(section.rows, blockStart, header.rowIndex, fileName, sheetName);
      const blockMetadata=measurementPointHeader ? { ...rawBlockMetadata, measurementPoint:'', sourceRef:null, vendor:'', vendorSourceRef:null } : rawBlockMetadata;
      // C3-C5-CR-REOPEN-5 FIX B：block 毎 vendor リスト + appeal 明细を記録（タグセット展開第二遍用）。
      // NO028：block 種別（通常／設定用タグセット）と block 根拠行を保持し、100% の来源選択に使う。
      const blockInfo={ vendorList:splitTverVendorList(blockMetadata.vendor), vendorSourceRef:blockMetadata.vendorSourceRef || null, appeals:[],
        blockKind:rawBlockMetadata.tagSetBlock ? 'tag-set' : 'regular', blockSourceRef:rawBlockMetadata.blockSourceRef || null, blockRowNumber:rawBlockMetadata.blockRowNumber || null };
      if(tagSetUsage && blockInfo.blockKind==='tag-set'){
        tagSetUsage.tagSetBlockPresent=true;
        tagSetUsage.tagSetBlockSourceRef=tagSetUsage.tagSetBlockSourceRef || blockInfo.blockSourceRef;
        tagSetUsage.tagSetBlockVendor=tagSetUsage.tagSetBlockVendor || blockMetadata.vendor;
        tagSetUsage.tagSetBlockRowNumber=tagSetUsage.tagSetBlockRowNumber || blockInfo.blockRowNumber;
      }
      blockInfos.push(blockInfo);
      for(let rowIndex=header.rowIndex+1; rowIndex<dataEnd; rowIndex+=1){
        const row=section.rows[rowIndex] || [];
        if(!row.some(value => String(value ?? '')!=='')) continue;
        const appeal=String(row[header.headers['タグ訴求']] ?? '').trim();
        if(!appeal) continue;
        if(MEASUREMENT_TAG_VENDOR_LABELS.includes(appeal)) continue; // 跳过 vendor 子表头行
        if(rowCarriesAdCompletePoint(row)) continue; // FIX A：携带「100%地点」值的行是 block metadata 载体（例：設定用タグセット行），不作为 appeal 明细
        const mapping={
          tagUrl:String(row[header.headers['タグ']] ?? ''),
          blockKind:blockInfo.blockKind,
          blockSourceRef:blockInfo.blockSourceRef,
          vendor:vendorHeader ? String(row[header.headers[vendorHeader]] ?? '') : '',
          measurementPoint:measurementPointHeader ? String(row[header.headers[measurementPointHeader]] ?? '') : blockMetadata.measurementPoint,
          newOrReuse:newOrReuseHeader ? String(row[header.headers[newOrReuseHeader]] ?? '') : '',
          sourceRefs:{
            appeal:blockSource(fileName, sheetName, rowIndex+1, 'タグ訴求', row, header.headers),
            tagUrl:blockSource(fileName, sheetName, rowIndex+1, 'タグ', row, header.headers),
            vendor:vendorHeader ? blockSource(fileName, sheetName, rowIndex+1, vendorHeader, row, header.headers) : blockMetadata.vendorSourceRef,
            measurementPoint:measurementPointHeader ? blockSource(fileName, sheetName, rowIndex+1, measurementPointHeader, row, header.headers) : blockMetadata.sourceRef,
            newOrReuse:newOrReuseHeader ? blockSource(fileName, sheetName, rowIndex+1, newOrReuseHeader, row, header.headers) : null,
          },
        };
        const existing=indexByAppeal[appeal];
        blockInfo.appeals.push({ appeal, tagUrl:mapping.tagUrl, sourceRef:mapping.sourceRefs.tagUrl, vendorSourceRef:mapping.sourceRefs.vendor || null, tagSetPattern:tverTagSetAppealPattern(appeal) });
        if(!existing){
          indexByAppeal[appeal]={ state:'unique', appeal, ...mapping, mappings:[mapping] };
          continue;
        }
        existing.mappings.push(mapping);
        if(measurementTagMappingSignature(existing)!==measurementTagMappingSignature(mapping)){
          existing.state='ambiguous';
          // NO028：100%地点の同名appealが別種block（通常／設定用タグセット）に存在する差は、
          // 使用指示がある場合に来源選択で解消できるため、重複診断を出さない。
          // 指示がない場合は従来どおり診断する（来源ブロックを一意に決めない）。
          const crossBlockResolved=Boolean(tagSetSelection && completeTrackingPoint(existing.measurementPoint) && completeTrackingPoint(mapping.measurementPoint)
            && String(existing.blockKind || 'regular')!==String(mapping.blockKind || 'regular'));
          if(!crossBlockResolved) diagnostics.push({ code:'SETTING_MEASUREMENT_TAG_MAPPING_AMBIGUOUS', sheetName, appeal, rowNumber:rowIndex+1 });
        }
      }
    });
    // C3-C5-CR-REOPEN-5 FIX B 第二遍：タグセット block（vendor リスト ≥2）内のタグセット appeal
    // （⑧ *_set / ⑦ タグセット_SP・_CTV、URL 空）を展開：base appeal + vendor リスト其余 vendor の
    // 同設備型 URL。単一 vendor block 内の空URL appeal は REOPEN3-A6 契約どおり missing 維持。
    blockInfos.forEach(blockInfo => {
      if(blockInfo.vendorList.length<2) return;
      const vendorBlocks=blockInfos.filter(info => info!==blockInfo && info.vendorList.length===1 && info.vendorList[0]);
      blockInfo.appeals.forEach(record => {
        if(!record.tagSetPattern) return;
        if(String(record.tagUrl ?? '').trim()!=='') return;
        const entry=indexByAppeal[record.appeal];
        if(!entry || entry.state!=='unique') return;
        const expansion=expandTverTagSetAppeal(record.appeal, blockInfo.vendorList, vendorBlocks, indexByAppeal);
        if(expansion){ expansion.blockKind=blockInfo.blockKind; entry.tagSetExpansion=expansion; }
      });
    });
    return indexByAppeal;
  }

  function completeTrackingPoint(measurementPoint){
    const point=String(measurementPoint ?? '').trim();
    // C3-C5-CR-REOPEN-3 FIX A：vendor metadata 行「100%地点」为 block 級 Complete 計測地点。
    return point==='100%' || point==='100%視聴' || point==='100%地点';
  }

  function tverTrackingMappingSources(mapping){
    const refs=mapping && mapping.sourceRefs || {};

  }

  function resolveTverCompleteTracking(appealValue, appealSource, tag, tagSetUsage){
    const appeal=String(appealValue ?? '').trim();
    const sourceOnly=uniqueSourceRefs([appealSource]);
    if(!appeal) return {state:'missing',value:null,reason:'SETTING_TRACKING_COMPLETE_APPEAL_NOT_PROVIDED',sourceRef:appealSource || null,derivedFrom:sourceOnly};
    if(appealSource && appealSource.columnName===SETTING_TAG_APPEAL_SECONDARY_HEADERS[0]) return {state:'missing',value:null,reason:'TRACKING_COMPLETE_100_PERCENT_SOURCE_NOT_PROVIDED',sourceRef:appealSource,derivedFrom:sourceOnly};
    if(!tag) return {state:'ambiguous',value:null,reason:'SETTING_MEASUREMENT_TAG_NOT_FOUND',sourceRef:appealSource || null,sourceEvidence:sourceOnly,derivedFrom:sourceOnly};
    // NO028：主業務表 100% 列上方のタグセット使用指示で来源ブロックを選ぶ。
    // 指示が確認できない場合は異なる来源の候補を混ぜずに要確認、明確な通常指定なら通常の100%ブロックのみを使う。
    const usage=tagSetUsage && typeof tagSetUsage==='object' ? tagSetUsage : null;
    const selection=usage && ['set','regular'].includes(usage.state) ? usage.state : null;
    const selectedBlockKind=selection==='set' ? 'tag-set' : selection;
    const usageEvidence=usage ? uniqueSourceRefs([usage.sourceRef, ...(usage.scopedCells || []), ...(usage.outOfScopeCells || [])]) : [];
    if(usage && usage.state==='ambiguous'){
      return {state:'ambiguous',value:null,reason:usage.reason || 'SETTING_TAG_SET_INSTRUCTION_AMBIGUOUS',ruleBasis:'TVER_TRACKING_COMPLETE_100_PERCENT_TAG_SET_UNCONFIRMED',sourceRef:usage.sourceRef || appealSource || null,sourceEvidence:uniqueSourceRefs([appealSource,...usageEvidence]),derivedFrom:uniqueSourceRefs([appealSource,...usageEvidence]),tagSetUsage:usage,tagSetSelection:null};
    }
    if(selection==='set' && !usage.tagSetBlockPresent){
      return {state:'ambiguous',value:null,reason:'SETTING_TAG_SET_BLOCK_NOT_FOUND',ruleBasis:'TVER_TRACKING_COMPLETE_100_PERCENT_TAG_SET_UNCONFIRMED',sourceRef:usage.sourceRef || appealSource || null,sourceEvidence:uniqueSourceRefs([appealSource,...usageEvidence]),derivedFrom:uniqueSourceRefs([appealSource,...usageEvidence]),tagSetUsage:usage,tagSetSelection:{blockKind:'tag-set',blockSourceRef:usage.tagSetBlockSourceRef || null,expectedUrlCount:0}};
    }
    const mappings=Array.isArray(tag.mappings) && tag.mappings.length ? tag.mappings : [tag];
    let completeMappings=mappings.filter(mapping=>completeTrackingPoint(mapping && mapping.measurementPoint));
    if(selection){
      const selected=completeMappings.filter(mapping=>String(mapping && mapping.blockKind || 'regular')===selectedBlockKind);
      if(!selected.length){
        const blockedCandidates=uniqueSourceRefs([appealSource,...completeMappings.flatMap(tverTrackingMappingSources),...usageEvidence]);
        return {state:'ambiguous',value:null,reason:selection==='set' ? 'SETTING_TAG_SET_TAG_APPEAL_NOT_FOUND' : 'SETTING_REGULAR_TAG_BLOCK_NOT_FOUND',ruleBasis:'TVER_TRACKING_COMPLETE_100_PERCENT_TAG_SET_UNCONFIRMED',sourceRef:usage.sourceRef || appealSource || null,sourceEvidence:blockedCandidates,derivedFrom:blockedCandidates,tagSetUsage:usage,tagSetSelection:{blockKind:selectedBlockKind,blockSourceRef:selection==='set' ? usage.tagSetBlockSourceRef || null : null,expectedUrlCount:0}};
      }
      completeMappings=selected;
    }
    const tagSetSelection=selection ? {blockKind:selectedBlockKind,blockSourceRef:selection==='set' ? (completeMappings[0] && completeMappings[0].blockSourceRef || usage.tagSetBlockSourceRef || null) : (completeMappings[0] && completeMappings[0].blockSourceRef || null)} : {blockKind:null,blockSourceRef:null};
    const usageSelectionRef=selection ? usageEvidence : [];
    if(!completeMappings.length){
      const candidates=uniqueSourceRefs([appealSource,...mappings.flatMap(tverTrackingMappingSources)]);
      return {state:'ambiguous',value:null,reason:'SETTING_MEASUREMENT_TAG_POINT_NOT_FOUND',sourceRef:appealSource || null,sourceEvidence:candidates,derivedFrom:candidates,mappings,tagSetUsage:usage,tagSetSelection};
    }
    const sources=uniqueSourceRefs([appealSource,...completeMappings.flatMap(tverTrackingMappingSources),...usageSelectionRef]);
    const urls=completeMappings.map(mapping=>String((mapping && mapping.tagUrl) ?? '').trim());
    const expansionAllowed=!selection || String(tag.tagSetExpansion && tag.tagSetExpansion.blockKind || 'regular')===selectedBlockKind;
    const expansion=tag.state==='unique' && completeMappings.length===1 && !urls[0] && expansionAllowed && tag.tagSetExpansion && Array.isArray(tag.tagSetExpansion.urls) && tag.tagSetExpansion.urls.length;
    if(expansion){
      const members=tag.tagSetExpansion.members || [];
      return {state:'unique',value:tag.tagSetExpansion.urls.join(','),ruleBasis:'TVER_260605_TAG_SET_EXPANSION',sourceRef:members[0] && members[0].sourceRef || completeMappings[0].sourceRefs && completeMappings[0].sourceRefs.tagUrl,measurementPointSourceRef:completeMappings[0].sourceRefs && completeMappings[0].sourceRefs.measurementPoint,derivedFrom:uniqueSourceRefs([appealSource,...sources,...members.flatMap(member=>[member.sourceRef,member.vendorSourceRef])]),tagSetUsage:usage,tagSetSelection};
    }
    if(urls.some(url=>!url)) return {state:'ambiguous',value:null,reason:'SETTING_MEASUREMENT_TAG_URL_NOT_PROVIDED',sourceRef:appealSource || null,sourceEvidence:sources,derivedFrom:sources,mappings:completeMappings,tagSetUsage:usage,tagSetSelection};
    const uniqueUrls=[...new Set(urls)];
    if(uniqueUrls.length!==1) return {state:'ambiguous',value:uniqueUrls.join('\n'),ruleBasis:'TVER_TRACKING_COMPLETE_100_PERCENT',reason:'SETTING_MEASUREMENT_TAG_URL_AMBIGUOUS',sourceRef:appealSource || null,sourceEvidence:sources,derivedFrom:sources,mappings:completeMappings,tagSetUsage:usage,tagSetSelection};
    const selectedMapping=completeMappings.find(mapping=>String((mapping && mapping.tagUrl) ?? '').trim()===uniqueUrls[0]);
    return {state:'unique',value:uniqueUrls[0],ruleBasis:selection==='set' ? 'TVER_TRACKING_COMPLETE_100_PERCENT_TAG_SET' : 'TVER_100_PERCENT_TAG_APPEAL_TO_COMPLETE',sourceRef:selectedMapping && selectedMapping.sourceRefs && selectedMapping.sourceRefs.tagUrl || null,measurementPointSourceRef:selectedMapping && selectedMapping.sourceRefs && selectedMapping.sourceRefs.measurementPoint || null,sourceEvidence:sources,derivedFrom:sources,mappings:completeMappings,tagSetUsage:usage,tagSetSelection};
  }

  function resolveCreativeFields(ad, creativeIndex, measurementTagIndex, uploadUrlIndex, tagSetUsage){
    const fields=ad && ad.fields || {};
    const sourceRefs=ad && ad.sourceRefs || {};
    const materialName=String(fields.materialName ?? '');
    const tagAppeal=String(fields.tagAppeal ?? '');
    const creative=creativeIndex && creativeIndex[materialName];
    const tag=measurementTagIndex && measurementTagIndex[tagAppeal];
    const creativeDerivedFrom=creative && creative.state==='unique'
      ? uniqueSourceRefs([sourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.fileName]) : uniqueSourceRefs([sourceRefs.materialName]);
    const landingPageDerivedFrom=creative && creative.state==='unique'
      ? uniqueSourceRefs([sourceRefs.landingPageName, sourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.landingPageUrl]) : uniqueSourceRefs([sourceRefs.landingPageName, sourceRefs.materialName]);
    const uploadIndex=uploadUrlIndex && uploadUrlIndex.byLandingPageName || {};
    const uploadMapping=uploadIndex[String(fields.landingPageName ?? '').trim()];
    const uploadUnresolved=uploadUrlIndex && uploadUrlIndex.sectionPresent
      ? (!uploadMapping || uploadMapping.state!=='unique' || !uploadMapping.uploadUrl) : null;
    const blankLandingPageSource=sourceRefs.landingPageName && String(sourceRefs.landingPageName.rawValue ?? fields.landingPageName ?? '').trim()==='' ? sourceRefs.landingPageName : null;
    const uploadHeaderUnavailable=Boolean(uploadUrlIndex && uploadUrlIndex.sectionPresent && ['missing','ambiguous'].includes(uploadUrlIndex.headerState));
    
    const explicitNoLandingPage=Boolean(blankLandingPageSource && uploadUrlIndex && uploadUrlIndex.sectionPresent && !uploadMapping && !uploadHeaderUnavailable);
    const resolvedLandingPage=explicitNoLandingPage ? { state:'not-required', url:'', notRequired:true, ruleBasis:'TVER_URL_EXPLICIT_NO_REQUIREMENT', sourceRef:blankLandingPageSource, sourceEvidence:uniqueSourceRefs([blankLandingPageSource]), derivedFrom:uniqueSourceRefs([blankLandingPageSource]) } : uploadUrlIndex && uploadUrlIndex.sectionPresent
      ? (uploadUnresolved
        ? { state:'ambiguous', url:null, reason:uploadMapping ? 'SETTING_UPLOAD_URL_MAPPING_AMBIGUOUS' : uploadUrlIndex.headerState==='missing' ? 'SETTING_UPLOAD_URL_HEADER_NOT_FOUND' : uploadUrlIndex.headerState==='ambiguous' ? 'SETTING_UPLOAD_URL_HEADER_AMBIGUOUS' : 'SETTING_UPLOAD_URL_MAPPING_NOT_FOUND', sourceRef:uploadMapping && uploadMapping.sourceRefs && uploadMapping.sourceRefs.uploadUrl || sourceRefs.landingPageName || null, sourceEvidence:uniqueSourceRefs((uploadMapping && uploadMapping.mappings || []).flatMap(mapping => [mapping.sourceRefs && mapping.sourceRefs.landingPageName, mapping.sourceRefs && mapping.sourceRefs.uploadUrl]).filter(Boolean)), derivedFrom:uniqueSourceRefs([sourceRefs.landingPageName]) }
        : { state:'unique', url:uploadMapping.uploadUrl, ruleBasis:'TVER_URL_EXPLICIT_UPLOAD_MAPPING', sourceRef:uploadMapping.sourceRefs.uploadUrl, sourceEvidence:uniqueSourceRefs([uploadMapping.sourceRefs.landingPageName, uploadMapping.sourceRefs.uploadUrl]), derivedFrom:uniqueSourceRefs([sourceRefs.landingPageName, uploadMapping.sourceRefs.landingPageName, uploadMapping.sourceRefs.uploadUrl]) })
      : (creative && creative.state==='unique' ? { state:'unique', url:creative.landingPageUrl, ruleBasis:'TVER_URL_CREATIVE_MAPPING', sourceRef:creative.sourceRefs.landingPageUrl, sourceEvidence:uniqueSourceRefs([creative.sourceRefs.landingPageUrl]), derivedFrom:landingPageDerivedFrom } : { state:creative && creative.state==='ambiguous' ? 'ambiguous' : 'missing', url:null, reason:creative && creative.state==='ambiguous' ? 'SETTING_CREATIVE_AMBIGUOUS' : 'SETTING_CREATIVE_NOT_FOUND', sourceRef:sourceRefs.landingPageName || null, sourceEvidence:[], derivedFrom:landingPageDerivedFrom });
    const missing=(reason, settingSource) => ({ state:'missing', value:null, reason, sourceRef:settingSource || null });
    const tracking={
      tracking_url_start:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_first_quartile:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_midpoint:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_third_quartile:missing('SETTING_SOURCE_NOT_PROVIDED'),
      tracking_url_complete:missing('SETTING_SOURCE_NOT_PROVIDED'),
    };
    // Complete is joined by the primary tag-appeal source and the exact 100% measurement point.
    tracking.tracking_url_complete=resolveTverCompleteTracking(tagAppeal,sourceRefs.tagAppeal,tag,tagSetUsage);
