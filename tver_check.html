  // NO004-FIX1：その他設定(ADG) の既知指示（見出し）と、現場で確認済みのテンプレート説明・占位符。
  // 既知指示は値の有効性をここでは判定しない（無効値は各フィールドの既存規則が理由を出す）。
  const TVER_OTHER_SETTINGS_INSTRUCTIONS=[
    { kind:'contents_group', test:line => line==='コンテンツグループ指定' },
    { kind:'dmp_expansion', test:line => /DMP\s*拡張値/.test(line) },
    { kind:'segment_expansion', test:line => /(?:入札)?セグメント拡張値/.test(line) },
    { kind:'auction_method', test:line => /^(?:オークション|入札)\s*(?:方式|方法)?\s*[:：=]/.test(line) },
  ];
  const TVER_OTHER_SETTINGS_TEMPLATE_LINES=[
    /^ADGを(?:SPPC|SP|CTV|PC)[\/・](?:SPPC|SP|CTV|PC)で分ける$/,
    /^◆?BLS\s*[（(]\s*SP調査\s*[）)]\s*あり$/,
    /^アンケート配信ADGのASR\s*[:：=]\s*[A-F0-9][A-F0-9,、\s]*$/i,
  ];
  function isTverOtherSettingsTemplateLine(line){
    const value=String(line ?? '').trim();
    if(!value) return true;
    if(/^[○●◎◆◇■□※＊*・\-—]+$/.test(value)) return true; // テンプレート記号・占位符のみ
    if(/^※セグメント(?:名|ID)$/.test(value)) return true;
    return TVER_OTHER_SETTINGS_TEMPLATE_LINES.some(pattern => pattern.test(value));
  }
  function tverOtherSettingsInstructionOf(line){
    const value=String(line ?? '').trim();
    return TVER_OTHER_SETTINGS_INSTRUCTIONS.find(instruction => instruction.test(value)) || null;
  }

  // NO004-FIX1：コンテンツグループは「自分の見出し＋・名称続行」だけを読む。
  // 続行行が別の既知指示・テンプレート説明・非・行になった時点で自分の範囲を終える。
  function parseTverContentsGroupInstruction(rawValue){
    const text=String(rawValue ?? '').replace(/\r\n?/g, '\n');
    const lines=text.split('\n').map(line => line.trim()).filter(line => line !== '');
    const index=lines.findIndex(line => line === 'コンテンツグループ指定');
    if(index < 0) return null;
    const names=[];
    for(const rawLine of lines.slice(index+1)){
      const line=rawLine.replace(/^[\s○●◎◆◇■□※＊*]+/,'').trim();
      if(!line) continue;
      if(!line.startsWith('・')) break;
      const name=line.replace(/^・\s*/, '').trim();
      if(!name) break;
      if(tverOtherSettingsInstructionOf(name) || isTverOtherSettingsTemplateLine(name)) break;
      names.push(name);
    }
    return names.length ? { names, rawValue:text } : null;
  }

  // NO004-FIX1：その他設定(ADG) を「既知指示」「テンプレート説明」「未知原文」に分解する。
  // 既知指示の値が無効でも未知扱いにはしない（各フィールドの既存規則が理由を出す）。
  // コンテンツグループは自分の見出し以降の・名称だけを取り、他の指示は独立に判定する。
  function parseTverOtherSettingsInstructions(rawValue){
    const text=String(rawValue ?? '').replace(/\r\n?/g,'\n');
    const known=[];
    const unknown=[];
    let contentsGroup=null;
    for(const rawLine of text.split('\n')){
      const original=String(rawLine ?? '');
      if(/^[\s○●◎◆◇■□※＊*]*$/.test(original)) continue; // 空行・記号のみ
      const line=original.replace(/^[\s○●◎◆◇■□※＊*]+/,'').trim();
      if(!line) continue;
      const body=line.replace(/^・\s*/,'').trim();
      const instruction=tverOtherSettingsInstructionOf(body);
      if(instruction){
        contentsGroup=null;
        if(instruction.kind==='contents_group'){
          contentsGroup={ kind:'contents_group', raw:body, names:[] };
          known.push(contentsGroup);
        }else if(instruction.kind==='dmp_expansion'){
          const match=/DMP\s*拡張値\s*[:：=]?\s*(\d+)/.exec(body);
          known.push({ kind:'dmp_expansion', value:match ? match[1] : null, raw:body });
        }else if(instruction.kind==='segment_expansion'){
          const match=/(?:入札)?セグメント拡張値\s*[:：=]?\s*(\d+)/.exec(body);
          known.push({ kind:'segment_expansion', value:match ? match[1] : null, raw:body });
        }else{
          known.push({ kind:instruction.kind, raw:body });
        }
        continue;
      }
      if(contentsGroup && line.startsWith('・')){
        const name=body;
        if(name){
          if(isTverOtherSettingsTemplateLine(name)){ contentsGroup=null; continue; }
          contentsGroup.names.push(name);
          continue;
        }
      }
      if(isTverOtherSettingsTemplateLine(body)) continue;
      contentsGroup=null;
      unknown.push(body);
    }
    return { known, unknown };
  }

  function collectTverOtherSettingsUnknown(setting){
    const sources=tverC343OtherSettingsSources(setting);
    const lines=[], used=[];
    sources.forEach(source => {
      const parsed=parseTverOtherSettingsInstructions(source && source.rawValue);
      if(!parsed.unknown.length) return;
      lines.push(...parsed.unknown);
      used.push(source);
    });
    return { lines:[...new Set(lines)], sources:uniqueSourceRefs(used) };
  }

  function resolveTverAdditionalTargeting(setting,field){
    if(field==='auction_type') return resolveSettingAdGroupAuctionType(setting);
    const label=field==='genre' ? '番組ジャンル●' : 'その他設定(ADG)';
    const allSources=tverA17TargetingSources(setting,label);
    // NO032-GATE-FIX1：コンテンツグループは「指示行を含むセル」を業務来源として全件収集する。
    // 解析できない指示も破棄せず、合法指示と併存する場合は一致を確定しない（○ 等のテンプレート記号は除外）。
    const contentsGroupSources=allSources.filter(source => strictText(source && source.rawValue).includes('コンテンツグループ指定'));
    const instructionParsed=contentsGroupSources.map(source => ({ source, parsed:parseTverContentsGroupInstruction(source.rawValue) }));
    const unparsedInstructionSources=instructionParsed.filter(item => !item.parsed).map(item => item.source);
    const sources=field==='contents_group' ? contentsGroupSources : allSources;
    const values=allSources.map(s=>String(s.rawValue));
    const missing=reason=>({rawValue:'',canonicalValue:null,comparable:false,sourceEvidence:sources,reason,ruleBasis:'TVER_EXACT_'+field.toUpperCase()});
    let lists=[];
    if(field==='genre'){
      const markers=values.filter(v=>v==='指定' || v==='除外');
      if(markers.includes('除外')) return {...missing('GENRE_INCLUDE_NOT_APPLICABLE'),notApplicable:true};
      if(!markers.includes('指定')) return missing('GENRE_INCLUDE_RULE_PENDING');
      lists=values.filter(v=>v!=='' && v!=='指定');
    }else{
      if(!instructionParsed.length) return missing('CONTENTS_GROUP_SOURCE_NOT_PROVIDED');
      // 解析できない指示が1件でもあれば、他の合法指示だけでは一致を確定しない。
      if(unparsedInstructionSources.length){
        return {rawValue:tverA17BusinessRawValue(contentsGroupSources),canonicalValue:null,comparable:false,sourceEvidence:sources,reason:'CONTENTS_GROUP_RULE_PENDING',ruleBasis:'TVER_EXACT_CONTENTS_GROUP'};
      }
      for(const item of instructionParsed) lists.push(item.parsed.names.join('\n'));
    }
    const dictionary=TVER_ID_DICTIONARIES[field] || [],byName=new Map(dictionary.map(x=>[x.name,x.id]));
    const canonical=lists.map(list=>{
      const tokens=field==='genre' ? list.split(/[、,\r\n]+/) : list.split('\n');
      const ids=tokens.map(t=>byName.get(t));
      return ids.length && ids.every(Boolean) && new Set(ids).size===ids.length ? ids.sort().join(' ') : null;
    });
    const known=[...new Set(canonical)];
    if(!canonical.length || canonical.includes(null) || known.length!==1) return missing('TARGETING_COLLECTION_RULE_PENDING');
    return {rawValue:lists[0],canonicalValue:known[0],comparable:true,sourceEvidence:sources,primarySource:(field==='contents_group' ? (instructionParsed.find(item=>item.parsed.names.join('\n')===lists[0]) || {}).source : sources.find(source=>String(source.rawValue)===lists[0])) || sources[0],ruleBasis:'TVER_EXACT_'+field.toUpperCase()};
  }

  function resolveTverQuartileTracking(ad,model,field){
    const points={tracking_url_first_quartile:'25%',tracking_url_midpoint:'50%',tracking_url_third_quartile:'75%'};
    const binding=ad.trackingQuartiles && ad.trackingQuartiles[field],appealSource=binding && binding.appealSource;
    const appeal=appealSource && String(appealSource.rawValue),index=model.sourceIndex && model.sourceIndex.measurementTagByAppeal || {},tag=appeal && index[appeal];
    const mappings=tag && tag.mappings || [],matches=mappings.filter(m=>m.measurementPoint===points[field]);
    const urls=[...new Set(matches.map(m=>m.tagUrl))];
    const sources=uniqueSourceRefs([appealSource,...matches.flatMap(m=>[m.sourceRefs.appeal,m.sourceRefs.tagUrl,m.sourceRefs.measurementPoint])]);
    const comparable=urls.length===1 && urls[0]!=='';
    return {value:comparable ? urls[0] : '',comparable,sourceEvidence:sources,primarySource:comparable ? matches[0].sourceRefs.tagUrl : appealSource || null,reason:appeal ? 'TRACKING_POINT_SOURCE_UNCONFIRMED' : 'TRACKING_POINT_BINDING_NOT_PROVIDED'};
  }

  function tverComparisonEntityBase(input){

  // NO017: these are existing, confirmed field rules; unknown GP rules stay review-only.
  function tverReliableGpValue(field,raw){
    const text=String(raw ?? '');
    if(field==='device'){
      const normalized=normalizeTverDevice(text),parsed=canonicalizeTverExplicitDevice(normalized.value);
      return {known:parsed.state==='known' && !/[A-Z]/.test(normalized.value),value:parsed.value};
    }
    if(field==='price'){
      const parsed=normalizeTverPriceForMatching(text);
      return {known:/^[¥￥]?(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(text) && parsed.resolved,value:parsed.value};
    }
    if(field==='auction_type' || field==='adgroup_status')return {known:(field==='auction_type' ? /^[12]$/ : /^[01]$/).test(text),value:text};
    if(isCampaignOrAdGroupDateTimeField(field)){
      const parsed=normalizeTverDateTimeForComparison(text);
      return {known:parsed.state==='known' && text!=='' && validateField({field,value:text}).every(issue=>issue.code==='DATETIME_NOT_30_MINUTE_GRANULARITY'),value:parsed.value};
    }
    if(field==='tver_video_duration'){
      const parsed=parseTverVideoDuration(text);return {known:parsed.state==='known',value:parsed.value};
    }
    return {known:false,value:null};
  }

      });

      if(!inputs.some(i=>i.entityKey===base.entityKey && i.field==='other_settings_adg')){

    const adPairs=inputs.filter(i=>i.level==='Ad' && i.field==='creative_name').map(tverComparisonEntityBase);
    adPairs.forEach(base=>{

      Object.assign(status,{settingValue:row ? row.rawValue : model.comparisonStage==='initial-setting' ? '1' : '',csvValue:actual,settingSource:row && row.primarySource,csvSource:csvFieldSource(csv,'status'),settingCanonical:row ? {value:row.canonicalValue,ruleId:row.ruleBasis,evidenceState:row.evidenceState} : null,csvCanonical:{value:actual,ruleId:'TVER_AD_STATUS',evidenceState:'available'},ruleBasis:row ? row.ruleBasis : 'TVER_AD_STAGE_RULE_PENDING',comparable:row ? row.comparable : model.comparisonStage==='initial-setting',comparisonStatus:row && row.comparable || model.comparisonStage==='initial-setting' ? null : '需确认',conservativeReason:row && row.comparable ? null : 'AD_STAGE_RULE_PENDING',sourceEvidence:{setting:row ? row.sourceEvidence : [],csv:entityFieldEvidence(csv,'status',csvFieldSource(csv,'status')),derivedFrom:row ? row.derivedFrom : []}});

    inputs.forEach(input=>{

    const cpPairs=inputs.filter(i=>i.level==='Campaign' && i.field==='campaign_name').map(tverComparisonEntityBase);
    cpPairs.forEach(base=>{
      const setting=(model.campaigns || []).find(e=>e.key===base.entityKey),csv=(tree.campaigns || []).find(e=>e.key===base.csvEntityKey),contract=resolveTverCampaignContract(setting,'report_target_flag');
      const field='report_target_flag';

      const setting=input.level==='Ad Group' && (model.adGroups || []).find(group=>group.key===input.entityKey);

      if(settingConflict){

          settingCanonical:{value:null,evidenceState:'ambiguous'},settingEvidenceState:'ambiguous',
          comparisonStatus:'需确认',comparable:false,conservativeReason:'SETTING_GP_FIELD_CONFLICT'});
        input.sourceEvidence.setting=settingConflict.sources;

      if(setting && setting.gpFieldEvidence && setting.gpFieldEvidence[input.field])input.sourceEvidence.setting=uniqueSourceRefs([...(input.sourceEvidence.setting || []),...setting.gpFieldEvidence[input.field]]);
      const gpRows=csv && csv.identityState==='logical-gp-scope' ? csv.rawRows || [] : [];
      const checkedGpFields=['price','device','auction_type','adgroup_status','tver_video_duration','adgroup_start_datetime','adgroup_end_datetime'];
      const gpSourcesComplete=gpRows.length>0 && gpRows.every(row=>row.sourceRefs && row.sourceRefs[input.field]

      if(conflicts.length){

          const reliableSetting=input.comparable!==false && input.settingEvidenceState!=='ambiguous' && input.settingEvidenceState!=='unavailable'

            conservativeReason:allRowsDiffer ? 'CSV_GP_ALL_ROWS_DIFFER' : 'CSV_GP_FIELD_CONFLICT',csvValue:conflictValues.join(' | '),csvSource:null,
            csvCanonical:{value:null,evidenceState:'ambiguous'},csvConflictRawValues:conflictValues,
            additionalEvidenceIssues:previous && !keep ? [previous,(allRowsDiffer ? 'CSV_GP_ALL_ROWS_DIFFER' : 'CSV_GP_FIELD_CONFLICT')] : []});
          input.sourceEvidence.csv=uniqueSourceRefs(conflicts.flatMap(conflict=>conflict.sources));
          return;
        }
        Object.assign(input,{comparisonStatus:'需确认',comparable:false,csvEvidenceState:'ambiguous',conservativeReason:keep ? previous : 'CSV_SCOPE_FIELD_CONFLICT',csvValue:conflicts.flatMap(c=>c.values).join(' | '),csvSource:null,
          csvCanonical:{value:null,evidenceState:'ambiguous'},csvConflictRawValues:conflicts.flatMap(c=>c.values),additionalEvidenceIssues:previous && !keep ? [previous,'CSV_SCOPE_FIELD_CONFLICT'] : []});
        input.sourceEvidence.csv=uniqueSourceRefs(conflicts.flatMap(c=>c.sources));
      }
      // NO004：その他設定(ADG) の未知指示は CSV 列を持たないため、CSVキー列監査の対象外とする。
      if(!['entity','identity','other_settings_adg'].includes(input.field) && fields.some(field=>!tverCsvSchemaHasField(parsed,field))){Object.assign(input,{comparisonStatus:'需确认',comparable:false,csvEvidenceState:'unavailable',conservativeReason:'CSV_FIELD_NOT_VERIFIABLE'});}

    identityBases.forEach(base=>{const csv=all.find(e=>e.key===base.csvEntityKey),reason=csv && csv.identityState==='unresolved-same-name-scope' ? 'NO_ID_SAME_NAME_SCOPE_IDENTITY_PENDING' : 'ENTITY_IDENTITY_NOT_UNIQUELY_CONFIRMED';inputs.push({...base,field:'identity',settingValue:'',csvValue:'',comparisonStatus:'需确认',comparable:false,conservativeReason:reason,ruleBasis:reason,sourceEvidence:{setting:[],csv:uniqueSourceRefs((csv && csv.rawRows || []).map(r=>r.source)),derivedFrom:[]}});});
  }

  function makeTverCandidateFieldConsensus(setting,candidates){
    if(!candidates.length || candidates.some(e=>e.level!==setting.level || !(e.rawRows || []).length || e.matchable===false)) return null;
    const owned=REGISTER_SOURCE_FIELDS_BY_LEVEL[setting.level] || [],rows=candidates.flatMap(e=>e.rawRows),fields={},sourceRefs={},evidence={},fieldConflicts={};
    owned.forEach(field=>{
      const values=[...new Set(rows.map(row=>String(row.values[field] ?? '')))];evidence[field]=collectFieldEvidence(rows,field);
      const value=values.length===1 ? values[0] : '';fields[field]=value;
      const alias=(REGISTER_PRIMARY_FIELD_MAP[setting.level] || {})[field];if(alias)fields[alias]=value;
      if(values.length===1)sourceRefs[field]=selectPrimaryEvidenceForRawValue(evidence[field],value);
      else fieldConflicts[field]={field,values,sources:evidence[field],rowNumbers:rows.map(row=>row.rowNumber)};
    });
    return {key:'field-consensus:'+setting.key,level:setting.level,fields,matchingFields:fields,sourceRefs,sourceEvidence:{fields:evidence},rawRows:rows,fieldConflicts,fieldConsensusOnly:true,candidateKeys:candidates.map(e=>e.key)};
  }

  function buildRunFromModels(settingModel, csvTree, matching, parsedCsv){
    const inputs=[];

    // NO015: 行レベル比較が成立した CSV 名称範囲は「CSV側未匹配」と誤読させない。

        inputs.push({ level:entity.level, entityKey:null, csvEntityKey:entity.key || null, targetName:entityTargetName(entity), field:'entity', settingValue:'', csvValue:entityTargetName(entity), settingSource:null, csvSource:entity.sourceRefs && entity.sourceRefs.csv, ruleBasis:'CSV_SIDE_AMBIGUOUS', comparisonStatus:'需确认', reason:'CSV側候補が一意ではありません' });

      }));

        targetName:'CSV名称範囲（行対応済・Group実体未確認）',
        field:'entity', settingValue:'', csvValue:scopeName, settingSource:null, csvSource:entity.sourceRefs && entity.sourceRefs.csv,
        ruleBasis:'ROW_LEVEL_SCOPE_ENTITY_UNCONFIRMED', comparisonStatus:'需确认', reason:'ROW_LEVEL_SCOPE_ENTITY_UNCONFIRMED',
        sourceEvidence:{ setting:[...info.settingRows.values()], csv:csvRowSources, derivedFrom:[] },
        rowLevelScope:{ name:scopeName, csvRowNumbers:[...info.csvRowNumbers].sort((a,b)=>a-b), settingRowNumbers:[...info.settingRows.keys()].sort((a,b)=>a-b), groupCount:info.groupCount } });
    });
    (matching.orphans || []).forEach(entity => inputs.push({ level:entity.level || 'CSV', entityKey:null, csvEntityKey:entity.key || null, targetName:entity.key || 'CSV orphan', field:'entity', settingValue:'', csvValue:entity.rawValue || '', settingSource:null, csvSource:entity.sourceRefs && entity.sourceRefs.csv || entity.source, ruleBasis:entity.orphanReason || 'CSV_ORPHAN', comparisonStatus:'未匹配', reason:'CSV側未匹配' }));
    enrichTverComparisonInputs(inputs,settingModel,comparisonTree,parsedCsv);
    const run=buildComparisonRun({ fields:inputs, orphanEntities:matching.orphans || [] });
    // A17-3B 的公开集成契约会继续使用调用方的数组进行断言；保留
    // Register 输入数组的原生数组类型，不改变 entries 内容或比较语义。
    if(inputs.some(input => input && ['store_segment', 'bid_segment'].includes(input.field))
      && settingModel && Array.isArray(settingModel.adGroups)){
      let inputArrayConstructor=null;
      for(const candidate of settingModel.adGroups){
        const candidateFields=candidate && candidate.sourceEvidence && candidate.sourceEvidence.fields || {};
        for(const value of Object.values(candidateFields)){
          if(Array.isArray(value)){ inputArrayConstructor=value.constructor; break; }

  // A18-1A：只读展示树。只消费既有实体、matching 与 comparison entries，
  // 不重新匹配、不从名称或 entityKey 字符串推断父级，也不复制 entry/evidence。
  function buildTverDisplayTree(input){
    const config=input || {};
    const settingModel=config.settingModel || {};
    const csvTree=config.csvTree || {};
    const matching=config.matching || {};
    const entries=Array.isArray(config.entries) ? config.entries : [];
    const settingEntities=[...(settingModel.campaigns || []), ...(settingModel.adGroups || []), ...(settingModel.ads || [])];
    const csvEntities=[
      ...(csvTree.campaigns || []), ...(csvTree.adGroups || []), ...(csvTree.ads || []),
      ...(Array.isArray(csvTree.orphans) ? csvTree.orphans : []),
      ...(Array.isArray(matching.orphans) ? matching.orphans : []),
    ].filter((entity, index, all) => entity && entity.key && all.findIndex(candidate => candidate && candidate.key===entity.key)===index);
    const settingByKey=new Map(settingEntities.filter(entity => entity && entity.key).map(entity => [entity.key, entity]));
    const csvByKey=new Map(csvEntities.filter(entity => entity && entity.key).map(entity => [entity.key, entity]));
    const settingMatchByKey=new Map((matching.matches || []).filter(match => match && match.settingKey).map(match => [match.settingKey, match]));
    const csvStateByKey=new Map();
    (matching.unmatched && matching.unmatched.csv || []).forEach(entity => { if(entity && entity.key) csvStateByKey.set(entity.key, 'unmatched'); });
    (matching.unassigned && matching.unassigned.csv || []).forEach(entity => { if(entity && entity.key) csvStateByKey.set(entity.key, 'ambiguous'); });
    (matching.orphans || []).forEach(entity => { if(entity && entity.key) csvStateByKey.set(entity.key, 'orphan'); });

    const nodes=[];
    const settingNodeByKey=new Map();
    const csvNodeByKey=new Map();
    const nodeMeta=new Map();

    const emptyCounts=() => Object.fromEntries(COMPARISON_STATUSES.map(status => [status, 0]));
    const usableDisplayName=entity => {
      if(!entity) return '';
      const name=entityTargetName(entity);
      return name && name!=='未特定' ? String(name) : '';
    };
    const displayNameFor= (setting, csv) => usableDisplayName(setting) || usableDisplayName(csv) || '未特定';
    const makeNodeKey=(setting, csv, entryIndex) => {
      if(entryIndex!==undefined) return `entry:${entryIndex}`;
      if(setting && csv) return `match:${setting.key}::${csv.key}`;
      if(setting) return `setting:${setting.key}`;
      return `csv:${csv.key}`;
    };
    const makeNode=(setting, csv, matchState, entryIndex) => {
      const level=setting && setting.level || csv && csv.level || 'Unknown';
      const displayName=entryIndex===undefined
        ? displayNameFor(setting, csv)
        : String(entries[entryIndex] && (entries[entryIndex].targetName || entries[entryIndex].field) || '未特定');
      const node={
        nodeKey:makeNodeKey(setting, csv, entryIndex),
        level,
        entityKey:setting && setting.key || null,
        csvEntityKey:csv && csv.key || null,
        parentEntityKey:null,
        displayName,
        displayLabel:entryIndex===undefined ? buildTverDisplayLabel(level, setting, csv, displayName) : displayName,
        matchState:matchState || 'unmatched',
        entryIndexes:[],
        directStatusCounts:emptyCounts(),
        subtreeStatusCounts:emptyCounts(),
        children:[],
      };
      if(level==='Ad Group') node.adParentContextLabel=entryIndex===undefined ? buildTverAdParentContextLabel(setting, csv) : displayName;
      nodes.push(node);
      nodeMeta.set(node, { setting, csv, hasExplicitParent:false, rootEligible:false });
      if(setting && setting.key && !settingNodeByKey.has(setting.key)) settingNodeByKey.set(setting.key, node);
      if(csv && csv.key && !csvNodeByKey.has(csv.key)) csvNodeByKey.set(csv.key, node);
      return node;
    };

    settingEntities.forEach(setting => {
      if(!setting || !setting.key || settingNodeByKey.has(setting.key)) return;
      const match=settingMatchByKey.get(setting.key);
      const csv=match && match.status==='matched' && match.csvKey ? csvByKey.get(match.csvKey) : null;
      makeNode(setting, csv, match && match.status || 'unmatched');
    });
    csvEntities.forEach(csv => {
      if(!csv || !csv.key || csvNodeByKey.has(csv.key)) return;
      makeNode(null, csv, csvStateByKey.get(csv.key) || 'unmatched');
    });

    const parentLevel={ 'Ad Group':'Campaign', Ad:'Ad Group' };
    const parentByNode=new Map();
    const rootEligibleByNode=new Map();
    nodes.forEach(node => {
      const meta=nodeMeta.get(node);
      const refs=[];
      if(meta.setting && meta.setting.parentKey!==null && meta.setting.parentKey!==undefined && meta.setting.parentKey!=='') refs.push({ side:'setting', key:meta.setting.parentKey, node:settingNodeByKey.get(meta.setting.parentKey) });
      if(meta.csv && meta.csv.parentKey!==null && meta.csv.parentKey!==undefined && meta.csv.parentKey!=='') refs.push({ side:'csv', key:meta.csv.parentKey, node:csvNodeByKey.get(meta.csv.parentKey) });
      meta.hasExplicitParent=refs.length>0;
      meta.rootEligible=!meta.hasExplicitParent && node.level==='Campaign';
      if(!refs.length){ parentByNode.set(node, null); rootEligibleByNode.set(node, meta.rootEligible); return; }
      const parentNodes=refs.map(ref => ref.node);
      const sameParent=parentNodes.every(parent => parent && parent===parentNodes[0]);
      const expectedParentLevel=parentLevel[node.level];
      const valid=sameParent && (!expectedParentLevel || parentNodes[0].level===expectedParentLevel) && parentNodes[0]!==node;
      if(valid){
        parentByNode.set(node, parentNodes[0]);
        node.parentEntityKey=refs.find(ref => ref.side==='setting') && refs.find(ref => ref.side==='setting').key || refs[0].key;
      }else{
        parentByNode.set(node, null);
        node.parentEntityKey=null;
      }
      rootEligibleByNode.set(node, false);
    });

    const cycleNodes=new Set();
    nodes.forEach(start => {
      const path=[];
      const seen=new Map();
      let current=start;
      while(current && parentByNode.get(current)){
        if(seen.has(current)){
          path.slice(seen.get(current)).forEach(node => cycleNodes.add(node));
          break;
        }
        seen.set(current, path.length);
        path.push(current);
        current=parentByNode.get(current);
      }
    });
    cycleNodes.forEach(node => { parentByNode.set(node, null); node.parentEntityKey=null; });

    const nodeForEntry=entry => {
      const settingNode=entry && entry.entityKey ? settingNodeByKey.get(entry.entityKey) : null;
      const csvNode=entry && entry.csvEntityKey ? csvNodeByKey.get(entry.csvEntityKey) : null;
      if(settingNode && csvNode && settingNode!==csvNode) return null;
      return settingNode || csvNode || null;
    };
    entries.forEach((entry, index) => {
      let node=nodeForEntry(entry);
      if(!node) node=makeNode(null, null, 'unattached', index);
      if(node.entryIndexes.includes(index)) return;
      node.entryIndexes.push(index);
      const status=entry && (entry.displayStatus || entry.comparisonStatus);
      if(Object.prototype.hasOwnProperty.call(node.directStatusCounts, status)) node.directStatusCounts[status]+=1;
    });

    const roots=[];
    const unattached=[];
    nodes.forEach(node => {
      const parent=parentByNode.get(node);
      if(parent){ parent.children.push(node); return; }
      if(rootEligibleByNode.get(node)) roots.push(node); else unattached.push(node);
    });

    const addCounts=(target, source) => COMPARISON_STATUSES.forEach(status => { target[status]+=source[status] || 0; });
    const aggregate=(node, visiting=new Set()) => {
      if(visiting.has(node)) return { ...node.directStatusCounts };
      const next=new Set(visiting); next.add(node);
      const total={ ...node.directStatusCounts };
      node.children.forEach(child => addCounts(total, aggregate(child, next)));
      node.subtreeStatusCounts=total;
      return total;
    };
    [...roots, ...unattached].forEach(node => aggregate(node));
    return { roots, unattached };
  }

  // A18-3A：横向结果表的只读展示投影。仅消费既有displayTree与entries，

  const TVER_HORIZONTAL_FIELD_ORDER={

  };

  };

  const TVER_COLUMN_DEFAULT_WIDTHS={ no:56, target:280, name:320, comparison:156, field:160 };
  const TVER_COLUMN_WIDTH_LIMITS={ no:{ min:56, max:56 }, target:{ min:90, max:560 }, name:{ min:220, max:480 }, comparison:{ min:140, max:300 }, field:{ min:120, max:560 } };

  function getTverColumnStorage(storage){
    if(storage!==undefined) return storage;
    try{ return typeof window!=='undefined' && window.localStorage ? window.localStorage : null; }catch(error){ return null; }
  }

  function tverColumnWidthKind(columnKey){
    return columnKey==='no' ? 'no' : columnKey==='target' ? 'target' : columnKey==='comparison' ? 'comparison' : columnKey==='name' ? 'name' : 'field';
  }

  function getTverColumnDefaultWidth(level, columnKey){
    const kind=tverColumnWidthKind(columnKey);
    if(kind==='target' && (level==='Ad Group' || level==='Ad')) return 100;
    return TVER_COLUMN_DEFAULT_WIDTHS[kind];
  }

  function clampTverColumnWidth(columnKey, width, level){
    const kind=tverColumnWidthKind(columnKey);
    const limits=TVER_COLUMN_WIDTH_LIMITS[kind];
    const minimum=kind==='target' && level!=='Ad Group' && level!=='Ad' ? 160 : limits.min;
    const value=Number(width);
    const safe=Number.isFinite(value) ? value : getTverColumnDefaultWidth(level, columnKey);
    return Math.round(Math.min(limits.max, Math.max(minimum, safe)));
  }

  function readTverColumnWidthPreferences(storage){
    const source=getTverColumnStorage(storage);

      }
      const previousRaw=source.getItem(TVER_COLUMN_PREVIOUS_WIDTH_STORAGE_KEY);

      const previous=JSON.parse((fromV2 ? source.getItem(TVER_COLUMN_LEGACY_WIDTH_STORAGE_KEY) : previousRaw) || '{}');
      const migrated={};
      if(previous && typeof previous==='object' && !Array.isArray(previous)){
        Object.entries(previous).forEach(([level, values]) => {
          if(!values || typeof values!=='object' || Array.isArray(values)) return;
          migrated[level]={};
          Object.entries(values).forEach(([key, value]) => {
            // FIX5: reset only Ad target/comparison; retain FIX4 migration for untouched v2 stores.
            if((level==='Ad' || fromV2 && (level==='Campaign' || level==='Ad Group')) && (key==='target' || key==='comparison')) return;
            if(Number.isFinite(Number(value))) migrated[level][key]=value;
          });
          if(level==='Ad' && !Object.prototype.hasOwnProperty.call(migrated[level], 'name') && Number.isFinite(Number(values.creative_name))){
            migrated[level].name=values.creative_name;
          }
        });
      }
      try{ if(typeof source.setItem==='function') source.setItem(TVER_COLUMN_WIDTH_STORAGE_KEY, JSON.stringify(migrated)); }catch(error){ /* read-only storage */ }
      return migrated;
    }catch(error){ return {}; }
  }

  function getTverColumnWidth(level, columnKey, storage){
    const key=String(columnKey || '');
    if(key==='parent') return TVER_COLUMN_DEFAULT_WIDTHS.field;
    const kind=tverColumnWidthKind(key);
    if(kind==='no') return TVER_COLUMN_DEFAULT_WIDTHS.no;
    const preferences=readTverColumnWidthPreferences(storage);
    const levelPreferences=preferences && preferences[String(level)] && typeof preferences[String(level)]==='object' ? preferences[String(level)] : {};
    return clampTverColumnWidth(key, levelPreferences[key] ?? getTverColumnDefaultWidth(level, key), level);
  }

  function setTverColumnWidth(level, columnKey, width, storage){
    const key=String(columnKey || '');
    if(key==='parent') return TVER_COLUMN_DEFAULT_WIDTHS.field;
    const next=clampTverColumnWidth(key, width, level);
    if(tverColumnWidthKind(key)==='no') return next;
    const source=getTverColumnStorage(storage);
    if(!source || typeof source.setItem!=='function') return next;
    try{
      const preferences=readTverColumnWidthPreferences(source);
      const levelKey=String(level || 'Campaign');
      const levelPreferences=preferences[levelKey] && typeof preferences[levelKey]==='object' && !Array.isArray(preferences[levelKey]) ? { ...preferences[levelKey] } : {};
      levelPreferences[key]=next;
      preferences[levelKey]=levelPreferences;
      source.setItem(TVER_COLUMN_WIDTH_STORAGE_KEY, JSON.stringify(preferences));
    }catch(error){ /* localStorage不可用でもUI幅の変更は継続する */ }
    return next;
  }

  function resetTverColumnWidths(storage){
    const source=getTverColumnStorage(storage);
    if(source && typeof source.setItem==='function'){
      try{ source.setItem(TVER_COLUMN_WIDTH_STORAGE_KEY, '{}'); }catch(error){ /* localStorage不可用 */ }
    }
  }

  function resolveTverHorizontalFieldLabel(level, field){
    const key=String(field ?? '');
    const jaLabels=TVER_HORIZONTAL_FIELD_LABELS[level];
    const jaLabel=jaLabels && jaLabels[key];
    if(typeof jaLabel==='string' && jaLabel.trim()!=='') return jaLabel;
    const enLabels=TVER_HORIZONTAL_FIELD_EN_LABELS[level];
    const enLabel=enLabels && enLabels[key];
    if(typeof enLabel==='string' && enLabel.trim()!=='') return enLabel;
    return key;
  }

  function buildTverHorizontalFieldLabel(level, field){
    return resolveTverHorizontalFieldLabel(level, field);
  }

  function buildTverHorizontalNodeLabel(node){
    if(!node) return '未特定';
    const label=node.displayLabel ?? node.displayName;
    return String(label ?? '') || '未特定';
  }

  function collectTverDisplayNodesByLevel(displayTree, level, entries=[]){
    const tree=displayTree && typeof displayTree==='object' ? displayTree : {};
    const roots=Array.isArray(tree.roots) ? tree.roots : [];
    const unattached=Array.isArray(tree.unattached) ? tree.unattached : [];
    const result=[];
    const contextLabel=node => level==='Ad' && node && node.level==='Ad Group' && node.adParentContextLabel!==undefined
      ? node.adParentContextLabel : buildTverHorizontalNodeLabel(node);

    const walk=(node, parent, parentPath, isUnattachedRoot) => {
      if(!node || typeof node!=='object') return;
      const nodeKey=String(node.nodeKey ?? node.entityKey ?? '');
      // An unattached record can have a known comparison level even when entity matching is unresolved.
      const index=node.matchState==='unattached' && node.entryIndexes && node.entryIndexes.length===1 ? node.entryIndexes[0] : null;
      const record=Number.isInteger(index) ? entries[index] : null;
      const nodeLevel=node.level==='Unknown' && record && TVER_HORIZONTAL_LEVELS.includes(record.level) ? record.level : String(node.level ?? '');
      const displayLabel=contextLabel(node);
      const path=Array.isArray(parentPath) ? parentPath.map(item => ({ ...item })) : [];
      if(nodeLevel===level){
        const parentNodeKey=parent ? String(parent.nodeKey ?? parent.entityKey ?? '') : null;
        const rowKey=JSON.stringify([isUnattachedRoot && !parent ? 'unattached' : 'tree', nodeLevel, ...path.map(item => item.nodeKey), nodeKey]);
        result.push({
          node,
          level:nodeLevel,
          nodeKey,
          entityKey:node.entityKey ?? null,
          displayLabel,
          parentNodeKey,
          parentDisplayLabel:parent ? contextLabel(parent) : (isUnattachedRoot ? '未接続' : ''),
          parentPath:path,
          rowKey,
          isUnattached:Boolean(isUnattachedRoot && !parent),
          entryIndexes:Array.isArray(node.entryIndexes) ? [...node.entryIndexes] : [],
        });
      }
      const nextPath=[...path, { nodeKey, level:nodeLevel, displayLabel }];
      const children=Array.isArray(node.children) ? node.children : [];
      children.forEach(child => walk(child, node, nextPath, false));
    };

    roots.forEach(node => walk(node, null, [], false));
    unattached.forEach(node => walk(node, null, [], true));
    return result;
  }

  function tverHorizontalRawValuePresent(value){
    return value!==null && value!==undefined && String(value).trim()!=='';
  }

  function buildTverHorizontalColumns(run, level){
    const safeRun=run && typeof run==='object' ? run : {};
    const entries=Array.isArray(safeRun.entries) ? safeRun.entries : [];
    const nodes=collectTverDisplayNodesByLevel(safeRun.displayTree, level, entries);
    const fixedFields=Array.isArray(TVER_HORIZONTAL_FIELD_ORDER[level]) ? TVER_HORIZONTAL_FIELD_ORDER[level] : [];
    const fixedSet=new Set(fixedFields);
    const projectedNameField=level==='Campaign' ? 'campaign_name' : level==='Ad Group' ? 'adgroup_name' : level==='Ad' ? 'creative_name' : null;
    const discoveredFields=[];
    const fieldHasMeaningfulValue=new Map();

    nodes.forEach(node => {
      node.entryIndexes.forEach(entryIndex => {
        if(!Number.isInteger(entryIndex) || entryIndex<0 || entryIndex>=entries.length) return;
        const entry=entries[entryIndex];
        if(!entry || entry.hidden || entry.level!==level) return;
        const field=String(entry.field ?? '');
        if(!field || field===projectedNameField) return;

        if(!fieldHasMeaningfulValue.has(field)){
          fieldHasMeaningfulValue.set(field, false);
          if(!fixedSet.has(field)) discoveredFields.push(field);
        }
        const keepBlankVisible=!(level==='Campaign' && field==='hourly_bid_weight');
        if((keepBlankVisible && entry.alwaysDisplay) || tverHorizontalRawValuePresent(entry.settingRawValue) || tverHorizontalRawValuePresent(entry.csvRawValue)) fieldHasMeaningfulValue.set(field, true);
      });
    });

    const columns=[...fixedFields, ...discoveredFields]
      .filter(field => field!==projectedNameField && fieldHasMeaningfulValue.get(field)===true)
      .map(field => ({ key:field, label:buildTverHorizontalFieldLabel(level, field) }));
    // NO004：この表の全ローカル局が「不要・明示空白・一致」なら列ごと隠す。
    if(level==='Ad Group' && columns.some(column => column.key==='local_broadcaster')){
      const localEntries=[];
      nodes.forEach(node => node.entryIndexes.forEach(entryIndex => {
        if(!Number.isInteger(entryIndex) || entryIndex<0 || entryIndex>=entries.length) return;
        const entry=entries[entryIndex];
        if(entry && !entry.hidden && entry.level===level && entry.field==='local_broadcaster') localEntries.push(entry);
      }));
      if(localEntries.length && localEntries.every(isTverLocalDisplayHidden)) return columns.filter(column => column.key!=='local_broadcaster');
    }
    return columns;
  }

  function buildTverHorizontalViewModel(run, level, filters){
    const safeRun=run && typeof run==='object' ? run : {};
    const entries=Array.isArray(safeRun.entries) ? safeRun.entries : [];
    const columns=buildTverHorizontalColumns(safeRun, level);
    const columnByKey=new Map(columns.map(column => [column.key, column]));
    const projectedNameField=level==='Campaign' ? 'campaign_name' : level==='Ad Group' ? 'adgroup_name' : level==='Ad' ? 'creative_name' : null;
    const criteria=buildTverEntryFilterCriteria({ ...(filters || {}), level });
    const rows=[];

    collectTverDisplayNodesByLevel(safeRun.displayTree, level, entries).forEach(nodeView => {
      const visibleEntryIndexes=nodeView.entryIndexes.filter(entryIndex => {
        if(!Number.isInteger(entryIndex) || entryIndex<0 || entryIndex>=entries.length) return false;
        const entry=entries[entryIndex];
        return Boolean(entry && entry.level===level && matchesTverDisplayEntryFilters(entry, criteria));
      });
      if(!visibleEntryIndexes.length) return;
      const entityEntries=nodeView.entryIndexes
        .map(entryIndex => Number.isInteger(entryIndex) ? entries[entryIndex] : null)
        .filter(entry => entry && !entry.hidden && entry.level===level);

      const cells={};
      columns.forEach(column => {
        cells[column.key]={ field:column.key, label:column.label, entryIndexes:[], entries:[] };
      });
      if(projectedNameField){
        const label=buildTverHorizontalFieldLabel(level, projectedNameField);
        const nameIndexes=nodeView.entryIndexes.filter(entryIndex=>{
          const entry=Number.isInteger(entryIndex) ? entries[entryIndex] : null;
          return Boolean(entry && !entry.hidden && entry.level===level && String(entry.field ?? '')===projectedNameField);
        });
        cells[projectedNameField]={
          field:projectedNameField,label,entryIndexes:nameIndexes,
          entries:nameIndexes.map(entryIndex=>entries[entryIndex]),
        };
      }
      visibleEntryIndexes.forEach(entryIndex => {
        const entry=entries[entryIndex];
        const field=String(entry.field ?? '');
        const cell=columnByKey.get(field) && cells[field];
        if(!cell) return;
        cell.entryIndexes.push(entryIndex);
        cell.entries.push(entry);
      });

      const projectedNameCell=projectedNameField ? cells[projectedNameField] : null;
      const projectedNameEntry=projectedNameCell && projectedNameCell.entries.length===1 ? projectedNameCell.entries[0] : null;
      const projectedName=projectedNameEntry ? {
        entryIndex:projectedNameCell.entryIndexes[0],
        expected:String(projectedNameEntry.settingRawValue ?? ''),
        actual:String(projectedNameEntry.csvRawValue ?? ''),
        status:projectTverDisplayStatus(projectedNameEntry.displayStatus || projectedNameEntry.comparisonStatus),
        entry:projectedNameEntry,
      } : null;

      rows.push({
        rowKey:nodeView.rowKey,
        level:nodeView.level,
        nodeKey:nodeView.nodeKey,
        entityKey:nodeView.entityKey,
        displayLabel:nodeView.displayLabel,
        parentNodeKey:nodeView.parentNodeKey,
        parentDisplayLabel:nodeView.parentDisplayLabel,
        parentPath:nodeView.parentPath.map(item => ({ ...item })),
        isUnattached:nodeView.isUnattached,
        entityDisplayStatus:projectTverEntityDisplayStatus(entityEntries),
        rowLevelScope:(entityEntries.find(entry=>entry && entry.rowLevelScope && typeof entry.rowLevelScope==='object') || {}).rowLevelScope || null,
        directStatusCounts:{ ...(nodeView.node && nodeView.node.directStatusCounts || {}) },
        entryIndexes:[...nodeView.entryIndexes],
        visibleEntryIndexes:[...visibleEntryIndexes],
        campaignName:level==='Campaign' ? projectedName : undefined,
        groupName:level==='Ad Group' ? projectedName : undefined,
        creativeName:level==='Ad' ? projectedName || {
          entry:null,
          candidateCount:projectedNameCell ? projectedNameCell.entries.length : 0,
          candidates:projectedNameCell ? projectedNameCell.entries.map((entry, index) => ({ entry, entryIndex:projectedNameCell.entryIndexes[index] })) : [],
        } : undefined,
        cells,
      });
    });

    rows.forEach(row => { Object.defineProperty(row, 'entriesRef', { value:entries, enumerable:false, configurable:true }); });
    return { level, columns, rows, entries };
  }

  function tverHorizontalStatusClass(status){
    const projected=projectTverDisplayStatus(status);
    return projected==='一致' ? 'tver-status-consistent' : projected==='不一致' ? 'tver-status-mismatch' : projected==='要確認' ? 'tver-status-review' : '';
  }

  function tverHorizontalCellStatusClass(cell){
    const entries=cell && Array.isArray(cell.entries) ? cell.entries : [];
    if(!entries.length) return '';
    // C3-C5-CR-REOPEN-3 FIX B：仅由 deferred 字段构成的单元格无判定状态色。
    if(entries.every(entry => entry && entry.deferred)) return '';
    return tverHorizontalStatusClass(projectTverEntityDisplayStatus(entries));
  }

  function tverHorizontalCellClass(cell){
    const statusClass=tverHorizontalCellStatusClass(cell);
    return `tver-horizontal-field-col tver-horizontal-cell-toggle${statusClass ? ` ${statusClass}` : ''}`;
  }

  function formatTverHorizontalSettingValue(entry, sourceKind){
    const raw=entry && entry.settingRawValue;
    if(sourceKind!=='setting') return raw;
    const field=String(entry && entry.field || '');
    const value=String(raw ?? '').trim();
    if(field==='campaign_status') return value==='0' ? '無効（規定値）' : value==='1' ? '有効' : raw;
    if(field==='consumption_type') return value==='1' ? 'フラット' : value==='2' ? 'フル' : raw;
    if(field==='cv_point' && value==='' && String(entry && entry.ruleBasis || '')==='TVER_CAMPAIGN_CV_NONE_FROM_SETTING') return 'なし';
    if(field==='report_target_flag') return value==='0' ? '対象外' : value==='1' ? '対象' : raw;
    if(field==='budget_type') return value==='1' ? '月次予算' : value==='2' ? '期間予算' : raw;
    return raw;
  }

  // 比较输入、canonicalValue、comparisonStatus及原始entry均保持不变。

    budget_type:Object.freeze({ '1':'月次予算', '2':'期間予算' }),
    campaign_status:Object.freeze({ '0':'無効', '1':'有効' }),

  function formatTverMediaIdsForDisplay(rawValue){
    // NO004：CSV 側は数字IDのみ表示する（媒体名は后台判定と詳細の根拠に残す）。
    return parseTverIdSet(rawValue).ids.join('、');

  // NO004：普通局名指定でローカル局が不要・CSV 明示空白・最終一致の行は、
  // ローカル局セルを空欄にする（設定表の局名を繰り返し表示しない）。
  function isTverLocalDisplayHidden(entry){
    const safe=entry && typeof entry==='object' ? entry : {};
    if(String(safe.field ?? '')!=='local_broadcaster') return false;
    if(String(safe.ruleBasis ?? '')!=='TVER_NO032_FIX3_LOCAL_BROADCASTER_NOT_REQUIRED_BY_STATION_NAME') return false;
    if(projectTverDisplayStatus(safe.displayStatus || safe.comparisonStatus)!=='一致') return false;
    return String(safe.csvRawValue ?? '').trim()==='';
  }

  function formatTverDisplayValue(entry, sourceKind){
    const safe=entry && typeof entry==='object' ? entry : {};
    if(isTverLocalDisplayHidden(safe)) return '';
    const raw=sourceKind==='setting' ? safe.settingRawValue : safe.csvRawValue;
    if(sourceKind==='setting' && safe.field==='creative_name' && safe.ruleBasis==='TVER_NO021_VIDEO_FILENAME_WITHOUT_EXTENSION') return deriveTverCreativeName(raw);
    if(sourceKind==='setting' && safe.field==='media' && /^\d+(?:[\s,]+\d+)*$/.test(String(raw ?? '').trim())) return formatTverMediaIdsForDisplay(raw);
    if(sourceKind==='setting') return formatTverHorizontalSettingValue(safe, sourceKind);
    const field=String(safe.field ?? '');
    if(field==='media' && /^\d+(?:[\s,]+\d+)*$/.test(String(raw ?? '').trim())) return formatTverMediaIdsForDisplay(raw);
    if(field==='device' && (raw==null || String(raw).trim()==='') && String(safe.settingRawValue ?? '').trim()!=='') return '（空欄）';
    const code=String(raw ?? '').trim();
    const labels=TVER_CSV_DISPLAY_CODE_LABELS[field];
    const label=labels && Object.prototype.hasOwnProperty.call(labels, code) ? labels[code] : '';
    return label ? `${String(raw ?? '')}（${label}）` : raw;
  }

  function buildTverHorizontalCellHtml(cell, sourceKind, scope){
    const safeCell=cell && typeof cell==='object' ? cell : {};
    const entries=Array.isArray(safeCell.entries) ? safeCell.entries : [];
    const entryIndexes=Array.isArray(safeCell.entryIndexes) ? safeCell.entryIndexes : [];
    const blocks=entries.map((entry, position) => {
      const entryIndex=entryIndexes[position];
      const status=entry && (entry.displayStatus || entry.comparisonStatus) || '';
      const projected=projectTverDisplayStatus(status);
      const value=entry ? formatTverDisplayValue(entry, sourceKind) : '';
      const prefDiff=sourceKind==='csv' && entry ? buildTverPrefDiffDisplay(entry).text : '';
      const entryClass=prefDiff ? 'tver-horizontal-cell-entry tver-horizontal-cell-entry-with-reason' : 'tver-horizontal-cell-entry';
      const reasonHtml=prefDiff ? `<span class="tver-horizontal-cell-reason" data-cell-reason="pref-diff">${escapeHtml(prefDiff)}</span>` : '';
      const qcStatusAttr=sourceKind==='setting'&&(projected==='不一致'||projected==='要確認')
        ? ` data-qc-status="${projected==='不一致' ? 'mismatch' : 'review'}" data-qc-scope="${escapeHtml(scope || '__all__')}"` : '';
      return `<div class="${entryClass}"${qcStatusAttr} data-entry-index="${escapeHtml(entryIndex)}" data-entry-status="${escapeHtml(projected)}"><span class="tver-horizontal-cell-value" title="${escapeHtml(value)}">${escapeHtml(value)}</span>${reasonHtml}</div>`;
    }).join('');
    return blocks;
  }

  function tverDisplayReasonCodeMessage(code){
    const key=String(code ?? '').trim();
    return key && Object.prototype.hasOwnProperty.call(TVER_DISPLAY_REASON_MESSAGES, key) ? TVER_DISPLAY_REASON_MESSAGES[key] : '';
  }

  function normalizeTverDisplayReasonCode(entry, code){
    const key=String(code ?? '').trim();
    if(key==='GP_PREF_SOURCE_OR_SCHEMA_UNAVAILABLE'
      && String((entry && entry.ruleBasis) ?? '')==='TVER_A17_2_PREF_EXCLUSION_CHANGE_AMBIGUOUS'){
      return 'PREF_EXCLUSION_CHANGE_AMBIGUOUS';
    }
    return key;
  }

  function buildTverPrefDiffDisplay(entry){
    const empty=() => ({ missingInCsv:[], extraInCsv:[], missingNames:[], extraNames:[], lines:[], text:'' });
    const safe=entry && typeof entry==='object' ? entry : {};
    if(String(safe.field ?? '')!=='pref' || String(safe.comparisonStatus ?? '')!=='不一致') return empty();
    const canonicalValues=safe.canonicalValues && typeof safe.canonicalValues==='object' ? safe.canonicalValues : {};
    const dictionary=Array.isArray(TVER_ID_DICTIONARIES.pref) ? TVER_ID_DICTIONARIES.pref : [];
    const knownIds=new Set(dictionary.map(item => String((item && item.id) || '')));
    const canonicalIds=value => {
      if(value===null || value===undefined) return null;
      const raw=String(value).trim();
      if(!raw) return [];
      const ids=parseTverIdSet(raw).ids;
      return ids.every(id => knownIds.has(id)) ? ids : null;
    };
    const settingIds=canonicalIds(canonicalValues.setting);
    const csvIds=canonicalIds(canonicalValues.csv);
    if(!settingIds || !csvIds) return empty();
    const csvSet=new Set(csvIds);
    const settingSet=new Set(settingIds);
    const missingInCsv=settingIds.filter(id => !csvSet.has(id));
    const extraInCsv=csvIds.filter(id => !settingSet.has(id));
    const namesById=new Map(dictionary.map(item => [String((item && item.id) || ''), String((item && item.name) || '')]));
    const displayName=id => namesById.get(id) || id;
    const missingNames=missingInCsv.map(displayName);
    const extraNames=extraInCsv.map(displayName);
    const lines=[];
    if(missingNames.length) lines.push(`CSV不足：${missingNames.join('、')}`);
    if(extraNames.length) lines.push(`CSV多余：${extraNames.join('、')}`);
    return { missingInCsv, extraInCsv, missingNames, extraNames, lines, text:lines.join('\n') };
  }

  // NO004：サブジャンル（指定／除外）の双方向差集合を、設定表の日本語名で要約する。
  function buildTverSubgenreDiffDisplay(entry){
    const empty=()=>({multi:[],missing:[],text:''});
    const safe=entry && typeof entry==='object' ? entry : {};
    const field=String(safe.field ?? '');
    if(field!=='subgenre' && field!=='subgenre_exclude') return empty();
    const canonicalValues=safe.canonicalValues && typeof safe.canonicalValues==='object' ? safe.canonicalValues : {};
    const settingRaw=canonicalValues.setting!==undefined && canonicalValues.setting!==null ? canonicalValues.setting : safe.settingRawValue;
    const csvRaw=canonicalValues.csv!==undefined && canonicalValues.csv!==null ? canonicalValues.csv : safe.csvRawValue;
    if(settingRaw===null || settingRaw===undefined || csvRaw===null || csvRaw===undefined) return empty();
    const dictionary=Array.isArray(TVER_ID_DICTIONARIES.subgenre) ? TVER_ID_DICTIONARIES.subgenre : [];
    const knownIds=new Set(dictionary.map(item => String((item && item.id) || '')));
    const ids=value => {
      const list=parseTverIdSet(String(value ?? '')).ids;
      return list.length && list.every(id => knownIds.has(id)) ? list : null;
    };
    const settingIds=ids(settingRaw), csvIds=ids(csvRaw);
    if(!settingIds || !csvIds) return empty();
    const settingSet=new Set(settingIds), csvSet=new Set(csvIds);
    const multi=csvIds.filter(id => !settingSet.has(id));
    const missing=settingIds.filter(id => !csvSet.has(id));
    if(!multi.length && !missing.length) return empty();
    const namesById=new Map(dictionary.map(item => [String((item && item.id) || ''), String((item && item.name) || '')]));
    const label=id => '「' + (namesById.get(id) || id) + '」';
    const mode=field==='subgenre_exclude' ? '除外' : '指定';
    const parts=[];
    if(multi.length) parts.push('下载数据多'+mode+'了'+multi.map(label).join(''));
    if(missing.length) parts.push('下载数据少'+mode+'了'+missing.map(label).join(''));
    return { multi, missing, text:parts.join('；')+'。' };
  }

  // NO005：media／local_broadcaster の差分は数字 ID のみで表す。放送局名・全量 ID 集合・
  // 辞書明細・技術的な理由コードは表示しない（監査データは entry.idDiff / mediaEvaluation に保持）。
  function tverIdDiffForEntry(entry){
    const safe=entry && typeof entry==='object' ? entry : {};
    const field=String(safe.field ?? '');
    if(field!=='media' && field!=='local_broadcaster') return null;
    if(safe.idDiff && typeof safe.idDiff==='object'){
      const kind=String(safe.idDiff.kind ?? '');
      return {
        missingIds:tverSortIdsForDisplay(safe.idDiff.missingIds || []),
        extraIds:tverSortIdsForDisplay(safe.idDiff.extraIds || []),
        violatedIds:tverSortIdsForDisplay(safe.idDiff.violatedIds || []),
        allowExtraIds:kind==='media_numeric' || kind==='local_broadcaster',
      };
    }
    // 旧 entry など idDiff を持たない経路のフォールバック（同じ集合差分を再計算する）。
    if(field==='media'){
      const evaluation=safe.mediaEvaluation && typeof safe.mediaEvaluation==='object' ? safe.mediaEvaluation : null;
      if(evaluation && Array.isArray(evaluation.violatedIds) && evaluation.violatedIds.length){
        return { missingIds:[], extraIds:[], violatedIds:tverSortIdsForDisplay(evaluation.violatedIds), allowExtraIds:false };
      }
      if(evaluation && Array.isArray(evaluation.expectedIds) && evaluation.expectedIds.length){
        const diff=buildTverIdSetDiff(evaluation.expectedIds.join(' '), safe.csvRawValue);
        return { missingIds:diff.missingIds, extraIds:diff.extraIds, violatedIds:[], allowExtraIds:false };
      }
      const expectedGroups=Array.isArray(evaluation && evaluation.expectedGroups) ? evaluation.expectedGroups : [];
      if(expectedGroups.length){
        const diff=buildTverIdSetDiff(tverMediaIdsForGroups(expectedGroups).join(' '), safe.csvRawValue);
        return { missingIds:diff.missingIds, extraIds:diff.extraIds, violatedIds:[], allowExtraIds:false };
      }
    }
    const canonicalValues=safe.canonicalValues && typeof safe.canonicalValues==='object' ? safe.canonicalValues : {};
    const expected=canonicalValues.setting;
    if(expected===null || expected===undefined || String(expected).trim()==='') return null;
    const actual=canonicalValues.csv===null || canonicalValues.csv===undefined ? safe.csvRawValue : canonicalValues.csv;
    const diff=buildTverIdSetDiff(expected, actual);
    return { missingIds:diff.missingIds, extraIds:diff.extraIds, violatedIds:[], allowExtraIds:true };
  }

  function buildTverIdDiffDisplay(entry){
    const empty=() => ({ missingIds:[], extraIds:[], violatedIds:[], lines:[], text:'' });
    const safe=entry && typeof entry==='object' ? entry : {};
    const field=String(safe.field ?? '');
    if(field!=='media' && field!=='local_broadcaster') return empty();
    if(projectTverDisplayStatus(safe.displayStatus || safe.comparisonStatus)!=='不一致') return empty();
    // 「未要求设置ローカル局」は専用文言（既存承認済み）を優先する。
    if(safe.conservativeReason==='LOCAL_BROADCASTER_VALUE_WHEN_NOT_REQUIRED') return empty();
    const diff=tverIdDiffForEntry(safe);
    if(!diff) return empty();
    const missingIds=diff.missingIds || [];
    const extraIds=diff.allowExtraIds ? (diff.extraIds || []) : [];
    const violatedIds=diff.violatedIds || [];
    const lines=[];
    if(violatedIds.length) lines.push('除外対象のID「'+violatedIds.join('、')+'」がダウンロードデータに含まれています。');
    if(missingIds.length && extraIds.length){
      lines.push('不足ID：'+missingIds.join('、'));
      lines.push('余分なID：'+extraIds.join('、'));
    }else if(missingIds.length===1){
      lines.push('ダウンロードデータにID「'+missingIds[0]+'」がありません。');
    }else if(missingIds.length){
      lines.push('不足ID：'+missingIds.join('、'));
    }else if(extraIds.length===1){
      lines.push('ダウンロードデータに余分なID「'+extraIds[0]+'」があります。');
    }else if(extraIds.length){
      lines.push('余分なID：'+extraIds.join('、'));
    }
    return { missingIds, extraIds, violatedIds, lines, text:lines.join('\n') };
  }

  function getTverDisplayReason(entry){
    const safe=entry && typeof entry==='object' ? entry : {};
    if(safe.field==='creative_name' && safe.ruleBasis==='TVER_NO021_VIDEO_FILENAME_WITHOUT_EXTENSION' && safe.displayStatus==='不一致') return '動画拡張子を除いた期待名「'+deriveTverCreativeName(safe.settingRawValue)+'」とCSV名称が異なります';
    const status=projectTverDisplayStatus(safe.displayStatus || safe.comparisonStatus);
    if(status==='不一致'){
      if(safe.conservativeReason==='LOCAL_BROADCASTER_VALUE_WHEN_NOT_REQUIRED') return TVER_DISPLAY_REASON_MESSAGES[safe.conservativeReason];
      // NO005：media／local_broadcaster は差分の数字 ID だけを理由として返す。
      const idDiff=buildTverIdDiffDisplay(safe);
      if(idDiff.text) return idDiff.text;
      const prefDiff=buildTverPrefDiffDisplay(safe);
      if(prefDiff.text) return prefDiff.text;
      const subgenreDiff=buildTverSubgenreDiffDisplay(safe);
      if(subgenreDiff.text) return subgenreDiff.text;
      return '設定表とCSVの値が異なります';
    }
    if(safe.displayStatus==='需确认' && String(safe.field ?? '')==='daily_budget' && !tverHorizontalRawValuePresent(safe.settingRawValue) && String(safe.ruleBasis ?? '')==='strict' && !String(safe.conservativeReason ?? '').trim()){
      return '設定表の日予算が空欄のため確認が必要です';
    }
    if(safe.field==='media' && safe.conservativeReason==='MEDIA_MAPPING_INSUFFICIENT' && String(safe.settingRawValue ?? '').trim()==='EX除外')
      return '設定表の「EX除外」は自動判定の対象外です。CSVの媒体IDをmediaシートで照合し、テレビ朝日所属のIDが含まれていないか確認してください';
    if(String(safe.field ?? '')==='other_settings_adg'){
      const raw=String(safe.settingRawValue ?? '').trim();
      return 'その他設定(ADG) 记载了「'+raw+'」。当前工具尚未配置这条指示的校正规则，请联系开发人员追加。';
    }
    const conservativeCode=normalizeTverDisplayReasonCode(safe, safe.conservativeReason);
    const conservativeMessage=tverDisplayReasonCodeMessage(conservativeCode);
    if(conservativeMessage) return conservativeMessage;
    const validationIssues=Array.isArray(safe.validationIssues) ? safe.validationIssues : [];
    for(const issue of validationIssues){
      const message=tverDisplayReasonCodeMessage(issue && issue.code);
      if(message) return message;
      if(String(issue && issue.code || '')==='DATETIME_NOT_30_MINUTE_GRANULARITY') return '日時がTVer設定単位（00分／30分）ではありません';
    }
    const explicitReason=String(safe.reason ?? '').trim();
    const explicitMessage=tverDisplayReasonCodeMessage(explicitReason);
    if(explicitMessage) return explicitMessage;
    if(explicitReason && !/^[A-Z0-9_]+$/.test(explicitReason)) return explicitReason;
    const ruleMessage=tverDisplayReasonCodeMessage(safe.ruleBasis);
    if(ruleMessage) return ruleMessage;
    return '確認理由を自動判定できません。根拠を確認してください';
  }

  function tverDetailSourceList(entry, side){
    const safe=entry && typeof entry==='object' ? entry : {};
    const candidates=[];
    const direct=safe.sourceRefs && safe.sourceRefs[side];
    const evidence=safe.sourceEvidence && safe.sourceEvidence[side];
    if(Array.isArray(direct)) candidates.push(...direct); else if(direct) candidates.push(direct);
    if(Array.isArray(evidence)) candidates.push(...evidence); else if(evidence) candidates.push(evidence);
    const seen=new Set();
    return candidates.filter(source => {
      if(!source || typeof source!=='object') return false;
      const key=JSON.stringify([source.fileName || '', source.sheetName || '', source.rowNumber ?? '', source.columnName || '', source.rawValue ?? '']);
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function formatTverDetailSource(sideLabel, source){
    if(!source) return `${sideLabel}側の直接確認元はありません`;
    const parts=[];
    parts.push(`ファイル ${source.fileName || '未提供'}`);
    if(source.sheetName) parts.push(`シート ${source.sheetName}`);
    if(source.rowNumber!==null && source.rowNumber!==undefined) parts.push(`行 ${source.rowNumber}`);
    if(source.columnName) parts.push(`列 ${source.columnName}`);
    return `${sideLabel}：${parts.join(' / ')}`;
  }

  // NO005：media／local_broadcaster の詳細は全 ID を列挙せず件数だけを示す。
  // 差分の具体 ID は確認理由（buildTverIdDiffDisplay）に出す。内部監査データは entry 側に残す。
  function tverDetailValueForField(entry, sourceKind){
    const safe=entry && typeof entry==='object' ? entry : {};
    const field=String(safe.field ?? '');
    if(field==='local_broadcaster'){
      // NO005-FIX1：local_broadcaster の表示は NO005 から変更しない（全選択＝ID N件／不要＝空欄／既存文言）。
      if(isTverLocalDisplayHidden(safe)) return '';
      const raw=sourceKind==='setting' ? safe.settingRawValue : safe.csvRawValue;
      const text=String(raw ?? '').trim();
      if(text!=='' && /^[\d\s,]+$/.test(text)){
        const ids=parseTverIdSet(text).ids;
        return ids.length ? 'ID '+ids.length+'件' : '';
      }
      return sourceKind==='setting' ? formatTverHorizontalSettingValue(safe, sourceKind) : text;
    }
    if(field==='media'){
      // NO005-FIX1：詳細の「設定表値」は放送局名・除外局名を出さず、確定済み ID 件数だけを表示する。
      if(sourceKind==='csv'){
        const csvIds=parseTverIdSet(safe.csvRawValue).ids;
        return csvIds.length ? 'ID '+csvIds.length+'件' : '';
      }
      const evaluation=safe.mediaEvaluation && typeof safe.mediaEvaluation==='object' ? safe.mediaEvaluation : null;
      const excludedGroups=Array.isArray(evaluation && evaluation.excludedGroups) ? evaluation.excludedGroups : [];
      if(excludedGroups.length){
        // 除外指定：辞書に実在する除外 ID 数だけを示す（要求選択 ID と混同しない）。
        const excludedIds=tverMediaIdsForGroups(excludedGroups);
        if(excludedIds.length) return '除外ID '+excludedIds.length+'件';
      }
      const expectedIds=Array.isArray(evaluation && evaluation.expectedIds) ? evaluation.expectedIds : [];
      if(expectedIds.length) return 'ID '+expectedIds.length+'件';
      const text=String(safe.settingRawValue ?? '').trim();
      if(text!=='' && /^[\d\s,]+$/.test(text)){
        const ids=parseTverIdSet(text).ids;
        if(ids.length) return 'ID '+ids.length+'件';
      }
      // 期待集合・除外集合を確認できない場合は件数を捏造せず、従来表示と要確認根拠を保持する。
      return formatTverHorizontalSettingValue(safe, sourceKind);
    }
    return formatTverDisplayValue(safe, sourceKind);
  }

  function buildTverHorizontalDetailViewModel(row, entriesRef, options={}){
    const safe=row && typeof row==='object' ? row : {};
    const cells=safe.cells && typeof safe.cells==='object' ? safe.cells : {};
    const entryByIndex=new Map();
    Object.values(cells).forEach(cell => {
      const safeCell=cell && typeof cell==='object' ? cell : {};
      const indexes=Array.isArray(safeCell.entryIndexes) ? safeCell.entryIndexes : [];
      const entries=Array.isArray(safeCell.entries) ? safeCell.entries : [];
      entries.forEach((entry, position) => {
        const index=indexes[position];
        if(Number.isInteger(index) && entry && !entryByIndex.has(index)) entryByIndex.set(index, entry);
      });
    });
    // NO022: 列が生成されないフィールド（設定表・CSVの原値が空欄等で列ごと省略）でも、
    // 実体判定に参加した要確認／不一致の原因を必ず展開できるよう、run.entries を
    // フォールバック参照する（表示列の有無で原因を隠さない）。
    const allEntries=Array.isArray(entriesRef) ? entriesRef : Array.isArray(safe.entriesRef) ? safe.entriesRef : [];
    const indexes=Array.isArray(safe.visibleEntryIndexes) ? safe.visibleEntryIndexes : Array.isArray(safe.entryIndexes) ? safe.entryIndexes : [];
    const details=indexes.map(entryIndex => {
      const cellEntry=entryByIndex.get(entryIndex) || null;
      const entry=cellEntry || allEntries[entryIndex] || null;
      if(!entry) return null;
      if(!cellEntry && entry.hidden) return null; // NO022: フォールバック参照は実体判定と同じく hidden を除外
      if(entry.deferred) return null; // C3-C5-CR-REOPEN-3 FIX B：deferred 字段无判定，不进入确认详情
      const displayStatus=projectTverDisplayStatus(entry.displayStatus || entry.comparisonStatus);
      if(displayStatus==='一致' && !options.includeConsistent) return null;
      const settingSources=tverDetailSourceList(entry, 'setting');
      const csvSources=tverDetailSourceList(entry, 'csv');
      const validationCodes=(Array.isArray(entry.validationIssues) ? entry.validationIssues : []).map(issue => String(issue && issue.code || '')).filter(Boolean);
      return {
        entryIndex,
        field:String(entry.field ?? ''),
        fieldLabel:entry.fieldLabel || buildTverHorizontalFieldLabel(safe.level, entry.field),
        displayStatus,
        comparisonStatus:String(entry.comparisonStatus ?? ''),
        settingRawValue:entry.settingRawValue,
        csvRawValue:entry.csvRawValue,
        mediaEvaluation:entry.mediaEvaluation,
        idDiff:entry.idDiff && typeof entry.idDiff==='object' ? { ...entry.idDiff } : null,
        settingDisplayValue:tverDetailDisplayValue(tverDetailValueForField(entry, 'setting')),
        csvDisplayValue:tverDetailDisplayValue(tverDetailValueForField(entry, 'csv')),
        reason:getTverDisplayReason(entry),
        settingSources:settingSources.length ? settingSources : [null],
        csvSources:csvSources.length ? csvSources : [null],
        settingCanonicalValue:entry.canonicalValues && entry.canonicalValues.setting || '',
        csvCanonicalValue:entry.canonicalValues && entry.canonicalValues.csv || '',
        conservativeReason:String(entry.conservativeReason ?? ''),
        ruleBasis:String(entry.ruleBasis ?? ''),
        evidenceStates:entry.evidenceStates && typeof entry.evidenceStates==='object' ? { ...entry.evidenceStates } : {},
        rowLevelScope:entry.rowLevelScope && typeof entry.rowLevelScope==='object' ? entry.rowLevelScope : null,
        validationCodes,
      };
    }).filter(Boolean);
    if(details.length) return details;
    const projectedEntityStatus=projectTverDisplayStatus(safe.entityDisplayStatus);
    // NO014: 行レベル比較（Group実体ID未確認）の行は、可視フィールドが全て一致でも
    // 行対応の要確認理由を展開できるようにする（理由のない要確認を作らない）。
    // 対象は新設 reason code を持つ行だけに限定し、既存の表示契約に影響させない。
    if(projectedEntityStatus==='要確認'){
      const rowLevelEntry=[...entryByIndex.values()].find(entry => String(entry && entry.reason || '')==='ROW_LEVEL_COMPARISON_CONFIRMED');
      if(rowLevelEntry){
        const fallbackIndex=[...entryByIndex.keys()].find(key => entryByIndex.get(key)===rowLevelEntry);
        const fallbackReason=getTverDisplayReason(rowLevelEntry);
        if(Number.isInteger(fallbackIndex) && fallbackReason){
          return [{
          entryIndex:fallbackIndex, field:'entity', fieldLabel:'Group行対応（行レベル比較）',
          displayStatus:'要確認', comparisonStatus:'需确认',
          settingRawValue:rowLevelEntry.settingRawValue, csvRawValue:rowLevelEntry.csvRawValue,
          settingDisplayValue:'—', csvDisplayValue:'—', reason:fallbackReason,
          settingSources:tverDetailSourceList(rowLevelEntry, 'setting'), csvSources:tverDetailSourceList(rowLevelEntry, 'csv'),
          conservativeReason:String(rowLevelEntry.conservativeReason ?? ''), ruleBasis:String(rowLevelEntry.ruleBasis ?? ''),
          evidenceStates:rowLevelEntry.evidenceStates && typeof rowLevelEntry.evidenceStates==='object' ? { ...rowLevelEntry.evidenceStates } : {},
          validationCodes:[],
        }];
        }
      }
    }
    // NO022: 要確認／不一致の実体に原因記録が1件も見つからない場合、無説明の状態を表示しない。
    // rowLevelScope を持つ行は buildTverHorizontalDetailRowHtml 側の NO015 合成詳細が優先されるため除外。
    if((projectedEntityStatus==='要確認' || projectedEntityStatus==='不一致') && !safe.rowLevelScope){
      if(typeof console!=='undefined' && console.warn) console.warn('[TVER][NO022] REVIEW_REASON_EVIDENCE_INSUFFICIENT rowKey='+String(safe.rowKey ?? '')+' status='+projectedEntityStatus);
      return [{ entryIndex:-1, field:'entity', fieldLabel:'確認理由（表示証拠不足）',
        displayStatus:projectedEntityStatus, comparisonStatus:'',
        settingRawValue:'', csvRawValue:'', settingDisplayValue:'—', csvDisplayValue:'—',
        reason:'実体は「'+projectedEntityStatus+'」と判定されていますが、表示可能な原因記録が見つかりません。表示証拠が不足しています（システムログと出力記録を確認してください）',
        settingSources:[], csvSources:[], conservativeReason:'REVIEW_REASON_EVIDENCE_INSUFFICIENT', ruleBasis:'REVIEW_REASON_EVIDENCE_INSUFFICIENT',
        evidenceStates:{}, rowLevelScope:null, validationCodes:[] }];
    }
    return details;
  }

  // NO022: 詳細内の空欄原値は「（空欄）」と明示する（取得可否の区別は確認理由・根拠で示す）。
  function tverDetailDisplayValue(value){
    return value===null || value===undefined || String(value).trim()==='' ? '（空欄）' : value;
  }

  function tverTechnicalValue(value){
    if(value===null || value===undefined || value==='') return '—';
    if(typeof value==='object'){
      try{ return JSON.stringify(value); }catch(error){ return String(value); }
    }
    return String(value);
  }

  // NO005：根拠パネルも差分 ID だけを出す（期待集合・CSV 全量・放送局名・命中等の一覧は表示しない）。
  // 全量の監査情報は detail.idDiff / detail.mediaEvaluation に保持し、表示だけを差分化する。
  function buildTverMediaBreakdownHtml(detail){
    const safe=detail && typeof detail==='object' ? detail : {};
    const field=String(safe.field ?? '');
    const lines=[];
    const diff=buildTverIdDiffDisplay(safe);
    if(diff.text) lines.push(...diff.lines);
    const evaluation=safe.mediaEvaluation || null;
    if(evaluation && evaluation.status==='需确认' && Array.isArray(evaluation.detailIds) && evaluation.detailIds.length){
      const label=field==='local_broadcaster' ? '確認が必要なローカル局ID' : '確認が必要な媒体ID';
      lines.push(label+'：'+tverSortIdsForDisplay(evaluation.detailIds).join('、'));
    }
    return lines.map(line => `<div class="tver-horizontal-detail-source">${escapeHtml(line)}</div>`).join('');
  }

  function buildTverHorizontalDetailEntryHtml(detail,{navigationLevel}={}){
    const targetAttributes=navigationLevel
      ? ` data-qc-detail-target data-qc-scope="${escapeHtml(navigationLevel)}" data-field-key="${escapeHtml(detail.field)}" data-qc-status="${detail.displayStatus==='要確認' ? 'review' : 'mismatch'}"` : '';
    const status=detail.displayStatus || '要確認';
    const sourceLines=[
      ...detail.settingSources.map(source => formatTverDetailSource('設定表', source)+(detail.conservativeReason==='SETTING_GP_FIELD_CONFLICT' ? ' / 原値 '+String(source.rawValue ?? '') : '')),
      ...detail.csvSources.map(source => formatTverDetailSource('CSV', source)),
    ];
    const sourceHtml=sourceLines.map(line => `<div class="tver-horizontal-detail-source">${escapeHtml(line)}</div>`).join('');
    // NO005：media／local_broadcaster は期待 ID / CSV ID の全量を表示せず、差分 ID だけを出す。
    const showCanonicalSets=detail.field!=='media' && detail.field!=='local_broadcaster';
    const canonicalLines=showCanonicalSets ? [
      detail.settingCanonicalValue ? '期待ID：'+detail.settingCanonicalValue : '',
      detail.csvCanonicalValue ? 'CSV ID：'+detail.csvCanonicalValue : '',
    ].filter(Boolean) : [];
    const canonicalHtml=canonicalLines.map(line => `<div class="tver-horizontal-detail-source">${escapeHtml(line)}</div>`).join('');
    const mediaBreakdownHtml=detail.field==='media' || detail.field==='local_broadcaster' ? buildTverMediaBreakdownHtml(detail) : '';
    const validation=tverTechnicalValue(detail.validationCodes.length ? detail.validationCodes.join(' | ') : '');
    const technical=[
      ['conservativeReason', detail.conservativeReason],
      ['ruleBasis', detail.ruleBasis],
      ['comparisonStatus', detail.comparisonStatus],
      ['displayStatus', status],
      ['evidenceStates', detail.evidenceStates],
      ['validationIssues.code', validation],
    ].map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(tverTechnicalValue(value))}</dd>`).join('');
    const rowLevelScopeHtml=detail.rowLevelScope ? `<div class="tver-horizontal-detail-scope"><span class="tver-horizontal-detail-label">名称範囲 / 行対応</span><span class="tver-horizontal-detail-value">${escapeHtml(String(detail.rowLevelScope.name || ''))} ／ CSV行: ${escapeHtml((detail.rowLevelScope.csvRowNumbers || []).join(', '))} ／ 設定表行: ${escapeHtml((detail.rowLevelScope.settingRowNumbers || []).join(', '))} ／ 行級比較: 設定Group ${escapeHtml(String(detail.rowLevelScope.groupCount ?? ''))}件 ⇔ CSV ${escapeHtml(String((detail.rowLevelScope.csvRowNumbers || []).length))}行（Group実体ID未確認）</span></div>` : '';
    return `<article class="tver-horizontal-detail-entry"${targetAttributes} data-detail-entry-index="${escapeHtml(detail.entryIndex)}"><div class="tver-horizontal-detail-grid"><div><span class="tver-horizontal-detail-label">項目</span><span class="tver-horizontal-detail-value tver-horizontal-detail-field">${escapeHtml(detail.fieldLabel || detail.field)}</span></div><div><span class="tver-horizontal-detail-label">判定</span><span class="tver-horizontal-detail-status ${tverHorizontalStatusClass(status)}">${escapeHtml(status)}</span></div><div><span class="tver-horizontal-detail-label">設定表値</span><span class="tver-horizontal-detail-value">${escapeHtml(detail.settingDisplayValue ?? detail.settingRawValue)}</span></div><div><span class="tver-horizontal-detail-label">CSV値</span><span class="tver-horizontal-detail-value">${escapeHtml(detail.csvDisplayValue ?? detail.csvRawValue)}</span></div></div><div class="tver-horizontal-detail-reason"><span class="tver-horizontal-detail-label">確認理由</span><span class="tver-horizontal-detail-value">${escapeHtml(detail.reason)}</span></div>${rowLevelScopeHtml}<div class="tver-horizontal-detail-actions"><button class="tver-horizontal-detail-action" type="button" data-action="toggle-detail-evidence" data-detail-entry-index="${escapeHtml(detail.entryIndex)}" aria-expanded="false">根拠を表示</button><div class="tver-horizontal-detail-sources hidden" hidden data-detail-evidence>${sourceHtml}${canonicalHtml}${mediaBreakdownHtml}</div><details class="tver-horizontal-detail-technical"><summary>技術情報</summary><dl>${technical}</dl></details></div></article>`;
  }

  // NO022: 実体バッジの原因概要（単一原因=項目ラベル、複数原因=N項目）。
  const TVER_ENTITY_BADGE_FIELD_LABELS=Object.freeze({ url:'遷移先URL' });
  function buildTverBadgeFieldLabel(detail, level){
    const field=String(detail && detail.field || '');
    if(field && TVER_ENTITY_BADGE_FIELD_LABELS[field]) return TVER_ENTITY_BADGE_FIELD_LABELS[field];
    const mapped=field ? resolveTverHorizontalFieldLabel(level, field) : '';
    if(mapped && mapped!==field) return mapped;
    return String(detail && detail.fieldLabel || '') || field || '項目';
  }
  function buildTverEntityBadgeLabel(row, entityStatus, entriesRef){
    if(entityStatus!=='要確認' && entityStatus!=='不一致') return entityStatus;
    const details=buildTverHorizontalDetailViewModel(row, entriesRef) || [];
    const target=details.filter(detail => detail && detail.displayStatus===entityStatus);
    if(!target.length) return entityStatus;
    if(target.length===1){
      const single=target[0];
      if(single.field==='entity' && single.conservativeReason==='REVIEW_REASON_EVIDENCE_INSUFFICIENT') return entityStatus;
      return `${entityStatus}（${buildTverBadgeFieldLabel(single, String(row && row.level || ''))}）`;
    }
    return `${entityStatus}（${target.length}項目）`;
  }

  // NO031：比較結果の既定表示は「状態・件数・項目名」の要約だけにし、長い理由は詳細クリックで展開する。
  function buildTverResultSummaryHtml(details, entityStatus){
    const mismatch=details.filter(detail => detail.displayStatus==='不一致');
    const review=details.filter(detail => detail.displayStatus==='要確認');
    const counts=[];
    if(mismatch.length) counts.push('<span class="tver-result-compact-count tver-result-compact-count-mismatch">不一致 '+mismatch.length+'項目</span>');
    if(review.length) counts.push('<span class="tver-result-compact-count tver-result-compact-count-review">要確認 '+review.length+'項目</span>');
    const labels=items => [...new Set(items.map(item => String(item.fieldLabel || item.field || '').trim()).filter(Boolean))];
    const red=labels(mismatch), yellow=labels(review);
    const redSlots=Math.min(red.length, Math.max(2, 4-yellow.length));
    const yellowSlots=4-redSlots;
    const groups=[];
    if(red.length) groups.push('不一致：'+red.slice(0,redSlots).join(' / '));
    if(yellow.length) groups.push('要確認：'+yellow.slice(0,yellowSlots).join(' / '));
    const rest=red.length-redSlots+Math.max(0,yellow.length-yellowSlots);
    const fieldText=groups.join(' ｜ ')+(rest ? ' / ほか'+rest+'項目' : '');
    return '<button type="button" class="tver-result-compact" data-action="toggle-result-detail" aria-expanded="false" data-entity-status="'+escapeHtml(entityStatus)+'">'
      +'<span class="tver-result-compact-head">'+counts.join('')+'<span class="tver-result-compact-hint">詳細</span></span>'
      +'<span class="tver-result-compact-fields">'+escapeHtml(fieldText)+'</span></button>';
  }

  function buildTverHorizontalDetailRowHtml(row, columns, entriesRef){
    let details=buildTverHorizontalDetailViewModel(row, entriesRef);
    // NO015: 行レベル対応済みの CSV 名称範囲は、展開で 名称範囲/対応行/実体未確認理由 を表示する。
    // この合成詳細は rowLevelScope を持つ（= NO014 行レベル計画が成立した）ノードだけに作用する。
    if(!details.length && row && row.rowLevelScope && projectTverDisplayStatus(row.entityDisplayStatus)!=='一致'){
      const scope=row.rowLevelScope;
      details=[{ entryIndex:-1, field:'entity', fieldLabel:'CSV名称範囲（行対応済・Group実体未確認）',
        displayStatus:'要確認', comparisonStatus:'需确认',
        settingRawValue:'', csvRawValue:String(scope.name || ''), settingDisplayValue:'—', csvDisplayValue:String(scope.name || ''),
        reason:'CSV名称範囲は行単位で対応済みです。Group実体IDは未確認です。名称範囲・対応CSV行・対応設定表行を確認してください',
        settingSources:[], csvSources:[], conservativeReason:'ROW_LEVEL_SCOPE_ENTITY_UNCONFIRMED', ruleBasis:'ROW_LEVEL_SCOPE_ENTITY_UNCONFIRMED',
        evidenceStates:{}, rowLevelScope:scope, validationCodes:[] }];
    }
    if(!details.length) return '';
    const columnCount=5 + (Array.isArray(columns) ? columns.length : 0);
    const entriesHtml=details.map(buildTverHorizontalDetailEntryHtml).join('');
    return `<tr class="tver-horizontal-detail-row hidden" hidden data-detail-row-key="${escapeHtml(row && row.rowKey)}"><td colspan="${columnCount}"><div class="tver-horizontal-detail">${entriesHtml}</div></td></tr>`;
  }

  function setTverHorizontalDetailExpanded(panel, control){
    if(!panel || !control || typeof panel.querySelectorAll!=='function' || typeof control.getAttribute!=='function') return false;
    const rowKey=control.getAttribute('data-row-key');
    const rows=[...panel.querySelectorAll('.tver-horizontal-detail-row[data-detail-row-key]')];
    const detailRow=rows.find(row => row && row.getAttribute && row.getAttribute('data-detail-row-key')===rowKey);
    if(!detailRow) return false;
    const isExpanded=detailRow.hidden===false && !(detailRow.classList && typeof detailRow.classList.contains==='function' && detailRow.classList.contains('hidden'));
    const next=!isExpanded;
    rows.forEach(row => {
      const expanded=next && row===detailRow;
      row.hidden=!expanded;
      row.classList && row.classList.toggle && row.classList.toggle('hidden', !expanded);
    });
    const controls=[...panel.querySelectorAll('[data-action="toggle-detail"]')];
    controls.forEach(item => {
      const same=item && item.getAttribute && item.getAttribute('data-row-key')===rowKey;
      item.setAttribute && item.setAttribute('aria-expanded', String(next && same));
    });
    return next;
  }

  function setTverHorizontalEvidenceExpanded(panel, control){
    if(!panel || !control) return false;
    const detailEntry=typeof control.closest==='function' ? control.closest('.tver-horizontal-detail-entry') : null;
    const sourcePanel=detailEntry && typeof detailEntry.querySelector==='function' ? detailEntry.querySelector('[data-detail-evidence]') : null;
    if(!sourcePanel) return false;
    const next=sourcePanel.hidden!==false;
    sourcePanel.hidden=!next;
    sourcePanel.classList && sourcePanel.classList.toggle && sourcePanel.classList.toggle('hidden', !next);
    control.setAttribute && control.setAttribute('aria-expanded', String(next));
    return next;
  }

  function tverHorizontalLevelId(level){
    return String(level || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'level';
  }

  function buildTverLevelTabsHtml(activeLevel){
    const current=TVER_HORIZONTAL_LEVELS.includes(activeLevel) ? activeLevel : 'Campaign';

      return `<button class="tver-level-tab" type="button" role="tab" data-action="switch-level" data-level="${escapeHtml(level)}" aria-selected="${String(selected)}" aria-controls="tver-horizontal-panel-${escapeHtml(tverHorizontalLevelId(level))}" tabindex="${selected ? '0' : '-1'}">${escapeHtml(level)}</button>`;
    }).join('');

  function resolveTverHorizontalWidths(level, columns, storage){
    const resolved={
      no:getTverColumnWidth(level, 'no', storage),
      target:getTverColumnWidth(level, 'target', storage),
      name:getTverColumnWidth(level, 'name', storage),
      comparison:getTverColumnWidth(level, 'comparison', storage),
      fields:{},
    };
    (Array.isArray(columns) ? columns : []).forEach(column => {
      const key=String(column && column.key || '');
      if(key) resolved.fields[key]=getTverColumnWidth(level, key, storage);
    });
    resolved.fixed=resolved.no + resolved.target + resolved.name + resolved.comparison;
    return resolved;
  }

  function tverResolvedColumnWidth(level, columnKey, storage, resolvedWidths){
    const key=String(columnKey || '');
    if(key===TVER_HORIZONTAL_SOURCE_COLUMN_KEY) return TVER_HORIZONTAL_SOURCE_COLUMN_WIDTH;
    if(resolvedWidths){
      if(key==='no' || key==='target' || key==='name' || key==='comparison') return Number(resolvedWidths[key]);
      if(resolvedWidths.fields && Object.prototype.hasOwnProperty.call(resolvedWidths.fields, key)) return Number(resolvedWidths.fields[key]);
    }
    return getTverColumnWidth(level, key, storage);
  }

  function buildTverColumnWidthStyle(level, columnKey, storage, resolvedWidths){
