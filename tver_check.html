        if(inputArrayConstructor) break;
      }
      inputArrayConstructor=inputArrayConstructor || settingModel.adGroups.constructor;
      if(typeof inputArrayConstructor==='function'){
        const nativeEntries=new inputArrayConstructor();
        run.entries.forEach(entry => nativeEntries.push(entry));
        run.entries=nativeEntries;
      }
    }
    run.entries.forEach((entry, index) => Object.assign(entry, { level:inputs[index].level, entityKey:inputs[index].entityKey || null, csvEntityKey:inputs[index].csvEntityKey || null, targetName:inputs[index].targetName, reason:inputs[index].reason || entry.conservativeReason || '', idExpandedValue:inputs[index].idExpandedValue || '' }));
    run.schemaKind=parsedCsv.schema.kind;
    run.businessRole=parsedCsv.schema.kind==='register-without-ids'
      ? '登録CSV：入稿内容の整合性チェックです。\n管理画面に正しく登録済みであることを証明するものではありません。'
      : '編集CSV：ダウンロード時点の管理画面の現在状態と比較しています。';
    run.settingCounts={ Campaign:(settingModel.campaigns || []).length, 'Ad Group':(settingModel.adGroups || []).length, Ad:(settingModel.ads || []).length };
    run.csvCounts={ Campaign:(csvTree.campaigns || []).length, 'Ad Group':(csvTree.adGroups || []).length, Ad:(csvTree.ads || []).length };
    run.matching=matching;
    run.diagnostics=[...(settingModel.diagnostics || []), ...(parsedCsv.parseIssues || []), ...(matching.diagnostics || [])];
    const schemaNotices=buildTverA173EditSchemaNotices(settingModel, csvTree, matching, parsedCsv.schema.kind);
    let noticeArrayConstructor=null;
    for(const candidate of settingModel && settingModel.adGroups || []){
      const candidateFields=candidate && candidate.sourceEvidence && candidate.sourceEvidence.fields || {};
      for(const value of Object.values(candidateFields)){
        if(Array.isArray(value)){ noticeArrayConstructor=value.constructor; break; }
      }
      if(noticeArrayConstructor) break;
    }
    noticeArrayConstructor=noticeArrayConstructor || (settingModel && Array.isArray(settingModel.adGroups) && settingModel.adGroups.constructor);
    if(typeof noticeArrayConstructor==='function'){
      run.schemaNotices=new noticeArrayConstructor();
    }else{
      run.schemaNotices=[];
    }
    schemaNotices.forEach(notice => run.schemaNotices.push(notice));
    run.displayTree=buildTverDisplayTree({ settingModel, csvTree, matching, entries:run.entries });
    return run;
  }

  // A18-1A：只读展示树。只消费既有实体、matching 与 comparison entries，
  // 不重新匹配、不从名称或 entityKey 字符串推断父级，也不复制 entry/evidence。
  function buildTverDisplayTree(input){
    const config=input || {};
    const settingModel=config.settingModel || {};
    const csvTree=config.csvTree || {};
    const matching=config.matching || {};
    const entries=Array.isArray(config.entries) ? config.entries : [];
    const settingEntities=[...(settingModel.campaigns || []), ...(settingModel.adGroups || []), ...(settingModel.ads || [])];
    const csvEntities=[
      ...(csvTree.campaigns || []), ...(csvTree.adGroups || []), ...(csvTree.ads || []),
      ...(Array.isArray(csvTree.orphans) ? csvTree.orphans : []),
      ...(Array.isArray(matching.orphans) ? matching.orphans : []),
    ].filter((entity, index, all) => entity && entity.key && all.findIndex(candidate => candidate && candidate.key===entity.key)===index);
    const settingByKey=new Map(settingEntities.filter(entity => entity && entity.key).map(entity => [entity.key, entity]));
    const csvByKey=new Map(csvEntities.filter(entity => entity && entity.key).map(entity => [entity.key, entity]));
    const settingMatchByKey=new Map((matching.matches || []).filter(match => match && match.settingKey).map(match => [match.settingKey, match]));
    const csvStateByKey=new Map();
    (matching.unmatched && matching.unmatched.csv || []).forEach(entity => { if(entity && entity.key) csvStateByKey.set(entity.key, 'unmatched'); });
    (matching.unassigned && matching.unassigned.csv || []).forEach(entity => { if(entity && entity.key) csvStateByKey.set(entity.key, 'ambiguous'); });
    (matching.orphans || []).forEach(entity => { if(entity && entity.key) csvStateByKey.set(entity.key, 'orphan'); });

    const nodes=[];
    const settingNodeByKey=new Map();
    const csvNodeByKey=new Map();
    const nodeMeta=new Map();

    const emptyCounts=() => Object.fromEntries(COMPARISON_STATUSES.map(status => [status, 0]));
    const usableDisplayName=entity => {
      if(!entity) return '';
      const name=entityTargetName(entity);
      return name && name!=='未特定' ? String(name) : '';
    };
    const displayNameFor= (setting, csv) => usableDisplayName(setting) || usableDisplayName(csv) || '未特定';
    const makeNodeKey=(setting, csv, entryIndex) => {
      if(entryIndex!==undefined) return `entry:${entryIndex}`;
      if(setting && csv) return `match:${setting.key}::${csv.key}`;
      if(setting) return `setting:${setting.key}`;
      return `csv:${csv.key}`;
    };
    const makeNode=(setting, csv, matchState, entryIndex) => {
      const level=setting && setting.level || csv && csv.level || 'Unknown';
      const displayName=entryIndex===undefined
        ? displayNameFor(setting, csv)
        : String(entries[entryIndex] && (entries[entryIndex].targetName || entries[entryIndex].field) || '未特定');
      const node={
        nodeKey:makeNodeKey(setting, csv, entryIndex),
        level,
        entityKey:setting && setting.key || null,
        csvEntityKey:csv && csv.key || null,
        parentEntityKey:null,
        displayName,
        displayLabel:entryIndex===undefined ? buildTverDisplayLabel(level, setting, csv, displayName) : displayName,
        matchState:matchState || 'unmatched',
        entryIndexes:[],
        directStatusCounts:emptyCounts(),
        subtreeStatusCounts:emptyCounts(),
        children:[],
      };
      if(level==='Ad Group') node.adParentContextLabel=entryIndex===undefined ? buildTverAdParentContextLabel(setting, csv) : displayName;
      nodes.push(node);
      nodeMeta.set(node, { setting, csv, hasExplicitParent:false, rootEligible:false });
      if(setting && setting.key && !settingNodeByKey.has(setting.key)) settingNodeByKey.set(setting.key, node);
      if(csv && csv.key && !csvNodeByKey.has(csv.key)) csvNodeByKey.set(csv.key, node);
      return node;
    };

    settingEntities.forEach(setting => {
      if(!setting || !setting.key || settingNodeByKey.has(setting.key)) return;
      const match=settingMatchByKey.get(setting.key);
      const csv=match && match.status==='matched' && match.csvKey ? csvByKey.get(match.csvKey) : null;
      makeNode(setting, csv, match && match.status || 'unmatched');
    });
    csvEntities.forEach(csv => {
      if(!csv || !csv.key || csvNodeByKey.has(csv.key)) return;
      makeNode(null, csv, csvStateByKey.get(csv.key) || 'unmatched');
    });

    const parentLevel={ 'Ad Group':'Campaign', Ad:'Ad Group' };
    const parentByNode=new Map();
    const rootEligibleByNode=new Map();
    nodes.forEach(node => {
      const meta=nodeMeta.get(node);
      const refs=[];
      if(meta.setting && meta.setting.parentKey!==null && meta.setting.parentKey!==undefined && meta.setting.parentKey!=='') refs.push({ side:'setting', key:meta.setting.parentKey, node:settingNodeByKey.get(meta.setting.parentKey) });
      if(meta.csv && meta.csv.parentKey!==null && meta.csv.parentKey!==undefined && meta.csv.parentKey!=='') refs.push({ side:'csv', key:meta.csv.parentKey, node:csvNodeByKey.get(meta.csv.parentKey) });
      meta.hasExplicitParent=refs.length>0;
      meta.rootEligible=!meta.hasExplicitParent && node.level==='Campaign';
      if(!refs.length){ parentByNode.set(node, null); rootEligibleByNode.set(node, meta.rootEligible); return; }
      const parentNodes=refs.map(ref => ref.node);
      const sameParent=parentNodes.every(parent => parent && parent===parentNodes[0]);
      const expectedParentLevel=parentLevel[node.level];
      const valid=sameParent && (!expectedParentLevel || parentNodes[0].level===expectedParentLevel) && parentNodes[0]!==node;
      if(valid){
        parentByNode.set(node, parentNodes[0]);
        node.parentEntityKey=refs.find(ref => ref.side==='setting') && refs.find(ref => ref.side==='setting').key || refs[0].key;
      }else{
        parentByNode.set(node, null);
        node.parentEntityKey=null;
      }
      rootEligibleByNode.set(node, false);
    });

    const cycleNodes=new Set();
    nodes.forEach(start => {
      const path=[];
      const seen=new Map();
      let current=start;
      while(current && parentByNode.get(current)){
        if(seen.has(current)){
          path.slice(seen.get(current)).forEach(node => cycleNodes.add(node));
          break;
        }
        seen.set(current, path.length);
        path.push(current);
        current=parentByNode.get(current);
      }
    });
    cycleNodes.forEach(node => { parentByNode.set(node, null); node.parentEntityKey=null; });

    const nodeForEntry=entry => {
      const settingNode=entry && entry.entityKey ? settingNodeByKey.get(entry.entityKey) : null;
      const csvNode=entry && entry.csvEntityKey ? csvNodeByKey.get(entry.csvEntityKey) : null;
      if(settingNode && csvNode && settingNode!==csvNode) return null;
      return settingNode || csvNode || null;
    };
    entries.forEach((entry, index) => {
      let node=nodeForEntry(entry);
      if(!node) node=makeNode(null, null, 'unattached', index);
      if(node.entryIndexes.includes(index)) return;
      node.entryIndexes.push(index);
      const status=entry && (entry.displayStatus || entry.comparisonStatus);
      if(Object.prototype.hasOwnProperty.call(node.directStatusCounts, status)) node.directStatusCounts[status]+=1;
    });

    const roots=[];
    const unattached=[];
    nodes.forEach(node => {
      const parent=parentByNode.get(node);
      if(parent){ parent.children.push(node); return; }
      if(rootEligibleByNode.get(node)) roots.push(node); else unattached.push(node);
    });

    const addCounts=(target, source) => COMPARISON_STATUSES.forEach(status => { target[status]+=source[status] || 0; });
    const aggregate=(node, visiting=new Set()) => {
      if(visiting.has(node)) return { ...node.directStatusCounts };
      const next=new Set(visiting); next.add(node);
      const total={ ...node.directStatusCounts };
      node.children.forEach(child => addCounts(total, aggregate(child, next)));
      node.subtreeStatusCounts=total;
      return total;
    };
    [...roots, ...unattached].forEach(node => aggregate(node));
    return { roots, unattached };
  }

  // A18-3A：横向结果表的只读展示投影。仅消费既有displayTree与entries，
  // 不改变业务对象、树结构、entryIndexes或任何比较结果。
  const TVER_HORIZONTAL_FIELD_ORDER={
    Campaign:['campaign_name', 'start_datetime', 'end_datetime', 'budget', 'daily_budget', 'budget_type', 'hourly_bid_weight', 'campaign_status', 'consumption_type', 'cv_point'],
    'Ad Group':['device', 'price', 'adgroup_start_datetime', 'adgroup_end_datetime', 'adgroup_status', 'media', 'local_broadcaster', 'gender', 'age', 'annual_income', 'demography', 'tver_video_duration', 'dmp_segment', 'pref', 'subgenre_exclude', 'store_segment', 'bid_segment'],
    // C3-C5-CR-REOPEN-3 FIX C/D：creative_id 保留在固定顺序中（无 entry 即不显示列）；
    // start_time/end_time 为 FIX D 新增（CSV 有值才显示）。
    Ad:['creative_name', 'url', 'tracking_url_start', 'tracking_url_first_quartile', 'tracking_url_midpoint', 'tracking_url_third_quartile', 'tracking_url_complete', 'creative_id', 'start_time', 'end_time'],
  };
  const TVER_HORIZONTAL_FIELD_LABELS={
    Campaign:{ campaign_name:'キャンペーン名', start_datetime:'開始日時', end_datetime:'終了日時', budget:'予算', daily_budget:'日予算', budget_type:'予算タイプ', hourly_bid_weight:'時間毎予算割合', campaign_status:'キャンペーンステータス', consumption_type:'予算消化タイプ', cv_point:'CVポイント', report_target_flag:'レポート対象' },
    'Ad Group':{ device:'デバイス', price:'単価', adgroup_start_datetime:'GP開始日時', adgroup_end_datetime:'GP終了日時', adgroup_status:'ステータス', media:'媒体', local_broadcaster:'ローカル局', gender:'性別', age:'年齢', annual_income:'世帯年収', demography:'デモグラフィック', tver_video_duration:'動画尺', dmp_segment:'DMPセグメント', pref:'都道府県', subgenre_exclude:'サブジャンル除外', store_segment:'店舗セグメント', bid_segment:'入札セグメント', auction_type:'オークション設定', dmp_segment_expansion_threshold:'DMPセグメントの拡張', uid_suffix:'ASR' },
    Ad:{ creative_name:'クリエイティブ名', start_time:'開始時間', end_time:'終了時間' },
  };
  // FIX1C：既存の正式な英文表示名。field keyからの推測翻訳は行わない。
  const TVER_HORIZONTAL_FIELD_EN_LABELS={
    Ad:{ url:'URL', tracking_url_start:'Tracking Start', tracking_url_first_quartile:'Tracking 25%', tracking_url_midpoint:'Tracking 50%', tracking_url_third_quartile:'Tracking 75%', tracking_url_complete:'Tracking Complete', creative_id:'Creative ID' },
  };
  const TVER_HORIZONTAL_SOURCE_COLUMN_KEY='source';
  const TVER_HORIZONTAL_SOURCE_COLUMN_WIDTH=96;
  const TVER_COLUMN_WIDTH_STORAGE_KEY='tver-horizontal-column-widths-v1';
  const TVER_COLUMN_DEFAULT_WIDTHS={ no:56, target:280, comparison:160, field:160 };
  const TVER_COLUMN_WIDTH_LIMITS={ no:{ min:56, max:56 }, target:{ min:160, max:560 }, comparison:{ min:120, max:240 }, field:{ min:120, max:560 } };

  function getTverColumnStorage(storage){
    if(storage!==undefined) return storage;
    try{ return typeof window!=='undefined' && window.localStorage ? window.localStorage : null; }catch(error){ return null; }
  }

  function tverColumnWidthKind(columnKey){
    return columnKey==='no' ? 'no' : columnKey==='target' ? 'target' : columnKey==='comparison' ? 'comparison' : 'field';
  }

  function clampTverColumnWidth(columnKey, width){
    const kind=tverColumnWidthKind(columnKey);
    const limits=TVER_COLUMN_WIDTH_LIMITS[kind];
    const value=Number(width);
    const fallback=TVER_COLUMN_DEFAULT_WIDTHS[kind];
    const safe=Number.isFinite(value) ? value : fallback;
    return Math.round(Math.min(limits.max, Math.max(limits.min, safe)));
  }

  function readTverColumnWidthPreferences(storage){
    const source=getTverColumnStorage(storage);
    if(!source || typeof source.getItem!=='function') return {};
    try{
      const parsed=JSON.parse(source.getItem(TVER_COLUMN_WIDTH_STORAGE_KEY) || '{}');
      return parsed && typeof parsed==='object' && !Array.isArray(parsed) ? parsed : {};
    }catch(error){ return {}; }
  }

  function getTverColumnWidth(level, columnKey, storage){
    const key=String(columnKey || '');
    if(key==='parent') return TVER_COLUMN_DEFAULT_WIDTHS.field;
    const kind=tverColumnWidthKind(key);
    if(kind==='no') return TVER_COLUMN_DEFAULT_WIDTHS.no;
    const preferences=readTverColumnWidthPreferences(storage);
    const levelPreferences=preferences && preferences[String(level)] && typeof preferences[String(level)]==='object' ? preferences[String(level)] : {};
    return clampTverColumnWidth(key, levelPreferences[key] ?? TVER_COLUMN_DEFAULT_WIDTHS[kind]);
  }

  function setTverColumnWidth(level, columnKey, width, storage){
    const key=String(columnKey || '');
    if(key==='parent') return TVER_COLUMN_DEFAULT_WIDTHS.field;
    const next=clampTverColumnWidth(key, width);
    if(tverColumnWidthKind(key)==='no') return next;
    const source=getTverColumnStorage(storage);
    if(!source || typeof source.setItem!=='function') return next;
    try{
      const preferences=readTverColumnWidthPreferences(source);
      const levelKey=String(level || 'Campaign');
      const levelPreferences=preferences[levelKey] && typeof preferences[levelKey]==='object' && !Array.isArray(preferences[levelKey]) ? { ...preferences[levelKey] } : {};
      levelPreferences[key]=next;
      preferences[levelKey]=levelPreferences;
      source.setItem(TVER_COLUMN_WIDTH_STORAGE_KEY, JSON.stringify(preferences));
    }catch(error){ /* localStorage不可用でもUI幅の変更は継続する */ }
    return next;
  }

  function resetTverColumnWidths(storage){
    const source=getTverColumnStorage(storage);
    if(source && typeof source.removeItem==='function'){
      try{ source.removeItem(TVER_COLUMN_WIDTH_STORAGE_KEY); }catch(error){ /* localStorage不可用 */ }
    }
  }

  function resolveTverHorizontalFieldLabel(level, field){
    const key=String(field ?? '');
    const jaLabels=TVER_HORIZONTAL_FIELD_LABELS[level];
    const jaLabel=jaLabels && jaLabels[key];
    if(typeof jaLabel==='string' && jaLabel.trim()!=='') return jaLabel;
    const enLabels=TVER_HORIZONTAL_FIELD_EN_LABELS[level];
    const enLabel=enLabels && enLabels[key];
    if(typeof enLabel==='string' && enLabel.trim()!=='') return enLabel;
    return key;
  }

  function buildTverHorizontalFieldLabel(level, field){
    return resolveTverHorizontalFieldLabel(level, field);
  }

  function buildTverHorizontalNodeLabel(node){
    if(!node) return '未特定';
    const label=node.displayLabel ?? node.displayName;
    return String(label ?? '') || '未特定';
  }

  function collectTverDisplayNodesByLevel(displayTree, level){
    const tree=displayTree && typeof displayTree==='object' ? displayTree : {};
    const roots=Array.isArray(tree.roots) ? tree.roots : [];
    const unattached=Array.isArray(tree.unattached) ? tree.unattached : [];
    const result=[];
    const contextLabel=node => level==='Ad' && node && node.level==='Ad Group' && node.adParentContextLabel!==undefined
      ? node.adParentContextLabel : buildTverHorizontalNodeLabel(node);

    const walk=(node, parent, parentPath, isUnattachedRoot) => {
      if(!node || typeof node!=='object') return;
      const nodeKey=String(node.nodeKey ?? node.entityKey ?? '');
      const nodeLevel=String(node.level ?? '');
      const displayLabel=contextLabel(node);
      const path=Array.isArray(parentPath) ? parentPath.map(item => ({ ...item })) : [];
      if(nodeLevel===level){
        const parentNodeKey=parent ? String(parent.nodeKey ?? parent.entityKey ?? '') : null;
        const rowKey=JSON.stringify([isUnattachedRoot && !parent ? 'unattached' : 'tree', nodeLevel, ...path.map(item => item.nodeKey), nodeKey]);
        result.push({
          node,
          level:nodeLevel,
          nodeKey,
          entityKey:node.entityKey ?? null,
          displayLabel,
          parentNodeKey,
          parentDisplayLabel:parent ? contextLabel(parent) : (isUnattachedRoot ? '未接続' : ''),
          parentPath:path,
          rowKey,
          isUnattached:Boolean(isUnattachedRoot && !parent),
          entryIndexes:Array.isArray(node.entryIndexes) ? [...node.entryIndexes] : [],
        });
      }
      const nextPath=[...path, { nodeKey, level:nodeLevel, displayLabel }];
      const children=Array.isArray(node.children) ? node.children : [];
      children.forEach(child => walk(child, node, nextPath, false));
    };

    roots.forEach(node => walk(node, null, [], false));
    unattached.forEach(node => walk(node, null, [], true));
    return result;
  }

  function tverHorizontalRawValuePresent(value){
    return value!==null && value!==undefined && String(value).trim()!=='';
  }

  function buildTverHorizontalColumns(run, level){
    const safeRun=run && typeof run==='object' ? run : {};
    const entries=Array.isArray(safeRun.entries) ? safeRun.entries : [];
    const nodes=collectTverDisplayNodesByLevel(safeRun.displayTree, level);
    const fixedFields=Array.isArray(TVER_HORIZONTAL_FIELD_ORDER[level]) ? TVER_HORIZONTAL_FIELD_ORDER[level] : [];
    const fixedSet=new Set(fixedFields);
    const discoveredFields=[];
    const fieldHasMeaningfulValue=new Map();

    nodes.forEach(node => {
      node.entryIndexes.forEach(entryIndex => {
        if(!Number.isInteger(entryIndex) || entryIndex<0 || entryIndex>=entries.length) return;
        const entry=entries[entryIndex];
        if(!entry || entry.hidden || entry.level!==level) return;
        const field=String(entry.field ?? '');
        if(!field) return;
        if(level==='Campaign' && field==='report_target_flag') return;
        if(!fieldHasMeaningfulValue.has(field)){
          fieldHasMeaningfulValue.set(field, false);
          if(!fixedSet.has(field)) discoveredFields.push(field);
        }
        const keepBlankVisible=!(level==='Campaign' && field==='hourly_bid_weight');
        if((keepBlankVisible && entry.alwaysDisplay) || tverHorizontalRawValuePresent(entry.settingRawValue) || tverHorizontalRawValuePresent(entry.csvRawValue)) fieldHasMeaningfulValue.set(field, true);
      });
    });

    return [...fixedFields, ...discoveredFields]
      .filter(field => fieldHasMeaningfulValue.get(field)===true)
      .map(field => ({ key:field, label:buildTverHorizontalFieldLabel(level, field) }));
  }

  function buildTverHorizontalViewModel(run, level, filters){
    const safeRun=run && typeof run==='object' ? run : {};
    const entries=Array.isArray(safeRun.entries) ? safeRun.entries : [];
    const columns=buildTverHorizontalColumns(safeRun, level);
    const columnByKey=new Map(columns.map(column => [column.key, column]));
    const criteria=buildTverEntryFilterCriteria({ ...(filters || {}), level });
    const rows=[];

    collectTverDisplayNodesByLevel(safeRun.displayTree, level).forEach(nodeView => {
      const visibleEntryIndexes=nodeView.entryIndexes.filter(entryIndex => {
        if(!Number.isInteger(entryIndex) || entryIndex<0 || entryIndex>=entries.length) return false;
        const entry=entries[entryIndex];
        return Boolean(entry && entry.level===level && matchesTverDisplayEntryFilters(entry, criteria));
      });
      if(!visibleEntryIndexes.length) return;
      const entityEntries=nodeView.entryIndexes
        .map(entryIndex => Number.isInteger(entryIndex) ? entries[entryIndex] : null)
        .filter(entry => entry && !entry.hidden && entry.level===level);

      const cells={};
      columns.forEach(column => {
        cells[column.key]={ field:column.key, label:column.label, entryIndexes:[], entries:[] };
      });
      visibleEntryIndexes.forEach(entryIndex => {
        const entry=entries[entryIndex];
        const field=String(entry.field ?? '');
        const cell=columnByKey.get(field) && cells[field];
        if(!cell) return;
        cell.entryIndexes.push(entryIndex);
        cell.entries.push(entry);
      });

      rows.push({
        rowKey:nodeView.rowKey,
        level:nodeView.level,
        nodeKey:nodeView.nodeKey,
        entityKey:nodeView.entityKey,
        displayLabel:nodeView.displayLabel,
        parentNodeKey:nodeView.parentNodeKey,
        parentDisplayLabel:nodeView.parentDisplayLabel,
        parentPath:nodeView.parentPath.map(item => ({ ...item })),
        isUnattached:nodeView.isUnattached,
        entityDisplayStatus:projectTverEntityDisplayStatus(entityEntries),
        directStatusCounts:{ ...(nodeView.node && nodeView.node.directStatusCounts || {}) },
        entryIndexes:[...nodeView.entryIndexes],
        visibleEntryIndexes:[...visibleEntryIndexes],
        cells,
      });
    });

    return { level, columns, rows };
  }

  function tverHorizontalStatusClass(status){
    const projected=projectTverDisplayStatus(status);
    return projected==='一致' ? 'tver-status-consistent' : projected==='不一致' ? 'tver-status-mismatch' : projected==='要確認' ? 'tver-status-review' : '';
  }

  function tverHorizontalCellStatusClass(cell){
    const entries=cell && Array.isArray(cell.entries) ? cell.entries : [];
    if(!entries.length) return '';
    // C3-C5-CR-REOPEN-3 FIX B：仅由 deferred 字段构成的单元格无判定状态色。
    if(entries.every(entry => entry && entry.deferred)) return '';
    return tverHorizontalStatusClass(projectTverEntityDisplayStatus(entries));
  }

  function tverHorizontalCellClass(cell){
    const statusClass=tverHorizontalCellStatusClass(cell);
    return `tver-horizontal-field-col tver-horizontal-cell-toggle${statusClass ? ` ${statusClass}` : ''}`;
  }

  function formatTverHorizontalSettingValue(entry, sourceKind){
    const raw=entry && entry.settingRawValue;
    if(sourceKind!=='setting') return raw;
    const field=String(entry && entry.field || '');
    const value=String(raw ?? '').trim();
    if(field==='campaign_status') return value==='0' ? '無効（規定値）' : value==='1' ? '有効' : raw;
    if(field==='consumption_type') return value==='1' ? 'フラット' : value==='2' ? 'フル' : raw;
    if(field==='cv_point' && value==='' && String(entry && entry.ruleBasis || '')==='TVER_CAMPAIGN_CV_NONE_FROM_SETTING') return 'なし';
    if(field==='report_target_flag') return value==='0' ? '対象外' : value==='1' ? '対象' : raw;
    if(field==='budget_type') return value==='1' ? '月次予算' : value==='2' ? '期間予算' : raw;
    return raw;
  }

  // C3-C4-UI-FIX1B：仅在最终显示层把已确认的CSV code增强为「raw（label）」。
  // 比较输入、canonicalValue、comparisonStatus及原始entry均保持不变。
  const TVER_CSV_DISPLAY_CODE_LABELS=Object.freeze({
    budget_type:Object.freeze({ '1':'月次予算', '2':'期間予算' }),
    campaign_status:Object.freeze({ '0':'無効', '1':'有効' }),
    adgroup_status:Object.freeze({ '0':'初動OFF', '1':'通常' }),
    auction_type:Object.freeze({ '1':'固定単価', '2':'オークション' }),
    consumption_type:Object.freeze({ '1':'フラット', '2':'フル' }),
    report_target_flag:Object.freeze({ '0':'レポート対象に含めない', '1':'レポート対象に含める' }),
    annual_income:Object.freeze({ '6':'600万円以上', '8':'800万円以上', '10':'1000万円以上' }),
    demography:Object.freeze({ '1':'子あり' }),
    gender:Object.freeze({ '1':'男性', '2':'女性', '3':'その他' }),
  });

  function formatTverDisplayValue(entry, sourceKind){
    const safe=entry && typeof entry==='object' ? entry : {};
    const raw=sourceKind==='setting' ? safe.settingRawValue : safe.csvRawValue;
    if(sourceKind==='setting') return formatTverHorizontalSettingValue(safe, sourceKind);
    const field=String(safe.field ?? '');
    const code=String(raw ?? '').trim();
    const labels=TVER_CSV_DISPLAY_CODE_LABELS[field];
    const label=labels && Object.prototype.hasOwnProperty.call(labels, code) ? labels[code] : '';
    return label ? `${String(raw ?? '')}（${label}）` : raw;
  }

  function buildTverHorizontalCellHtml(cell, sourceKind){
    const safeCell=cell && typeof cell==='object' ? cell : {};
    const entries=Array.isArray(safeCell.entries) ? safeCell.entries : [];
    const entryIndexes=Array.isArray(safeCell.entryIndexes) ? safeCell.entryIndexes : [];
    const blocks=entries.map((entry, position) => {
      const entryIndex=entryIndexes[position];
      const status=entry && (entry.displayStatus || entry.comparisonStatus) || '';
      const projected=projectTverDisplayStatus(status);
      const value=entry ? formatTverDisplayValue(entry, sourceKind) : '';
      const prefDiff=sourceKind==='csv' && entry ? buildTverPrefDiffDisplay(entry).text : '';
      const entryClass=prefDiff ? 'tver-horizontal-cell-entry tver-horizontal-cell-entry-with-reason' : 'tver-horizontal-cell-entry';
      const reasonHtml=prefDiff ? `<span class="tver-horizontal-cell-reason" data-cell-reason="pref-diff">${escapeHtml(prefDiff)}</span>` : '';
      return `<div class="${entryClass}" data-entry-index="${escapeHtml(entryIndex)}" data-entry-status="${escapeHtml(projected)}"><span class="tver-horizontal-cell-value" title="${escapeHtml(value)}">${escapeHtml(value)}</span>${reasonHtml}</div>`;
    }).join('');
    return blocks;
  }

  function buildTverHorizontalSourceCellHtml(sourceKind){
    const label=sourceKind==='setting' ? '設定表' : 'CSV';
    return `<td class="tver-horizontal-source-row-label" data-column-key="${TVER_HORIZONTAL_SOURCE_COLUMN_KEY}" data-source-kind="${escapeHtml(sourceKind)}">${escapeHtml(label)}</td>`;
  }

  const TVER_DISPLAY_REASON_MESSAGES={
    SETTING_SOURCE_NOT_PROVIDED:'設定表側に確認元がないため、CSV値を確認してください',
    SETTING_EVIDENCE_NOT_PROVIDED:'設定表側に確認元がないため、CSV値を確認してください',
    SETTING_EVIDENCE_UNAVAILABLE:'設定表側の確認元を利用できないため、CSV値を確認してください',
    SETTING_EVIDENCE_AMBIGUOUS:'設定表側の確認元が複数あるため確認が必要です',
    GP_PREF_SOURCE_OR_SCHEMA_UNAVAILABLE:'設定表側の都道府県確認元を利用できないため、CSV値を確認してください',
    SETTING_CURRENT_STATUS_NOT_PROVIDED:'設定表に現在ステータスの確認元がありません',
    SETTING_CREATIVE_ID_SOURCE_NOT_PROVIDED:'設定表にCreative IDの確認元がありません',
    MEDIA_MAPPING_INSUFFICIENT:'設定表の放送局指定だけではCSV値との一致を確定できません',
    SETTING_LOCAL_BROADCASTER_NOT_PROVIDED:'設定表にローカル局の確認元がありません',
    LOCAL_BROADCASTER_FULL_SELECTION_UNPROVEN:'ローカル局の全選択を確定できないため確認が必要です',
    GENDER_CODE_MAPPING_UNPROVEN:'設定表表記とCSVコードの対応を確定できません',
    PREF_EXCLUSION_CHANGE_AMBIGUOUS:'都道府県の除外指定に複数の確認元があるため確認が必要です',
    TARGETING_EVIDENCE_UNCONFIRMED:'設定表のターゲティング根拠を確定できないため確認が必要です',
    CSV_TARGETING_ID_EVIDENCE_UNAVAILABLE:'CSV側のターゲティングID根拠を確認できないため確認が必要です',
    EDIT_CSV_FIELD_NOT_PROVIDED:'編集CSVにこの項目がないため確認が必要です',
    SETTING_MEASUREMENT_TAG_AMBIGUOUS:'設定表の計測タグ候補が一意ではないため確認が必要です',
    HOURLY_BID_WEIGHT_RULE_PENDING:'時間毎予算割合の期待値ルールが未確定のため確認が必要です',
    SETTING_CV_POINT_SOURCE_NOT_PROVIDED:'設定表のCVポイント確認元がないため確認が必要です',
    TVER_A17_3A_VALUE_UNAVAILABLE:'設定表側の確認値を利用できないため確認が必要です',
    TVER_A17_3B_VALUE_UNAVAILABLE:'設定表側の確認値を利用できないため確認が必要です',
  };

  function tverDisplayReasonCodeMessage(code){
    const key=String(code ?? '').trim();
    return key && Object.prototype.hasOwnProperty.call(TVER_DISPLAY_REASON_MESSAGES, key) ? TVER_DISPLAY_REASON_MESSAGES[key] : '';
  }

  function normalizeTverDisplayReasonCode(entry, code){
    const key=String(code ?? '').trim();
    if(key==='GP_PREF_SOURCE_OR_SCHEMA_UNAVAILABLE'
      && String((entry && entry.ruleBasis) ?? '')==='TVER_A17_2_PREF_EXCLUSION_CHANGE_AMBIGUOUS'){
      return 'PREF_EXCLUSION_CHANGE_AMBIGUOUS';
    }
    return key;
  }

  function buildTverPrefDiffDisplay(entry){
    const empty=() => ({ missingInCsv:[], extraInCsv:[], missingNames:[], extraNames:[], lines:[], text:'' });
    const safe=entry && typeof entry==='object' ? entry : {};
    if(String(safe.field ?? '')!=='pref' || String(safe.comparisonStatus ?? '')!=='不一致') return empty();
    const canonicalValues=safe.canonicalValues && typeof safe.canonicalValues==='object' ? safe.canonicalValues : {};
    const dictionary=Array.isArray(TVER_ID_DICTIONARIES.pref) ? TVER_ID_DICTIONARIES.pref : [];
    const knownIds=new Set(dictionary.map(item => String((item && item.id) || '')));
    const canonicalIds=value => {
      if(value===null || value===undefined) return null;
      const raw=String(value).trim();
      if(!raw) return [];
      const ids=parseTverIdSet(raw).ids;
      return ids.every(id => knownIds.has(id)) ? ids : null;
    };
    const settingIds=canonicalIds(canonicalValues.setting);
    const csvIds=canonicalIds(canonicalValues.csv);
    if(!settingIds || !csvIds) return empty();
    const csvSet=new Set(csvIds);
    const settingSet=new Set(settingIds);
    const missingInCsv=settingIds.filter(id => !csvSet.has(id));
    const extraInCsv=csvIds.filter(id => !settingSet.has(id));
    const namesById=new Map(dictionary.map(item => [String((item && item.id) || ''), String((item && item.name) || '')]));
    const displayName=id => namesById.get(id) || id;
    const missingNames=missingInCsv.map(displayName);
    const extraNames=extraInCsv.map(displayName);
    const lines=[];
    if(missingNames.length) lines.push(`CSV不足：${missingNames.join('、')}`);
    if(extraNames.length) lines.push(`CSV多余：${extraNames.join('、')}`);
    return { missingInCsv, extraInCsv, missingNames, extraNames, lines, text:lines.join('\n') };
  }

  function getTverDisplayReason(entry){
    const safe=entry && typeof entry==='object' ? entry : {};
    const status=projectTverDisplayStatus(safe.displayStatus || safe.comparisonStatus);
    if(status==='不一致'){
      const prefDiff=buildTverPrefDiffDisplay(safe);
      if(prefDiff.text) return prefDiff.text;
      return '設定表とCSVの値が異なります';
    }
    if(safe.displayStatus==='需确认' && String(safe.field ?? '')==='daily_budget' && !tverHorizontalRawValuePresent(safe.settingRawValue) && String(safe.ruleBasis ?? '')==='strict' && !String(safe.conservativeReason ?? '').trim()){
      return '設定表の日予算が空欄のため確認が必要です';
    }
    const conservativeCode=normalizeTverDisplayReasonCode(safe, safe.conservativeReason);
    const conservativeMessage=tverDisplayReasonCodeMessage(conservativeCode);
    if(conservativeMessage) return conservativeMessage;
    const validationIssues=Array.isArray(safe.validationIssues) ? safe.validationIssues : [];
    for(const issue of validationIssues){
      const message=tverDisplayReasonCodeMessage(issue && issue.code);
      if(message) return message;
      if(String(issue && issue.code || '')==='DATETIME_NOT_30_MINUTE_GRANULARITY') return '日時がTVer設定単位（00分／30分）ではありません';
    }
    const explicitReason=String(safe.reason ?? '').trim();
    const explicitMessage=tverDisplayReasonCodeMessage(explicitReason);
    if(explicitMessage) return explicitMessage;
    if(explicitReason && !/^[A-Z0-9_]+$/.test(explicitReason)) return explicitReason;
    const ruleMessage=tverDisplayReasonCodeMessage(safe.ruleBasis);
    if(ruleMessage) return ruleMessage;
    return '確認理由を自動判定できません。根拠を確認してください';
  }

  function tverDetailSourceList(entry, side){
    const safe=entry && typeof entry==='object' ? entry : {};
    const candidates=[];
    const direct=safe.sourceRefs && safe.sourceRefs[side];
    const evidence=safe.sourceEvidence && safe.sourceEvidence[side];
    if(Array.isArray(direct)) candidates.push(...direct); else if(direct) candidates.push(direct);
    if(Array.isArray(evidence)) candidates.push(...evidence); else if(evidence) candidates.push(evidence);
    const seen=new Set();
    return candidates.filter(source => {
      if(!source || typeof source!=='object') return false;
      const key=JSON.stringify([source.fileName || '', source.sheetName || '', source.rowNumber ?? '', source.columnName || '', source.rawValue ?? '']);
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function formatTverDetailSource(sideLabel, source){
    if(!source) return `${sideLabel}側の直接確認元はありません`;
    const parts=[];
    parts.push(`ファイル ${source.fileName || '未提供'}`);
    if(source.sheetName) parts.push(`シート ${source.sheetName}`);
    if(source.rowNumber!==null && source.rowNumber!==undefined) parts.push(`行 ${source.rowNumber}`);
    if(source.columnName) parts.push(`列 ${source.columnName}`);
    return `${sideLabel}：${parts.join(' / ')}`;
  }

  function buildTverHorizontalDetailViewModel(row){
    const safe=row && typeof row==='object' ? row : {};
    const cells=safe.cells && typeof safe.cells==='object' ? safe.cells : {};
    const entryByIndex=new Map();
    Object.values(cells).forEach(cell => {
      const safeCell=cell && typeof cell==='object' ? cell : {};
      const indexes=Array.isArray(safeCell.entryIndexes) ? safeCell.entryIndexes : [];
      const entries=Array.isArray(safeCell.entries) ? safeCell.entries : [];
      entries.forEach((entry, position) => {
        const index=indexes[position];
        if(Number.isInteger(index) && entry && !entryByIndex.has(index)) entryByIndex.set(index, entry);
      });
    });
    const indexes=Array.isArray(safe.visibleEntryIndexes) ? safe.visibleEntryIndexes : Array.isArray(safe.entryIndexes) ? safe.entryIndexes : [];
    return indexes.map(entryIndex => {
      const entry=entryByIndex.get(entryIndex);
      if(!entry) return null;
      if(entry.deferred) return null; // C3-C5-CR-REOPEN-3 FIX B：deferred 字段无判定，不进入确认详情
      const displayStatus=projectTverDisplayStatus(entry.displayStatus || entry.comparisonStatus);
      if(displayStatus==='一致') return null;
      const settingSources=tverDetailSourceList(entry, 'setting');
      const csvSources=tverDetailSourceList(entry, 'csv');
      const validationCodes=(Array.isArray(entry.validationIssues) ? entry.validationIssues : []).map(issue => String(issue && issue.code || '')).filter(Boolean);
      return {
        entryIndex,
        field:String(entry.field ?? ''),
        fieldLabel:entry.fieldLabel || buildTverHorizontalFieldLabel(safe.level, entry.field),
        displayStatus,
        comparisonStatus:String(entry.comparisonStatus ?? ''),
        settingRawValue:entry.settingRawValue,
        csvRawValue:entry.csvRawValue,
        settingDisplayValue:formatTverDisplayValue(entry, 'setting'),
        csvDisplayValue:formatTverDisplayValue(entry, 'csv'),
        reason:getTverDisplayReason(entry),
        settingSources:settingSources.length ? settingSources : [null],
        csvSources:csvSources.length ? csvSources : [null],
        conservativeReason:String(entry.conservativeReason ?? ''),
        ruleBasis:String(entry.ruleBasis ?? ''),
        evidenceStates:entry.evidenceStates && typeof entry.evidenceStates==='object' ? { ...entry.evidenceStates } : {},
        validationCodes,
      };
    }).filter(Boolean);
  }

  function tverTechnicalValue(value){
    if(value===null || value===undefined || value==='') return '—';
    if(typeof value==='object'){
      try{ return JSON.stringify(value); }catch(error){ return String(value); }
    }
    return String(value);
  }

  function buildTverHorizontalDetailEntryHtml(detail){
    const status=detail.displayStatus || '要確認';
    const sourceLines=[
      ...detail.settingSources.map(source => formatTverDetailSource('設定表', source)),
      ...detail.csvSources.map(source => formatTverDetailSource('CSV', source)),
    ];
    const sourceHtml=sourceLines.map(line => `<div class="tver-horizontal-detail-source">${escapeHtml(line)}</div>`).join('');
    const validation=tverTechnicalValue(detail.validationCodes.length ? detail.validationCodes.join(' | ') : '');
    const technical=[
      ['conservativeReason', detail.conservativeReason],
      ['ruleBasis', detail.ruleBasis],
      ['comparisonStatus', detail.comparisonStatus],
      ['displayStatus', status],
      ['evidenceStates', detail.evidenceStates],
      ['validationIssues.code', validation],
    ].map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(tverTechnicalValue(value))}</dd>`).join('');
    return `<article class="tver-horizontal-detail-entry" data-detail-entry-index="${escapeHtml(detail.entryIndex)}"><div class="tver-horizontal-detail-grid"><div><span class="tver-horizontal-detail-label">項目</span><span class="tver-horizontal-detail-value tver-horizontal-detail-field">${escapeHtml(detail.fieldLabel || detail.field)}</span></div><div><span class="tver-horizontal-detail-label">判定</span><span class="tver-horizontal-detail-status ${tverHorizontalStatusClass(status)}">${escapeHtml(status)}</span></div><div><span class="tver-horizontal-detail-label">設定表値</span><span class="tver-horizontal-detail-value">${escapeHtml(detail.settingDisplayValue ?? detail.settingRawValue)}</span></div><div><span class="tver-horizontal-detail-label">CSV値</span><span class="tver-horizontal-detail-value">${escapeHtml(detail.csvDisplayValue ?? detail.csvRawValue)}</span></div></div><div class="tver-horizontal-detail-reason"><span class="tver-horizontal-detail-label">確認理由</span><span class="tver-horizontal-detail-value">${escapeHtml(detail.reason)}</span></div><div class="tver-horizontal-detail-actions"><button class="tver-horizontal-detail-action" type="button" data-action="toggle-detail-evidence" data-detail-entry-index="${escapeHtml(detail.entryIndex)}" aria-expanded="false">根拠を表示</button><div class="tver-horizontal-detail-sources hidden" hidden data-detail-evidence>${sourceHtml}</div><details class="tver-horizontal-detail-technical"><summary>技術情報</summary><dl>${technical}</dl></details></div></article>`;
  }

  function buildTverHorizontalDetailRowHtml(row, columns){
    const details=buildTverHorizontalDetailViewModel(row);
    if(!details.length) return '';
    const columnCount=4 + (Array.isArray(columns) ? columns.length : 0);
    const entriesHtml=details.map(buildTverHorizontalDetailEntryHtml).join('');
    return `<tr class="tver-horizontal-detail-row hidden" hidden data-detail-row-key="${escapeHtml(row && row.rowKey)}"><td colspan="${columnCount}"><div class="tver-horizontal-detail">${entriesHtml}</div></td></tr>`;
  }

  function setTverHorizontalDetailExpanded(panel, control){
    if(!panel || !control || typeof panel.querySelectorAll!=='function' || typeof control.getAttribute!=='function') return false;
    const rowKey=control.getAttribute('data-row-key');
    const rows=[...panel.querySelectorAll('.tver-horizontal-detail-row[data-detail-row-key]')];
    const detailRow=rows.find(row => row && row.getAttribute && row.getAttribute('data-detail-row-key')===rowKey);
    if(!detailRow) return false;
    const isExpanded=detailRow.hidden===false && !(detailRow.classList && typeof detailRow.classList.contains==='function' && detailRow.classList.contains('hidden'));
    const next=!isExpanded;
    rows.forEach(row => {
      const expanded=next && row===detailRow;
      row.hidden=!expanded;
      row.classList && row.classList.toggle && row.classList.toggle('hidden', !expanded);
    });
    const controls=[...panel.querySelectorAll('[data-action="toggle-detail"]')];
    controls.forEach(item => {
      const same=item && item.getAttribute && item.getAttribute('data-row-key')===rowKey;
      item.setAttribute && item.setAttribute('aria-expanded', String(next && same));
    });
    return next;
  }

  function setTverHorizontalEvidenceExpanded(panel, control){
    if(!panel || !control) return false;
    const detailEntry=typeof control.closest==='function' ? control.closest('.tver-horizontal-detail-entry') : null;
    const sourcePanel=detailEntry && typeof detailEntry.querySelector==='function' ? detailEntry.querySelector('[data-detail-evidence]') : null;
    if(!sourcePanel) return false;
    const next=sourcePanel.hidden!==false;
    sourcePanel.hidden=!next;
    sourcePanel.classList && sourcePanel.classList.toggle && sourcePanel.classList.toggle('hidden', !next);
    control.setAttribute && control.setAttribute('aria-expanded', String(next));
    return next;
  }

  function tverHorizontalLevelId(level){
    return String(level || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'level';
  }

  function buildTverLevelTabsHtml(activeLevel){
    const current=TVER_HORIZONTAL_LEVELS.includes(activeLevel) ? activeLevel : 'Campaign';
    const tabs=TVER_HORIZONTAL_LEVELS.map(level => {
      const selected=level===current;
      return `<button class="tver-level-tab" type="button" role="tab" data-action="switch-level" data-level="${escapeHtml(level)}" aria-selected="${String(selected)}" aria-controls="tver-horizontal-panel-${escapeHtml(tverHorizontalLevelId(level))}" tabindex="${selected ? '0' : '-1'}">${escapeHtml(level)}</button>`;
    }).join('');
    return `<nav class="tver-level-tabs" role="tablist" aria-label="レベル">${tabs}</nav>`;
  }

  function resolveTverHorizontalWidths(level, columns, storage){
    const resolved={
      no:getTverColumnWidth(level, 'no', storage),
      target:getTverColumnWidth(level, 'target', storage),
      comparison:getTverColumnWidth(level, 'comparison', storage),
      fields:{},
    };
    (Array.isArray(columns) ? columns : []).forEach(column => {
      const key=String(column && column.key || '');
      if(key) resolved.fields[key]=getTverColumnWidth(level, key, storage);
    });
    resolved.fixed=resolved.no + resolved.target + resolved.comparison;
    return resolved;
  }

  function tverResolvedColumnWidth(level, columnKey, storage, resolvedWidths){
    const key=String(columnKey || '');
    if(key===TVER_HORIZONTAL_SOURCE_COLUMN_KEY) return TVER_HORIZONTAL_SOURCE_COLUMN_WIDTH;
    if(resolvedWidths){
      if(key==='no' || key==='target' || key==='comparison') return Number(resolvedWidths[key]);
      if(resolvedWidths.fields && Object.prototype.hasOwnProperty.call(resolvedWidths.fields, key)) return Number(resolvedWidths.fields[key]);
    }
    return getTverColumnWidth(level, key, storage);
  }

  function buildTverColumnWidthStyle(level, columnKey, storage, resolvedWidths){
    const width=tverResolvedColumnWidth(level, columnKey, storage, resolvedWidths);
    return `style="width:${width}px;min-width:${width}px"`;
  }

  function buildTverColumnHeader(label, className, columnKey, level, storage, adjustable, resolvedWidths){
    const handle=adjustable ? `<span class="tver-column-resizer" data-action="resize-column" data-column-key="${escapeHtml(columnKey)}" role="separator" aria-label="${escapeHtml(label)}の幅を調整"></span>` : '';
    return `<th class="${className}" data-column-key="${escapeHtml(columnKey)}" ${buildTverColumnWidthStyle(level, columnKey, storage, resolvedWidths)}>${escapeHtml(label)}${handle}</th>`;
  }

  function tverResolvedHorizontalDynamicWidth(resolvedWidths){
    const fields=resolvedWidths && resolvedWidths.fields && typeof resolvedWidths.fields==='object' ? resolvedWidths.fields : {};
    return TVER_HORIZONTAL_SOURCE_COLUMN_WIDTH + Object.values(fields).reduce((total, width) => total + (Number.isFinite(Number(width)) ? Number(width) : 0), 0);
  }

  function buildTverHorizontalSourceColumnHtml(){
    return `<col class="tver-horizontal-source-col" data-column-key="${TVER_HORIZONTAL_SOURCE_COLUMN_KEY}" style="width:${TVER_HORIZONTAL_SOURCE_COLUMN_WIDTH}px;min-width:${TVER_HORIZONTAL_SOURCE_COLUMN_WIDTH}px">`;
  }

  function buildTverHorizontalTableLayoutStyle(level, storage, resolvedWidths){
    const widths=resolvedWidths || resolveTverHorizontalWidths(level, [], storage);
    const dynamicWidth=tverResolvedHorizontalDynamicWidth(widths);
    const tableWidth=widths.fixed + dynamicWidth;
    return `style="--tver-no-width:${widths.no}px;--tver-target-width:${widths.target}px;--tver-comparison-width:${widths.comparison}px;--tver-fixed-width:${widths.fixed}px;--tver-dynamic-width:${dynamicWidth}px;--tver-table-width:${tableWidth}px"`;
  }

  function buildTverHorizontalTableHtmlLegacy(viewModel, options){
    const view=viewModel && typeof viewModel==='object' ? viewModel : { level:'Campaign', columns:[], rows:[] };
    const config=options || {};
    const storage=config.storage;
    const columns=Array.isArray(view.columns) ? view.columns : [];
    const rows=Array.isArray(view.rows) ? view.rows : [];
    const resolvedWidths=config.resolvedWidths || resolveTverHorizontalWidths(view.level, columns, storage);
    const levelId=tverHorizontalLevelId(view.level);
    const targetHeaderLabel=view.level==='Campaign' ? 'CPN訴求' : '対象名';
    const colgroup=`<colgroup><col class="tver-horizontal-col-no" data-column-key="no" ${buildTverColumnWidthStyle(view.level, 'no', storage, resolvedWidths)}><col class="tver-horizontal-col-target" data-column-key="target" ${buildTverColumnWidthStyle(view.level, 'target', storage, resolvedWidths)}><col class="tver-horizontal-col-comparison" data-column-key="comparison" ${buildTverColumnWidthStyle(view.level, 'comparison', storage, resolvedWidths)}>${buildTverHorizontalSourceColumnHtml()}${columns.map(column => `<col class="tver-horizontal-field-col" data-column-key="${escapeHtml(column.key)}" ${buildTverColumnWidthStyle(view.level, column.key, storage, resolvedWidths)}>`).join('')}</colgroup>`;
    const head=`<thead><tr>${buildTverColumnHeader('No.', 'tver-horizontal-fixed tver-horizontal-col-no tver-horizontal-fixed-no', 'no', view.level, storage, false, resolvedWidths)}${buildTverColumnHeader(targetHeaderLabel, 'tver-horizontal-fixed tver-horizontal-col-target tver-horizontal-fixed-target', 'target', view.level, storage, true, resolvedWidths)}${buildTverColumnHeader('比較結果', 'tver-horizontal-fixed tver-horizontal-col-comparison tver-horizontal-fixed-comparison', 'comparison', view.level, storage, true, resolvedWidths)}${buildTverColumnHeader('来源', 'tver-horizontal-source-col', TVER_HORIZONTAL_SOURCE_COLUMN_KEY, view.level, storage, false, resolvedWidths)}${columns.map(column => buildTverColumnHeader(column.label, 'tver-horizontal-field-col', column.key, view.level, storage, true, resolvedWidths)).join('')}</tr></thead>`;
    let previousGroupKey=null;
    const bodyRows=[];
    rows.forEach((row, index) => {
      const groupKey=row.parentNodeKey || (row.isUnattached ? 'unattached' : '');
      if(view.level!=='Campaign' && groupKey!==previousGroupKey){
        const groupLabel=row.parentDisplayLabel || (row.isUnattached ? '未接続' : '');
        bodyRows.push(`<tr class="tver-horizontal-group-row" data-group-key="${escapeHtml(groupKey)}"><th colspan="${4 + columns.length}">${escapeHtml(groupLabel)}</th></tr>`);
        previousGroupKey=groupKey;
      }
      const settingSourceCell=buildTverHorizontalSourceCellHtml('setting');
      const csvSourceCell=buildTverHorizontalSourceCellHtml('csv');
      const settingCells=columns.map(column => `<td class="${tverHorizontalCellClass(row.cells && row.cells[column.key])}" data-action="toggle-cell" data-field-key="${escapeHtml(column.key)}">${buildTverHorizontalCellHtml(row.cells && row.cells[column.key], 'setting')}</td>`).join('');
      const csvCells=columns.map(column => `<td class="${tverHorizontalCellClass(row.cells && row.cells[column.key])}" data-action="toggle-cell" data-field-key="${escapeHtml(column.key)}">${buildTverHorizontalCellHtml(row.cells && row.cells[column.key], 'csv')}</td>`).join('');
      const entityStatus=projectTverDisplayStatus(row.entityDisplayStatus) || '一致';
      const detailHtml=buildTverHorizontalDetailRowHtml(row, columns);
      const comparisonControl=detailHtml
        ? `<button class="tver-horizontal-entity-status ${tverHorizontalStatusClass(entityStatus)} tver-horizontal-entity-status-toggle" type="button" data-action="toggle-detail" data-row-key="${escapeHtml(row.rowKey)}" aria-expanded="false" aria-controls="tver-horizontal-detail-${escapeHtml(index + 1)}">${escapeHtml(entityStatus)}</button>`
        : `<span class="tver-horizontal-entity-status ${tverHorizontalStatusClass(entityStatus)}" data-entity-status="${escapeHtml(entityStatus)}">${escapeHtml(entityStatus)}</span>`;
      const fixedCells=`<td class="tver-horizontal-fixed tver-horizontal-col-no tver-horizontal-fixed-no" rowspan="2">${escapeHtml(index + 1)}</td><td class="tver-horizontal-fixed tver-horizontal-col-target tver-horizontal-fixed-target" rowspan="2">${escapeHtml(row.displayLabel)}</td><td class="tver-horizontal-fixed tver-horizontal-col-comparison tver-horizontal-fixed-comparison" rowspan="2"><span data-entity-status="${escapeHtml(entityStatus)}">${comparisonControl}</span></td>`;
      bodyRows.push(`<tr data-row-key="${escapeHtml(row.rowKey)}" data-row-variant="setting">${fixedCells}${settingSourceCell}${settingCells}</tr><tr data-row-key="${escapeHtml(row.rowKey)}" data-row-variant="csv">${csvSourceCell}${csvCells}</tr>${detailHtml.replace('<tr class="tver-horizontal-detail-row hidden"', `<tr id="tver-horizontal-detail-${escapeHtml(index + 1)}" class="tver-horizontal-detail-row hidden"`)}`);
    });
    const body=bodyRows.length ? bodyRows.join('') : `<tr><td class="tver-horizontal-empty" colspan="${4 + columns.length}">現在の条件に一致する結果はありません。</td></tr>`;
    return `<section class="tver-horizontal-panel" id="tver-horizontal-panel-${escapeHtml(levelId)}" role="tabpanel" aria-label="${escapeHtml(view.level)}結果"><div class="tver-horizontal-scroll-shell" ${buildTverHorizontalTableLayoutStyle(view.level, storage, resolvedWidths)}><div class="tver-horizontal-scroll"><table class="tver-horizontal-table" data-level="${escapeHtml(view.level)}" ${buildTverHorizontalTableLayoutStyle(view.level, storage, resolvedWidths)}>${colgroup}${head}<tbody>${body}</tbody></table></div></div></section>`;
  }

  function buildTverHorizontalTableHtml(viewModel, options){
    const view=viewModel && typeof viewModel==='object' ? viewModel : { level:'Campaign', columns:[], rows:[] };
    const config=options || {};
    const storage=config.storage;
    const columns=Array.isArray(view.columns) ? view.columns : [];
    const resolvedWidths=config.resolvedWidths || resolveTverHorizontalWidths(view.level, columns, storage);
    const layoutStyle=buildTverHorizontalTableLayoutStyle(view.level, storage, resolvedWidths);
    const targetHeaderLabel=view.level==='Campaign' ? 'CPN訴求' : '対象名';
    const fixedColgroup='<colgroup>'
      + '<col class="tver-horizontal-col-no" data-column-key="no" ' + buildTverColumnWidthStyle(view.level, 'no', storage, resolvedWidths) + '>'
      + '<col class="tver-horizontal-col-target" data-column-key="target" ' + buildTverColumnWidthStyle(view.level, 'target', storage, resolvedWidths) + '>'
      + '<col class="tver-horizontal-col-comparison" data-column-key="comparison" ' + buildTverColumnWidthStyle(view.level, 'comparison', storage, resolvedWidths) + '>'
      + '</colgroup>';
    const dynamicColgroup='<colgroup>' + buildTverHorizontalSourceColumnHtml() + columns.map(column => '<col class="tver-horizontal-field-col" data-column-key="' + escapeHtml(column.key) + '" ' + buildTverColumnWidthStyle(view.level, column.key, storage, resolvedWidths) + '>').join('') + '</colgroup>';
    const fixedHead='<thead><tr>'
      + buildTverColumnHeader('No.', 'tver-horizontal-fixed tver-horizontal-col-no tver-horizontal-fixed-no', 'no', view.level, storage, false, resolvedWidths)
      + buildTverColumnHeader(targetHeaderLabel, 'tver-horizontal-fixed tver-horizontal-col-target tver-horizontal-fixed-target', 'target', view.level, storage, true, resolvedWidths)
      + buildTverColumnHeader('比較結果', 'tver-horizontal-fixed tver-horizontal-col-comparison tver-horizontal-fixed-comparison', 'comparison', view.level, storage, true, resolvedWidths)
      + '</tr></thead>';
    const dynamicHead='<thead><tr>' + buildTverColumnHeader('来源', 'tver-horizontal-source-col', TVER_HORIZONTAL_SOURCE_COLUMN_KEY, view.level, storage, false, resolvedWidths) + columns.map(column => buildTverColumnHeader(column.label, 'tver-horizontal-field-col', column.key, view.level, storage, true, resolvedWidths)).join('') + '</tr></thead>';
    const legacyHtml=buildTverHorizontalTableHtmlLegacy(view, { ...config, resolvedWidths });
    const headerHtml='<div class="tver-horizontal-sticky-header" data-tver-sticky-header>'
      + '<div class="tver-horizontal-sticky-header-row">'
      + '<div class="tver-horizontal-sticky-header-fixed">'
      + '<table class="tver-horizontal-table tver-horizontal-sticky-header-table tver-horizontal-sticky-header-fixed-table" data-level="' + escapeHtml(view.level) + '" ' + layoutStyle + '>' + fixedColgroup + fixedHead + '</table>'
      + '</div>'
      + '<div class="tver-horizontal-sticky-header-dynamic"><div class="tver-horizontal-sticky-header-track" data-tver-sticky-header-track>'
      + '<table class="tver-horizontal-table tver-horizontal-sticky-header-table tver-horizontal-sticky-header-dynamic-table" data-level="' + escapeHtml(view.level) + '" ' + layoutStyle + '>' + dynamicColgroup + dynamicHead + '</table>'
      + '</div></div>'
      + '</div>'
      + '<div class="tver-horizontal-scroll-access" data-tver-horizontal-scroll-access hidden aria-label="結果表の横スクロール"><div class="tver-horizontal-scroll-access-track" data-tver-horizontal-scroll-access-track></div></div>'
      + '</div>';
    const shellMarker='<div class="tver-horizontal-scroll-shell" ' + layoutStyle + '>';
    const shellReplacement='<div class="tver-horizontal-scroll-shell" ' + layoutStyle + '>' + headerHtml;
    return legacyHtml.replace(shellMarker, shellReplacement);
  }

  function syncTverHorizontalScrollAccess(panel){
    if(!panel || typeof panel.querySelector!=='function') return;
    const source=panel.querySelector('.tver-horizontal-scroll');
    const access=panel.querySelector('.tver-horizontal-scroll-access');
    const track=panel.querySelector('.tver-horizontal-scroll-access-track');
    if(!source || !access || !track) return;
    const scrollWidth=Math.max(0, Number(source.scrollWidth) || 0);
    const clientWidth=Math.max(0, Number(source.clientWidth) || 0);
    const hasOverflow=scrollWidth>clientWidth+1;
    if(track.style) track.style.width=Math.max(scrollWidth, clientWidth) + 'px';
    access.hidden=!hasOverflow;
    if(access.setAttribute) access.setAttribute('aria-hidden', String(!hasOverflow));
    // C3-C5-CR-REOPEN-3 FIX E：Ad/CR 横版字段少（无横向溢出）时，sticky header 右侧
    // 不再渲染整行深蓝底（fit 状态下 dynamic 区域透明，仅 track 实宽着色；fixed 区自带深蓝）。
    // 仅作用于 Ad 层——Campaign / Ad Group 的渲染与行为保持不变。
    const stickyHeader=panel.querySelector('.tver-horizontal-sticky-header');
    if(stickyHeader && stickyHeader.classList && typeof stickyHeader.classList.toggle==='function'){
      const levelTable=panel.querySelector('.tver-horizontal-table[data-level]');
      const level=levelTable && typeof levelTable.getAttribute==='function' ? String(levelTable.getAttribute('data-level') || '') : '';
      if(level==='Ad') stickyHeader.classList.toggle('tver-horizontal-sticky-header-fit', !hasOverflow);
    }
    const sourceScrollLeft=Number.isFinite(Number(source.scrollLeft)) ? Number(source.scrollLeft) : 0;
    if(Number(access.scrollLeft)!==sourceScrollLeft) access.scrollLeft=sourceScrollLeft;
    syncTverHorizontalHeaderHeights(panel);
  }

  function tverHorizontalMeasuredHeight(element){
    if(!element) return 0;
    const rect=typeof element.getBoundingClientRect==='function' ? element.getBoundingClientRect() : null;
    const rectHeight=rect && Number(rect.height);
    if(Number.isFinite(rectHeight) && rectHeight>0) return rectHeight;
    const offsetHeight=Number(element.offsetHeight);
    return Number.isFinite(offsetHeight) && offsetHeight>0 ? offsetHeight : 0;
  }

  function syncTverHorizontalHeaderHeights(panel){
    if(!panel || typeof panel.querySelector!=='function') return 0;
    const row=panel.querySelector('.tver-horizontal-sticky-header-row');
    const fixed=panel.querySelector('.tver-horizontal-sticky-header-fixed');
    const dynamic=panel.querySelector('.tver-horizontal-sticky-header-dynamic');
    const fixedTable=panel.querySelector('.tver-horizontal-sticky-header-fixed-table');
    const dynamicTable=panel.querySelector('.tver-horizontal-sticky-header-dynamic-table');
    const targets=[row, fixed, dynamic, fixedTable, dynamicTable].filter(Boolean);
    if(!targets.length) return 0;
    targets.forEach(element => {
      if(!element.style) return;
      element.style.height='';
      element.style.minHeight='';
    });
    const fixedHeight=Math.max(tverHorizontalMeasuredHeight(fixedTable), tverHorizontalMeasuredHeight(fixed));
    const dynamicHeight=Math.max(tverHorizontalMeasuredHeight(dynamicTable), tverHorizontalMeasuredHeight(dynamic));
    const headerHeight=Math.max(fixedHeight, dynamicHeight);
    if(!(headerHeight>0)) return 0;
    const cssHeight=headerHeight + 'px';
    targets.forEach(element => {
      if(!element.style) return;
      element.style.height=cssHeight;
      element.style.minHeight=cssHeight;
    });
    return headerHeight;
  }

  function syncTverHorizontalStickyPresentation(panel){
    if(!panel || typeof panel.querySelector!=='function') return;
    syncTverHorizontalHeaderHeights(panel);
    const shell=panel.querySelector('.tver-horizontal-scroll-shell');
    const scroll=panel.querySelector('.tver-horizontal-scroll');
    const track=panel.querySelector('[data-tver-sticky-header-track]');
    const bodyTable=panel.querySelector('.tver-horizontal-scroll table[data-level]');
    const header=panel.querySelector('[data-tver-sticky-header]');
    const headerRect=header && typeof header.getBoundingClientRect==='function' ? header.getBoundingClientRect() : null;
    const headerHeight=headerRect && Number.isFinite(Number(headerRect.height)) ? Number(headerRect.height) : header && Number.isFinite(Number(header.offsetHeight)) ? Number(header.offsetHeight) : 0;
    const headerBottom=headerRect && Number.isFinite(Number(headerRect.bottom)) ? Number(headerRect.bottom) : headerHeight;
    if(shell && shell.style && typeof shell.style.setProperty==='function') shell.style.setProperty('--tver-sticky-header-height', headerHeight + 'px');
    if(track){
      const scrollLeft=scroll && Number.isFinite(Number(scroll.scrollLeft)) ? Number(scroll.scrollLeft) : 0;
      track.style.transform='translate3d(' + (-scrollLeft) + 'px,0,0)';
    }
    const label=panel.querySelector('[data-tver-sticky-group]');
    if(!label) return;
    const groupRows=typeof panel.querySelectorAll==='function' ? [...panel.querySelectorAll('.tver-horizontal-scroll .tver-horizontal-group-row')] : [];
    let current=null;
    groupRows.forEach(row => {
      if(row && row.getAttribute && row.getAttribute('data-group-key') && typeof row.getBoundingClientRect==='function' && row.getBoundingClientRect().top<=headerBottom+1) current=row;
    });
    const shellBottom=shell && typeof shell.getBoundingClientRect==='function' ? shell.getBoundingClientRect().bottom : Infinity;
    const text=label.querySelector && label.querySelector('[data-tver-sticky-group-text]');
    if(label.style) label.style.top=headerHeight + 'px';
    if(current && shellBottom>headerBottom){
      if(text) text.textContent=current.textContent || '';
      label.style && (label.style.visibility='visible');
      label.setAttribute && label.setAttribute('aria-hidden','false');
    }else{
      if(text) text.textContent='';
      label.style && (label.style.visibility='hidden');
      label.setAttribute && label.setAttribute('aria-hidden','true');
    }
  }

  const tverHorizontalStickySyncState=new WeakMap();
  function scheduleTverHorizontalStickySync(panel){
    if(!panel) return;
    const view=panel.ownerDocument && panel.ownerDocument.defaultView || (typeof window!=='undefined' ? window : null);
    const raf=view && typeof view.requestAnimationFrame==='function' ? view.requestAnimationFrame.bind(view) : null;
    if(!raf){ syncTverHorizontalStickyPresentation(panel); return; }
    const current=tverHorizontalStickySyncState.get(panel) || { pending:false };
    if(current.pending) return;
    current.pending=true;
    tverHorizontalStickySyncState.set(panel, current);
    raf(() => {
      current.pending=false;
      syncTverHorizontalStickyPresentation(panel);
    });
  }

  function bindTverHorizontalInteractions(panel){
    if(!panel || typeof panel.addEventListener!=='function' || panel.__tverHorizontalEventsBound) return;
    panel.__tverHorizontalEventsBound=true;
    panel.addEventListener('click', event => {
      const target=event && event.target;
      const control=target && typeof target.closest==='function' ? target.closest('[data-action]') : target && target.getAttribute && target.getAttribute('data-action') ? target : null;
      if(!control || (typeof panel.contains==='function' && !panel.contains(control))) return;
      const action=control.getAttribute && control.getAttribute('data-action');
      if(action==='switch-level'){
        const level=control.getAttribute && control.getAttribute('data-level');
        if(!TVER_HORIZONTAL_LEVELS.includes(level) || !tverPageState.run) return;
        tverPageState.activeLevel=level;
        tverPageState.filters={ ...tverPageState.filters, level };
        renderTverRun(tverPageState.run, { activeLevel:level });
      }
      if(action==='reset-column-widths' && tverPageState.run){
        resetTverColumnWidths();
        renderTverRun(tverPageState.run, { activeLevel:tverPageState.activeLevel, filters:tverPageState.filters });
      }
      if(action==='toggle-detail'){
        setTverHorizontalDetailExpanded(panel, control);
        syncTverHorizontalScrollAccess(panel);
      }
      if(action==='toggle-detail-evidence') setTverHorizontalEvidenceExpanded(panel, control);
    });
    panel.addEventListener('dblclick', event => {
      const target=event && event.target;
      const cell=target && typeof target.closest==='function' ? target.closest('[data-action="toggle-cell"]') : target && target.getAttribute && target.getAttribute('data-action')==='toggle-cell' ? target : null;
      if(!cell || (typeof panel.contains==='function' && !panel.contains(cell))) return;
      cell.classList && cell.classList.toggle('tver-horizontal-cell-expanded');
      event.preventDefault && event.preventDefault();
    });
    panel.addEventListener('keydown', event => {
      const target=event && event.target;
      if(!target || target.getAttribute && target.getAttribute('data-action')!=='switch-level') return;
      if(event.key!=='Enter' && event.key!==' ') return;
      event.preventDefault && event.preventDefault();
      target.click && target.click();
    });
    panel.addEventListener('pointerdown', event => {
      const target=event && event.target;
      const handle=target && typeof target.closest==='function' ? target.closest('[data-action="resize-column"]') : target && target.getAttribute && target.getAttribute('data-action')==='resize-column' ? target : null;
      if(!handle || (typeof panel.contains==='function' && !panel.contains(handle))) return;
      const table=typeof handle.closest==='function' ? handle.closest('table') : null;
      const level=table && table.getAttribute ? table.getAttribute('data-level') : '';
      const tables=panel && typeof panel.querySelectorAll==='function'
        ? [...panel.querySelectorAll('table[data-level="' + level + '"]')]
        : table ? [table] : [];
      const shell=panel && typeof panel.querySelector==='function' ? panel.querySelector('.tver-horizontal-scroll-shell') : null;
      const columnKey=handle.getAttribute && handle.getAttribute('data-column-key');
      const column=table && typeof table.querySelectorAll==='function'
        ? [...table.querySelectorAll('col[data-column-key]')].find(item => item.getAttribute && item.getAttribute('data-column-key')===columnKey)
        : null;
      const startWidth=column && column.style && parseFloat(column.style.width) || getTverColumnWidth(level, columnKey);
      const doc=panel.ownerDocument || (typeof document!=='undefined' ? document : null);
      if(!doc || typeof doc.addEventListener!=='function' || !column || !column.style) return;
      event.preventDefault && event.preventDefault();
      const storage=getTverColumnStorage();
      const move=moveEvent => {
        const width=setTverColumnWidth(level, columnKey, startWidth + Number(moveEvent.clientX || 0) - Number(event.clientX || 0), storage);
        column.style.width=`${width}px`;
        column.style.minWidth=`${width}px`;
        const getWidth=key => {
          const candidate=[...table.querySelectorAll('col[data-column-key]')].find(item => item.getAttribute && item.getAttribute('data-column-key')===key);
          return candidate && candidate.style ? parseFloat(candidate.style.width) || getTverColumnWidth(level, key, storage) : getTverColumnWidth(level, key, storage);
        };
        tables.forEach(tableItem => {
          const matchingColumn=typeof tableItem.querySelectorAll==='function'
            ? [...tableItem.querySelectorAll('col[data-column-key]')].find(item => item.getAttribute && item.getAttribute('data-column-key')===columnKey)
            : null;
          if(matchingColumn && matchingColumn.style){
            matchingColumn.style.width=width + 'px';
            matchingColumn.style.minWidth=width + 'px';
          }
        });
        const dynamicWidth=Math.max(0, ...tables.map(tableItem => {
          const dynamicColumns=typeof tableItem.querySelectorAll==='function' ? [...tableItem.querySelectorAll('col[data-column-key]')] : [];
          return dynamicColumns
            .filter(item => !['no', 'target', 'comparison'].includes(item.getAttribute && item.getAttribute('data-column-key')))
            .reduce((total, item) => total + (item.style && parseFloat(item.style.width) || 0), 0);
        }));
        const noWidth=getWidth('no');
        const targetWidth=getWidth('target');
        const comparisonWidth=getWidth('comparison');
        const fixedWidth=noWidth + targetWidth + comparisonWidth;
        const tableWidth=fixedWidth + dynamicWidth;
        const styleTargets=[...tables, shell].filter(Boolean);
        styleTargets.forEach(target => {
          target.style.setProperty('--tver-no-width', noWidth + 'px');
          target.style.setProperty('--tver-target-width', targetWidth + 'px');
          target.style.setProperty('--tver-comparison-width', comparisonWidth + 'px');
          target.style.setProperty('--tver-fixed-width', fixedWidth + 'px');
          target.style.setProperty('--tver-dynamic-width', dynamicWidth + 'px');
          target.style.setProperty('--tver-table-width', tableWidth + 'px');
        });
        syncTverHorizontalScrollAccess(panel);
        syncTverHorizontalHeaderHeights(panel);
      };
      const stop=() => {
        doc.removeEventListener && doc.removeEventListener('pointermove', move);
        doc.removeEventListener && doc.removeEventListener('pointerup', stop);
      };
      doc.addEventListener('pointermove', move);
      doc.addEventListener('pointerup', stop, { once:true });
    });
    const sync=event => {
      const source=panel.querySelector && panel.querySelector('.tver-horizontal-scroll');
      const access=panel.querySelector && panel.querySelector('.tver-horizontal-scroll-access');
      const target=event && event.target;
      if(source && access && target===access && Number(source.scrollLeft)!==Number(access.scrollLeft)) source.scrollLeft=access.scrollLeft;
      if(source && access && target===source && Number(access.scrollLeft)!==Number(source.scrollLeft)) access.scrollLeft=source.scrollLeft;
      syncTverHorizontalScrollAccess(panel);
      scheduleTverHorizontalStickySync(panel);
    };
    panel.addEventListener('scroll', sync, true);
    const view=panel.ownerDocument && panel.ownerDocument.defaultView || (typeof window!=='undefined' ? window : null);
    if(view && typeof view.addEventListener==='function'){
      view.addEventListener('resize', sync);
    }
    sync();
  }

  // 只读汇总：供批量真实验证脚本（tests/tver_real_file.verify.js）输出每案指标。
  // 不修改任何比对/匹配/规则结论，仅从已构建的 run 抽取统计。
  function summarizeValidationRun(run){
    const safe=run || {};
    const settingCounts=safe.settingCounts || { Campaign:0, 'Ad Group':0, Ad:0 };
    const csvCounts=safe.csvCounts || { Campaign:0, 'Ad Group':0, Ad:0 };
    const matchedCounts={ Campaign:0, 'Ad Group':0, Ad:0 };
    const matching=safe.matching || {};
    (matching.matches || []).forEach(match => {
      if(match && match.status==='matched' && Object.prototype.hasOwnProperty.call(matchedCounts, match.level)) matchedCounts[match.level]+=1;
    });
    const entries=Array.isArray(safe.entries) ? safe.entries : [];
    const representativeDifferences=entries
      .filter(entry => entry && (entry.comparisonStatus==='不一致' || entry.comparisonStatus==='需确认' || entry.comparisonStatus==='未匹配'))
      .slice(0, 3)
      .map(entry => ({ level:entry.level, targetName:entry.targetName, field:entry.field, comparisonStatus:entry.comparisonStatus, reason:entry.reason || '' }));
    return {
      schemaKind: safe.schemaKind || '',
      businessRole: safe.businessRole || '',
      parsedCounts: {
        setting: { Campaign:settingCounts.Campaign, 'Ad Group':settingCounts['Ad Group'], Ad:settingCounts.Ad },
        csv: { Campaign:csvCounts.Campaign, 'Ad Group':csvCounts['Ad Group'], Ad:csvCounts.Ad },
      },
      matchedCounts,
      statusCounts: safe.statusCounts || {},
      representativeDifferences,
    };
  }

  const TVER_DISPLAY_TREE_LEVEL_LABELS={ Campaign:'キャンペーン', 'Ad Group':'広告グループ', Ad:'広告' };

  function tverDisplayTreeLevelLabel(level){
    return TVER_DISPLAY_TREE_LEVEL_LABELS[level] || String(level || 'エンティティ');
  }

  function tverDisplayTreeStatusCount(counts, status){
    const count=Number(counts && counts[status]);
    return Number.isFinite(count) && count>0 ? count : 0;
  }

  function buildTverDisplayTreeStatusHtml(counts){
    return COMPARISON_STATUSES.map(status => {
      const count=tverDisplayTreeStatusCount(counts, status);
      if(!count) return '';
      return `<span class="tver-tree-status-badge status-${escapeHtml(status)}"><span>${escapeHtml(statusDisplayLabel(status))}</span><strong>${escapeHtml(count)}</strong></span>`;
    }).join('');
  }

  function buildTverEntryDisplayLabelIndex(displayTree){
    const index=new Map();
    const visit=node => {
      if(!node || typeof node!=='object') return;
      const label=String(node.displayLabel || node.displayName || '');
      const entryIndexes=Array.isArray(node.entryIndexes) ? node.entryIndexes : [];
      entryIndexes.forEach(entryIndex => {
        if(Number.isInteger(entryIndex) && !index.has(entryIndex)) index.set(entryIndex, label);
      });
      (Array.isArray(node.children) ? node.children : []).forEach(visit);
    };
    const tree=displayTree && typeof displayTree==='object' ? displayTree : {};
    (Array.isArray(tree.roots) ? tree.roots : []).forEach(visit);
    (Array.isArray(tree.unattached) ? tree.unattached : []).forEach(visit);
    return index;
  }

  function buildTverEntityFieldTableHtml(node, entries, filters){
    const safe=node && typeof node==='object' ? node : {};
    const safeEntries=Array.isArray(entries) ? entries : [];
    const criteria=buildTverEntryFilterCriteria(filters);
    const indexes=(Array.isArray(safe.entryIndexes) ? safe.entryIndexes : []).filter(entryIndex => Number.isInteger(entryIndex) && entryIndex>=0 && entryIndex<safeEntries.length && safeEntries[entryIndex] && matchesTverEntryFilters(safeEntries[entryIndex], criteria));
    const rows=indexes.map(entryIndex => {
      const entry=safeEntries[entryIndex];
      const status=entry.displayStatus || entry.comparisonStatus || '';
      const reason=entry.reason || entry.conservativeReason || '';
      const ruleBasis=entry.ruleBasis || '';
      return `<tr data-entry-index="${escapeHtml(entryIndex)}"><td>${escapeHtml(entry.field)}</td><td class="result-status">${escapeHtml(statusDisplayLabel(status))}</td><td>${escapeHtml(formatTverDisplayValue(entry, 'setting'))}</td><td>${escapeHtml(formatTverDisplayValue(entry, 'csv'))}</td><td>${escapeHtml(reason)}${ruleBasis ? `<div class="detail">${escapeHtml(ruleBasis)}</div>` : ''}</td></tr>`;
    }).join('');
    if(!rows) return '';
    return `<div class="tver-entity-fields" data-node-fields><table class="tver-entity-field-table"><thead><tr><th>項目</th><th>比較結果</th><th>設定表値</th><th>CSV値</th><th>理由／ルール根拠</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function buildTverDisplayTreeNodeHtml(node, entries, filters){
    const safe=node && typeof node==='object' ? node : {};

    const nodeKey=String(safe.nodeKey ?? '');

    const expanded=level==='Campaign';
    const directCount=Array.isArray(safe.entryIndexes) ? safe.entryIndexes.length : 0;

  function buildTverDisplayTreeHtml(displayTree, entries, filters){
    const tree=displayTree && typeof displayTree==='object' ? displayTree : {};
    const roots=Array.isArray(tree.roots) ? tree.roots : [];
    const unattached=Array.isArray(tree.unattached) ? tree.unattached : [];

  function renderTverRun(run, options){
    const config=options || {};
    const filters={ ...defaultFilters(), ...(config.filters || tverPageState.filters) };
    const requestedLevel=config.activeLevel || (filters.level!=='all' ? filters.level : tverPageState.activeLevel);
    const activeLevel=TVER_HORIZONTAL_LEVELS.includes(requestedLevel) ? requestedLevel : 'Campaign';
    const effectiveFilters={ ...filters, level:activeLevel };
    const shown=filterTverDisplayEntries(run, effectiveFilters);
    const statusCounts=run && run.statusCounts || Object.fromEntries(COMPARISON_STATUSES.map(status => [status, 0]));
    const projectedCounts=projectTverStatusCounts(statusCounts);
    const statusHtml=TVER_DISPLAY_STATUSES.map(status => `<div class="status-count ${tverHorizontalStatusClass(status)}"><span>${escapeHtml(status)}</span><strong>${projectedCounts[status] || 0}</strong></div>`).join('');
    const horizontalView=buildTverHorizontalViewModel(run, activeLevel, filters);
    const horizontalHtml=`${buildTverLevelTabsHtml(activeLevel)}${buildTverHorizontalTableHtml(horizontalView)}`;
    const summaryContentHtml=`<div class="status-counts">${statusHtml}</div>`;
    const summaryHtml=`<div class="tver-result-summary" aria-label="チェック結果">${summaryContentHtml}</div>`;
    const diagnosticsHtml=run && run.diagnostics && run.diagnostics.length ? `<details><summary>診断コード（${run.diagnostics.length}件）</summary><pre>${escapeHtml(run.diagnostics.map(issue => issue.code || String(issue)).join('\n'))}</pre></details>` : '';
    const mainHtml=`${horizontalHtml}${diagnosticsHtml}`;
    const html=`${summaryHtml}${mainHtml}`;
    const doc=config.document===undefined ? (typeof document!=='undefined' ? document : null) : config.document;
    if(doc && typeof doc.getElementById==='function'){
      const resultSummary=doc.getElementById('tver-result-summary');
      if(resultSummary){ resultSummary.innerHTML=summaryContentHtml; resultSummary.classList && resultSummary.classList.remove('hidden'); }
      const panel=doc.getElementById('results-panel');
      if(panel){ panel.innerHTML=resultSummary ? mainHtml : html; panel.classList && panel.classList.remove('hidden'); bindTverHorizontalInteractions(panel); syncTverHorizontalScrollAccess(panel); syncTverHorizontalHeaderHeights(panel); scheduleTverHorizontalStickySync(panel); }

  function fileDescription(file){
