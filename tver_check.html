  // 同一业务语义可有多个完全重复来源；不同语义绝不按文档顺序猜选。
  function tverA17UniqueBusinessCandidate(candidates){
    const groups=new Map();
    (candidates || []).forEach(candidate => {
      const rawValue=strictText(candidate && candidate.source && candidate.source.rawValue).trim();
      if(!candidate || !candidate.source || !rawValue) return;
      const semanticKey=candidate.semanticKey || (candidate.canonicalValue!==null && candidate.canonicalValue!==undefined
        ? `canonical:${candidate.canonicalValue}`
        : `raw:${rawValue}`);
      if(!groups.has(semanticKey)) groups.set(semanticKey, []);
      groups.get(semanticKey).push(candidate);
    });
    const allSources=uniqueSourceRefs((candidates || []).map(candidate => candidate && candidate.source));
    if(groups.size!==1) return { unique:false, candidate:null, sources:allSources };
    const group=[...groups.values()][0];
    return { unique:true, candidate:group[0], sources:allSources };
  }

  // NO030：pref 専用の ID 正規化。47 都道府県辞書に存在する 1..47 のみ 2 桁へ揃える。
  // 未知・範囲外・辞書外の値は null（要確認）とし、他フィールドへは適用しない。
  function tverPrefCanonicalIds(rawValue){
    const raw=strictText(rawValue).trim();
    if(raw==='') return '';
    const tokens=raw.split(/[\s,]+/).map(value => value.trim()).filter(Boolean);
    if(!tokens.length) return '';
    const known=new Set((TVER_ID_DICTIONARIES.pref || []).map(entry => entry.id));
    const ids=[];
    for(const token of tokens){
      if(/^\d+$/.test(token)){
        const padded=token.padStart(2,'0');
        if(!known.has(padded)) return null;
        ids.push(padded);
        continue;
      }
      if(known.has(token)){ ids.push(token); continue; }
      return null;
    }
    return [...new Set(ids)].sort().join(' ');
  }

  // NO030：設定表「放送局●」の放送局名/略称を、参照 Excel の対応表（TVER_MEDIA_STATION_ALIASES）と
  // 正式名称の完全一致だけで解決する。部分一致・推測はしない（NNN チャンネルは別分類のまま）。
  function resolveTverMediaStationGroups(rawValue){
    const raw=strictText(rawValue).trim();
    if(!raw) return [];
    const text=raw.startsWith('○') ? raw.slice(1).trim() : raw;
    if(/^\d+(?:[\s,]+\d+)*$/.test(text) || text.includes('local_broadcaster')) return [];
    const tokens=text.split(/[、,，\s]+/).map(value => value.trim()).filter(Boolean);
    if(!tokens.length) return [];
    const groups=[];
    for(const token of tokens){
      const formal=TVER_MEDIA_STATION_ALIASES[token] || (TVER_MEDIA_GROUPS.includes(token) ? token : null);
      if(!formal) return [];
      if(!groups.includes(formal)) groups.push(formal);
    }
    return groups;
  }

  // NO030：CSV media ID 群と、設定表が指定した放送局群の関係だけを評価する。
  // 完全な期待 ID 集合を証明できない場合は「一致」を作らない。
  function tverMediaIdsForGroups(groups){
    const expected=new Set(groups || []);
    return (TVER_ID_DICTIONARIES.media || []).filter(entry => expected.has(entry.group)).map(entry => entry.id);
  }
  // NO005：放送局名指定は「指定放送局に属する全 ID が CSV に存在すること」を要求する。
  // 指定放送局自身の ID が 1 件でも欠ければ不一致。他の放送局 ID の増減は判定に混ぜず
  // （extraGroups は診断用に保持）、除外指定がある場合だけ別評価する。
  function evaluateTverMediaStationEvidence(expectedGroups, csvValue, csvEvidenceState){
    const expectedGroupsList=[...new Set(expectedGroups || [])];
    const expectedGroupsSet=new Set(expectedGroupsList);
    const ids=parseTverIdSet(csvValue).ids;
    const expectedGroupIds=new Map(expectedGroupsList.map(group => [group, tverMediaIdsForGroups([group])]));
    const unknownExpectedGroups=expectedGroupsList.filter(group => !(expectedGroupIds.get(group) || []).length);
    if(unknownExpectedGroups.length) return { status:'需确认', reason:'MEDIA_EXPECTED_GROUP_UNKNOWN', detailIds:[], hitGroups:[], missingGroups:[], extraGroups:[], hitCounts:{}, unknownExpectedGroups, expectedIds:[], missingIds:[], extraIds:[] };
    // NO005：指定放送局の全 ID を期待集合とし、CSV 側に無い ID を過不足なく求める。
    const expectedIds=tverSortIdsForDisplay([...new Set(expectedGroupsList.flatMap(group => expectedGroupIds.get(group) || []))]);
    const expectedSet=new Set(expectedIds);
    const csvSet=new Set(ids);
    const missingIds=tverSortIdsForDisplay(expectedIds.filter(id => !csvSet.has(id)));
    // 他放送局の ID は現行規則どおり判定対象外。診断用に extraIds として保持するだけ。
    const extraIds=tverSortIdsForDisplay(ids.filter(id => !expectedSet.has(id)));
    // NO005：Schema 不支持・セル来源未取得は値の有無にかかわらず要確認（明示空白とは区別）。
    if(csvEvidenceState!=='available') return { status:'需确认', reason:'CSV_MEDIA_ID_NOT_PROVIDED', detailIds:[], expectedIds, missingIds:[], extraIds:[] };
    if(!ids.length) return { status:'不一致', reason:null, detailIds:[], hitGroups:[], missingGroups:expectedGroupsList, extraGroups:[], hitCounts:{}, expectedIds, missingIds:tverSortIdsForDisplay(expectedIds), extraIds:[] };
    const dictionary=new Map((TVER_ID_DICTIONARIES.media || []).map(entry => [entry.id, entry]));
    const unknown=ids.filter(id => !dictionary.has(id));
    if(unknown.length) return { status:'需确认', reason:'MEDIA_ID_NOT_IN_DICTIONARY', detailIds:unknown, expectedIds, missingIds:[], extraIds:[] };
    const unclassified=ids.filter(id => !String(dictionary.get(id).group || '').trim());
    if(unclassified.length) return { status:'需确认', reason:'MEDIA_GROUP_UNCLASSIFIED', detailIds:unclassified, expectedIds, missingIds:[], extraIds:[] };
    const groupIds=new Map();
    ids.forEach(id => {
      const group=dictionary.get(id).group;
      if(!groupIds.has(group)) groupIds.set(group, []);
      groupIds.get(group).push(id);
    });
    const hitGroups=expectedGroupsList.filter(group => (groupIds.get(group) || []).length > 0);
    const missingGroups=expectedGroupsList.filter(group => !(groupIds.get(group) || []).length);
    const extraGroups=[...groupIds.keys()].filter(group => !expectedGroupsSet.has(group));
    const hitCounts=Object.fromEntries(expectedGroupsList.map(group => [group, (groupIds.get(group) || []).length]));
    // NO005：群の命中可否ではなく、指定局の期待 ID がすべて揃った場合だけ一致とする。
    if(!missingIds.length) return { status:'一致', reason:null, detailIds:[], hitGroups, missingGroups, extraGroups, hitCounts, expectedIds, missingIds:[], extraIds };
    return { status:'不一致', reason:null, detailIds:[], hitGroups, missingGroups, extraGroups, hitCounts, expectedIds, missingIds, extraIds };
  }

  // NO031：放送局の「除外」指定（例：CX除外）を、指定放送局リストとして誤解釈しない。
  function resolveTverMediaExclusionSelection(rawValue){
    const raw=strictText(rawValue).trim().replace(/^○\s*/, '');
    const match=raw.match(/^(.+?)除外$/);
    if(!match) return { groups:[], tokens:[] };
    const tokens=match[1].split(/[\s,，、]+/).map(value => value.trim()).filter(Boolean);
    const groups=[];
    const unresolved=[];
    tokens.forEach(token => {
      const resolved=resolveTverMediaStationGroups(token);
      if(resolved.length) groups.push(...resolved); else unresolved.push(token);
    });
    return { groups:[...new Set(groups)], tokens, unresolved };
  }
  function evaluateTverMediaExclusionEvidence(excludedGroups, csvValue, csvEvidenceState){
    const excludedGroupsList=[...new Set(excludedGroups || [])];
    const excluded=new Set(excludedGroupsList);
    const ids=parseTverIdSet(csvValue).ids;
    const unknownExcludedGroups=excludedGroupsList.filter(group => !tverMediaIdsForGroups([group]).length);
    if(unknownExcludedGroups.length) return { status:'需确认', reason:'MEDIA_EXCLUDED_GROUP_UNKNOWN', detailIds:[], violatedGroups:[], violatedIds:[], unknownExcludedGroups };
    // NO005：Schema 不支持・セル来源未取得は値の有無にかかわらず要確認（明示空白とは区別）。
    if(csvEvidenceState!=='available') return { status:'需确认', reason:'CSV_MEDIA_ID_NOT_PROVIDED', detailIds:[], violatedGroups:[], violatedIds:[] };
    // 明示的な空白は「除外対象を1件も選択していない」ため除外条件成立（一致）。
    if(!ids.length) return { status:'一致', reason:null, detailIds:[], violatedGroups:[], violatedIds:[] };
    const dictionary=new Map((TVER_ID_DICTIONARIES.media || []).map(entry => [entry.id, entry]));
    const unknown=ids.filter(id => !dictionary.has(id));
    if(unknown.length) return { status:'需确认', reason:'MEDIA_ID_NOT_IN_DICTIONARY', detailIds:unknown };
    const unclassified=ids.filter(id => !String(dictionary.get(id).group || '').trim());
    if(unclassified.length) return { status:'需确认', reason:'MEDIA_GROUP_UNCLASSIFIED', detailIds:unclassified };
    const violatedIds=ids.filter(id => excluded.has(dictionary.get(id).group));
    const violatedGroups=excludedGroupsList.filter(group => violatedIds.some(id => dictionary.get(id).group===group));
    if(violatedGroups.length) return { status:'不一致', reason:'MEDIA_EXCLUSION_VIOLATED', detailIds:violatedIds, violatedGroups, violatedIds };
    return { status:'一致', reason:null, detailIds:[], violatedGroups:[], violatedIds:[] };
  }

  // NO030：subgenre の「指定／除外」マーカーだけを厳密に 1 つへ解決する。
  function resolveTverSubgenreMarker(entity){
    const sources=tverA17TargetingSources(entity, '番組サブジャンル●');
    const markers=sources.filter(source => ['指定','除外'].includes(strictText(source && source.rawValue).trim()));
    const values=[...new Set(markers.map(source => strictText(source && source.rawValue).trim()))];
    if(!markers.length) return { state:'absent', value:null, sources:[], primarySource:null };
    if(values.length!==1) return { state:'ambiguous', value:values.join(' / '), sources:uniqueSourceRefs(markers), primarySource:markers[0] };
    return { state:'available', value:values[0], sources:uniqueSourceRefs(markers), primarySource:markers[0] };
  }
  // A17-2 的 Setting resolver 只读取既有 targeting 证据；绝不回写 targeting、entity.fields 或 matcher 输入。
  function tverSettingSourceIsMediaOnly(source){
    const raw=strictText(source && source.rawValue).trim();
    if(strictText(source && source.columnName).trim()!=='放送局●' || raw==='') return false;
    if(raw==='○' || raw==='EX除外' || /^\d+(?:[\s,]+\d+)*$/.test(raw)) return true;
    if(raw.includes('local_broadcaster')) return false;
    const stationText=raw.startsWith('○') ? raw.slice(1).trim() : raw;
    const stationCodes=stationText.split(',').map(code => code.trim());
    const knownStationCodes=new Set(['NTV','TBS','CX','EX','TX']);
    return stationCodes.length>0 && stationCodes.every(code => knownStationCodes.has(code));
  }

  // NO032-GATE-FIX2：媒体欄が「放送局名指定・放送局除外・数字ID指定／除外」のいずれかで
  // 一意に解決できる場合、管理画面手順の既定どおりローカル局は 139 ID 全選択を期待する。
  // 来源が複数・矛盾・未解決の場合は全選択を推定せず要確認にする。
  function resolveTverLocalBroadcasterDefaultFromMedia(broadcasterSources){
    const business=(broadcasterSources || []).filter(source => {
      const raw=strictText(source && source.rawValue).trim();
      return raw!=='' && raw!=='○';
    });
    if(!business.length) return { state:'none', sources:[] };
    const texts=[...new Set(business.map(source => strictText(source.rawValue).trim()))];
    if(texts.length!==1) return { state:'ambiguous', reason:'LOCAL_BROADCASTER_MEDIA_SOURCE_CONFLICT', sources:business };
    const raw=texts[0];
    const numeric=raw.match(/^(\d+(?:[\s,]+\d+)*)(?:\s*除外)?$/);
    if(numeric){
      const ids=parseTverIdSet(numeric[1]).ids;
      const known=new Set(TVER_ID_DICTIONARIES.media.map(entry => entry.id));
      const unknown=ids.filter(id => !known.has(id));
      if(unknown.length) return { state:'ambiguous', reason:'MEDIA_ID_NOT_IN_DICTIONARY', sources:business, detailIds:unknown };
      return { state:'full', reason:null, sources:business, mediaText:raw };
    }
    const exclusion=raw.match(/^○?\s*(.+?)除外$/);
    if(exclusion){
      const tokens=exclusion[1].split(/[\s,，、.]+/).map(value => value.trim()).filter(Boolean);
      const groups=[]; const unresolved=[];
      tokens.forEach(token => {
        const resolved=resolveTverMediaStationGroups(token);
        if(resolved.length) groups.push(...resolved); else unresolved.push(token);
      });
      if(!tokens.length || unresolved.length || !groups.length) return { state:'ambiguous', reason:'MEDIA_EXCLUSION_STATION_UNRESOLVED', sources:business };
      return { state:'full', reason:null, sources:business, mediaText:raw };
    }
    const groups=resolveTverMediaStationGroups(raw);
    // NO032-GATE-FIX3：普通の放送局名指定は「その局を選ぶ」だけで、ローカル局の全選択を意味しない。
    // 除外指定・数字指定とは分離し、CSV local が明示空白なら一致、値があれば既存の
    // LOCAL_BROADCASTER_VALUE_WHEN_NOT_REQUIRED で不一致とする。
    if(groups.length) return { state:'not_required', reason:null, sources:business, mediaText:raw };
    return { state:'ambiguous', reason:'LOCAL_BROADCASTER_MEDIA_SOURCE_UNRECOGNIZED', sources:business };
  }

  function resolveSettingTargetingForComparison(entity, field){
    const broadcasterSources=tverA17TargetingSources(entity, '放送局●');
    if(field==='media'){
      const numericCandidates=broadcasterSources
        .filter(source => /^\d+(?:[\s,]+\d+)*$/.test(strictText(source.rawValue).trim()))
        .map(source => ({ source, canonicalValue:tverA17CanonicalIdSet(source.rawValue, 'media') }));
      const numeric=tverA17UniqueBusinessCandidate(numericCandidates);
      if(numeric.sources.length){
        const nonNumericSources=broadcasterSources.filter(source => {
          const raw=strictText(source.rawValue).trim();
          return raw!=='' && raw!=='○' && raw!=='local_broadcaster(ローカル局)は全選択' && !numericCandidates.some(candidate => candidate.source===source);
        });
        const evidenceSources=uniqueSourceRefs([...numeric.sources, ...nonNumericSources]);
        if(!numeric.unique || nonNumericSources.length) return tverA17TargetingResult({ rawValue:tverA17BusinessRawValue(evidenceSources), evidenceState:'ambiguous', sourceEvidence:evidenceSources, ruleBasis:'TVER_A17_2_MEDIA_NUMERIC_ID_SLOT', diagnostics:[{ code:'MEDIA_MULTIPLE_CONFLICTING_ID_SLOTS' }], shouldGenerate:true });
        const selected=numeric.candidate;
        return tverA17TargetingResult({ rawValue:strictText(selected.source.rawValue), canonicalValue:selected.canonicalValue, evidenceState:'available', comparable:selected.canonicalValue!==null, primarySource:selected.source, sourceEvidence:numeric.sources, ruleBasis:'TVER_A17_2_MEDIA_NUMERIC_ID_SLOT', diagnostics:selected.canonicalValue!==null ? [] : [{ code:'MEDIA_ID_NOT_IN_DICTIONARY' }], shouldGenerate:true });
      }
      // NO031-GATE-FIX1：除外来源を「最初の1件」で代表させず、同一 field の全業務来源を先に収集する。
      // 単一除外のみ確定扱い、複数除外・除外と指定の併存は要確認（証拠は全件保持）。
      const isBusinessMediaSource=source => {
        const raw=strictText(source && source.rawValue).trim();
        return raw!=='' && raw!=='○' && raw!=='local_broadcaster(ローカル局)は全選択';
      };
      const exclusionSources=broadcasterSources.filter(source => {
        const raw=strictText(source && source.rawValue).trim();
        return /^○?\s*.+除外$/.test(raw) && raw!=='EX除外';
      });
      if(exclusionSources.length){
        const exclusionTexts=[...new Set(exclusionSources.map(source => strictText(source.rawValue).trim()))];
        const otherBusiness=broadcasterSources.filter(source => isBusinessMediaSource(source) && !exclusionSources.includes(source));
        const evidenceSources=uniqueSourceRefs([...exclusionSources, ...otherBusiness]);
        const rawText=tverA17BusinessRawValue(evidenceSources);
        if(exclusionTexts.length>1){
          return tverA17TargetingResult({ rawValue:rawText, evidenceState:'ambiguous', sourceEvidence:evidenceSources, derivedFrom:evidenceSources, ruleBasis:'TVER_NO031_MEDIA_EXCLUSION', diagnostics:[{ code:'MEDIA_EXCLUSION_MULTIPLE_INDICATIONS' }] });
        }
        if(otherBusiness.length){
          // 例：CX除外 と CX（指定）が併存 → 互いに矛盾するため一意な要求を作らない。
          return tverA17TargetingResult({ rawValue:rawText, evidenceState:'ambiguous', sourceEvidence:evidenceSources, derivedFrom:evidenceSources, ruleBasis:'TVER_NO031_MEDIA_EXCLUSION', diagnostics:[{ code:'MEDIA_EXCLUSION_CONFLICT' }] });
        }
        const selection=resolveTverMediaExclusionSelection(exclusionTexts[0]);
        if(selection.groups.length && !selection.unresolved.length){
          return tverA17TargetingResult({ rawValue:exclusionTexts[0], evidenceState:'available', comparable:true, primarySource:exclusionSources[0], sourceEvidence:evidenceSources, derivedFrom:evidenceSources, stationGroups:[], mediaExclusion:{groups:selection.groups}, ruleBasis:'TVER_NO031_MEDIA_EXCLUSION', shouldGenerate:true });
        }
        return tverA17TargetingResult({ rawValue:exclusionTexts[0], evidenceState:'ambiguous', sourceEvidence:evidenceSources, derivedFrom:evidenceSources, ruleBasis:'TVER_NO031_MEDIA_EXCLUSION', diagnostics:[{ code:'MEDIA_EXCLUSION_STATION_UNRESOLVED' }] });
      }
      const nonMarker=broadcasterSources.filter(source => {
        const raw=strictText(source.rawValue).trim();

  // NO030-FIX1：入札セグメントは「確定した有効ID集合」だけを比較材料にする。

  function tverBidSegmentPlaceholder(rawValue){
    const raw=strictText(rawValue).trim();
    return raw==='' || raw==='-' || raw==='○' || raw==='●' || raw==='未設定' || raw==='なし' || raw.startsWith('※') || raw.startsWith('↓');
  }
  function tverBidSegmentIds(rawValue){
    const raw=strictText(rawValue).trim();
    if(!raw) return null;
    const tokens=raw.split(/[\s,，、]+/).map(value => value.trim()).filter(Boolean);
    if(!tokens.length) return null;
    if(!tokens.every(token => /^\d+$/.test(token))) return null;
    return [...new Set(tokens)].sort((left, right) => Number(left)-Number(right));
  }
  function classifyTverBidSetting(entity, field){
    const spec=tverA173RetargetFieldSpec(field);
    if(!spec) return { state:'unresolved', reason:'BID_FIELD_UNSUPPORTED', sources:[] };
    const sources=tverA173RetargetSettingSources(entity, field);
    if(!sources.length) return { state:'not-provided', sources:[], hasBusiness:false };
    const business=sources.filter(source => !tverBidSegmentPlaceholder(source && source.rawValue));
    if(!business.length) return { state:'empty', sources, hasBusiness:false };
    const settingMixed=business.filter(source => {
      const tokens=strictText(source && source.rawValue).split(/[\s,，、]+/).map(value => value.trim()).filter(Boolean);
      return tokens.length>1 && tokens.some(token => /^\d+$/.test(token)) && !tokens.every(token => /^\d+$/.test(token));
    });
    if(settingMixed.length) return { state:'unresolved', reason:'SETTING_BID_SEGMENT_VALUE_INVALID', sources, invalid:settingMixed, hasBusiness:true };
    const numeric=business.filter(source => tverBidSegmentIds(source && source.rawValue)!==null);
    if(!numeric.length) return { state:'unresolved', reason:'SETTING_BID_SEGMENT_TEXT_UNRESOLVED', sources, invalid:business, hasBusiness:true };
    const sets=[...new Set(numeric.map(source => tverBidSegmentIds(source.rawValue).join(' ')))];
    if(sets.length!==1) return { state:'ambiguous', reason:'SETTING_BID_SEGMENT_MULTIPLE_VALUES', sources, hasBusiness:true };
    // NO030-FIX2：同一 row 上の「名称セル＋IDセル」だけを名称として許容する。
    // 別 row／對応 ID の無い未解析テキストは「有効だが解釈不能な業務内容」として一致判定を禁止する。
    const numericRows=new Set(numeric.map(source => source && source.rowNumber).filter(row => row!==null && row!==undefined));
    const unpaired=business.filter(source => !numeric.includes(source) && !(source && numericRows.has(source.rowNumber)));
    if(unpaired.length) return { state:'unresolved', reason:'SETTING_BID_SEGMENT_TEXT_UNRESOLVED', sources, invalid:unpaired, hasBusiness:true };
    return { state:'ids', ids:sets[0].split(' ').filter(Boolean), raw:sets[0], sources, hasBusiness:true, invalid:business.filter(source => !numeric.includes(source)) };

  function classifyTverBidCsv(entity, spec){

  function tverA173BidDecision(field, settingState, csvState){

      csvValue:csvState.state==='ids' ? csvState.raw : (csvState.sources.length ? tverA17BusinessRawValue(csvState.sources) : ''),
      settingCanonical, csvCanonical,

    if(csvState.state==='ambiguous') return { ...base, status:'需确认', reason:'CSV_BID_SEGMENT_MULTIPLE_VALUES' };
    if(settingState.state==='empty'){
      return { ...base, status:csvState.state==='ids' ? '不一致' : '一致', reason:null };

    if(!settingResult.shouldGenerate && !csvHasBusiness) return [];
    const bothComparable=settingResult.comparable && csvResult.comparable && settingResult.evidenceState==='available' && csvResult.evidenceState==='available';
    let comparisonStatus=null;
    let conservativeReason=null;
    if(!bothComparable || settingResult.evidenceState==='ambiguous' || csvResult.evidenceState==='ambiguous'){
      comparisonStatus='需确认';
      conservativeReason=(settingResult.diagnostics[0] && settingResult.diagnostics[0].code) || (csvResult.diagnostics[0] && csvResult.diagnostics[0].code) || 'TVER_A17_5_UPLOAD_SEGMENT_EXPANSION_UNCONFIRMED';
    }else if(String(settingResult.canonicalValue)===String(csvResult.canonicalValue)){
      comparisonStatus='一致';
    }else{
      comparisonStatus='不一致';
    }
    const derivedFrom=uniqueSourceRefs([...(settingResult.derivedFrom || []), ...(csvResult.derivedFrom || [])]);
    return [{ ...(base || {}), field:'upload_segment_expansion_threshold', settingValue:settingResult.rawValue, csvValue:csvResult.rawValue, settingSource:settingResult.primarySource, csvSource:csvResult.primarySource, settingCanonical:{ value:settingResult.canonicalValue, ruleId:settingResult.ruleBasis, evidenceState:settingResult.evidenceState }, csvCanonical:{ value:csvResult.canonicalValue, ruleId:csvResult.ruleBasis, evidenceState:csvResult.evidenceState }, settingEvidenceState:settingResult.evidenceState, csvEvidenceState:csvResult.evidenceState, comparable:bothComparable, alwaysDisplay:true, ruleBasis:settingResult.ruleBasis, comparisonStatus, conservativeReason, sourceEvidence:{ setting:settingResult.sourceEvidence, csv:csvResult.sourceEvidence, derivedFrom } }];
  }

  // 仅为 comparison-only 证据测试保留的窄兜底：不改 matching 结论，且只在
  // Register 案件恰好只有一个 Setting ADG 与一个 CSV ADG、结构字段不足导致
  // matcher 未能给出候选时使用。真实多候选／多 ADG 一律不猜。
  function tverA173SingleAdGroupComparisonFallback(match, setting, settingModel, csvTree, schemaKind){
    if(schemaKind!=='register-without-ids' || !match || match.level!=='Ad Group' || match.status==='matched') return null;
    if(match.reasonCode!=='MISSING_ADGROUP_STRUCTURAL_FIELD' || !setting) return null;
    const settingAdGroups=settingModel && Array.isArray(settingModel.adGroups) ? settingModel.adGroups : [];
    const csvAdGroups=csvTree && Array.isArray(csvTree.adGroups) ? csvTree.adGroups : [];
    if(settingAdGroups.length!==1 || csvAdGroups.length!==1 || settingAdGroups[0].key!==setting.key) return null;
    return csvAdGroups[0];
  }

  function tverA17CsvAgeParse(csvEntity, schemaKind){
    const start=strictText(readTverA17TargetingCsvValue(csvEntity, schemaKind, 'start_age')).trim();
    const end=strictText(readTverA17TargetingCsvValue(csvEntity, schemaKind, 'end_age')).trim();
    if(/^\d+$/.test(start) && /^\d+$/.test(end)){
      const minAge=Number(start);
      const maxAge=Number(end);
      return { canonicalValue:`${minAge}-${maxAge}`, minAge, maxAge, upperOpen:false, ruleId:'TVER_A17_2_AGE_EXACT_RANGE' };
    }
    if(/^\d+$/.test(start) && end===''){
      const minAge=Number(start);
      // CSV 側 end_age 空欄（= 上限未指定）も canonical 上は X-100 に揃える。
      // ただし end_age=100 の「閉区間 100」と区別できるよう upperOpen は true のまま保持し、
      // raw（start/end）は一切書き換えない。
      return { canonicalValue:`${minAge}-${TVER_TARGETING_MAX_AGE}`, minAge, maxAge:TVER_TARGETING_MAX_AGE, upperOpen:true, ruleId:'TVER_C3_C4_4B_AGE_OPEN_UPPER_BOUND' };
    }
    return null;
  }

  function tverA17CsvCanonical(field, csvValue, csvEntity, schemaKind){
    if(field==='age'){
      const parsed=tverA17CsvAgeParse(csvEntity, schemaKind);
      return parsed ? parsed.canonicalValue : null;
    }
    if(field==='genre_exclude') return tverA17CsvEvidenceState(schemaKind, field, csvEntity)==='available'
      ? tverA17CanonicalIdSet(csvValue, 'genre') : null;
    if(field==='pref') return tverA17CsvEvidenceState(schemaKind, 'pref', csvEntity)==='available'
      ? (strictText(csvValue).trim()==='' ? '' : tverPrefCanonicalIds(csvValue)) : null;
    if(field==='subgenre' || field==='subgenre_exclude'){
      // NO030：subgenre は CSV の英語 ID と日本語名（旧名称含む）の双方を受け付け、空欄は空集合として比較する。
      if(tverA17CsvEvidenceState(schemaKind, field, csvEntity)!=='available') return null;
      const rawSubgenre=strictText(csvValue).trim();
      if(rawSubgenre==='') return '';
      const viaNames=tverA17CanonicalNames(rawSubgenre, 'subgenre');
      return viaNames!==null ? viaNames : tverA17CanonicalIdSet(rawSubgenre, 'subgenre');
    }
    if(field==='gender') return tverA17GenderCanonical(csvValue);
    if(TVER_C3_C4_4D_TARGETING_SPECS[field]) return tverA17CsvEvidenceState(schemaKind, field, csvEntity)==='available'
      ? tverC344CsvCanonical(field, csvValue) : null;
    return tverA17CanonicalIdSet(csvValue, field==='subgenre_exclude' ? 'subgenre' : field);
  }

  function tverA17CsvEvidenceState(schemaKind, logicalField, entity){
    const field=tverA17CsvEvidenceFieldName(schemaKind, logicalField);
    if(!field) return 'unavailable';
    // NO032-GATE-FIX1：media / local_broadcaster は Schema の列と実セル来源が確認できた場合だけ
    // 「明示的な空白」と扱う。列欠落・未認識 Schema・来源なしは unavailable（＝要確認）へ分離する。
    if(logicalField==='media' || logicalField==='local_broadcaster'){
      return tverA17CsvEvidence(entity, schemaKind, logicalField).length ? 'available' : 'unavailable';
    }
    if(['start_age', 'end_age'].includes(logicalField)){
      const startEvidence=tverA17CsvEvidence(entity, schemaKind, 'start_age');
      const endEvidence=tverA17CsvEvidence(entity, schemaKind, 'end_age');
      return startEvidence.length && endEvidence.length ? 'available' : 'unavailable';
    }
    if(TVER_C3_C4_4D_TARGETING_SPECS[logicalField]) return tverA17CsvEvidence(entity, schemaKind, logicalField).length ? 'available' : 'unavailable';
    return 'available';
  }

  function tverA17CsvHasBusinessValue(field, csv, schemaKind){
    if(field==='age') return readTverA17TargetingCsvValue(csv, schemaKind, 'start_age')!=='' || readTverA17TargetingCsvValue(csv, schemaKind, 'end_age')!=='';
    return readTverA17TargetingCsvValue(csv, schemaKind, field)!=='';

  function buildTverA17TargetingComparisonInputs(setting, csv, schemaKind, base){

        && csvEvidenceState==='available' && tverIdListAllKnown(csvValue, 'media')
        ? buildTverIdSetDiff(resolved.canonicalValue, csvValue) : null;
      // NO005：ローカル局の全選択（139 ID）も完全集合比較し、不足・超過の双方を保持する。
      const localFullDiff=field==='local_broadcaster'
        && (resolved.ruleBasis==='TVER_NO032_LOCAL_BROADCASTER_DEFAULT_FULL_SELECTION' || resolved.ruleBasis==='TVER_C3_C4_3_LOCAL_BROADCASTER_FULL_SELECTION')
        && resolved.canonicalValue!==null && resolved.canonicalValue!==undefined && String(resolved.canonicalValue).trim()!==''
        && csvEvidenceState==='available' && tverIdListAllKnown(csvValue, 'local_broadcaster')
        ? buildTverIdSetDiff(resolved.canonicalValue, csvValue) : null;
      // NO005：監査用に期待集合・CSV 集合・不足・超過・除外違反を entry へ保持する（表示は差分 ID のみ）。
      const idDiff=mediaStationEvaluation

        : mediaNumericDiff

          : localFullDiff
            ? { kind:'local_broadcaster', expectedIds:localFullDiff.expectedIds, actualIds:localFullDiff.actualIds, missingIds:localFullDiff.missingIds, extraIds:localFullDiff.extraIds, violatedIds:[] }
            : null;
      const mediaEvaluationDetail=mediaStationEvaluation ? {
        status:mediaStationEvaluation.status, reason:mediaStationEvaluation.reason,

        hitGroups:mediaStationEvaluation.hitGroups || [], missingGroups:mediaStationEvaluation.missingGroups || [],
        extraGroups:mediaStationEvaluation.extraGroups || [], hitCounts:mediaStationEvaluation.hitCounts || {},
        violatedGroups:mediaStationEvaluation.violatedGroups || [], violatedIds:mediaStationEvaluation.violatedIds || [],
        expectedIds:mediaStationEvaluation.expectedIds || [], missingIds:mediaStationEvaluation.missingIds || [], extraIds:mediaStationEvaluation.extraIds || [],
        unknownExpectedGroups:mediaStationEvaluation.unknownExpectedGroups || [], unknownExcludedGroups:mediaStationEvaluation.unknownExcludedGroups || [],
        ...(resolved.stationGroups ? { expectedGroups:resolved.stationGroups } : {}),
        ...(resolved.mediaExclusion && resolved.mediaExclusion.groups ? { excludedGroups:resolved.mediaExclusion.groups } : {}),
      } : null;
      const ageGuard=field==='age' && (resolved.comparable || resolved.evidenceState!=='available' || csvEvidenceState!=='available')
        ? resolveTverGpAgeGuard({ field, settingEvidenceState:resolved.evidenceState, csvEvidenceState }, resolved.rawValue, csvValue)

        const csvEmpty=String(csvValue ?? '').trim()==='' && csvCanonical==='';

        const settingUnknown=resolved.canonicalValue===null && !settingEmpty && resolved.evidenceState!=='not_provided';

        if(schemaUnavailable && !csvEmpty){

        }else if((asrSetting && asrSetting.duplicate) || (asrCsv && asrCsv.duplicate)){

        }else if(settingEmpty && csvEmpty){

        }else if(settingEmpty!==csvEmpty){

      }else if(field==='local_broadcaster' && resolved.ruleBasis==='TVER_NO032_FIX3_LOCAL_BROADCASTER_NOT_REQUIRED_BY_STATION_NAME'){
        if(csvEvidenceState!=='available'){
          comparisonStatus='需确认';

          conservativeReason=null;
        }else if(csvCanonical===null){

      }else if(field==='local_broadcaster' && (resolved.ruleBasis==='TVER_NO032_LOCAL_BROADCASTER_DEFAULT_FULL_SELECTION' || resolved.ruleBasis==='TVER_C3_C4_3_LOCAL_BROADCASTER_FULL_SELECTION')){
        const expectedIds=parseTverIdSet(resolved.canonicalValue).ids;
        const actualIds=parseTverIdSet(csvValue).ids;

        }else if(actualIds.some(id => !localKnown.has(id)) || (!actualIds.length && csvLocalText!=='')){
