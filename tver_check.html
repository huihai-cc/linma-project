    return Boolean(tverPageState.recognition && tverPageState.recognition.ok && tverPageState.settingFile && tverPageState.csvFile);
  }

  function tverFileRecognitionFailure(file, role, code, message){
    return { ok:false, role, file:file || null, code, message };
  }

  function identifyTverSettingWorkbook(workbook, options){
    const config=options || {};
    const headerInfo=findSettingHeaderCandidates(workbook, config);
    const candidates=headerInfo && Array.isArray(headerInfo.candidates) ? headerInfo.candidates : [];
    if(candidates.length!==1){
      const code=candidates.length ? 'SETTING_HEADER_AMBIGUOUS' : 'SETTING_HEADER_NOT_FOUND';
      return { ok:false, role:'setting', code, workbook:null, model:null, candidate:null, message:'設定表として識別できません（TVer設定表の表頭を一意に確認できません）。' };
    }
    const model=parseTverSettingWorkbook(workbook, { ...config, fileName:config.fileName || '' });
    const issue=settingParseBlockingIssue(model);
    if(issue){
      return { ok:false, role:'setting', code:issue.code, workbook:null, model:null, candidate:null, message:'設定表として識別できません（TVer設定表の必須表頭を一意に確認できません）。' };
    }
    return { ok:true, role:'setting', code:null, workbook, model, candidate:candidates[0], message:'設定表として識別しました。' };
  }

  function identifyTverCsvText(text, options){
    const config=options || {};
    const parsed=parseCsvText(text, config);
    const issues=parsed && Array.isArray(parsed.parseIssues) ? parsed.parseIssues : [];
    const schema=parsed && parsed.schema || {};
    if(!schema.kind || issues.some(issue => issue && issue.code==='CSV_SCHEMA_UNRECOGNIZED')){
      return { ok:false, role:'csv', code:'CSV_SCHEMA_UNRECOGNIZED', parsedCsv:null, schemaKind:null, message:'CSVとして識別できません（TVer CSV Schemaを確認できません）。' };
    }
    return { ok:true, role:'csv', code:null, parsedCsv:parsed, schemaKind:schema.kind, message:`${schema.kind} として識別しました。` };
  }

  async function identifyTverSettingFile(file, options){
    const config=options || {};
    if(!file || !/\.xlsx$/i.test(file.name || '')) return tverFileRecognitionFailure(file, 'setting', 'UNSUPPORTED_FILE_FORMAT', '対応外形式です（.xlsx と .csv のみ使用できます）。');
    try{
      const reader=config.readSettingWorkbook || readSettingWorkbook;
      const workbook=await reader(file);
      return { ...identifyTverSettingWorkbook(workbook, { ...config, fileName:file.name || '' }), file };
    }catch(error){
      return tverFileRecognitionFailure(file, 'setting', 'SETTING_FILE_READ_ERROR', `識別できないファイルです（${fileNameDescription(file)}）。`);
    }
  }

  async function identifyTverCsvFile(file, options){
    const config=options || {};
    if(!file || !/\.csv$/i.test(file.name || '')) return tverFileRecognitionFailure(file, 'csv', 'UNSUPPORTED_FILE_FORMAT', '対応外形式です（.xlsx と .csv のみ使用できます）。');
    try{
      const reader=config.readCsvFile || readCsvFile;
      const text=await reader(file);
      return { ...identifyTverCsvText(text, { ...config, fileName:file.name || '' }), file, text };
    }catch(error){
      return tverFileRecognitionFailure(file, 'csv', 'CSV_FILE_READ_ERROR', `識別できないファイルです（${fileNameDescription(file)}）。`);
    }
  }

  function buildTverFileRecognitionMessage(result){
    const recognition=result || {};
    const setting=recognition.setting;
    const csv=recognition.csv;
    const lines=[`設定表：${fileNameDescription(setting && setting.file)}`, `CSV：${fileNameDescription(csv && csv.file)}`];
    if(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('setting')) lines.push('設定表が複数選択されています。1つだけ選択してください。');
    if(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('csv')) lines.push('CSVが複数選択されています。1つだけ選択してください。');
    if(Array.isArray(recognition.unsupported) && recognition.unsupported.length) lines.push(`対応外形式：${recognition.unsupported.map(item => fileNameDescription(item.file)).join('、')}（.xlsx と .csv のみ）`);
    if(Array.isArray(recognition.unrecognized) && recognition.unrecognized.length) lines.push(`識別できないファイル：${recognition.unrecognized.map(item => fileNameDescription(item.file)).join('、')}`);
    if(!setting && !(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('setting'))) lines.push('設定表が未選択です。');
    if(!csv && !(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('csv'))) lines.push('CSVが未選択です。');
    if(recognition.ok) lines.push('設定表とCSVを識別しました。チェック開始できます。');
    return lines.join('\n');
  }

  async function identifyTverFiles(files, options){
    const fileList=Array.from(files || []).filter(Boolean);
    const config=options || {};
    const inspected=await Promise.all(fileList.map(file => {
      if(/\.xlsx$/i.test(file.name || '')) return identifyTverSettingFile(file, config);
      if(/\.csv$/i.test(file.name || '')) return identifyTverCsvFile(file, config);
      return Promise.resolve(tverFileRecognitionFailure(file, 'unknown', 'UNSUPPORTED_FILE_FORMAT', '対応外形式です（.xlsx と .csv のみ使用できます）。'));
    }));
    const settings=inspected.filter(item => item && item.ok && item.role==='setting');
    const csvs=inspected.filter(item => item && item.ok && item.role==='csv');
    const unsupported=inspected.filter(item => item && item.code==='UNSUPPORTED_FILE_FORMAT');
    const unrecognized=inspected.filter(item => item && !item.ok && item.code!=='UNSUPPORTED_FILE_FORMAT');
    const conflicts=[];
    if(settings.length>1) conflicts.push('setting');
    if(csvs.length>1) conflicts.push('csv');
    const result={
      ok:unsupported.length===0 && unrecognized.length===0 && conflicts.length===0 && settings.length===1 && csvs.length===1,
      files:fileList, inspected, settings, csvs, unsupported, unrecognized, conflicts,
      setting:settings.length===1 && !conflicts.includes('setting') ? settings[0] : null,
      csv:csvs.length===1 && !conflicts.includes('csv') ? csvs[0] : null,
    };
    result.message=buildTverFileRecognitionMessage(result);
    return result;
  }

  function renderTverFileRecognition(doc){
    const recognition=tverPageState.recognition;
    const settingTarget=getElement(doc, 'setting-file-state');
    const csvTarget=getElement(doc, 'csv-file-state');
    const messageTarget=getElement(doc, 'upload-recognition-state');

    if(csvTarget){ csvTarget.textContent=`CSV：${fileNameDescription(recognition && recognition.csv && recognition.csv.file)}`; csvTarget.classList && csvTarget.classList.toggle('success', Boolean(recognition && recognition.csv)); }
    if(messageTarget){
      messageTarget.textContent=recognition ? recognition.message : '.xlsx と .csv を選択してください。';
      messageTarget.classList && messageTarget.classList.toggle('success', Boolean(recognition && recognition.ok));
      messageTarget.classList && messageTarget.classList.toggle('error', Boolean(recognition && !recognition.ok && recognition.files && recognition.files.length));
    }
  }

  function updateActionButtons(doc){
    const hasRun=Boolean(tverPageState.run && !tverPageState.busy);
    const runButton=getElement(doc, 'run-check'); if(runButton) runButton.disabled=Boolean(tverPageState.busy || !hasRecognizedTverFiles());
    const resetButton=getElement(doc, 'reset-check'); if(resetButton) resetButton.disabled=Boolean(tverPageState.busy || !(tverPageState.uploadFiles && tverPageState.uploadFiles.length) && !tverPageState.settingFile && !tverPageState.csvFile && !tverPageState.run);
    const copyButton=getElement(doc, 'copy-exceptions'); if(copyButton) copyButton.disabled=!hasRun;
    const exportButton=getElement(doc, 'export-exceptions'); if(exportButton) exportButton.disabled=!hasRun;
  }

  function buildTverUsageLogPayload(run){
    const counts=run && run.statusCounts || {};
    const count=status => Number.isFinite(Number(counts[status])) ? Number(counts[status]) : 0;
    const consistent=count('一致');
    const notation=count('表記ゆれ一致');
    const mismatch=count('不一致');
    const review=count('需确认');
    const unmatched=count('未匹配');
    return {
      tool:'TVer設定チェック',
      diffCount:mismatch + review + unmatched,
      criticalCount:mismatch + unmatched,
      note:`一致:${consistent} 表記ゆれ一致:${notation} 不一致:${mismatch} 需確認:${review} 未匹配:${unmatched}`,
    };
  }

  function recordTverUsage(run){
    if(typeof sendLog!=='function') return;
    const payload=buildTverUsageLogPayload(run);
    try{
      const request=sendLog(payload.tool, payload.diffCount, payload.criticalCount, payload.note);
      if(request && typeof request.then==='function'){
        return request
          .then(result => console.log('✅ TVer使用日志上报结果:', result))
          .catch(error => console.warn('⚠️ TVer使用日志上报失败（不影响QC）:', error));
      }
      return request;
    }catch(error){
      console.warn('⚠️ TVer使用日志上报失败（不影响QC）:', error);
      return undefined;
    }
  }

  async function setPageFiles(files, doc, options){
    const incoming=Array.from(files || []).filter(Boolean);
    tverPageState.uploadFiles=[...(Array.isArray(tverPageState.uploadFiles) ? tverPageState.uploadFiles : []), ...incoming];
    tverPageState.settingFile=null;
    tverPageState.csvFile=null;
    tverPageState.run=null;
    tverPageState.recognition={ ok:false, files:tverPageState.uploadFiles, setting:null, csv:null, message:'ファイルを識別しています。' };
    const token=(Number(tverPageState.recognitionToken) || 0)+1;

  async function readSettingWorkbook(file){
    if(typeof XLSX==='undefined' || !XLSX.read) throw new Error('ローカルSheetJSを読み込めません。');
    const bytes=await file.arrayBuffer();
    return XLSX.read(bytes, { type:'array', cellDates:false });
  }

  async function readCsvFile(file){
    if(typeof file.text==='function') return file.text();
    const bytes=await file.arrayBuffer();
    return new TextDecoder('utf-8').decode(bytes);
  }

  function settingParseBlockingIssue(model){
    return (model && model.diagnostics || []).find(issue => ['SETTING_HEADER_NOT_FOUND','SETTING_HEADER_AMBIGUOUS','SETTING_BUSINESS_HEADER_MISSING','SETTING_BUSINESS_HEADER_DUPLICATE'].includes(issue.code));
  }

  async function runTverCheck(options){
    const config=options || {};
    const doc=config.document===undefined ? (typeof document!=='undefined' ? document : null) : config.document;
    const settingFile=config.settingFile || tverPageState.settingFile;
    const csvFile=config.csvFile || tverPageState.csvFile;
    const directArtifacts=config.settingWorkbook!==undefined || config.csvText!==undefined;
    if(!directArtifacts && !hasRecognizedTverFiles()){
      const message=tverPageState.recognition && tverPageState.recognition.message || '設定表とCSVの両方を選択してください。'; showPageNotice(message, true, doc); return { ok:false, message };
    }
    if(config.settingWorkbook===undefined && !settingFile || config.csvText===undefined && !csvFile){
      const message='設定表とCSVの両方を選択してください。'; showPageNotice(message, true, doc); return { ok:false, message };
    }
    tverPageState.busy=true; updateActionButtons(doc); showPageNotice('チェックしています。しばらくお待ちください。', false, doc);
    try{
      const workbook=config.settingWorkbook || await readSettingWorkbook(settingFile);
      const csvText=config.csvText!==undefined ? config.csvText : await readCsvFile(csvFile);
      const settingModel=parseTverSettingWorkbook(workbook, { fileName:config.settingFileName || settingFile && settingFile.name || '' });
      const settingIssue=settingParseBlockingIssue(settingModel);
      if(settingIssue) throw new Error('設定表の表頭を一意に確認できません。');
      const parsedCsv=parseCsvText(csvText, { fileName:config.csvFileName || csvFile && csvFile.name || '' });
      if(!parsedCsv.schema.kind) throw new Error('CSV Schemaを識別できません。');
      if(parsedCsv.parseIssues.some(issue => issue.code==='CSV_SCHEMA_UNRECOGNIZED')) throw new Error('CSV Schemaを識別できません。');
      const dictionaryState=validateIdDictionaries(getTverIdDictionaries());
      if(!dictionaryState.valid) throw new Error('ID主データの検証に失敗しました。');
      const csvTree=parsedCsv.schema.kind==='edit-with-ids' ? buildEditTree(parsedCsv) : buildRegisterTree(parsedCsv);
      const matching=matchTverEntities(settingModel, csvTree, { schemaKind:parsedCsv.schema.kind, conversionContext:createTverConversionContext(parsedCsv.schema.kind, csvTree) });
      const run=buildRunFromModels(settingModel, csvTree, matching, parsedCsv);
      tverPageState.run=run; tverPageState.activeLevel='Campaign'; tverPageState.filters=defaultFilters();
      renderTverRun(run, { document:doc, activeLevel:'Campaign', filters:tverPageState.filters });
      recordTverUsage(run);
      showPageNotice('', false, doc);
      return { ok:true, run };
    }catch(error){
      const message=error && error.message ? error.message : 'チェック中にエラーが発生しました。'; showPageNotice(message, true, doc); return { ok:false, message };
    }finally{ tverPageState.busy=false; updateActionButtons(doc); }
  }

  function makeSyntheticExampleRun(){
    const run=buildComparisonRun({ fields:[
      { field:'budget', settingValue:'Synthetic planned value', csvValue:'Synthetic downloaded value', ruleBasis:'strict' },
      { field:'device', settingValue:'SP／PC', csvValue:'android ios pc', ruleBasis:'TVER_260605_DEVICE_SP_PC' },
      { field:'city', settingValue:'Synthetic City', csvValue:'Synthetic City', ruleBasis:'strict' },
      { field:'entity', settingValue:'Synthetic unmatched setting', csvValue:'', ruleBasis:'SYNTHETIC', comparisonStatus:'未匹配' },
    ]});
    run.entries.forEach((entry, index) => { entry.level=index<2?'Campaign':'Ad'; entry.targetName=`Synthetic Target ${index+1}`; entry.reason=entry.conservativeReason || (index===0?'値が一致しません':''); entry.sourceRefs={ setting:{ fileName:'synthetic-setting.xlsx', sheetName:'配信設計', rowNumber:index+2, columnName:entry.field, rawValue:entry.settingRawValue }, csv:{ fileName:'synthetic-download.csv', sheetName:null, rowNumber:index+2, columnName:entry.field, rawValue:entry.csvRawValue } }; });
    run.schemaKind='register-without-ids'; run.businessRole='登録CSV：入稿内容の整合性チェックです。\n管理画面に正しく登録済みであることを証明するものではありません。'; return run;
  }

  function triggerExceptionDownload(csv, options){
    const config=options || {};
    const doc=config.document || (typeof document!=='undefined' ? document : null);
    const BlobCtor=config.BlobCtor || (typeof Blob!=='undefined' ? Blob : null);
    const URLApi=config.URLApi || (typeof URL!=='undefined' ? URL : null);
    const schedule=config.schedule || setTimeout;
    if(!doc || !doc.body || !doc.createElement || !BlobCtor || !URLApi || !URLApi.createObjectURL) return null;
    const blob=new BlobCtor([csv], { type:'text/csv;charset=utf-8' });
    const objectUrl=URLApi.createObjectURL(blob);
    const link=doc.createElement('a');
    link.href=objectUrl;
    link.download=config.fileName || 'tver_check_exceptions.csv';
    doc.body.appendChild(link);
    link.click();
    if(typeof link.remove==='function') link.remove(); else if(link.parentNode) link.parentNode.removeChild(link);
    schedule(() => { if(URLApi.revokeObjectURL) URLApi.revokeObjectURL(objectUrl); }, 1000);
    return objectUrl;
  }

  function safeExportExceptionCsv(doc){
    if(!tverPageState.run || typeof Blob==='undefined' || typeof URL==='undefined' || !URL.createObjectURL){ showPageNotice('CSVを出力できる結果がありません。', true, doc); return; }
    const csv=buildExceptionCsv(tverPageState.run, { filters:tverPageState.filters });
    if(tverPageState.objectUrl && URL.revokeObjectURL) URL.revokeObjectURL(tverPageState.objectUrl);
    const now=new Date(); const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
    tverPageState.objectUrl=triggerExceptionDownload(csv, { document:doc, fileName:`tver_check_exceptions_${stamp}.csv` });
    if(!tverPageState.objectUrl) showPageNotice('この環境ではCSVを出力できません。', true, doc);
  }

  function clearTverPage(state, options){
    const current=state || tverPageState;
    const config=options || {}; const revoke=config.revokeObjectUrl || (typeof URL!=='undefined' && URL.revokeObjectURL ? URL.revokeObjectURL.bind(URL) : null);
    if(current.objectUrl && revoke) revoke(current.objectUrl);
    const cleared={ settingFile:null, csvFile:null, uploadFiles:[], recognition:null, recognitionToken:0, run:null, error:'', busy:false, activeLevel:'Campaign', filters:defaultFilters(), objectUrl:null };
    if(!state) tverPageState=cleared;
    const doc=config.document===undefined ? (typeof document!=='undefined' ? document : null) : config.document;
    if(doc){
      const input=getElement(doc, 'tver-file-input'); if(input) input.value='';
      ['setting-file-state','csv-file-state'].forEach(id => { const target=getElement(doc, id); if(target) target.textContent=id==='setting-file-state' ? '設定表：未選択' : 'CSV：未選択'; target && target.classList && target.classList.remove('success'); });
      const recognition=getElement(doc, 'upload-recognition-state'); if(recognition){ recognition.textContent='.xlsx と .csv を選択してください。'; recognition.classList && recognition.classList.remove('success'); recognition.classList && recognition.classList.remove('error'); }
      const zone=getElement(doc, 'tver-upload-zone'); if(zone && zone.classList) zone.classList.remove('drag-over');
      clearTverResults(doc); showPageNotice('', false, doc); updateActionButtons(doc);
    }
    return cleared;
  }

  function bindTverPage(){
    if(typeof document==='undefined') return;
    const input=getElement(document, 'tver-file-input');
    const zone=getElement(document, 'tver-upload-zone');
    if(input && zone){
      input.addEventListener && input.addEventListener('change', event => setPageFiles(event.target.files, document));
      ['dragenter','dragover'].forEach(eventName => zone.addEventListener && zone.addEventListener(eventName, event => { event.preventDefault(); zone.classList && zone.classList.add('drag-over'); }));
      ['dragleave','drop'].forEach(eventName => zone.addEventListener && zone.addEventListener(eventName, event => { event.preventDefault(); zone.classList && zone.classList.remove('drag-over'); }));
      zone.addEventListener && zone.addEventListener('drop', event => setPageFiles(event.dataTransfer && event.dataTransfer.files, document));
    }
    const runButton=getElement(document,'run-check'); if(runButton) runButton.addEventListener('click', () => runTverCheck());
    const resetButton=getElement(document,'reset-check'); if(resetButton) resetButton.addEventListener('click', () => clearTverPage());
    updateActionButtons(document);
  }

  bindTverPage();
  })();
  </script>
