  const TVER_ID_DICTIONARY_COUNTS={ media:240, local_broadcaster:139, pref:47, carrier:5, genre:6, subgenre:44, contents_group:10, affinity:17 };

  function decodeBase64Utf8(text){
    const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const bytes=[];
    let buffer=0;
    let bits=0;
    for(const character of String(text ?? '')){
      if(character==='=') break;
      const index=alphabet.indexOf(character);
      if(index<0) continue;
      buffer=(buffer<<6)|index;
      bits+=6;
      if(bits>=8){
        bits-=8;
        bytes.push((buffer>>bits)&255);
      }
    }
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
  }

  const TVER_ID_SENTINELS={ media:['1','1567'], local_broadcaster:['11','150'], pref:['01','47'], carrier:['docomo','mvno'], genre:['drama','other'], subgenre:['romance','kids612'], contents_group:['all','tts_mrs_ceremony'], affinity:['2','18'] };

  function normalizeDictionaryId(rawId){
    return String(rawId ?? '').trim();
  }

  function validateEmbeddedIdDictionaries(dictionaries, expectedCounts, expectedSentinels){
    const counts={};
    const issues=[];
    const countRules=expectedCounts || TVER_ID_DICTIONARY_COUNTS;
    const sentinelRules=expectedSentinels || TVER_ID_SENTINELS;
    Object.entries(countRules).forEach(([type, expectedCount]) => {
      const entries=dictionaries && dictionaries[type];
      counts[type]=Array.isArray(entries) ? entries.length : 0;
      if(!Array.isArray(entries)){
        issues.push({ code:'ID_DICTIONARY_CATEGORY_MISSING', type });
        return;
      }
      if(entries.length!==expectedCount) issues.push({ code:'ID_DICTIONARY_COUNT_INVALID', type, expectedCount, actualCount:entries.length });
      const ids=new Set();
      entries.forEach((entry, index) => {
        const rawId=String((entry && (entry.rawId ?? entry.id)) ?? '');
        const id=normalizeDictionaryId(entry && entry.id!==undefined ? entry.id : rawId);
        const name=String((entry && entry.name) ?? '').trim();
        if(!rawId || !id || !name) issues.push({ code:'ID_DICTIONARY_VALUE_INVALID', type, index });
        if(ids.has(id)) issues.push({ code:'ID_DICTIONARY_NORMALIZED_ID_DUPLICATE', type, id });
        ids.add(id);
      });
      const sentinels=sentinelRules[type];
      if(sentinels && entries.length){
        const first=normalizeDictionaryId(entries[0].id);
        const last=normalizeDictionaryId(entries[entries.length-1].id);
        if(first!==sentinels[0] || last!==sentinels[1]) issues.push({ code:'ID_DICTIONARY_SENTINEL_INVALID', type, expected:sentinels, actual:[first,last] });
      }
    });
    return { valid:issues.length===0, templateVersion:TVER_TEMPLATE_VERSION, counts, issues };
  }

  function validateIdDictionaries(dictionaries){
    const result=validateEmbeddedIdDictionaries(dictionaries, TVER_ID_DICTIONARY_COUNTS, TVER_ID_SENTINELS);
    if(!result.valid) throw new Error(`ID_DICTIONARY_INVALID:${result.issues.map(issue => issue.code).join(',')}`);
    return result;
  }

  const TVER_ID_DICTIONARIES=(()=>{
    const raw=JSON.parse(decodeBase64Utf8(TVER_ID_DICTIONARY_BASE64));
    const dictionaries=Object.fromEntries(Object.entries(raw).map(([type, entries]) => [
      type, entries.map(([rawId, name]) => ({ rawId:String(rawId), id:normalizeDictionaryId(rawId), name:String(name) })),
    ]));
    validateIdDictionaries(dictionaries);
    return dictionaries;
  })();

  function getTverIdDictionaries(){
    return TVER_ID_DICTIONARIES;
  }

  function normalizeTverDevice(rawValue){
    const value=String(rawValue ?? '');
    if(value==='SP／PC') return { rawValue:value, value:'android ios pc', transformed:true, ruleId:'TVER_260605_DEVICE_SP_PC' };
    if(value==='CTV') return { rawValue:value, value:'ctv', transformed:true, ruleId:'TVER_260605_DEVICE_CTV' };
    return { rawValue:value, value, transformed:false, ruleId:null };
  }

  function normalizeTverVideoDuration(value){
    const seconds=typeof value==='number' ? value : Number(String(value ?? '').trim());
    if(!Number.isInteger(seconds)) return null;
    if(seconds>=6 && seconds<=10) return '6';
    if(seconds>=11 && seconds<=22) return '15';
    if(seconds>=23 && seconds<=37) return '30';
    if(seconds>=38 && seconds<=52) return '45';
    if(seconds>=53 && seconds<=60) return '60';
    return null;
  }

  function parseTverVideoDuration(rawValue){
    const raw=String(rawValue ?? '');
    const direct=raw.match(/^(6|15|30|45|60)$/);
    if(direct) return { rawValue:raw, value:direct[1], state:'known', ruleId:'TVER_260605_VIDEO_DURATION_DIRECT' };
    const ranged=raw.match(/^(6|15|30|45|60)秒\((\d+)-(\d+)秒\)$/);
    if(!ranged) return { rawValue:raw, value:null, state:'unknown', ruleId:null };
    const registeredRanges={
      '6':{ start:'6', end:'10', ruleId:'TVER_260605_VIDEO_DURATION_6_10' },
      '15':{ start:'11', end:'22', ruleId:'TVER_260605_VIDEO_DURATION_11_22' },
      '30':{ start:'23', end:'37', ruleId:'TVER_260605_VIDEO_DURATION_23_37' },
      '45':{ start:'38', end:'52', ruleId:'TVER_260605_VIDEO_DURATION_38_52' },
      '60':{ start:'53', end:'60', ruleId:'TVER_260605_VIDEO_DURATION_53_60' },
    };
    const registered=registeredRanges[ranged[1]];
    if(!registered || registered.start!==ranged[2] || registered.end!==ranged[3]) return { rawValue:raw, value:null, state:'ambiguous', ruleId:null };
    return { rawValue:raw, value:ranged[1], state:'known', ruleId:registered.ruleId };
  }

  const COMPARISON_STATUSES=['一致', '表記ゆれ一致', '不一致', '需确认', '未匹配'];
  const TRACKING_MACRO_WHITELIST=new Set(['{adid}', '{campaignid}', '{campaign_id}', '{adgroup_id}', '{ad_id}', '{cachebuster}', '{pauid}', '{session_id}']);

  function validationIssue(code, field, rawValue, source){
    return { code, field, rawValue, source:source || null };
  }

  function isValidCalendarDate(year, month, day){
    const date=new Date(Date.UTC(year, month-1, day));
    return date.getUTCFullYear()===year && date.getUTCMonth()===month-1 && date.getUTCDate()===day;
  }

  function isCampaignOrAdGroupDateTimeField(field){
    return field==='start_datetime' || field==='end_datetime' || /^campaign_(start|end)_datetime$/.test(field) || /^adgroup_(start|end)_datetime$/.test(field);
  }

  function isTrackingUrlField(field){
    return /^tracking_url_(start|first_quartile|midpoint|third_quartile|complete)$/.test(field);
  }

  function validateDateTime(field, rawValue, source){
    const match=String(rawValue ?? '').match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
    if(!match) return [validationIssue('INVALID_DATETIME', field, rawValue, source)];
    const year=Number(match[1]);
    const month=Number(match[2]);
    const day=Number(match[3]);
    const hour=Number(match[4]);
    const minute=Number(match[5]);
    const second=match[6]===undefined ? 0 : Number(match[6]);
    if(!isValidCalendarDate(year, month, day) || hour>23 || minute>59 || second>59) return [validationIssue('INVALID_DATETIME', field, rawValue, source)];
    const issues=[];
    if(minute!==0 && minute!==30) issues.push(validationIssue('DATETIME_NOT_30_MINUTE_GRANULARITY', field, rawValue, source));
    if(second!==0) issues.push(validationIssue('DATETIME_SECOND_NOT_ZERO', field, rawValue, source));
    return issues;
  }

  // C3-C5-CR-REOPEN-5 FIX A：Ad time 共享解析（hour/minute/second 各 1~2 位）。
  // 真实⑤⑥⑦⑧ CSV 存在 H:M 形態（例「0:0」）；越界（hour>23/minute>59/second>59）
  // 与 3 桁以上桁数は拒否（「12:345」「24:00」「00:60」等）。validateAdTime と
  // normalizeTverAdTimeForComparison は同一解析を共有し、判定ずれを起こさない。
  function parseTverAdTimeComponents(rawValue){
    const match=String(rawValue ?? '').trim().match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
    if(!match) return null;
    const hour=Number(match[1]);
    const minute=Number(match[2]);
    const second=match[3]===undefined ? 0 : Number(match[3]);
    if(hour>23 || minute>59 || second>59) return null;
    return { hour, minute, second };
  }

  function validateAdTime(field, rawValue, source){
    // C3-C5-CR-REOPEN-3 FIX D：CSV 実際存在 H:MM（例「0:00」）/ HH:MM / HH:MM:SS 形態。
    // C3-C5-CR-REOPEN-5 FIX A：更に H:M（例「0:0」）形態を含む 1~2 桁入力を共有解析で受理。
    // canonical 化後統一校验；end_time 默认契約 23:59 豁免模板粒度检查。
    const parsed=parseTverAdTimeComponents(rawValue);
    if(!parsed) return [validationIssue('INVALID_AD_TIME', field, rawValue, source)];
    const canonical=`${String(parsed.hour).padStart(2,'0')}:${String(parsed.minute).padStart(2,'0')}`;
    if(field==='end_time' && canonical==='23:59') return [];
    if(parsed.minute!==0 && parsed.minute!==30) return [validationIssue('AD_TIME_NOT_TEMPLATE_GRANULARITY', field, rawValue, source)];
    return [];
  }

  // C3-C5-CR-REOPEN-3 FIX D：Ad start/end time canonical（H:MM / HH:MM / HH:MM:SS → HH:MM）。
  // C3-C5-CR-REOPEN-5 FIX A：H:M（「0:0」/「00:0」）も HH:MM に正規化。非法/越界値は null、
  // 上層は原値で保守比較（validateAdTime と同共享解析のため判定ずれなし）。
  function normalizeTverAdTimeForComparison(rawValue){
    const parsed=parseTverAdTimeComponents(rawValue);
    if(!parsed) return null;
    return `${String(parsed.hour).padStart(2,'0')}:${String(parsed.minute).padStart(2,'0')}`;
  }

  function validateUrl(field, rawValue, source){
    const raw=String(rawValue ?? '');
    const issues=[];
    if(!/^https?:\/\//.test(raw)) return [validationIssue('INVALID_URL_PROTOCOL', field, rawValue, source)];
    const macros=raw.match(/\{[^}]*\}/g) || [];
    macros.forEach(macro => {
      if(!TRACKING_MACRO_WHITELIST.has(macro)) issues.push(validationIssue('UNKNOWN_TRACKING_MACRO', field, rawValue, source));
    });
    try{
      new URL(raw);
    }catch(error){
      issues.push(validationIssue('INVALID_URL', field, rawValue, source));
    }
    return issues;
  }

  function validateField(input){
    const field=String(input && input.field || '');
    const rawValue=String(input ? (input.value ?? '') : '');
    const source=input && input.source;
    if(rawValue==='') return [];
    if(isCampaignOrAdGroupDateTimeField(field)) return validateDateTime(field, rawValue, source);
    if(field==='start_time' || field==='end_time') return validateAdTime(field, rawValue, source);
    if(field==='campaign_status' || field==='adgroup_status' || field==='status') return ['0', '1'].includes(rawValue) ? [] : [validationIssue('INVALID_STATUS_CODE', field, rawValue, source)];
    if(/_id$/.test(field)) return /^\d+$/.test(rawValue) ? [] : [validationIssue('INVALID_ID', field, rawValue, source)];
    if(field==='url' || isTrackingUrlField(field)) return validateUrl(field, rawValue, source);
    return [];
  }

  function normalizeTverDateTimeForComparison(rawValue){
    const raw=String(rawValue ?? '');
    const match=raw.trim().match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
    if(!match) return { rawValue:raw, value:null, transformed:false, ruleId:null, state:'unknown' };
    const [, yearText, monthText, dayText, hourText, minuteText, secondText]=match;
    const year=Number(yearText), month=Number(monthText), day=Number(dayText), hour=Number(hourText), minute=Number(minuteText), second=secondText===undefined ? 0 : Number(secondText);
    if(!isValidCalendarDate(year, month, day) || hour>23 || minute>59 || second!==0) return { rawValue:raw, value:null, transformed:false, ruleId:null, state:'unknown' };
    const pad=value=>String(value).padStart(2, '0');
    const value=`${year}-${pad(month)}-${pad(day)} ${pad(hour)}:${pad(minute)}`;
    return { rawValue:raw, value, transformed:value!==raw, ruleId:'TVER_A16_DATETIME_CANONICAL', state:'known' };
  }

  function normalizeTverBudgetForComparison(rawValue){
    const raw=String(rawValue ?? '');

    if(!/^\d+$/.test(value)) return { rawValue:raw, value:raw, transformed:false, ruleId:null, state:'unknown' };
    return { rawValue:raw, value, transformed:value!==raw, ruleId:'TVER_A16_BUDGET_INTEGER', state:'known' };
  }

  function normalizeExplicitCanonical(rawValue, canonical){
    if(!canonical || typeof canonical!=='object') return null;
    const value=canonical.value===undefined ? null : canonical.value;
    const state=TVER_EVIDENCE_STATES.has(canonical.evidenceState) ? canonical.evidenceState : 'available';
    return {
      rawValue:String(rawValue ?? ''), value,
      transformed:value!==null && String(value)!==String(rawValue ?? ''),
      ruleId:canonical.ruleId || null,
      state:state==='available' ? 'known' : state,
      evidenceState:state,
    };

  // C3-C5-CR-REOPEN-5 FIX C：Tracking Complete 多URL比較 = ORDER_INSENSITIVE_MULTISET。
  // CSV/設定表両側の逗号接続 URL collection を trim→sort→改行結合で canonical 化し、
  // 順序差異・区切り両側の空白差異を許容。URL query・引数は一切改変しない、
  // 重複出現回数は multiset 計数で維持（Set 化しない）。
  // 単一 URL（セグメント 1 件）・空欄セグメント混入・空値は従来どおり raw 比較（保守）。
  function normalizeTverTrackingUrlCollectionForComparison(rawValue){
    const raw=String(rawValue ?? '');
    if(raw.trim()==='') return { rawValue:raw, value:raw, transformed:false, ruleId:null, state:'known' };
    const segments=raw.split(',').map(segment => segment.trim());
    if(segments.length<2 || segments.some(segment => segment==='')){
      return { rawValue:raw, value:raw, transformed:false, ruleId:null, state:'known' };
    }
    const value=segments.slice().sort().join('\n');
    return { rawValue:raw, value, transformed:value!==raw, ruleId:'TVER_260605_TRACKING_URL_COLLECTION', state:'known' };
  }

  function normalizeComparisonValue(field, rawValue, explicitCanonical){
    const raw=String(rawValue ?? '');
    const explicit=normalizeExplicitCanonical(raw, explicitCanonical);
    if(explicit) return explicit;
    if(field==='tracking_url_complete') return normalizeTverTrackingUrlCollectionForComparison(raw);
    if(field==='campaign_name' || field==='creative_name'){
      const value=normalizeTverNameForMatching(raw);
      return { rawValue:raw, value, transformed:value!==raw, ruleId:'TVER_A16_NAME_CANONICAL', state:'known' };
    }
    if(isCampaignOrAdGroupDateTimeField(field)) return normalizeTverDateTimeForComparison(raw);
    if(field==='budget' || field==='daily_budget') return normalizeTverBudgetForComparison(raw);
    if(field==='price'){
      const result=normalizeTverPriceForMatching(raw);
      return { rawValue:raw, value:result.value, transformed:result.resolved && result.value!==raw, ruleId:result.resolved ? 'TVER_A16_PRICE_CANONICAL' : null, state:result.resolved ? 'known' : 'ambiguous' };

      return { rawValue:raw, value:result.value, transformed:result.transformed, ruleId:result.ruleId, state:'known' };

    if(field==='tver_video_duration'){
      const result=parseTverVideoDuration(raw);
      return { rawValue:raw, value:result.value, transformed:result.state==='known' && result.value!==raw, ruleId:result.ruleId, state:result.state };
    }
    return { rawValue:raw, value:raw, transformed:false, ruleId:null, state:'known' };
  }

  function deriveDisplayStatus(input){
    const comparisonStatus=input && input.comparisonStatus;
    if(comparisonStatus==='不一致' || comparisonStatus==='未匹配') return comparisonStatus;
    if(comparisonStatus==='需确认') return '需确认';

  const TVER_CHANGE_OVERRIDE_WHITELIST=[];

  function getChangeOverrideWhitelist(){

  function applyConservativeRules(input){
    const field=String(input && input.field || '');
    const settingValue=String(input ? (input.settingValue ?? '') : '');
    const csvValue=String(input ? (input.csvValue ?? '') : '');
    const schemaKind=input && input.schemaKind;
    const settingEvidenceState=input && input.settingEvidenceState;
    const csvEvidenceState=input && input.csvEvidenceState;
    if(['campaign_status', 'adgroup_status'].includes(field) && input && input.currentStatusRequired===false
      && input.settingEvidenceState!=='available'){
      return { forcedComparisonStatus:'需确认', reason:'SETTING_CURRENT_STATUS_NOT_PROVIDED', hidden:false };
    }
    if(TVER_A16_COMPARE_FIELDS.has(field)){
      const state=[settingEvidenceState, csvEvidenceState].find(value => value && value!=='available');
      if(state==='not_provided') return { forcedComparisonStatus:'需确认', reason:'SETTING_EVIDENCE_NOT_PROVIDED', hidden:false };
      if(state==='unavailable') return { forcedComparisonStatus:'需确认', reason:'SETTING_EVIDENCE_UNAVAILABLE', hidden:false };
      if(state==='ambiguous') return { forcedComparisonStatus:'需确认', reason:'SETTING_EVIDENCE_AMBIGUOUS', hidden:false };

  const TVER_C4A_GP_PERIOD_FIELDS=new Set(['adgroup_start_datetime', 'adgroup_end_datetime']);

  function resolveTverGpPeriodGuard(input, settingRawValue, csvRawValue){
    const field=String(input && input.field || '');

      || (input && input.settingSourceState==='missing' ? 'unavailable' : 'available');

  const TVER_C4B_GP_AGE_FIELDS=new Set(['age']);

  function resolveTverGpAgeGuard(input, settingRawValue, csvRawValue){

  function resolveTverC344TargetingGuard(input, settingRawValue, csvRawValue){

  function compareField(input){
    const field=String(input && input.field || '');
    const settingRawValue=String(input ? (input.settingValue ?? '') : '');
    const csvRawValue=String(input ? (input.csvValue ?? '') : '');
    const settingNormalization=normalizeComparisonValue(field, settingRawValue, input && input.settingCanonical);
    const csvNormalization=normalizeComparisonValue(field, csvRawValue, input && input.csvCanonical);
    const statusFields=['campaign_status', 'adgroup_status', 'status'];
    const settingValidationValue=statusFields.includes(field) && input && input.settingCanonical
      && input.settingCanonical.value!==null && input.settingCanonical.value!==undefined
      ? String(input.settingCanonical.value) : settingRawValue;
    const csvValidationValue=statusFields.includes(field) && input && input.csvCanonical
      && input.csvCanonical.value!==null && input.csvCanonical.value!==undefined
      ? String(input.csvCanonical.value) : csvRawValue;
    const comparisonInput={
      ...(input || {}),
      settingEvidenceState:input && input.settingEvidenceState || settingNormalization.evidenceState,
      csvEvidenceState:input && input.csvEvidenceState || csvNormalization.evidenceState,

    const c344TargetingGuard=resolveTverC344TargetingGuard(comparisonInput, settingRawValue, csvRawValue);
    const gpGuard=gpPeriodGuard || gpAgeGuard || gpPrefGuard || c344TargetingGuard;
    const validationIssues=[
      ...validateField({ field, value:settingValidationValue, source:input && input.settingSource }).map(issue => ({ ...issue, side:'設定表値' })),
      ...validateField({ field, value:csvValidationValue, source:input && input.csvSource }).map(issue => ({ ...issue, side:'CSV値' })),
    ];
    const conservative=gpGuard || applyConservativeRules(comparisonInput);
    let comparisonStatus=input && input.comparisonStatus || gpGuard && gpGuard.comparisonStatus || conservative.forcedComparisonStatus;
    let ruleBasis=input && input.ruleBasis || gpGuard && gpGuard.ruleBasis || null;
    if(!comparisonStatus && TVER_A16_COMPARE_FIELDS.has(field) && (settingNormalization.state!=='known' || csvNormalization.state!=='known')){

    // C3-C5-CR-REOPEN-3 FIX B/D：deferred 字段（Tracking Start/25/50/75 等 comparison DEFER）
    // 不判一致/不一致/要確認——displayStatus 为空，行级聚合与 cell 状态投影按无判定处理。
    const deferred=Boolean(input && input.deferred);
    const displayValidationIssues=(gpGuard && gpGuard.neutral) ? [] : ((input && ['Campaign', 'Ad Group'].includes(String(input.level)) && isCampaignOrAdGroupDateTimeField(field))
      ? validationIssues.filter(issue => issue.code!=='DATETIME_NOT_30_MINUTE_GRANULARITY')
      : validationIssues);
    return {
      field, comparisonStatus, validationIssues,
      fieldLabel:TVER_COMPARE_FIELD_LABELS[field] || field,
      entityKey:input && input.entityKey || null,
      csvEntityKey:input && input.csvEntityKey || null,
      displayStatus:deferred ? '' : deriveDisplayStatus({ comparisonStatus, validationIssues:displayValidationIssues }),

      canonicalValues:{ setting:settingNormalization.value, csv:csvNormalization.value },

      sourceEvidence:input && input.sourceEvidence || { setting:[], csv:[], derivedFrom:[] },

      alwaysDisplay:input && input.alwaysDisplay!==undefined ? Boolean(input.alwaysDisplay) : TVER_A16_COMPARE_FIELDS.has(field),
      deferred,
      ruleBasis,

      neutral:Boolean(gpGuard && gpGuard.neutral),
      conservativeReason:conservative.reason || input && input.conservativeReason || null,
      evidence:input && Array.isArray(input.evidence) ? input.evidence : [],
    };
  }

  function buildComparisonRun(input){
    const entries=(input && Array.isArray(input.fields) ? input.fields : []).map(compareField);
    const statusCounts=Object.fromEntries(COMPARISON_STATUSES.map(status => [status, 0]));
    // C3-C5-CR-REOPEN-3：deferred 字段无判定状态，不计入五类状态统计。
    entries.forEach(entry => { if(entry.displayStatus) statusCounts[entry.displayStatus]+=1; });
    return { entries, statusCounts, orphanEntities:input && Array.isArray(input.orphanEntities) ? input.orphanEntities : [] };
  }

  function parseTverIdSet(rawValue){
    const raw=String(rawValue ?? '');
    const values=raw.split(/[\s,]+/).map(value => value.trim()).filter(Boolean);
    return { rawValue:raw, ids:[...new Set(values)].sort() };
  }

  function sameTverIdSet(left, right){
    return left.length===right.length && left.every((value, index) => value===right[index]);
  }

  function compareTverIdSets(settingValue, csvValue, dictionaryType){
    const dictionary=TVER_ID_DICTIONARIES[dictionaryType];
    const setting={ include:parseTverIdSet(settingValue && settingValue.include), exclude:parseTverIdSet(settingValue && settingValue.exclude) };
    const csv={ include:parseTverIdSet(csvValue && csvValue.include), exclude:parseTverIdSet(csvValue && csvValue.exclude) };
    if(!dictionary) return { status:'dictionary-unavailable', dictionaryType, setting, csv };
    const known=new Set(dictionary.map(entry => entry.id));
    const unknownIds=[...setting.include.ids, ...setting.exclude.ids, ...csv.include.ids, ...csv.exclude.ids].filter(id => !known.has(id));
    if(unknownIds.length) return { status:'unknown-id', dictionaryType, setting, csv, unknownIds:[...new Set(unknownIds)].sort() };
    return { status:sameTverIdSet(setting.include.ids, csv.include.ids) && sameTverIdSet(setting.exclude.ids, csv.exclude.ids) ? 'equal' : 'different', dictionaryType, setting, csv, unknownIds:[] };
  }


  function strictText(value){

  }

  // A17-2：Register 与 Edit 的实体字段命名不同，必须按 schema 明确读取，禁止 camel || snake 回退。
  const TVER_A17_TARGETING_CSV_FIELD_MAP={
    'edit-with-ids':{

  };
  // Register 的 entity.fields 沿用 camelCase，而既有 sourceRefs / sourceEvidence.fields 保留 CSV 原始 snake_case。
  // 两者均按 schema 显式映射，不能以字段存在与否做动态回退。
  const TVER_A17_TARGETING_CSV_EVIDENCE_FIELD_MAP={
    'edit-with-ids':{
      media:'media', local_broadcaster:'local_broadcaster', pref:'pref', gender:'gender',
      start_age:'start_age', end_age:'end_age', annual_income:'annual_income', demography:'demography', uid_suffix:'uid_suffix', subgenre_exclude:'subgenre_exclude',

        const parsed=parseTverAgeExpression(source.rawValue);
        return { source, canonicalValue:parsed ? parsed.canonicalValue : null, ageShape:parsed ? {
          minAge:parsed.minAge, maxAge:parsed.maxAge, upperOpen:parsed.upperOpen,
        } : null, ruleId:parsed && parsed.ruleId };
      }));
      if(!selected.unique) return tverA17TargetingResult({ rawValue:tverA17BusinessRawValue(selected.sources), evidenceState:'ambiguous', sourceEvidence:sources, ruleBasis:'TVER_A17_2_AGE_EXACT_RANGE', diagnostics:[{ code:'AGE_MULTIPLE_CONFLICTING_VALUES' }], shouldGenerate:true });
      return tverA17TargetingResult({ rawValue:strictText(selected.candidate.source.rawValue), canonicalValue:selected.candidate.canonicalValue, ageShape:selected.candidate.ageShape,
        evidenceState:'available', comparable:selected.candidate.canonicalValue!==null, primarySource:selected.candidate.source, sourceEvidence:sources,
        ruleBasis:selected.candidate.ruleId || 'TVER_A17_2_AGE_EXACT_RANGE', diagnostics:selected.candidate.canonicalValue!==null ? [] : [{ code:'AGE_EXACT_RANGE_UNRESOLVED' }], shouldGenerate:true });
    }
    if(field==='subgenre_exclude'){
      const sources=tverA17TargetingSources(entity, '番組サブジャンル●');
      const markers=sources.filter(source => strictText(source.rawValue).trim()==='除外');
      const lists=sources.filter(source => strictText(source.rawValue).trim()!=='' && strictText(source.rawValue).trim()!=='除外');
      if(!markers.length || !lists.length) return tverA17TargetingResult({ ruleBasis:'TVER_A17_2_SUBGENRE_EXCLUDE_MARKER', diagnostics:[{ code:'SUBGENRE_EXCLUDE_MARKER_OR_LIST_NOT_PROVIDED' }] });
      const marker=tverA17UniqueBusinessCandidate(markers.map(source => ({ source, canonicalValue:'exclude-marker' })));
      const list=tverA17UniqueBusinessCandidate(lists.map(source => ({ source, canonicalValue:tverA17CanonicalNames(source.rawValue, 'subgenre') })));
      const sourceEvidence=uniqueSourceRefs([...markers, ...lists]);
      if(!marker.unique || !list.unique) return tverA17TargetingResult({ rawValue:tverA17BusinessRawValue(lists), evidenceState:'ambiguous', sourceEvidence, derivedFrom:sourceEvidence, ruleBasis:'TVER_A17_2_SUBGENRE_EXCLUDE_MARKER', diagnostics:[{ code:'SUBGENRE_EXCLUDE_MULTIPLE_CONFLICTING_VALUES' }], shouldGenerate:true });
      return tverA17TargetingResult({ rawValue:strictText(list.candidate.source.rawValue), canonicalValue:list.candidate.canonicalValue, evidenceState:'available', comparable:list.candidate.canonicalValue!==null, primarySource:list.candidate.source, sourceEvidence, derivedFrom:sourceEvidence, ruleBasis:'TVER_A17_2_SUBGENRE_EXCLUDE_MARKER', diagnostics:list.candidate.canonicalValue!==null ? [] : [{ code:'SUBGENRE_EXCLUDE_LIST_UNRESOLVED' }], shouldGenerate:true });
    }
    return tverA17TargetingResult({ ruleBasis:'TVER_A17_2_FIELD_UNSUPPORTED', diagnostics:[{ code:'TARGETING_FIELD_UNSUPPORTED' }] });
  }

  // A17-3A：仅从已完成匹配的 ADG 证据解析 Register 专用视频秒数／DMP ID。
  // 这里不回写 entity.fields，也不参与 parser、matcher、candidateSignature 或 structural profile。
  function tverA173SettingSources(entity, field){
    const evidence=entity && entity.sourceEvidence || {};
    const fields=evidence.fields || {};
    const targeting=evidence.targeting || {};
    const fieldNames=field==='tver_video_duration' ? ['tver_video_duration', 'videoDuration'] : ['dmp_segment', 'segment'];
    const labels=field==='tver_video_duration' ? ['広告再生時間●'] : ['DMPセグメント'];
    for(const name of fieldNames){
      if(Array.isArray(fields[name]) && fields[name].length) return uniqueSourceRefs(fields[name]);
    }
    for(const label of labels){
      if(Array.isArray(targeting[label]) && targeting[label].length) return uniqueSourceRefs(targeting[label]);
    }
    const rows=Array.isArray(entity && entity.rawRows) ? entity.rawRows : [];
    const rowSources=[];
    rows.forEach(row => {
      if(!row || !row.values || row.values[field]===undefined) return;
      const source=row.sourceRefs && row.sourceRefs[field];
      if(source) rowSources.push(source);
      else if(row.source) rowSources.push({ ...row.source, columnName:field, rawValue:String(row.values[field] ?? '') });
    });
    return uniqueSourceRefs(rowSources);
  }

  function tverA173CsvSources(entity, field){
    const sources=[];
    const rows=Array.isArray(entity && entity.rawRows) ? entity.rawRows : [];
    rows.forEach(row => {
      if(!row || !row.values || row.values[field]===undefined) return;
      const source=row.sourceRefs && row.sourceRefs[field];
      if(source) sources.push(source);
      else if(row.source) sources.push({ ...row.source, columnName:field, rawValue:String(row.values[field] ?? '') });
    });
    if(!sources.length){
      const fields=entity && entity.sourceEvidence && entity.sourceEvidence.fields || {};
      if(Array.isArray(fields[field])) sources.push(...fields[field]);
    }
    return uniqueSourceRefs(sources);
  }

  function tverA173PlaceholderValue(rawValue){
    const raw=strictText(rawValue).trim();
    return raw==='' || raw==='-' || raw==='○';
  }

  function tverA173NumericIdSet(rawValue){
    const raw=strictText(rawValue).trim();
    if(tverA173PlaceholderValue(raw)) return null;
    const stripped=stripTverSegmentBoilerplate(raw).replace(/[，、]/g, ',');
    const tokens=stripped.split(/[\s,]+/).map(token => token.trim()).filter(Boolean);
    if(!tokens.length) return null;
    if(tokens.every(token => /^\d+$/.test(token))){
      return [...new Set(tokens)].sort((left, right) => Number(left)-Number(right)).join(' ');
    }
    const numericTokens=tokens.filter(token => /^\d+$/.test(token));
    return numericTokens.length===1 ? numericTokens[0] : null;
  }

  // A17-3B：Retarget の store / bid は、A17-3A の動画／DMP resolver と分離して
  // 対応する Setting 列と CSV 列だけを読む。証拠は全て保持し、業務候補は
  // 既存の tverA173NumericIdSet() が認識した明示的な数字 ID 集合だけに限定する。
  function tverA173RetargetFieldSpec(field){
    if(field==='store_segment') return {
      settingField:'dataAccumulation', targetingLabel:'データ蓄積', csvField:'store_segment',
      ruleBasis:'TVER_A17_3B_STORE_SEGMENT', diagnostic:'STORE_SEGMENT_MULTIPLE_OR_UNRESOLVED_IDS',
    };
    if(field==='bid_segment') return {
      settingField:'bidSegment', targetingLabel:'入札セグメント', csvField:'bid_segment',
      ruleBasis:'TVER_A17_3B_BID_SEGMENT', diagnostic:'BID_SEGMENT_MULTIPLE_OR_UNRESOLVED_IDS',
    };
    return null;
  }

  function tverA173RetargetSettingSources(entity, field){
    const spec=tverA173RetargetFieldSpec(field);
    if(!spec) return [];
    const evidence=entity && entity.sourceEvidence || {};
    const fields=evidence.fields || {};
    const targeting=evidence.targeting || {};
    const fieldSources=Array.isArray(fields[spec.settingField]) ? uniqueSourceRefs(fields[spec.settingField]) : [];
    const targetingSources=Array.isArray(targeting[spec.targetingLabel]) ? targeting[spec.targetingLabel] : [];
    // 先保留既有 fields 数组的 realm，再补充 targeting 别名来源并去重；
    // 这样不会因拼接证据而改变来源对象或产生跨 ADG 共享。
    targetingSources.forEach(source => {
      if(!source) return;
      const key=sourceRefIdentity(source);
      if(!fieldSources.some(existing => sourceRefIdentity(existing)===key)) fieldSources.push(source);
    });
    return fieldSources;
  }

  function tverA173RetargetCsvSources(entity, field){
    const spec=tverA173RetargetFieldSpec(field);
    if(!spec) return [];
    const sources=[];
    const rows=Array.isArray(entity && entity.rawRows) ? entity.rawRows : [];
    rows.forEach(row => {
      if(!row || !row.values || row.values[spec.csvField]===undefined) return;
      const source=row.sourceRefs && row.sourceRefs[spec.csvField];
      if(source) sources.push(source);
      else if(row.source) sources.push({ ...row.source, columnName:spec.csvField, rawValue:String(row.values[spec.csvField] ?? '') });
    });
    if(!sources.length){
      const fields=entity && entity.sourceEvidence && entity.sourceEvidence.fields || {};
      if(Array.isArray(fields[spec.csvField])) sources.push(...fields[spec.csvField]);
    }
    return uniqueSourceRefs(sources);
  }

  function tverA173ResolveRetargetSources(sources, field){
    const spec=tverA173RetargetFieldSpec(field);
    if(!spec) return tverA17TargetingResult({ ruleBasis:'TVER_A17_3B_FIELD_UNSUPPORTED', diagnostics:[{ code:'RETARGET_FIELD_UNSUPPORTED' }] });
    const evidence=uniqueSourceRefs(sources || []);
    const candidates=evidence.map(source => ({
      source, canonicalValue:tverA173NumericIdSet(source && source.rawValue),
    })).filter(candidate => candidate.canonicalValue!==null);
    const canonicalValues=[...new Set(candidates.map(candidate => String(candidate.canonicalValue)))];
    if(!canonicalValues.length){
      return tverA17TargetingResult({ sourceEvidence:evidence, derivedFrom:evidence, ruleBasis:spec.ruleBasis });
    }
    if(canonicalValues.length!==1){
      return tverA17TargetingResult({
        rawValue:tverA17BusinessRawValue(candidates.map(candidate => candidate.source)),
        evidenceState:'ambiguous', comparable:false, primarySource:null,
        sourceEvidence:evidence, derivedFrom:evidence, ruleBasis:spec.ruleBasis,
        diagnostics:[{ code:spec.diagnostic }], shouldGenerate:true,
      });
    }
    const selected=candidates.find(candidate => String(candidate.canonicalValue)===canonicalValues[0]);
    return tverA17TargetingResult({
      rawValue:strictText(selected.source.rawValue), canonicalValue:selected.canonicalValue,
      evidenceState:'available', comparable:true, primarySource:selected.source,
      sourceEvidence:evidence, derivedFrom:evidence, ruleBasis:spec.ruleBasis,
      diagnostics:[], shouldGenerate:true,
    });
  }

  function tverA173ResolveDmpSources(evidence){
    const ruleBasis='TVER_A17_3A_DMP_SEGMENT';
    const candidates=evidence.map(source => ({
      source, canonicalValue:tverA173NumericIdSet(source && source.rawValue),
    })).filter(candidate => candidate.canonicalValue!==null);
    const canonicalValues=[...new Set(candidates.map(candidate => String(candidate.canonicalValue)))];
    if(!canonicalValues.length) return tverA17TargetingResult({ sourceEvidence:evidence, derivedFrom:evidence, ruleBasis });
    if(canonicalValues.length!==1){
      return tverA17TargetingResult({
        rawValue:tverA17BusinessRawValue(candidates.map(candidate => candidate.source)), evidenceState:'ambiguous', comparable:false,
        sourceEvidence:evidence, derivedFrom:evidence, ruleBasis,
        diagnostics:[{ code:'DMP_SEGMENT_MULTIPLE_OR_UNRESOLVED_IDS' }], shouldGenerate:true,
      });
    }
    const selected=candidates.find(candidate => String(candidate.canonicalValue)===canonicalValues[0]);
    return tverA17TargetingResult({
      rawValue:strictText(selected.source.rawValue), canonicalValue:selected.canonicalValue, evidenceState:'available',
      comparable:true, primarySource:selected.source, sourceEvidence:evidence, derivedFrom:evidence,
      ruleBasis:'TVER_A17_3A_DMP_NUMERIC_ID_SET', diagnostics:[], shouldGenerate:true,
    });
  }

  function tverA173ResolveSources(sources, field){
    const evidence=uniqueSourceRefs(sources || []);
    if(field==='dmp_segment') return tverA173ResolveDmpSources(evidence);
    const business=evidence.filter(source => !tverA173PlaceholderValue(source && source.rawValue));
    const emptyResult=() => tverA17TargetingResult({
      sourceEvidence:evidence, derivedFrom:evidence, ruleBasis:field==='tver_video_duration' ? 'TVER_A17_3A_VIDEO_DURATION' : 'TVER_A17_3A_DMP_SEGMENT',
    });
    if(!business.length) return emptyResult();

    const candidates=business.map(source => {
      if(field==='tver_video_duration'){
        const parsed=parseTverVideoDuration(source.rawValue);
        return { source, canonicalValue:parsed.value, state:parsed.state, ruleId:parsed.ruleId };
      }
      const canonicalValue=tverA173NumericIdSet(source.rawValue);
      return { source, canonicalValue, state:canonicalValue===null ? 'ambiguous' : 'known', ruleId:'TVER_A17_3A_DMP_NUMERIC_ID_SET' };
    });
    const unresolved=candidates.filter(candidate => candidate.state!=='known' || candidate.canonicalValue===null);
    const known=candidates.filter(candidate => candidate.state==='known' && candidate.canonicalValue!==null);
    const canonicalValues=[...new Set(known.map(candidate => String(candidate.canonicalValue)))];
    const ruleBasis=field==='tver_video_duration' ? 'TVER_A17_3A_VIDEO_DURATION' : 'TVER_A17_3A_DMP_SEGMENT';
    if(unresolved.length || canonicalValues.length!==1){
      return tverA17TargetingResult({
        rawValue:tverA17BusinessRawValue(business), evidenceState:'ambiguous', comparable:false,
        sourceEvidence:evidence, derivedFrom:evidence, ruleBasis,
        diagnostics:[{ code:field==='tver_video_duration' ? 'VIDEO_DURATION_MULTIPLE_OR_UNRESOLVED_VALUES' : 'DMP_SEGMENT_MULTIPLE_OR_UNRESOLVED_IDS' }],
        shouldGenerate:true,
      });
    }
    const selected=known.find(candidate => String(candidate.canonicalValue)===canonicalValues[0]);
    return tverA17TargetingResult({
      rawValue:strictText(selected.source.rawValue), canonicalValue:selected.canonicalValue, evidenceState:'available',
      comparable:true, primarySource:selected.source, sourceEvidence:evidence, derivedFrom:evidence,
      ruleBasis:selected.ruleId || ruleBasis, diagnostics:[], shouldGenerate:true,
    });
  }

  function resolveSettingOperationalTargetingForComparison(entity, field){
    if(tverA173RetargetFieldSpec(field)){
      return tverA173ResolveRetargetSources(tverA173RetargetSettingSources(entity, field), field);
    }
    if(!['tver_video_duration', 'dmp_segment'].includes(field)){
      return tverA17TargetingResult({ ruleBasis:'TVER_A17_3A_FIELD_UNSUPPORTED', diagnostics:[{ code:'OPERATIONAL_TARGETING_FIELD_UNSUPPORTED' }] });
    }
    return tverA173ResolveSources(tverA173SettingSources(entity, field), field);
  }

  function resolveSettingDmpExpansionForComparison(entity){
    const dmpSources=tverA173SettingSources(entity, 'dmp_segment');
    const otherSources=tverC343OtherSettingsSources(entity);
    const evidence=uniqueSourceRefs([...dmpSources, ...otherSources]);
    const explicit=[];
    const overrideSources=otherSources.filter(source => /DMP\s*拡張値/i.test(strictText(source && source.rawValue)));
    otherSources.forEach(source => {
      const match=strictText(source && source.rawValue).match(/DMP\s*拡張値\s*[:：=]?\s*([0-9]+)/i);
      if(match) explicit.push({ source, value:match[1] });
    });
    const explicitValues=[...new Set(explicit.map(item => item.value))];
    if(overrideSources.length && explicitValues.length===1 && explicit.length===overrideSources.length){
      const selected=explicit[0];
      return tverA17TargetingResult({ rawValue:selected.value, canonicalValue:selected.value, evidenceState:'available', comparable:true,
        primarySource:selected.source, sourceEvidence:evidence, derivedFrom:evidence,
        ruleBasis:'TVER_C3_C4_3_DMP_EXPANSION_EXPLICIT', diagnostics:[], shouldGenerate:true });
    }
    if(overrideSources.length){
      return tverA17TargetingResult({ rawValue:tverA17BusinessRawValue(overrideSources), evidenceState:'ambiguous', comparable:false,
        sourceEvidence:evidence, derivedFrom:evidence, ruleBasis:'TVER_C3_C4_3_DMP_EXPANSION_EXPLICIT',
        diagnostics:[{ code:'DMP_EXPANSION_OVERRIDE_UNCONFIRMED' }], shouldGenerate:true });
    }
    const dmpId=tverA173ResolveDmpSources(dmpSources);
    if(dmpId.shouldGenerate && dmpId.canonicalValue!==null){
      return tverA17TargetingResult({ rawValue:'10', canonicalValue:'10', evidenceState:'available', comparable:true,
        primarySource:dmpId.primarySource, sourceEvidence:evidence, derivedFrom:evidence,
        ruleBasis:'TVER_C3_C4_3_DMP_EXPANSION_DEFAULT_10', diagnostics:[], shouldGenerate:true });
    }
    return tverA17TargetingResult({ sourceEvidence:evidence, derivedFrom:evidence,
      ruleBasis:'TVER_C3_C4_3_DMP_EXPANSION_DEFAULT_10', diagnostics:[{ code:'SETTING_DMP_NOT_PROVIDED' }] });
  }

  function resolveCsvDmpExpansionForComparison(entity){
    const evidence=tverA173CsvSources(entity, 'dmp_segment_expansion_threshold');
    const business=evidence.filter(source => !tverA173PlaceholderValue(source && source.rawValue));
    if(!business.length) return tverA17TargetingResult({ sourceEvidence:evidence, derivedFrom:evidence,
      ruleBasis:'TVER_C3_C4_3_DMP_EXPANSION_CSV' });
    const values=business.map(source => strictText(source.rawValue).trim());
    const numeric=values.filter(value => /^\d+$/.test(value));
    const canonicalValues=[...new Set(numeric)];
    if(canonicalValues.length!==1 || numeric.length!==values.length){
      return tverA17TargetingResult({ rawValue:tverA17BusinessRawValue(business), evidenceState:'ambiguous', comparable:false,
        sourceEvidence:evidence, derivedFrom:evidence, ruleBasis:'TVER_C3_C4_3_DMP_EXPANSION_CSV',
        diagnostics:[{ code:'CSV_DMP_EXPANSION_UNRESOLVED' }], shouldGenerate:true });
    }
    const selected=business.find(source => strictText(source.rawValue).trim()===canonicalValues[0]);
    return tverA17TargetingResult({ rawValue:strictText(selected.rawValue), canonicalValue:canonicalValues[0], evidenceState:'available', comparable:true,
      primarySource:selected, sourceEvidence:evidence, derivedFrom:evidence,
      ruleBasis:'TVER_C3_C4_3_DMP_EXPANSION_CSV', diagnostics:[], shouldGenerate:true });
  }

  function tverA173CsvOperationalResult(entity, field){
    if(tverA173RetargetFieldSpec(field)){
      return tverA173ResolveRetargetSources(tverA173RetargetCsvSources(entity, field), field);
    }
    return tverA173ResolveSources(tverA173CsvSources(entity, field), field);
  }

  function buildTverA173OperationalComparisonInputs(setting, csv, schemaKind, base){
    if(schemaKind!=='register-without-ids') return [];
    const inputs=[];
    ['tver_video_duration', 'dmp_segment'].forEach(field => {
      const settingResult=resolveSettingOperationalTargetingForComparison(setting, field);
      const csvResult=tverA173CsvOperationalResult(csv, field);
      if(!settingResult.shouldGenerate && !csvResult.shouldGenerate) return;
      const ruleBasis=field==='tver_video_duration' ? 'TVER_A17_3A_VIDEO_DURATION' : 'TVER_A17_3A_DMP_SEGMENT';
      const bothComparable=settingResult.comparable && csvResult.comparable
        && settingResult.evidenceState==='available' && csvResult.evidenceState==='available';
      let comparisonStatus=null;
      let conservativeReason=null;
      if(!bothComparable || settingResult.evidenceState==='ambiguous' || csvResult.evidenceState==='ambiguous'){
        comparisonStatus='需确认';
        conservativeReason=(settingResult.diagnostics[0] && settingResult.diagnostics[0].code)
          || (csvResult.diagnostics[0] && csvResult.diagnostics[0].code)
          || 'TVER_A17_3A_EVIDENCE_UNCONFIRMED';
      }else if(settingResult.canonicalValue===null || csvResult.canonicalValue===null){
        comparisonStatus='需确认';
        conservativeReason='TVER_A17_3A_VALUE_UNAVAILABLE';
      }else if(String(settingResult.canonicalValue)===String(csvResult.canonicalValue)){
        comparisonStatus=settingResult.rawValue===csvResult.rawValue ? '一致' : '表記ゆれ一致';
      }else{
        comparisonStatus='不一致';
      }
      const derivedFrom=uniqueSourceRefs([...(settingResult.derivedFrom || []), ...(csvResult.derivedFrom || [])]);
      inputs.push({
        ...(base || {}), field, settingValue:settingResult.rawValue, csvValue:csvResult.rawValue,
        settingSource:settingResult.primarySource, csvSource:csvResult.primarySource,
        settingCanonical:{ value:settingResult.canonicalValue, ruleId:settingResult.ruleBasis, evidenceState:settingResult.evidenceState },
        csvCanonical:{ value:csvResult.canonicalValue, ruleId:csvResult.ruleBasis, evidenceState:csvResult.evidenceState },
        settingEvidenceState:settingResult.evidenceState, csvEvidenceState:csvResult.evidenceState,
        comparable:bothComparable, alwaysDisplay:true, ruleBasis,
        comparisonStatus, conservativeReason,
        sourceEvidence:{ setting:settingResult.sourceEvidence, csv:csvResult.sourceEvidence, derivedFrom },
      });
    });
    return inputs;
  }

  function buildTverA173RetargetComparisonInputs(setting, csv, schemaKind, base){
