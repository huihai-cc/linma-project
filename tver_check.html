        const key=scopeKey(scope);
        indexes.delete(key);
        currentPositions.delete(key);
        if(activeScope===key){activeScope=null;hideFloating();}
      }
      clearFocus();
    }
    function bindSummary(summary,scope){
      if(!summary||typeof summary.addEventListener!=='function'||summary.__qcMismatchNavigatorBound) return;
      summary.__qcMismatchNavigatorBound=true;
      const activate=event=>{
        if(event&&event.preventDefault) event.preventDefault();
        if(unified){
          const reviewMarker=summary.getAttribute && summary.getAttribute('data-qc-review-navigator');
          const mismatchMarker=summary.getAttribute && summary.getAttribute('data-qc-mismatch-navigator');
          if(reviewMarker!==null && reviewMarker!==undefined) mode='review';
          else if(mismatchMarker!==null && mismatchMarker!==undefined) mode='mismatch';
        }
        const key=scope===undefined?readScope(summary):scope;
        if(activeScope===scopeKey(key) && navigate(key,1)) return;
        if(startScope(key)) return;
        if(typeof options.onEmpty==='function' && options.onEmpty(key, mode)) startScope(key);
      };
      summary.addEventListener('click',activate);
      summary.addEventListener('keydown',event=>{if(event&&(event.key==='Enter'||event.key===' ')) activate(event);});
    }
    function bindSummaries(container=root){
      if(!container||typeof container.querySelectorAll!=='function') return;
      container.querySelectorAll(summarySelector).forEach(summary=>bindSummary(summary));
    }
    return {getTargets,navigate,reset,resetAll:()=>reset(),beginLifecycle,refresh,bindSummary,bindSummaries};
  }

  // NO032：不一致・要確認を単一ナビで扱う。現在層に該当が無ければ他層へ切り替える。
  function activateTverUnifiedFallback(mode){
    if(!tverPageState || !tverPageState.run) return false;
    const doc=typeof document!=='undefined' ? document : null;
    if(!doc) return false;
    const selector=mode==='all' ? '[data-qc-status="mismatch"],[data-qc-status="review"]' : '[data-qc-status="'+mode+'"]';
    const order=['Campaign', 'Ad Group', 'Ad'];
    const current=tverPageState.activeLevel || 'Campaign';
    const startIndex=Math.max(0, order.indexOf(current));
    for(let offset=1; offset<=order.length; offset+=1){
      const level=order[(startIndex+offset)%order.length];
      if(level===current) continue;
      tverPageState.activeLevel=level;
      tverPageState.filters={ ...tverPageState.filters, level };
      renderTverRun(tverPageState.run, { activeLevel:level, filters:tverPageState.filters, newLifecycle:false });
      const panel=doc.getElementById('tver-horizontal-panel-'+tverHorizontalLevelId(level));
      if(panel && typeof panel.querySelector==='function' && panel.querySelector(selector)) return true;
    }
    if(tverPageState.activeLevel!==current){
      tverPageState.activeLevel=current;
      tverPageState.filters={ ...tverPageState.filters, level:current };
      renderTverRun(tverPageState.run, { activeLevel:current, filters:tverPageState.filters, newLifecycle:false });
    }
    return false;
  }
  function syncTverUnifiedNavigator(doc,options={}){
    const root=doc || (typeof document!=='undefined' ? document : null);
    if(!root) return;
    if(!tverUnifiedNavigator) tverUnifiedNavigator=createQcMismatchNavigator({root, unified:true, statuses:['mismatch','review'], targetSelector:'[data-qc-status]', summarySelector:'[data-qc-mismatch-navigator], [data-qc-review-navigator]', focusClass:'qc-mismatch-focus', onEmpty:(key,currentMode)=>activateTverUnifiedFallback(currentMode)});
    tverUnifiedNavigator.bindSummaries(root);
    if(options.newLifecycle===false) tverUnifiedNavigator.refresh('__all__');
    else tverUnifiedNavigator.beginLifecycle('__all__');
  }
  function resetTverNavigator(){if(tverUnifiedNavigator) tverUnifiedNavigator.resetAll();}

  function getTverPageState(){
    return tverPageState;
  }

  function escapeHtml(value){
    return String(value ?? '').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
  }

  function statusDisplayLabel(status){
    return status==='需确认' ? '要確認' : String(status ?? '');
  }

  function projectTverDisplayStatus(status){
    return TVER_DISPLAY_STATUS_MAP[String(status ?? '')] || '';
  }

  function isTverHiddenBlankCampaignHourlyEntry(entry){
    if(!entry || entry.level!=='Campaign' || String(entry.field ?? '')!=='hourly_bid_weight') return false;
    return !tverHorizontalRawValuePresent(entry.settingRawValue) && !tverHorizontalRawValuePresent(entry.csvRawValue);
  }

  function projectTverEntityDisplayStatus(entries){
    const statuses=(Array.isArray(entries) ? entries : [])
      .filter(entry => !isTverHiddenBlankCampaignHourlyEntry(entry))
      .filter(entry => !entry.neutral)
      .filter(entry => !entry.deferred) // C3-C5-CR-REOPEN-3 FIX B：deferred 字段无判定，不参与行级聚合
      .map(entry => projectTverDisplayStatus(entry && (entry.displayStatus || entry.comparisonStatus)))
      .filter(Boolean);
    if(statuses.includes('不一致')) return '不一致';
    if(statuses.includes('要確認')) return '要確認';
    return '一致';
  }

  function projectTverStatusCounts(statusCounts){
    const counts=statusCounts && typeof statusCounts==='object' ? statusCounts : {};
    const count=status => { const value=Number(counts[status]); return Number.isFinite(value) && value>0 ? value : 0; };
    return {
      '一致':count('一致') + count('表記ゆれ一致'),
      '不一致':count('不一致'),
      '要確認':count('需确认') + count('未匹配'),
    };
  }

  function formatTverSource(source){
    if(!source) return '未提供';
    const parts=[];
    if(source.fileName) parts.push(source.fileName);
    if(source.sheetName) parts.push(source.sheetName);
    if(source.rowNumber!==null && source.rowNumber!==undefined) parts.push(`${source.rowNumber}行`);
    if(source.columnName) parts.push(source.columnName);
    return parts.length ? parts.join(' / ') : '未提供';
  }

  function defaultFilters(){
    return { ...TVER_DEFAULT_FILTERS };
  }

  function buildTverEntryFilterCriteria(filters){
    const criteria={ ...defaultFilters(), ...(filters || {}) };
    return { ...criteria, keyword:String(criteria.keyword ?? '').toLocaleLowerCase() };
  }

  function isExceptionStatus(status){
    return status==='不一致' || status==='需确认' || status==='未匹配';
  }

  function matchesTverEntryFilters(entry, criteria){
    if(entry.hidden) return false;
    if(criteria.level!=='all' && entry.level!==criteria.level) return false;
    if(criteria.status!=='all' && entry.displayStatus!==criteria.status) return false;
    if(criteria.abnormalOnly && !isExceptionStatus(entry.displayStatus)) return false;
    if(!criteria.keyword) return true;
    const searchable=[entry.targetName, entry.field, entry.settingRawValue, entry.csvRawValue, entry.reason, entry.conservativeReason, entry.ruleBasis].join(' ').toLocaleLowerCase();
    return searchable.includes(criteria.keyword);
  }

  function matchesTverDisplayEntryFilters(entry, criteria){
    const safeCriteria=buildTverEntryFilterCriteria(criteria);
    if(!matchesTverEntryFilters(entry, { ...safeCriteria, status:'all' })) return false;
    const requestedStatus=safeCriteria.status;
    const projectedCriteriaStatus=requestedStatus==='all' ? 'all' : projectTverDisplayStatus(requestedStatus) || requestedStatus;
    return projectedCriteriaStatus==='all' || projectTverDisplayStatus(entry && (entry.displayStatus || entry.comparisonStatus))===projectedCriteriaStatus;
  }

  function filterTverDisplayEntries(run, filters){
    const criteria=buildTverEntryFilterCriteria(filters);
    return (run && Array.isArray(run.entries) ? run.entries : []).filter(entry => matchesTverDisplayEntryFilters(entry, criteria));
  }

  function filterTverEntries(run, filters){
    const criteria=buildTverEntryFilterCriteria(filters);
    return (run && Array.isArray(run.entries) ? run.entries : []).filter(entry => matchesTverEntryFilters(entry, criteria));
  }

  function csvEscape(value){
    const text=String(value ?? '');
    return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }

  function exceptionEntries(run, filters){
    return filterTverDisplayEntries(run, filters).filter(entry => isExceptionStatus(entry.displayStatus));
  }

  function buildExceptionCsv(run, options){
    const config=options || {};
    const schemaKind=run && run.schemaKind || '';
    const role=run && run.businessRole || '';
    const lines=[];
    if(schemaKind==='register-without-ids') lines.push('注意：登録CSVは入稿内容の整合性チェックであり、管理画面に正しく登録済みであることを証明するものではありません。');
    else if(schemaKind==='edit-with-ids') lines.push('注意：編集CSVはダウンロード時点の管理画面の現在状態との比較です。');
    const headers=['Schema','業務上の意味','レベル','対象','comparisonStatus','validationIssues','displayStatus','項目','設定表値','CSV値','理由','ルール根拠','設定表ソース','CSVソース','ID展開値'];
    lines.push(headers.join(','));
    exceptionEntries(run, config.filters).forEach(entry => {
      const reason=entry.reason || entry.conservativeReason || '';
      const validation=(entry.validationIssues || []).map(issue => issue.code).join(' | ');
      const values=[schemaKind, role, entry.level || '', entry.targetName || '', entry.comparisonStatus, validation, entry.displayStatus, entry.field, entry.settingRawValue, entry.csvRawValue, reason, entry.ruleBasis || '', formatTverSource(entry.sourceRefs && entry.sourceRefs.setting), formatTverSource(entry.sourceRefs && entry.sourceRefs.csv), entry.idExpandedValue || ''];
      lines.push(values.map(csvEscape).join(','));
    });
    return `\uFEFF${lines.join('\r\n')}\r\n`;
  }

  function exceptionCopyText(run, filters){
    return exceptionEntries(run, filters).map(entry => [
      `【${entry.level || '対象'}】${entry.field || ''}`,
      `結果：${statusDisplayLabel(entry.displayStatus)}`,
      `設定表値：${entry.settingRawValue ?? ''}`,
      `CSV値：${entry.csvRawValue ?? ''}`,
      `理由：${entry.reason || entry.conservativeReason || entry.ruleBasis || ''}`,
      `設定表ソース：${formatTverSource(entry.sourceRefs && entry.sourceRefs.setting)}`,
      `CSVソース：${formatTverSource(entry.sourceRefs && entry.sourceRefs.csv)}`,
    ].join('\n')).join('\n\n');
  }

  async function copyVisibleExceptions(run, options){
    const config=options || {};
    const text=exceptionCopyText(run, config.filters);
    if(!text) return { ok:false, message:'コピーできる異常項目がありません。' };
    const writeText=config.writeText || (typeof navigator!=='undefined' && navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText.bind(navigator.clipboard) : null);
    if(!writeText) return { ok:false, message:'この環境ではクリップボードを利用できません。' };
    try{
      await writeText(text);
      return { ok:true, text };
    }catch(error){
      return { ok:false, message:'クリップボードへのコピーに失敗しました。' };
    }
  }

  function findEntityByKey(collection, key){
    return (collection || []).find(entity => entity.key===key) || null;
  }

  function entityTargetName(entity){
    if(!entity) return '未特定';
    if(entity.level==='Ad Group'){
      const expectedName=strictText(entity.expectedName);
      if(expectedName && expectedName!==entity.key && !/^adgroup:\s*\{/.test(expectedName)) return expectedName;
      const fields=entity.fields || {};
      const csvName=strictText(fields.adGroupName || fields.adgroupName || fields.adgroup_name);
      if(csvName && !/^adgroup:\s*\{/.test(csvName)) return csvName;
      return resolveAdGroupShortDisplayName(entity).value || '広告グループ';
    }
    return entity.expectedName || entity.fields && (entity.fields.campaignName || entity.fields.materialName || entity.fields.adgroupName || entity.fields.campaign_name || entity.fields.creative_name) || entity.key;
  }

  // C3-C4-2：只读取Setting证据，输出不回写实体或任何聚合／匹配字段。
  function resolveAdGroupShortDisplayName(settingEntity){
    const fields=settingEntity && settingEntity.fields || {};
    const identity=settingEntity && settingEntity.displayIdentity || {};
    const refs=settingEntity && settingEntity.sourceRefs || {};
    const name=String(identity.targetingName ?? '').trim();
    const tag=String(fields.tagAppeal ?? '').trim();
    const number=String(fields.targetingNumber ?? '').trim();
    const device=resolveSettingAdGroupDevice(settingEntity);
    const branch=device.resolved ? ({ ctv:'CTV', 'android ios pc':'SPPC', 'android ios':'SP' }[device.device] || '') : '';
    const nameSource=identity.sourceRefs && identity.sourceRefs.targetingName;
    if(name && branch){
      return { value:name.endsWith(`_${branch}`) ? name : `${name}_${branch}`, primarySource:nameSource || null,
        sourceEvidence:uniqueSourceRefs([nameSource, refs.tagAppeal, ...(device.sourceEvidence || [])]) };
    }
    if(tag && !['SPPC', 'CTV', 'SP'].includes(tag)){
      return { value:tag, primarySource:refs.tagAppeal || null, sourceEvidence:uniqueSourceRefs([refs.tagAppeal]) };
    }
    const suffix=branch || tag;
    const value=number ? `広告グループ ${number}${suffix ? `｜${suffix}` : ''}` : (suffix ? `広告グループ｜${suffix}` : '広告グループ');
    return { value, primarySource:refs.targetingNumber || refs.tagAppeal || null,
      sourceEvidence:uniqueSourceRefs([refs.targetingNumber, refs.tagAppeal, ...(device.sourceEvidence || [])]) };
  }

  function buildTverDisplayLabel(level, settingEntity, csvEntity, fallbackDisplayName){
    if(level==='Campaign'){
      const settingFields=settingEntity && settingEntity.fields || {};
      const campaignAppeal=String(settingFields.campaignAppeal ?? '').trim();
      if(campaignAppeal) return campaignAppeal;
      return fallbackDisplayName;
    }
    if(level!=='Ad Group') return fallbackDisplayName;
    if(settingEntity && settingEntity.businessType==='survey-ctv') return String(csvEntity && csvField(csvEntity,'adGroupName','adgroup_name') || settingEntity.expectedName);
    if(settingEntity){
      const shortName=resolveAdGroupShortDisplayName(settingEntity).value;
      // NO016: CSV 実 Group ID が無い論理GPであることを表示で明示（IDは捏造しない）。
      return settingEntity.gpIdentity && settingEntity.gpIdentity.logical ? shortName+'（論理GP・CSV ID未提供）' : shortName;
    }
    // NO015: 行レベル対応済みの CSV 名称範囲を「CSV側未匹配」と誤読させない。
    if(csvEntity && csvEntity.rowLevelComparison) return 'CSV名称範囲（行対応済・Group実体未確認）';
    return 'CSV側未匹配';
  }

  // Ad tab的父组上下文沿用原显示规则；不用于GP対象名或Setting期望。
  function buildTverAdParentContextLabel(settingEntity, csvEntity){
    const csv=csvEntity && csvEntity.fields || {};
    const csvName=String(csv.adgroup_name ?? '').trim() || String(csv.adGroupName ?? '').trim();
    if(csvName) return csvName;
    const fields=settingEntity && settingEntity.fields || {};
    const number=String(fields.targetingNumber ?? '').trim();
    const tag=String(fields.tagAppeal ?? '').trim();
    return number ? `広告グループ ${number}${tag ? `｜${tag}` : ''}` : (tag ? `広告グループ｜${tag}` : '広告グループ');
  }

  // ==== 阶段 A5：Ad Group structural profile 的 canonical 解析 =====
  // device：优先 tagAppeal 明确 token；tagAppeal 为空时回退 targeting 配信デバイス清单（仅当唯一有效设备类别）。
  // price：CPM● 行安全 canonical 化（去 ¥/,/前导-/空白/重复，唯一数值集合才返回）。
  // DMP：Setting 侧 segment（DMPセグメント行）；CSV 侧 register 用 dmp_segment、edit 用名称 _DMP_ token。
  // 阶段 A8：device 由 配信デバイス● 清单（是否含 PC）+ tagAppeal 分支（SP 侧/CTV 侧）共同决定，
  // 不再让 tagAppeal 单独决定 PC 是否存在。
  function parseTverDeviceSet(deviceRaw){
    const set=new Set();
    const tokens=String(deviceRaw ?? '').split(/\s+/);
    for(const token of tokens){
      let cleaned=token.replace(/^[-]+/, '');
      cleaned=cleaned.split('※')[0].trim();
      if(!cleaned) continue;
      if(/SP[／/]PC|SP-PC/.test(cleaned)) { set.add('sp'); set.add('pc'); }
      else if(/SP/.test(cleaned)) set.add('sp');
      if(/CTV/.test(cleaned)) set.add('ctv');
    }
    return set;
  }

  function resolveTverSettingDeviceValueSource(entity){
    const fieldSources=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.device || [];
    const targetingSources=entity && entity.sourceEvidence && entity.sourceEvidence.targeting && entity.sourceEvidence.targeting['配信デバイス●'] || [];
    return uniqueSourceRefs([...(Array.isArray(fieldSources) ? fieldSources : []), ...(Array.isArray(targetingSources) ? targetingSources : [])])
      .find(source => {
        const raw=String((source && source.rawValue) ?? '').trim();
        if(!raw || raw==='-' || raw.startsWith('※')) return false;
        return parseTverDeviceSet(raw).size===1;
      }) || null;
  }

  function resolveTverSettingDeviceDisplayValue(source, fallback){
    const raw=String((source && source.rawValue) ?? '').trim();
    if(raw && parseTverDeviceSet(raw).size===1 && parseTverDeviceSet(raw).has('ctv')) return 'CTV';
    return raw || String(fallback ?? '');
  }

  // tagAppeal 判断当前 ADG 属于 SP 侧还是 CTV 侧（明确 token，不模糊）。返回 'sp' | 'ctv' | null。
  function resolveTverAdGroupSide(tagAppeal){
    const s=String(tagAppeal ?? '').trim();
    if(!s) return null;
    // CTV：明确 token 边界 (?:^|_)CTV(?:_|$)，覆盖前缀 CTV_xxx 与后缀 xxx_CTV（含 タグセット_CTV）。
    if(/(?:^|_)CTV(?:_|$)/.test(s)) return 'ctv';
    // SP：SPPC 前缀/后缀 token；SD/PC、SD-PC token；タグセット_SP token（保持独立，不受影响）。
    if(/(?:^|_)SPPC(?:_|$)/.test(s)) return 'sp';
    if(/^SD[\/\-]PC(?:_|$)/.test(s)) return 'sp';
    if(/^タグセット_SP(?:_|$)/.test(s)) return 'sp';
    return null;
  }

  // A17-1：Targeting 派生字段的 primary 必须由字段 resolver 明确选择；不允许通用 provenance helper 猜测首条来源。
  function resolveSettingTargetingField(entity, field){
    if(field==='price') return resolveTverSettingPrice(entity);
    const targeting=entity && entity.fields && entity.fields.targeting || {};
    const value=String(targeting[field] ?? '');
    const sourceEvidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields[field] || [];
    const primarySource=(sourceEvidence || []).find(source => String((source && source.rawValue) ?? '')===value) || null;
    return { value, primarySource, sourceEvidence };
  }

  function resolveSettingAdGroupDevice(entity){
    const row=resolveTverRowField(entity,'device');
    if(row && !row.comparable) return {resolved:false,rawValue:row.rawValue,device:null,sourceEvidence:row.sourceEvidence,primarySource:row.primarySource,reason:'SETTING_ROW_DEVICE_UNCONFIRMED'};
    const fields=entity && entity.fields ? entity.fields : {};
    const targeting=fields.targeting || {};
    // NEW FMT：主業務表 row-level「デバイス」列（存在かつ非空）が authoritative。
    // 配信デバイス● 総括 / tagAppeal は supporting であり row-level を上書きしない。
    // row-level が未知 token の場合は推測せず unresolved（要確認）とし、下の fallback へは降りない。
    const explicitRaw=String(fields.rowDevice ?? '').trim();
    if(explicitRaw){
      const explicitSource=(entity && entity.sourceRefs && entity.sourceRefs.rowDevice)
        || (entity && entity.sourceEvidence && entity.sourceEvidence.derived && entity.sourceEvidence.derived.device && entity.sourceEvidence.derived.device.primarySource)
        || null;
      const explicitEvidence=uniqueSourceRefs([explicitSource]);
      const canonical=canonicalizeTverExplicitDevice(explicitRaw);
      if(canonical.state==='known'){
        return {
          resolved:true, device:canonical.value, primarySource:explicitSource, sourceEvidence:explicitEvidence,
          rawValue:explicitRaw, comparisonSource:explicitSource, canonicalValue:canonical.value,
          ruleBasis:'TVER_NEW_FMT_DEVICE_ROW_LEVEL',
        };
      }
      return {
        resolved:false, device:null, primarySource:explicitSource, sourceEvidence:explicitEvidence,
        rawValue:explicitRaw, comparisonSource:explicitSource, canonicalValue:null,
        ruleBasis:'TVER_NEW_FMT_DEVICE_ROW_LEVEL_UNRESOLVED',
      };
    }
    const targetingDeviceState=entity && entity.fieldStates && entity.fieldStates.targeting && entity.fieldStates.targeting.device;
    if(targetingDeviceState==='ambiguous'){
      const evidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.device || [];
      return {resolved:false,device:null,primarySource:null,sourceEvidence:evidence,rawValue:'',comparisonSource:null,canonicalValue:null,ruleBasis:'TVER_SETTING_DEVICE_SOURCE_AMBIGUOUS'};
    }
    const deviceRaw=targeting.device || fields.device || '';
    const deviceSet=parseTverDeviceSet(deviceRaw);
    const tagAppeal=String(fields.tagAppeal ?? '').trim();
    const primarySource=entity && entity.sourceRefs && entity.sourceRefs.device || null;
    const sourceEvidence=entity && entity.sourceEvidence && entity.sourceEvidence.derived && entity.sourceEvidence.derived.device && entity.sourceEvidence.derived.device.derivedFrom
      || uniqueSourceRefs([primarySource, entity && entity.sourceRefs && entity.sourceRefs.tagAppeal]);
    const tagAppealSource=(entity && entity.sourceRefs && entity.sourceRefs.tagAppeal)
      || ((entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.tagAppeal) || []).find(source => source);
    const fallbackSource=resolveTverSettingDeviceValueSource(entity);
    const fallbackDisplayValue=resolveTverSettingDeviceDisplayValue(fallbackSource, fields.device);
    const tagSide=resolveTverAdGroupSide(tagAppeal);
    const result=(resolved, device) => {
      const useTagAppealSource=resolved && Boolean(tagAppeal) && Boolean(tagSide);
      const useFallbackSource=!tagAppeal && Boolean(fallbackSource);
      const selectedSource=useTagAppealSource ? tagAppealSource : useFallbackSource ? fallbackSource : primarySource;
      return {
        resolved, device, primarySource:selectedSource, sourceEvidence,
        rawValue:useTagAppealSource ? tagAppeal : useFallbackSource ? fallbackDisplayValue : String(fields.device ?? ''),
        comparisonSource:selectedSource,
        canonicalValue:resolved ? device : null,
        ruleBasis:useTagAppealSource ? `TVER_C3_C4_3_DEVICE_FROM_TAG_APPEAL_${tagSide.toUpperCase()}` : null,
      };
    };
    if(tagAppeal){
      const side=tagSide;
      // CTV 侧：tagAppeal 明确 token 即足够（配信デバイス● 清单可能不枚举 CTV，如②「SP／PC」却存在 CTV ADG）。
      if(side==='ctv') return result(true, 'ctv');
      if(side==='sp') return deviceSet.has('sp') ? result(true, deviceSet.has('pc') ? 'android ios pc' : 'android ios') : result(false, null);
      return result(false, null);
    }
    // tagAppeal 空 → 回退：targeting 清单唯一有效设备类别
    if(deviceSet.size===1){
      const only=[...deviceSet][0];
      if(only==='ctv') return result(true, 'ctv');
      if(only==='sp') return result(true, deviceSet.has('pc') ? 'android ios pc' : 'android ios');
      return result(false, null);
    }
    return result(false, null);
  }

  function normalizeTverPriceForMatching(rawValue){
    const parsed=parseTverPriceTokens(rawValue);
    if(!String(rawValue ?? '').trim() || parsed.invalid.length || parsed.candidates.length===0) return { resolved:false, value:null };
    const seen=new Set(parsed.candidates.map(candidate => candidate.canonicalValue));
    if(seen.size!==1) return { resolved:false, value:null };
    return { resolved:true, value:[...seen][0] };
  }

  function parseTverPriceTokens(rawValue){
    const tokens=String(rawValue ?? '').trim().split(/[\s/]+/).filter(Boolean);
    const candidates=[];
    const invalid=[];
    tokens.forEach(token => {
      const cleaned=token.replace(/^[-]+/, '').replace(/[¥￥,]/g, '').trim();
      if(!cleaned) return;
      if(!/^\d+$/.test(cleaned)){
        invalid.push(token);
        return;
      }
      candidates.push({ rawValue:token, canonicalValue:cleaned });
    });
    return { tokens, candidates, invalid };
  }

  function resolveTverSettingPrice(entity){
    const row=resolveTverRowField(entity,'price');if(row) return {...row,value:row.rawValue};
    const targeting=entity && entity.fields && entity.fields.targeting || {};
    const aggregatedRawValue=String(targeting.price ?? '');
    const sourceEvidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.price || [];
    const fallbackSource=entity && entity.sourceRefs && entity.sourceRefs.price || null;
    if(entity && entity.fieldStates && entity.fieldStates.targeting && entity.fieldStates.targeting.price==='ambiguous'){
      return {value:aggregatedRawValue,primarySource:null,sourceEvidence,canonicalValue:null,ruleBasis:'TVER_SETTING_PRICE_SOURCE_AMBIGUOUS'};
    }
    const sourceCandidates=[];
    let invalid=[];
    (Array.isArray(sourceEvidence) ? sourceEvidence : []).forEach(source => {
      const parsed=parseTverPriceTokens(source && source.rawValue);
      invalid=invalid.concat(parsed.invalid);
      parsed.candidates.forEach(candidate => sourceCandidates.push({ ...candidate, source }));
    });
    const rawParsed=parseTverPriceTokens(aggregatedRawValue);
    invalid=invalid.concat(rawParsed.invalid);
    const rawCandidates=rawParsed.candidates.map(candidate => ({ ...candidate, source:null }));
    const candidates=[...sourceCandidates, ...rawCandidates];
    const canonicalValues=new Set(candidates.map(candidate => candidate.canonicalValue));
    if(!candidates.length || invalid.length || canonicalValues.size!==1){
      return { value:aggregatedRawValue, primarySource:null, sourceEvidence, canonicalValue:null, ruleBasis:null };
    }
    const canonicalValue=[...canonicalValues][0];
    const selected=sourceCandidates.find(candidate => candidate.canonicalValue===canonicalValue) || rawCandidates[0];
    return {
      value:selected.rawValue,
      primarySource:selected.source || fallbackSource,
      sourceEvidence,
      canonicalValue,
      ruleBasis:'TVER_C3_C4_3_PRICE_FROM_CPM',
    };
  }

  function stripTverSegmentBoilerplate(segment){
    let s=String(segment ?? '');
    s=s.replace(/※セグメント名/g, ' ');
    s=s.replace(/※セグメントID/g, ' ');
    s=s.replace(/ADGをSPPC\/CTVで分ける/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  function extractTverSegmentId(strippedSegment){
    const tokens=String(strippedSegment ?? '').split(/\s+/);
    const ids=tokens.filter(token => /^\d+$/.test(token));
    return ids.length===1 ? ids[0] : null;
  }

  function resolveSettingDmpProfile(entity){
    const fields=entity && entity.fields ? entity.fields : {};
    const targeting=fields.targeting || {};
    const segment=String(targeting.segment ?? '');
    const stripped=stripTverSegmentBoilerplate(segment);
    if(!stripped) return { resolved:true, dmpKind:'regular', dmpSegmentId:null };
    return { resolved:true, dmpKind:'dmp', dmpSegmentId:extractTverSegmentId(stripped) };
  }

  function csvDmpSegmentFromRawRows(csv){
    const rows=csv && Array.isArray(csv.rawRows) ? csv.rawRows : [];
    for(const row of rows){
      if(!row || !row.values) continue;
      const value=String(row.values.dmp_segment ?? '').trim();
      if(value) return value;
    }
    return '';
  }

  function resolveCsvDmpProfile(csv, schemaKind, csvDmpAvailable){
    if(schemaKind==='register-without-ids'){
      const dmpSegment=csvDmpSegmentFromRawRows(csv);
      if(dmpSegment) return { resolved:true, dmpKind:'dmp', dmpSegmentId:dmpSegment };
      return { resolved:true, dmpKind:'regular', dmpSegmentId:null };
    }
    const name=csvField(csv, 'adGroupName', 'adgroup_name');
    if(/_DMP_/.test(name)) return { resolved:true, dmpKind:'dmp', dmpSegmentId:null };
    // edit schema 无 dmp_segment 列：当整案 CSV 无 DMP 维度时无法证明 regular → unavailable（区别于 unknown，skip 不冲突）。
    if(csvDmpAvailable===false) return { resolved:true, dmpKind:'unavailable', dmpSegmentId:null };
    return { resolved:true, dmpKind:'regular', dmpSegmentId:null };
  }

  // 阶段 A8：retarget 维度（独立于 DMP）。
  // Setting：データ蓄積 行有真实段 ID → store；入札セグメント 行有真实段 ID → bid；都无 → none；都有 → unresolved。
  function resolveSettingRetargetProfile(entity){
    const fields=entity && entity.fields ? entity.fields : {};
    const targeting=fields.targeting || {};
    const dataAccId=extractTverSegmentId(targeting.dataAccumulation);
    const bidSegId=extractTverSegmentId(targeting.bidSegment);
    if(dataAccId && bidSegId) return { resolved:false, retargetKind:null, retargetSegmentId:null };
    if(dataAccId) return { resolved:true, retargetKind:'store', retargetSegmentId:dataAccId };
    if(bidSegId) return { resolved:true, retargetKind:'bid', retargetSegmentId:bidSegId };
    return { resolved:true, retargetKind:'none', retargetSegmentId:null };
  }

  // CSV：store_segment 非空 → store；bid_segment 非空 → bid；都空 → none；都非空 → unresolved。
  function resolveCsvRetargetProfile(csv){
    const fields=csv && csv.fields ? csv.fields : {};
    const store=String(fields.store_segment ?? '').trim();
    const bid=String(fields.bid_segment ?? '').trim();
    if(store && bid) return { resolved:false, retargetKind:null, retargetSegmentId:null };
    if(store) return { resolved:true, retargetKind:'store', retargetSegmentId:store };
    if(bid) return { resolved:true, retargetKind:'bid', retargetSegmentId:bid };
    return { resolved:true, retargetKind:'none', retargetSegmentId:null };
  }

  function createTverConversionContext(schemaKind, csvTree){
    // edit schema 无 dmp_segment 列：DMP 维度仅当整案 CSV 任一 ADG 名称含 _DMP_ 时才可表达（④⑥），
    // 否则整案 DMP unavailable（②），比较时跳过而非当作 regular 冲突。
    const csvDmpAvailable = schemaKind==='register-without-ids'
      ? true
      : (!csvTree || (Array.isArray(csvTree.adGroups) && csvTree.adGroups.some(adGroup => /_DMP_/.test(csvField(adGroup, 'adGroupName', 'adgroup_name')))));
    function profileForSetting(entity){
      const deviceResolution=resolveSettingAdGroupDevice(entity);
      const targeting=entity && entity.fields && entity.fields.targeting || {};
      const priceResolution=normalizeTverPriceForMatching(targeting.price);
      const dmp=resolveSettingDmpProfile(entity);
      const retarget=resolveSettingRetargetProfile(entity);
      return {
        fields:{
          device:deviceResolution.resolved ? deviceResolution.device : { state:'unknown' },
          price:priceResolution.resolved ? priceResolution.value : { state:'unknown' },
          dmpKind:dmp.resolved ? dmp.dmpKind : { state:'unknown' },
          dmpSegmentId:dmp.dmpSegmentId || null,
          retargetKind:retarget.resolved ? retarget.retargetKind : { state:'unknown' },
          retargetSegmentId:retarget.retargetSegmentId || null,
        },
        // Device is compared after identity matching; it cannot be a structural identity gate.
        requiredFields:['price','dmpKind','retargetKind'],
        optionalFields:['dmpSegmentId','retargetSegmentId'],
      };
    }
    function profileForCsv(entity){
      const device=normalizeTverDevice(entity && entity.fields && entity.fields.device || '').value;
      const priceResolution=normalizeTverPriceForMatching(entity && entity.fields && entity.fields.price || '');
      const dmp=resolveCsvDmpProfile(entity, schemaKind, csvDmpAvailable);
      const retarget=resolveCsvRetargetProfile(entity);
      return {
        fields:{
          device:device ? device : { state:'unknown' },
          price:priceResolution.resolved ? priceResolution.value : { state:'unknown' },
          dmpKind:dmp.resolved ? dmp.dmpKind : { state:'unknown' },
          dmpSegmentId:dmp.dmpSegmentId || null,
          retargetKind:retarget.resolved ? retarget.retargetKind : { state:'unknown' },
          retargetSegmentId:retarget.retargetSegmentId || null,
        },
        requiredFields:['price','dmpKind','retargetKind'],
        optionalFields:['dmpSegmentId','retargetSegmentId'],
      };
    }
    return { getSettingAdGroupProfile:profileForSetting, getCsvAdGroupProfile:profileForCsv };
  }

  function addFieldResult(inputs, base, field, settingValue, csvValue, settingSource, csvSource, extra){
    inputs.push({ ...base, field, settingValue, csvValue, settingSource, csvSource, ruleBasis:'strict', ...(extra || {}) });
  }

  function entityFieldEvidence(entity, field, fallbackSource){
    const fields=entity && entity.sourceEvidence && entity.sourceEvidence.fields || {};
    const evidence=Array.isArray(fields[field]) ? fields[field] : [];
    return evidence.length ? evidence : uniqueSourceRefs([fallbackSource]);
  }

  function addTverStartTrackingInput(inputs,base,setting,csv,parsedCsv){
    const field='tracking_url_start';
    const {appealSource,mapping}=setting.trackingStart;
    const urlSource=mapping && mapping.urlSource;
    const settingState=mapping ? mapping.state : 'not_provided';
    const rows=csv.rawRows || [];
    const csvEvidence=collectFieldEvidence(rows,field);
    const values=new Set(csvEvidence.map(s=>String(s.rawValue ?? '')));
    const csvState=!tverCsvSchemaHasField(parsedCsv,field) || !rows.length || rows.some(row=>!row.sourceRefs || !row.sourceRefs[field])
      ? 'unavailable' : values.size>1 ? 'ambiguous' : 'available';
    const csvValue=csvState==='available' ? String(csvEvidence[0].rawValue ?? '') : '';
    // A blank, unresolved appeal plus a blank CSV has no demonstrated expectation.
    if(!String(appealSource.rawValue).trim() && ![...values].some(value=>value.trim()!=='')) return;
    const reason=settingState!=='available' ? 'TRACKING_START_SETTING_UNCONFIRMED'
      : csvState==='ambiguous' ? 'TRACKING_START_CSV_CONFLICT'
      : csvState==='unavailable' ? 'TRACKING_START_CSV_UNAVAILABLE' : null;
    const settingEvidence=[...new Map([appealSource,...(mapping ? mapping.sources : [])].map(source=>[source.rowNumber+":"+source.columnNumber,source])).values()];
    addFieldResult(inputs,base,field,urlSource ? urlSource.rawValue : '',csvValue,urlSource,csvState==='available' ? csvEvidence[0] : null,{
      ruleBasis:'TVER_NEW_FMT_TRACKING_START_0_PERCENT',settingEvidenceState:settingState,csvEvidenceState:csvState,
      comparable:!reason,alwaysDisplay:true,comparisonStatus:reason ? '需确认' : undefined,conservativeReason:reason,
      sourceEvidence:{setting:settingEvidence,csv:csvEvidence,derivedFrom:settingEvidence},
    });
  }

  function entrySourceEvidence(setting, settingField, settingSource, csv, csvField, csvSource, derivedFrom){
    const derived=uniqueSourceRefs(derivedFrom || []);
    return {
      setting:derived.length ? derived : entityFieldEvidence(setting, settingField, settingSource),
      csv:entityFieldEvidence(csv, csvField, csvSource),
      derivedFrom:derived,
    };
  }

  function tverCampaignRuleSource(field){
    const rule=TVER_CAMPAIGN_CONTRACT_RULES[field];
    if(!rule) return null;
    return {
      fileName:`embedded:TVER_${TVER_TEMPLATE_VERSION}`,
      sheetName:'新規設定バルク(26.3.6時点)',
      rowNumber:8,
      columnName:field,
      rawValue:rule.value,
      ruleId:rule.ruleId,
    };
  }

  function tverSettingContractSource(setting, fieldNames){
    for(const field of fieldNames || []){
      const direct=setting && setting.sourceRefs && setting.sourceRefs[field];
      if(direct) return direct;
      const evidence=setting && setting.sourceEvidence && setting.sourceEvidence.fields && setting.sourceEvidence.fields[field];
      if(Array.isArray(evidence) && evidence.length) return evidence[0];
    }
    return null;
  }

  function tverSettingContractValue(setting, fieldNames){
    const fields=setting && setting.fields || {};
    for(const field of fieldNames || []){
      if(!Object.prototype.hasOwnProperty.call(fields, field)) continue;
      return { value:strictText(fields[field]), source:tverSettingContractSource(setting, [field]) };
    }
    return null;
  }

  // FIX4-A：CV业务值只接受纯ID列表或每行“说明：ID”，不从任意文本扫描数字。
  function parseTverCvPointCollection(rawValue, settingSide){
    const raw=String(rawValue ?? '').replace(/[０-９]/g, digit=>String.fromCharCode(digit.charCodeAt(0)-0xFEE0)).trim();
    if(!raw) return { value:'', reason:null };
    const tokens=[];
    for(const line of raw.split(/\r?\n/).map(value=>value.trim()).filter(Boolean)){
      let ids=line;
      if(!/^\d+(?:[\s,，、]+\d+)*$/.test(ids)){
        const named=settingSide && !/https?:\/\//i.test(line) && line.match(/^.+[:：]\s*(\d+)\s*$/);
        if(!named) return { value:null, reason:'CV_POINT_INVALID_IDS' };
        ids=named[1];
      }
      tokens.push(...ids.split(/[\s,，、]+/));
    }
    const unique=[...new Set(tokens)].sort((a,b)=>a.length-b.length || a.localeCompare(b));
    return { value:unique.join(' '), reason:unique.length===tokens.length ? null : 'CV_POINT_DUPLICATE_IDS' };
  }

  function resolveTverSettingCvPoint(setting){
    const point=tverSettingContractValue(setting, ['cvPoint', 'cv_point']);
    const mode=tverSettingContractValue(setting, ['cvMode', 'cv_mode']);
    const pointSources=entityFieldEvidence(setting, 'cvPoint', point && point.source);
    const modeSources=entityFieldEvidence(setting, 'cvMode', mode && mode.source);
    const sources=uniqueSourceRefs([...pointSources, ...modeSources]);
    const parsed=parseTverCvPointCollection(point && point.value, true);
    const modeValue=String(mode && mode.value || '').trim().toLowerCase();
    const none=['なし', '無し', 'none'].includes(modeValue);
    const enabled=['あり', '有り'].includes(modeValue);
    let reason=null;
    if(setting && setting.fieldStates && [setting.fieldStates.cvMode, setting.fieldStates.cvPoint].includes('ambiguous')) reason='SETTING_CV_POINT_AMBIGUOUS';
    else if(!mode || !mode.source || (!none && !enabled)) reason='SETTING_CV_MODE_UNCONFIRMED';
    else if(none && point && point.value.trim()!=='') reason='SETTING_CV_CONTRADICTION';
    else if(enabled && (!point || !point.source || parsed.value==='')) reason='SETTING_CV_POINT_SOURCE_NOT_PROVIDED';
    else if(parsed.reason) reason=parsed.reason;
    const value=point ? point.value : '';
    return { value, canonicalValue:parsed.value, reason, comparable:!reason,
      primarySource:point && point.source || mode && mode.source || null,
      sourceEvidence:sources, derivedFrom:sources, evidenceState:reason ? 'ambiguous' : 'available',
      ruleBasis:none && !reason ? 'TVER_CAMPAIGN_CV_NONE_FROM_SETTING' : 'TVER_FIX4_CV_POINT_ID_SET' };
  }

  // 比较专用证据读取，不把CV加入Register campaignFields/signature，不更改实体聚合。
  function readTverCsvCvPoint(entity, schemaKind){
    const evidence=uniqueSourceRefs([
      ...((entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.cv_point) || []),
      ...collectFieldEvidence(entity && entity.rawRows || [], 'cv_point'),
    ]);
    if(!['register-without-ids', 'edit-with-ids'].includes(schemaKind) || !evidence.length){
      return { value:'', canonicalValue:null, primarySource:null, sourceEvidence:evidence, comparable:false, evidenceState:'unavailable', reason:'CSV_CV_POINT_SOURCE_NOT_PROVIDED' };
    }
    const candidates=evidence.map(source=>({ source, ...parseTverCvPointCollection(source.rawValue, false) }));
    const selected=candidates.find(candidate=>candidate.reason) || candidates[0];
    const conflict=new Set(candidates.map(candidate=>candidate.value)).size>1;
    const reason=selected.reason || (conflict ? 'CSV_CV_POINT_CONFLICT' : null);
    return { value:String(selected.source.rawValue), canonicalValue:conflict ? null : selected.value,
      primarySource:selected.source, sourceEvidence:evidence, comparable:!reason, evidenceState:reason ? 'ambiguous' : 'available', reason };
  }

  // Targeting.rawFields已保留時間指定证据；只用于Ad比较，不加入GP的semanticSignature。
  function resolveTverAdTimeContract(adGroup){
    const sources=tverA17TargetingSources(adGroup, '時間指定');
    const business=sources.filter(source=>!['', '○', '-'].includes(String(source.rawValue).trim()));
    const base={ start:'00:00', end:'23:59', source:null, sourceEvidence:sources, explicit:false, comparable:true, reason:null };
    if(!business.length && !sources.some(source=>String(source.rawValue).trim()==='○')) return base;
    const candidates=business.map(source=>{
      const range=String(source.rawValue).normalize('NFKC').trim().match(/^(\d{1,2}:\d{1,2}(?::00)?)\s*[~〜-]\s*(\d{1,2}:\d{1,2}(?::00)?)$/);
      const start=range && normalizeTverAdTimeForComparison(range[1]);
      const end=range && normalizeTverAdTimeForComparison(range[2]);
      return { source, start:range && range[1], end:range && range[2], canonical:start && end && start<=end ? `${start}/${end}` : null };
    });
    if(!candidates.length || candidates.some(candidate=>candidate.canonical===null) || new Set(candidates.map(candidate=>candidate.canonical)).size!==1){
      const source=business[0] || sources[0];
      return { ...base, start:String(source && source.rawValue || ''), end:String(source && source.rawValue || ''), source,
        explicit:true, comparable:false, reason:'SETTING_AD_TIME_UNCONFIRMED' };
    }
    return { ...base, start:candidates[0].start, end:candidates[0].end, source:candidates[0].source, explicit:true };
  }

  function resolveTverDailyBudget(setting){
    const field=setting.fields || {},state=setting.fieldStates || {};
    const sources=uniqueSourceRefs(['campaignBudget','startDateTime','endDateTime'].flatMap(f=>entityFieldEvidence(setting,f,setting.sourceRefs && setting.sourceRefs[f])));
    const unknown=reason=>({value:'',comparable:false,reason,derivedFrom:sources});
    if(state.initialDailyBudget==='ambiguous') return unknown('DAILY_BUDGET_EXPLICIT_CONFLICT');
    if(String(field.initialDailyBudget ?? '')!=='') return {value:String(field.initialDailyBudget),comparable:true,derivedFrom:entityFieldEvidence(setting,'initialDailyBudget',setting.sourceRefs && setting.sourceRefs.initialDailyBudget)};
    if(state.campaignBudget==='ambiguous') return unknown('DAILY_BUDGET_TOTAL_CONFLICT');
    const date=value=>{const m=String(value || '').match(/^(\d{4})\/(\d{1,2})\/(\d{1,2}) \d{2}:\d{2}(?::\d{2})?$/);return m && isValidCalendarDate(+m[1],+m[2],+m[3]) ? Date.UTC(+m[1],+m[2]-1,+m[3]) : null;};
    const start=date(field.startDateTime),end=date(field.endDateTime),budget=normalizeTverBudgetForComparison(field.campaignBudget);
    const normalizedStart=normalizeTverDateTimeForComparison(field.startDateTime),normalizedEnd=normalizeTverDateTimeForComparison(field.endDateTime);
    if(normalizedStart.state!=='known' || normalizedEnd.state!=='known' || normalizedEnd.value<normalizedStart.value) return unknown('DAILY_BUDGET_PERIOD_UNCONFIRMED');
    if(start===null || end===null || end<start || budget.state!=='known' || !/^\d+$/.test(String(budget.value))) return unknown('DAILY_BUDGET_INPUT_UNCONFIRMED');
    const days=(end-start)/86400000+1,total=Number(budget.value);
    if(!Number.isSafeInteger(total) || total<0) return unknown('DAILY_BUDGET_AMOUNT_UNCONFIRMED');
    return {value:String(Math.ceil(total/days)),comparable:true,days,derivedFrom:sources,ruleBasis:'TVER_BULK_I5_INCLUSIVE_DAYS_CEIL_YEN'};
  }

  function resolveTverCampaignContract(setting, field){
    const explicitFields={
      budget_type:['budgetType', 'budget_type'],
      campaign_status:['campaignStatus', 'campaign_status'],
      consumption_type:['consumptionType', 'consumption_type'],
      report_target_flag:['reportTargetFlag', 'report_target_flag'],
    };
    const explicit=tverSettingContractValue(setting, explicitFields[field] || []);
    const validExplicit=explicit && explicit.value!=='';
    if(field==='campaign_status'){
      const rule=TVER_CAMPAIGN_CONTRACT_RULES.campaign_status;
      const ruleSource=tverCampaignRuleSource(field);
      const conflict=Boolean(validExplicit && explicit.source && explicit.value!==rule.value);
      const evidence=uniqueSourceRefs([ruleSource,explicit && explicit.source]);
      return { value:rule.value, primarySource:ruleSource, sourceEvidence:evidence, derivedFrom:evidence, evidenceState:'available', comparable:true, ruleBasis:rule.ruleId, conflict, conflictSource:conflict ? explicit.source : null, conflictValue:conflict ? explicit.value : null };
    }
    if(field==='consumption_type'){
      if(validExplicit) return { value:explicit.value, primarySource:explicit.source, sourceEvidence:uniqueSourceRefs([explicit.source]), derivedFrom:uniqueSourceRefs([explicit.source]), evidenceState:explicit.source ? 'available' : 'not_provided', comparable:Boolean(explicit.source), ruleBasis:'TVER_CAMPAIGN_CONSUMPTION_SETTING_VALUE' };
      const otherValue=tverSettingContractValue(setting, ['otherSettings']);
      if(otherValue && /フル|full/i.test(otherValue.value)){
        return { value:'2', primarySource:otherValue.source, sourceEvidence:uniqueSourceRefs([otherValue.source]), derivedFrom:uniqueSourceRefs([otherValue.source]), evidenceState:otherValue.source ? 'available' : 'not_provided', comparable:Boolean(otherValue.source), ruleBasis:'TVER_CAMPAIGN_CONSUMPTION_FULL_FROM_SETTING' };
      }
      const ruleSource=tverCampaignRuleSource(field);
      return { value:TVER_CAMPAIGN_CONTRACT_RULES[field].value, primarySource:ruleSource, sourceEvidence:[ruleSource], derivedFrom:[ruleSource], evidenceState:'available', comparable:true, ruleBasis:TVER_CAMPAIGN_CONTRACT_RULES[field].ruleId };
    }
    if(field==='cv_point'){
      return resolveTverSettingCvPoint(setting);
    }
    if(validExplicit){
      return { value:explicit.value, primarySource:explicit.source, sourceEvidence:uniqueSourceRefs([explicit.source]), derivedFrom:uniqueSourceRefs([explicit.source]), evidenceState:explicit.source ? 'available' : 'not_provided', comparable:Boolean(explicit.source), ruleBasis:`TVER_CAMPAIGN_${field.toUpperCase()}_SETTING_VALUE` };
    }
    const ruleSource=tverCampaignRuleSource(field);
    return { value:TVER_CAMPAIGN_CONTRACT_RULES[field].value, primarySource:ruleSource, sourceEvidence:[ruleSource], derivedFrom:[ruleSource], evidenceState:'available', comparable:true, ruleBasis:TVER_CAMPAIGN_CONTRACT_RULES[field].ruleId };
  }

  // NO010: 260605「新規設定バルク(26.3.6時点)」H6詳細「指定なし(=推奨設定)の場合は空欄」／
  // H8注意「基本空欄。フルモードの場合は以下 100 0 0 …」／J8「フルの場合は時間毎予算割合は
  // 0時100にする」を根拠に、フラット（予算消化タイプ1）では期待値=空欄として比較する。
  // フル（2）は指示値の形が一意でないため従来どおり要確認を維持する。
  const TVER_HOURLY_BID_WEIGHT_RULE={ blank:'TVER_260605_HOURLY_BID_WEIGHT_DEFAULT_BLANK', full:'TVER_260605_HOURLY_BID_WEIGHT_FULL_MODE_RULE_PENDING' };

  function resolveTverHourlyBidWeight(setting, model){
    // NO011: 260605「新規設定バルク」以外のテンプレート（legacy形式）には既定値を流用しない。
    if(model && model.templateFormat && model.templateFormat!=='new'){
      return { value:'', primarySource:null, derivedFrom:[], evidenceState:'not_provided', comparable:false,
        ruleBasis:'TVER_HOURLY_BID_WEIGHT_TEMPLATE_NOT_APPLICABLE', reason:'HOURLY_BID_WEIGHT_TEMPLATE_NOT_APPLICABLE' };
    }
    const explicit=tverSettingContractValue(setting, ['hourlyBidWeight', 'hourly_bid_weight']);
    if(explicit && explicit.value!==''){
      return { value:explicit.value, primarySource:explicit.source, derivedFrom:uniqueSourceRefs([explicit.source]),
        evidenceState:explicit.source ? 'available' : 'not_provided', comparable:Boolean(explicit.source),
        ruleBasis:'TVER_CAMPAIGN_HOURLY_BID_WEIGHT_SETTING_VALUE', reason:null };
    }
    const consumption=resolveTverCampaignContract(setting, 'consumption_type');
    const consumptionValue=String(consumption.value ?? '').trim();
    // NO011: 予算消化タイプが未確認／不正な値のときは、フラットと決めつけない。
    if(consumptionValue==='2'){
      return { value:'', primarySource:null, derivedFrom:[], evidenceState:'not_provided', comparable:false,
        ruleBasis:TVER_HOURLY_BID_WEIGHT_RULE.full, reason:'HOURLY_BID_WEIGHT_FULL_MODE_RULE_PENDING' };
    }
    if(consumptionValue!=='' && consumptionValue!=='1'){
      return { value:'', primarySource:null, derivedFrom:[], evidenceState:'ambiguous', comparable:false,
        ruleBasis:'TVER_HOURLY_BID_WEIGHT_CONSUMPTION_INVALID', reason:'HOURLY_BID_WEIGHT_CONSUMPTION_TYPE_INVALID' };
    }
    if(!consumption.comparable || consumptionValue===''){

        ruleBasis:'TVER_HOURLY_BID_WEIGHT_CONSUMPTION_UNCONFIRMED', reason:'HOURLY_BID_WEIGHT_CONSUMPTION_TYPE_UNCONFIRMED' };

      ruleBasis:TVER_HOURLY_BID_WEIGHT_RULE.blank, reason:null };
  }

  function tverCsvSchemaHasField(parsedCsv, field){
    const headers=parsedCsv && parsedCsv.schema && parsedCsv.schema.canonicalHeaders;

  function buildTverA173EditSchemaNotices(settingModel, csvTree, matching, schemaKind){
    if(schemaKind!=='edit-with-ids') return [];
    const settingAll=[...(settingModel && settingModel.campaigns || []), ...(settingModel && settingModel.adGroups || []), ...(settingModel && settingModel.ads || [])];
    const csvAll=[...(csvTree && csvTree.campaigns || []), ...(csvTree && csvTree.adGroups || []), ...(csvTree && csvTree.ads || [])];
    const fieldConfig={
      tver_video_duration:{
        code:'EDIT_SCHEMA_UNSUPPORTED_TVER_VIDEO_DURATION',
        message:'編集CSVには広告再生時間が含まれないため、設定表のADG単位の証拠を確認してください。',
      },
      dmp_segment:{
        code:'EDIT_SCHEMA_UNSUPPORTED_DMP_SEGMENT',
        message:'編集CSVにはDMPセグメントが含まれないため、設定表のADG単位の証拠を確認してください。',
      },
    };
    const grouped=new Map(Object.keys(fieldConfig).map(field => [field, { settingEvidence:[], affectedEntityKeys:[] }]));
    (matching && matching.matches || []).forEach(match => {
      if(!match || match.status!=='matched' || match.level!=='Ad Group') return;
      const setting=findEntityByKey(settingAll, match.settingKey);
      const csv=findEntityByKey(csvAll, match.csvKey);
      if(!setting) return;
      Object.keys(fieldConfig).forEach(field => {
        const result=resolveSettingOperationalTargetingForComparison(setting, field);
        if(!result || !result.shouldGenerate) return;
        const group=grouped.get(field);
        const entityKey=csv && csv.key || setting.key;
        if(entityKey && !group.affectedEntityKeys.includes(entityKey)) group.affectedEntityKeys.push(entityKey);
        (result.sourceEvidence || []).forEach(source => {
          if(source) group.settingEvidence.push(source);
        });
      });
    });
    return [...grouped.entries()]
      .filter(([, group]) => group.affectedEntityKeys.length)
      .map(([field, group]) => ({
        field, level:'Ad Group', code:fieldConfig[field].code, message:fieldConfig[field].message,
        settingEvidence:uniqueSourceRefs(group.settingEvidence),
        affectedEntityKeys:[...group.affectedEntityKeys],
      }));
  }

  function normalizeTverSurveyCsvValue(field, rawValue){
    const raw=String(rawValue ?? '').trim();
    if(raw==='') return {value:'',reason:null};
    if(field==='uid_suffix'){
      const parsed=tverAsr0CCollection(raw);
      return {value:parsed.value,reason:parsed.value===null ? 'SURVEY_ASR_TOKEN_UNCONFIRMED' : parsed.duplicate ? 'SURVEY_DUPLICATE_MEMBERS' : null};
    }
    if(['bid_segment','bid_segment_exclude','dmp_segment','affinity','demography','gender','pref','annual_income'].includes(field)){
      const parsed=parseTverCvPointCollection(raw,false);
      return {value:parsed.value,reason:parsed.reason ? 'SURVEY_ID_COLLECTION_UNCONFIRMED' : null};
    }
    if(['start_time','end_time'].includes(field)){
      const value=normalizeTverAdTimeForComparison(raw);
      return {value,reason:value===null ? 'SURVEY_AD_TIME_UNCONFIRMED' : null};
    }
    const normalized=normalizeComparisonValue(field,rawValue);
    return {value:normalized.value,reason:normalized.state==='known' ? null : 'SURVEY_CSV_VALUE_UNCONFIRMED'};
  }

  function resolveTverGroupNameContract(setting, model){
    const sources=[],components={};
    const result=(value,reason,ruleBasis='TVER_GROUP_NAME_P25')=>({value,comparable:!reason,reason:reason || null,ruleBasis,sourceEvidence:uniqueSourceRefs(sources),components});
    const rule=page=>({fileName:'embedded:TVer管理画面マニュアル_20260827',sheetName:`P${page}`,rowNumber:page,columnName:'Group命名規則',rawValue:'Setting独立派生',ruleId:`TVER_GROUP_NAME_P${page}`});
    if(setting.businessType){
      const c=setting.surveyContracts && setting.surveyContracts.adgroup_name;
      sources.push(...(c && c.sourceEvidence || []));
      if(setting.businessType==='survey-sp' && c) return result(c.rawValue,c.comparable ? c.reason : c.reason || 'SP名称来源未确认',c.ruleBasis);
      if(setting.businessType==='survey-ctv'){
        sources.push(rule(65),rule(66),rule(68));
        components.settingName=c && c.rawValue || '';
        return result(null,'CTV_GROUP_NAME_AUTHORITY_PENDING：運用使用欄の名称とP65/P66/P68の優先順位が未確認（P66のCTV前区切りも曖昧）','TVER_GROUP_NAME_CTV_AUTHORITY_PENDING');
      }
      return result(null,'特殊業務の名称規則が未確認');
    }
    sources.push(rule(22),rule(25),{fileName:'embedded:business-confirmed:NO022',sheetName:'正式命名规则',rowNumber:null,columnName:'Ad Group/Device',rawValue:'PC+SP+CTV: suffixなし; SPPC:_SPPC; SP:_SP; CTV:_CTV; SP+CTV:_SPCTV',ruleId:'TVER_NO022_CONFIRMED_DEVICE_SUFFIX'});
    const parent=(model.campaigns || []).find(cp=>cp.key===setting.parentKey);
    if(!parent) return result(null,'親CPのSetting来源が未確認');
    // 空値を省略できるのは、列/槽位が存在し、実際に空だと確認できた場合だけ。
    const read=(entity,field)=>{
      const source=entity.sourceRefs && entity.sourceRefs[field];
      if(!source || entity.nameHeaderPresence && entity.nameHeaderPresence[field]===false) return {ok:false};
      sources.push(source);return {ok:true,value:String((entity.fields && entity.fields[field]) ?? '')};
    };
    const cpName=read(parent,'campaignName'),appeal=read(parent,'campaignAppeal');
    if(!cpName.ok || !cpName.value.trim() || !appeal.ok) return result(null,'CPN名またはCPN訴求の来源列が未確認');
    const dates=[];
    for(const field of ['startDateTime','endDateTime']){
      const value=read(parent,field);
      if(!value.ok) return result(null,'継承するCP期間の来源が未確認');
      const match=value.value.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:[ T].*)?$/);
      if(!match || !isValidCalendarDate(Number(match[1]),Number(match[2]),Number(match[3]))) return result(null,'名称用日付を安全に解析できません');
      dates.push(campaignDateCode(value.value,field==='startDateTime'));
    }
    const identity=setting.displayIdentity, targetSource=identity && identity.sourceRefs && identity.sourceRefs.targetingName;
    if(!targetSource) return result(null,'ターゲティング名の来源槽位が未確認');
    sources.push(targetSource);
    const target=String(targetSource.rawValue ?? '');
    if(target.startsWith('※') || target.trim()!==String(identity.targetingName ?? '').trim()) return result(null,'ターゲティング名はテンプレート注記または解析不一致');
    const device=resolveSettingAdGroupDevice(setting);
    sources.push(...(device.sourceEvidence || []));
    if(!device.resolved || !(device.sourceEvidence || []).length) return result(null,'Deviceの名称用根拠が未確認');
    const tokens=new Set(String(device.device).split(' '));
    const exact=values=>tokens.size===values.length && values.every(value=>tokens.has(value));
    let suffix;
    if(exact(['android','ios','pc','ctv'])) suffix='';
    else if(exact(['android','ios','pc'])) suffix='SPPC';
    else if(exact(['android','ios'])) suffix='SP';
    else if(exact(['ctv'])) suffix='CTV';
    else if(exact(['android','ios','ctv'])) suffix='SPCTV';
    else suffix=null;
    const other=String(setting.fields.targeting && setting.fields.targeting.otherSettings || '');
    if(/消化用/.test(other)) return result(null,'消化用DMPの適用・後置順序の根拠が未確認');
    const dmp=resolveSettingDmpProfile(setting);
    const segmentEvidence=uniqueSourceRefs(((setting.sourceEvidence && setting.sourceEvidence.fields && setting.sourceEvidence.fields.segment) || []).filter(source=>String(source && source.rawValue || '').trim() && !String(source.rawValue || '').trim().startsWith('※')));
    if(dmp.dmpKind==='dmp'){
      sources.push(...segmentEvidence);
      const segmentId=String(dmp.dmpSegmentId || '');
      if(!segmentId || !segmentEvidence.some(source=>String(source.rawValue || '').trim()===segmentId)) return result(null,'DMP Segment IDのSetting来源未确认');
      // NO031：ターゲティング名が空欄（NO のみ有効）の場合、名称に DMP を要求しない。
      // 明示的なターゲティング名がある場合のみ、従来どおり DMP 表記を要求する。
      if(String(target).trim()!=='' && !/(?:^|_)DMP(?:_|$)/.test(target)) return result(null,'DMPのTargeting名称/消化用区分が未確認');
    }else if(/(?:^|_)DMP(?:_|$)/.test(target)){
      return result(null,'DMP Targeting名に対応するSetting segment来源が未确认');
    }
    // Preserve the existing evidenced DMP-only name contract; do not generalize single PC/iOS to other Groups.
    if(suffix===null && target==='DMP' && dmp.dmpKind==='dmp' && (exact(['pc']) || exact(['ios']))) suffix='';
    if(suffix===null) return result(null,'DEVICE_SUFFIX_RULE_PENDING','TVER_NO021_DEVICE_COMBINATION_UNCONFIRMED');
    Object.assign(components,{campaignName:cpName.value,start:dates[0],end:dates[1],appeal:appeal.value,targetingName:target,deviceSuffix:suffix});
    const campaignPart=buildCampaignExpectation(parent.fields);
    if(parent.expectedName && parent.expectedName!==campaignPart) return result(null,'CP_NAME_SETTING_DERIVATION_CONFLICT');
    return result(`${parent.expectedName || campaignPart}${target ? '_'+target : ''}${suffix ? '_'+suffix : ''}`);
  }

  // NO011: 管理画面マニュアル P25 の命名ルールは「[ターゲティング名など(あれば)]」と任意指定。
  // CPN訴求とターゲティング名が同値の案件では、運用がその任意トークンを省略する実例がある
  // (006/008)。省略形と完全一致する場合だけ「表記ゆれ一致」とし、他の差異は不一致のまま。
  // P25 が定義する接尾辞は _SPPC／_SP／_CTV／_DMP に加え、NO022 で _SPCTV（SP+CTV）が現場確認済み。
  // CSV 側に定義外の接尾辞がある場合は名称規則が未確定なので要確認に落とす。
  const TVER_GROUP_NAME_DOCUMENTED_SUFFIXES=new Set(['SPPC','SP','CTV','DMP','SPCTV']);
  // 名称末尾の「_英大文字2〜6字」を接尾辞候補として分離する（本体は接尾辞を除いた部分）。
  function splitTverGroupNameSuffix(value){
    const raw=String(value ?? ''),match=/(?:^|_)([A-Z]{2,6})$/.exec(raw);
    // NO014: 名称全体が英大文字のみで '_' 区切りが無い場合 match.index===0 となり、
    // 旧実装の raw.slice(0,raw.length-len-1) は本体末尾1文字を誤って落としていた。
    // 接尾辞は「本体 + '_' + 接尾辞」の形でのみ分離し、区切りが無い場合は本体全体を本体とする。
    if(!match || match.index===0) return {body:raw,suffix:''};
    return {body:raw.slice(0,match.index),suffix:match[1]};
  }
  function resolveTverGroupNameTolerance(input,actual){
    const raw=String(actual ?? '');
    if(!input || !input.settingValue || raw==='') return null;
    const expected=String(input.settingValue);
    if(raw===expected) return null;
    const components=input.__groupNameComponents || null;
    const declared=String(input.__groupNameDeclaredSuffix || '');
    // NO013: 接尾辞の降級は「本体が設定表由来の本体と完全一致」のときだけ。
    // 本体が違う名称は、末尾が英字でも不一致のまま（過剰な降級を防ぐ）。
    const expectedBody=declared && expected.endsWith('_'+declared) ? expected.slice(0,expected.length-declared.length-1) : expected;
    const actualParts=splitTverGroupNameSuffix(raw);
    const suffixOnly=actualParts.suffix!=='' && actualParts.suffix!==declared
      && !TVER_GROUP_NAME_DOCUMENTED_SUFFIXES.has(actualParts.suffix) && actualParts.body===expectedBody;
    if(suffixOnly) return {status:'需确认',reason:'DEVICE_SUFFIX_RULE_PENDING',ruleBasis:'TVER_GROUP_NAME_P25_SUFFIX_PENDING'};
    if(!components || !components.targetingName) return null;
    const withoutTarget=expected.replace(new RegExp('_'+components.targetingName.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$'),'');
    if(withoutTarget!==expected && raw===withoutTarget){
      return {status:'表記ゆれ一致',reason:null,ruleBasis:'TVER_GROUP_NAME_P25_OPTIONAL_TARGETING_OMITTED'};
    }
    // NO014: P25 の「[ターゲティング名など(あれば)]」省略は、デバイス接尾辞が付く名称でも起こる。
    // 期待名を構成要素から厳密に再構成し、ターゲティング名トークンだけを除いた形と実値が
    // 完全一致する場合に限り「表記ゆれ一致」とする（他のトークン差異は不一致のまま）。
    const composeName=withTarget=>`${components.campaignName}_${components.start}-${components.end}`
      +(`${components.appeal ? '_'+components.appeal : ''}`)
      +(withTarget ? `_${components.targetingName}` : '')
      +(declared ? `_${declared}` : '');
    if(components.campaignName && components.start && components.end
      && composeName(true)===expected && raw===composeName(false)){
      return {status:'表記ゆれ一致',reason:null,ruleBasis:'TVER_GROUP_NAME_P25_OPTIONAL_TARGETING_OMITTED'};
    }
    return null;
  }

  function buildTverGroupNameInput(setting,csv,model,base){
    const contract=resolveTverGroupNameContract(setting,model),evidence=collectFieldEvidence(csv.rawRows || [],'adgroup_name');
    const actual=String(csvField(csv, 'adGroupName', 'adgroup_name') ?? '');
    const conflict=new Set(evidence.map(s=>String(s.rawValue))).size>1;
    const unavailable=!evidence.length,comparable=contract.comparable && !conflict && !unavailable;
    const input={...base,field:'adgroup_name',settingValue:contract.value || '',csvValue:conflict ? '' : actual,
      settingSource:contract.sourceEvidence.find(s=>!s.fileName.startsWith('embedded:')) || null,csvSource:conflict ? null : evidence[0] || null,
      settingEvidenceState:contract.comparable ? 'available' : 'ambiguous',csvEvidenceState:conflict ? 'ambiguous' : unavailable ? 'unavailable' : 'available',
      comparable,alwaysDisplay:true,comparisonStatus:comparable ? null : '需确认',ruleBasis:contract.ruleBasis,
      conservativeReason:conflict ? 'CSV_GROUP_NAME_CONFLICT' : unavailable ? 'CSV_GROUP_NAME_SOURCE_UNAVAILABLE' : contract.reason,
      sourceEvidence:{setting:contract.sourceEvidence,csv:evidence,derivedFrom:contract.sourceEvidence}};
    if(comparable){
      input.__groupNameComponents=contract.components || null;
      input.__groupNameDeclaredSuffix=String(contract.components && contract.components.deviceSuffix || '');
      const tolerance=resolveTverGroupNameTolerance(input,actual);
      if(tolerance){
        if(tolerance.status==='需确认') Object.assign(input,{comparisonStatus:'需确认',comparable:false,conservativeReason:tolerance.reason,ruleBasis:tolerance.ruleBasis});
        else Object.assign(input,{comparisonStatus:tolerance.status,ruleBasis:tolerance.ruleBasis});
      }
      delete input.__groupNameComponents;
      delete input.__groupNameDeclaredSuffix;
    }
    return input;
  }

  function buildTverSurveyComparisonInputs(setting,csv,parsedCsv,base){
    return Object.entries(setting.surveyContracts || {}).map(([field,originalContract])=>{
      const editAdStatus=setting.level==='Ad' && field==='status' && parsedCsv.schema.kind==='edit-with-ids';
      const contract=editAdStatus ? { ...originalContract,rawValue:'',canonicalValue:null,comparable:false,sourceEvidence:[],
        ruleBasis:setting.businessType==='survey-ctv' ? 'TVER_SURVEY_CTV_EDIT_AD_STATUS_DEFERRED' : 'TVER_SURVEY_SP_EDIT_AD_STATUS_DEFERRED',reason:'SURVEY_EDIT_AD_STATUS_NOT_CONFIRMED' } : originalContract;
      const settingState=editAdStatus ? 'not_provided' : contract.comparable ? 'available' : 'ambiguous';
      const csvFields=field==='age' ? ['start_age','end_age'] : [field];
      const provided=csvFields.every(name=>tverCsvSchemaHasField(parsedCsv,name));
      const evidence=uniqueSourceRefs(csvFields.flatMap(name=>collectFieldEvidence(csv.rawRows || [],name)));
      let rawValue='',canonical=null,csvReason=null;
      if(field==='age'){
        const pairs=(csv.rawRows || []).map(row=>({start:String(row.values.start_age ?? ''),end:String(row.values.end_age ?? '')}));
        const pair=pairs[0] || {start:'',end:''};
        rawValue=pair.start==='' && pair.end==='' ? '' : `${pair.start} / ${pair.end}`;
        const parsed=tverA17CsvAgeParse(csv,parsedCsv.schema.kind);
        canonical=rawValue==='' ? '' : parsed && parsed.canonicalValue;
        if(new Set(pairs.map(p=>JSON.stringify(p))).size>1 || (rawValue!=='' && !parsed)) csvReason='SURVEY_CSV_VALUE_CONFLICT';
      }else{
        const candidates=evidence.map(source=>({source,...(setting.businessType==='survey-ctv' && field==='uid_suffix' ? {value:String(source.rawValue),reason:null} : normalizeTverSurveyCsvValue(field,source.rawValue))}));
        const first=candidates[0];
        rawValue=first ? String(first.source.rawValue) : '';
        canonical=first ? first.value : null;

      }

      const contactAsrPending=setting.businessType==='survey-sp' && setting.level==='Ad Group' && setting.surveyRole==='contact' && field==='uid_suffix' && rawValue.trim()!=='';
      const comparisonSettingState=contactAsrPending ? 'ambiguous' : settingState;

      const reason=!provided || !evidence.length ? 'SURVEY_CSV_FIELD_UNAVAILABLE' : editAdStatus ? 'SURVEY_EDIT_AD_STATUS_NOT_CONFIRMED' : contract.reason || (ctvNotRequired ? 'CTV_NOT_REQUIRED_FIELD_PRESENT' : null) || csvReason || (contactAsrPending ? 'SURVEY_CONTACT_ASR_RULE_PENDING' : null) || (!contract.comparable ? 'SURVEY_SETTING_SOURCE_UNCONFIRMED' : null);
      const comparable=!reason && canonical!==null;
      const comparisonStatus=!comparable ? '需确认' : String(contract.canonicalValue)===String(canonical) ? (contract.rawValue===rawValue ? '一致' : '表記ゆれ一致') : '不一致';
      return { ...base,ctvContract:setting.businessType==='survey-ctv',field,settingValue:contract.rawValue,csvValue:rawValue,
        settingSource:contract.sourceEvidence[0] || null,csvSource:evidence[0] || null,
        settingCanonical:{value:contract.canonicalValue,evidenceState:comparisonSettingState,ruleId:contract.ruleBasis},
        csvCanonical:{value:canonical,evidenceState:provided ? 'available' : 'unavailable',ruleId:setting.businessType==='survey-ctv' ? 'TVER_SURVEY_CTV_CSV' : 'TVER_SURVEY_SP_CSV'},
        settingEvidenceState:comparisonSettingState,csvEvidenceState:provided ? 'available' : 'unavailable',
        schemaKind:parsedCsv.schema.kind,currentStatusRequired:true,comparable,alwaysDisplay:true,comparisonStatus,
        conservativeReason:reason,ruleBasis:contract.ruleBasis,
        sourceEvidence:{setting:contract.sourceEvidence,csv:evidence,derivedFrom:contract.sourceEvidence},
      };
    });
  }

  function buildTverOrdinarySurveySpInputs(setting,csv,parsedCsv,base){

        : new Set(candidates.map(c=>c.value)).size!==1 ? 'CSV_ROWS_CONFLICT' : null);
      const comparisonStatus=reason ? '需确认' : String(expected)===String(csvCanonical)
        ? settingRaw===csvRaw ? '一致' : '表記ゆれ一致' : '不一致';
      return {...base,field,settingValue:settingRaw,csvValue:csvRaw,
        settingSource:resolved.primarySource || (resolved.sourceEvidence || [])[0] || null,csvSource:first && first.source || null,
        settingCanonical:{value:settingCanonical,evidenceState:resolved.evidenceState,ruleId:'TVER_SURVEY_NORMAL_SP_P56'},
        csvCanonical:{value:csvCanonical,evidenceState:provided ? 'available' : 'unavailable',ruleId:'TVER_SURVEY_NORMAL_SP_CSV'},

        comparable:!reason,alwaysDisplay:true,comparisonStatus,conservativeReason:reason ? 'TVER_SURVEY_NORMAL_SP_'+reason : null,
        ruleBasis:'TVER_SURVEY_NORMAL_SP_P56',sourceEvidence:{setting:settingEvidence,csv:evidence,derivedFrom:derived}};
    });
  }

  function tverInactiveFieldEvidence(model,setting,field){
    if(!setting || setting.businessType) return null;
    const off=model.coverageFacts && model.coverageFacts.survey;
    if(['bls_start_datetime','bls_end_datetime','contact_bls_survey_id','non_contact_bls_survey_id','bls_store_segment'].includes(field)
      && off && off.state==='available' && off.value==='なし') return {reason:'SETTING_SURVEY_EXPLICIT_OFF',sources:off.sources};
    if(setting.level==='Ad') return null; // An empty Tracking binding is missing source, not proof that Tracking was not requested.
    if(setting.level!=='Ad Group') return null;
    if(isTverOrdinarySurveySpScopedGp(setting) && ['uid_suffix','store_segment'].includes(field)) return null;
    const labels={genre:'番組ジャンル●',genre_exclude:'番組ジャンル●',subgenre:'番組サブジャンル●',subgenre_exclude:'番組サブジャンル●',
      contents_group:'その他設定(ADG)',affinity:'興味関心●',gender:'性別●',annual_income:'世帯年収●',demography:'デモグラフィック●',tv_usage_tendency:'テレビ視聴傾向●',
      uid_suffix:'ASR',age:'年齢●',pref:'都道府県/市区町村●',media:'放送局●',local_broadcaster:'放送局●',
      bid_segment:'入札セグメント',bid_segment_exclude:'入札除外セグメント',upload_segment_expansion_threshold:'入札セグメント',
      dmp_segment:'DMPセグメント',dmp_segment_exclude:'DMP除外セグメント',dmp_segment_expansion_threshold:'DMPセグメント',store_segment:'データ蓄積'};
    const group=model.sourceIndex && model.sourceIndex.targetingByNumber && model.sourceIndex.targetingByNumber[canonicalizeTverTargetingNumber(setting.fields.targetingNumber)];
    const raw=group && group.rawFields && group.rawFields[labels[field]],slots=raw && raw.slots;
    if(!slots || slots.length<2 || (raw.occurrences || []).length!==1) return null;
    const currentSources=tverA17TargetingSources(setting,labels[field]);
    if(currentSources.some(source=>!slots.some(slot=>['fileName','sheetName','rowNumber','columnName','columnNumber','rawValue'].every(key=>slot.source[key]===source[key])))) return null;
    const marker=String(slots[0].rawValue),value=String(slots[1].rawValue);
    if(field==='genre_exclude' && marker==='指定') return {reason:'GENRE_INCLUDE_DIRECTIVE_EXCLUDES_EXCLUSION',sources:[slots[0].source,slots[1].source]};
    if(field==='genre' && marker==='除外') return {reason:'GENRE_EXCLUDE_DIRECTIVE_EXCLUDES_INCLUSION',sources:[slots[0].source,slots[1].source]};
    if(/^dmp_/.test(field) && (/(?:^|_)DMP(?:_|$)/.test(String(setting.displayIdentity && setting.displayIdentity.targetingName || '')) || resolveSettingDmpExpansionForComparison(setting).shouldGenerate)) return null;
    const segmentLabel=['DMPセグメント','DMP除外セグメント','入札セグメント','入札除外セグメント','データ蓄積'].includes(labels[field]);
    const emptySlot=value=>tverA173PlaceholderValue(value) || segmentLabel && ['※セグメント名','※セグメントID'].includes(value);
    const supplement=slots[2] && String(slots[2].rawValue) || '';
    if(!['','-'].includes(marker) || !emptySlot(value) || !emptySlot(supplement)) return null;
    return {reason:'SETTING_OPTIONAL_TARGETING_EXPLICIT_EMPTY',sources:uniqueSourceRefs(slots.slice(0,3).map(s=>s.source))};
  }

  function applyTverCoverageGovernance(run,model,parsed,csvTree){
    const entities=[...model.campaigns,...model.adGroups,...model.ads],csvEntities=[...csvTree.campaigns,...csvTree.adGroups,...csvTree.ads];
    const retained=run.entries.slice(0,0);
    for(const entry of [...run.entries,...run.coverageOnlyEntries]){
      const setting=entities.find(e=>e.key===entry.entityKey),match=run.matching.matches.find(m=>m.settingKey===entry.entityKey);
      const csv=csvEntities.find(e=>e.key===(match && (match.csvKey || match.comparisonScopeKey)));
      const ownedFields=entry.field==='age' ? ['start_age','end_age'] : [entry.field];
      const evidence=csv ? uniqueSourceRefs(ownedFields.flatMap(field=>collectFieldEvidence(csv.rawRows,field))) : entry.sourceEvidence.csv || [];
      const csvAbsenceVerifiable=ownedFields.every(field=>tverCsvSchemaHasField(parsed,field)) && evidence.length>0;
      const rawValues=[...new Set(evidence.map(s=>String(s.rawValue ?? '')))];
      const empty=entry.field==='age' ? String(entry.csvRawValue || '').split('/').every(s=>s.trim()==='') : rawValues.length ? rawValues.every(v=>v==='') : String(entry.csvRawValue || '')==='';
      if(!entry.comparable && /MAPPING_NOT_FOUND|MAPPING_AMBIGUOUS/.test(String(entry.conservativeReason || '')))entry.coverageCategory='INPUT_INSUFFICIENT';
      if(!entry.comparable && entry.evidenceStates.setting!=='available' && entry.ruleBasis==='strict' && /^tracking_url_/.test(entry.field)){entry.conservativeReason='TRACKING_POINT_BINDING_NOT_PROVIDED';entry.coverageCategory='INPUT_INSUFFICIENT';}
      const inactive=tverInactiveFieldEvidence(model,setting,entry.field);
      if(inactive && empty && csvAbsenceVerifiable && (entry.coverageOnly || !entry.comparable) && !entry.identityPending && match && match.status==='matched' && csv){
        Object.assign(entry,{coverageOnly:true,notApplicable:true,comparable:false,displayStatus:'',comparisonStatus:null,conservativeReason:inactive.reason});
        entry.sourceEvidence.setting=uniqueSourceRefs([...(entry.sourceEvidence.setting || []),...inactive.sources]);
      }
      if(entry.notApplicable && entry.field!=='creative_id' && (!csvAbsenceVerifiable || !empty)){
        delete entry.notApplicable;
        entry.coverageCategory=csvAbsenceVerifiable ? 'MANUAL_REQUIRED' : 'CSV_NOT_VERIFIABLE';
        entry.conservativeReason=csvAbsenceVerifiable ? 'CSV_VALUE_PRESENT_FOR_INACTIVE_FIELD' : 'CSV_FIELD_NOT_VERIFIABLE';
        entry.comparable=false;entry.comparisonStatus='需确认';if(!entry.coverageOnly)entry.displayStatus='需确认';
      }
      if(entry.coverageOnly){
        if(!entry.notApplicable && !['entity','identity','full_frequency_cap','video_position'].includes(entry.field)){
          if(entry.conservativeReason==='SETTING_FIELD_SOURCE_OR_RULE_PENDING'){
            entry.conservativeReason='SETTING_SOURCE_NOT_PROVIDED:'+entry.field;
            entry.coverageCategory='INPUT_INSUFFICIENT';

          if(evidence.length){entry.sourceEvidence.csv=evidence;entry.csvRawValue=rawValues.join(' | ');}
        }
      }else retained.push(entry);
    }
    const all=[...run.entries,...run.coverageOnlyEntries];run.entries=retained;run.coverageOnlyEntries=all.filter(e=>e.coverageOnly);
  }

    required.Campaign=[...new Set([...required.Campaign,...CAMPAIGN_FIELDS,'budget_type'])];

    required.Ad=[...new Set([...required.Ad,...AD_FIELDS])];

        const entry=compareField({level:entity.level,entityKey:entity.key,csvEntityKey:csvKey || null,field,settingValue:'',csvValue:'',comparisonStatus:'需确认',comparable:false,notApplicable,conservativeReason:coverageReason,ruleBasis:coverageReason});

  function buildTverCoverage(run){
    const counts={AUTO_COMPARED:0,DIFFERENCE:0,RULE_PENDING:0,INPUT_INSUFFICIENT:0,CSV_NOT_VERIFIABLE:0,NOT_APPLICABLE:0,MANUAL_REQUIRED:0};
    const records=[...run.entries,...(run.coverageOnlyEntries || [])];
    const entries=records.map((entry,index)=>{
      const reason=String(entry.conservativeReason || entry.ruleBasis || '');let category;
      if(entry.coverageCategory) category=entry.coverageCategory;
      // NO014: 行レベル比較でも、実際に値が異なる場合は「差異あり」として数える。
      // （同一性未確認を理由に実差を MANUAL_REQUIRED へ隠さない）
      else if(entry.displayStatus==='不一致') category='DIFFERENCE';
      else if(entry.identityPending || entry.field==='entity' || entry.field==='identity' || reason==='ENTITY_NOT_MATCHED' || /MANUAL_REQUIRED/.test(reason)) category='MANUAL_REQUIRED';
      else if(/CSV.*(?:NOT_VERIFIABLE|NOT_PROVIDED|UNAVAILABLE)|EDIT_CSV_FIELD_NOT_PROVIDED/.test(reason)) category='CSV_NOT_VERIFIABLE';
      else if(entry.notApplicable) category='NOT_APPLICABLE';
      else if(entry.deferred || !entry.comparable || entry.displayStatus==='需确认' || !entry.displayStatus) category=/NOT_PROVIDED|MISSING|CONFLICT|UNAVAILABLE|INSUFFICIENT/.test(reason) ? 'INPUT_INSUFFICIENT' : 'RULE_PENDING';
      else if(entry.displayStatus==='不一致') category='DIFFERENCE';else category='AUTO_COMPARED';
      counts[category]++;return {index,level:entry.level,entityKey:entry.entityKey,field:entry.field,category,reason};
    });
    return {counts,entries,records,completed:counts.RULE_PENDING+counts.INPUT_INSUFFICIENT+counts.CSV_NOT_VERIFIABLE+counts.MANUAL_REQUIRED===0};
  }

  function resolveTverExactCollection(raw,type){
