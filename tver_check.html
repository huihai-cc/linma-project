        }
      }else if(field==='local_broadcaster' && csvCanonical!==null && csvCanonical!==resolved.canonicalValue){
        comparisonStatus=resolved.evidenceState==='available' && String(resolved.canonicalValue ?? '')==='' ? '不一致' : '需确认';
        conservativeReason=resolved.evidenceState==='available' && String(resolved.canonicalValue ?? '')==='' ? 'LOCAL_BROADCASTER_VALUE_WHEN_NOT_REQUIRED' : 'LOCAL_BROADCASTER_FULL_SELECTION_UNPROVEN';
      }else if(csvCanonical===null){
        comparisonStatus='需确认';
        conservativeReason='CSV_TARGETING_ID_EVIDENCE_UNAVAILABLE';
      }
      const derivedFrom=field==='age' ? csvEvidence : resolved.derivedFrom;
      inputs.push({
        ...(base || {}), field, settingValue:resolved.rawValue, csvValue,
        settingSource:resolved.primarySource, csvSource,
        settingCanonical:{ value:resolved.canonicalValue, ruleId:resolved.ruleBasis, evidenceState:resolved.evidenceState, ...(resolved.ageShape || {}) },
        csvCanonical:{ value:csvCanonical, ruleId:field==='age' && csvAgeParsed ? csvAgeParsed.ruleId : field==='gender' ? 'TVER_C3_C4_3_GENDER_MAPPING' : resolved.ruleBasis, evidenceState:csvEvidenceState,
          ...(csvAgeParsed ? { minAge:csvAgeParsed.minAge, maxAge:csvAgeParsed.maxAge, upperOpen:csvAgeParsed.upperOpen } : {}) },
        settingEvidenceState:resolved.evidenceState, csvEvidenceState,
        comparable:ageGuard ? ageGuard.comparable : mediaStationEvaluation
           ? mediaStationEvaluation.status!=='需确认'
           : field==='local_broadcaster' && resolved.ruleBasis==='TVER_NO032_FIX3_LOCAL_BROADCASTER_NOT_REQUIRED_BY_STATION_NAME'
             ? comparisonStatus!=='需确认'
             : resolved.comparable && csvCanonical!==null
               && (!isC344Field || (resolved.evidenceState==='available' && csvEvidenceState==='available'))
               && (field!=='pref' || csvEvidenceState==='available'),
        alwaysDisplay:true, ruleBasis:field==='uid_suffix' && resolved.asrInitialLeft ? 'TVER_NO032_ASR_INITIAL_LEFT_OF_ARROW' : resolved.ruleBasis, comparisonStatus,
        conservativeReason, sourceEvidence:{ setting:resolved.sourceEvidence, csv:csvEvidence, derivedFrom },
        ...(mediaEvaluationDetail ? { mediaEvaluation:mediaEvaluationDetail } : {}),
        ...(idDiff ? { idDiff } : {}),
      });
    });
    return inputs;
  }

  function csvField(entity, matchingName, fieldName){
    if(entity && entity.matchingFields && entity.matchingFields[matchingName]!==undefined) return strictText(entity.matchingFields[matchingName]);
    if(fieldName==='budget_type' && entity && Array.isArray(entity.rawRows) && entity.rawRows[0] && entity.rawRows[0].values && Object.prototype.hasOwnProperty.call(entity.rawRows[0].values, fieldName)){
      return strictText(entity.rawRows[0].values[fieldName]);
    }
    return strictText(entity && entity.fields ? entity.fields[fieldName] : '');
  }

  function csvFieldSource(entity, fieldName){
    if(entity && entity.sourceRefs && entity.sourceRefs[fieldName]!==undefined) return entity.sourceRefs[fieldName];
    const evidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields[fieldName];
    if(Array.isArray(evidence) && evidence.length) return evidence[0];
    const row=entity && Array.isArray(entity.rawRows) ? entity.rawRows[0] : null;
    return row && row.sourceRefs && row.sourceRefs[fieldName] || null;
  }

  function settingField(entity, fieldName){
    return strictText(entity && entity.fields ? entity.fields[fieldName] : '');
  }

  // 日期时间专用归一化：仅消除 年/月/日/时/分 的零填充与分隔符差异，
  // 把「值相同、仅表记不同」的日期时间转为统一 canonical 形式（YYYY-MM-DD HH:MM）。
  // 无法解析（或非法）的值：不猜、不改写，直接返回原字符串，由上层保守处理。
  function normalizeTverDateTimeForMatching(value){
    const s=String(value ?? '').trim();
    if(!s) return s;
    const m=s.match(/^(\d{4})[/\-.](\d{1,2})[/\-.](\d{1,2})[ T](\d{1,2}):(\d{1,2})(?::\d{1,2})?$/);
    if(!m) return s; // 解析失败：保守返回原值，不猜
    const [, y, mo, d, h, mi]=m;
    const pad=n=>String(Number(n)).padStart(2,'0');
    return `${y}-${pad(mo)}-${pad(d)} ${pad(h)}:${pad(mi)}`;
  }

  // 阶段 A10/A14：名称归一化仅限已由真实案件确认的全角标点与独立 Pre token（其余一律原样）。
  // 禁止追加空格删除/全名称大小写/连字符/长音符/全角英数字/模糊匹配/相似度/alias 等泛化。
  function normalizeTverNameForMatching(value){
    return String(value ?? '')
      .replace(/（/g, '(')
      .replace(/）/g, ')')
      .replace(/＆/g, '&')
      .replace(/｜/g, '|')
      .replace(/(^|_)Pre(?=_|$)/g, '$1pre');
  }

  function optionalFieldMatches(settingValue, csvValue){
    return !settingValue || !csvValue || settingValue===csvValue;
  }

  function resolvedStructuralProfile(profile){
    if(!profile || !profile.fields || !Array.isArray(profile.requiredFields)) return { ok:false, missing:['conversionContext'] };
    const missing=profile.requiredFields.filter(field => {
      if(!Object.prototype.hasOwnProperty.call(profile.fields, field)) return true;
      const value=profile.fields[field];
      return value===null || value===undefined || (typeof value==='object' && value.state==='unknown');
    });
    return { ok:missing.length===0, missing };
  }

  function structuralProfilesMatch(settingProfile, csvProfile){
    const requiredMatch=settingProfile.requiredFields.every(field => {
      const settingValue=settingProfile.fields[field];
      const csvValue=csvProfile.fields[field];
      // unavailable = 该侧 schema 无法表达此维度（如 edit CSV 无 dmp_segment），跳过比较；unknown/缺值仍阻断。
      if(settingValue==='unavailable' || csvValue==='unavailable') return true;
      return strictText(settingValue)===strictText(csvValue);
    });
    if(!requiredMatch) return false;
    const optionalFields=Array.isArray(settingProfile.optionalFields) ? settingProfile.optionalFields : [];
    return optionalFields.every(field => {
      const settingValue=settingProfile.fields[field];
      const csvValue=csvProfile.fields[field];
      if(settingValue===null || settingValue===undefined || (typeof settingValue==='object' && settingValue.state==='unknown')) return true;
      if(csvValue===null || csvValue===undefined || (typeof csvValue==='object' && csvValue.state==='unknown')) return true;
      return strictText(settingValue)===strictText(csvValue);
    });
  }

  function makeMatch(level, setting, status, reasonCode, candidates){
    return {
      level, settingKey:setting.key, csvKey:candidates.length===1 ? candidates[0].key : null,
      status, reasonCode, candidateKeys:candidates.map(candidate => candidate.key),
    };
  }

  function isUnknownStructuralValue(value){
    return value===null || value===undefined || (typeof value==='object' && value.state==='unknown');
  }

  function structuralProfilesConflictOnKnownValues(settingProfile, csvProfile){
    if(!settingProfile || !csvProfile || !settingProfile.fields || !csvProfile.fields) return false;
    const requiredFields=Array.isArray(settingProfile.requiredFields) ? settingProfile.requiredFields : [];
    for(const field of requiredFields){
      const settingValue=settingProfile.fields[field];
      const csvValue=csvProfile.fields[field];
      if(settingValue==='unavailable' || csvValue==='unavailable' || isUnknownStructuralValue(settingValue) || isUnknownStructuralValue(csvValue)) continue;
      if(strictText(settingValue)!==strictText(csvValue)) return true;
    }
    const optionalFields=Array.isArray(settingProfile.optionalFields) ? settingProfile.optionalFields : [];
    for(const field of optionalFields){
      const settingValue=settingProfile.fields[field];
      const csvValue=csvProfile.fields[field];
      if(isUnknownStructuralValue(settingValue) || isUnknownStructuralValue(csvValue)) continue;
      if(strictText(settingValue)!==strictText(csvValue)) return true;
    }
    return false;
  }

  // C3-C4-FIX1：名前组成只适用于本次经真实案件确认的单Campaign／五Targeting／SPPC+CTV结构。
  // 不把该命名关系提升为通用TVer模板规则；所有名称比较仍为原文严格相等。
  function createTverFix1IdentityScope(settingCampaigns, settingAdGroups, csvCampaigns, csvAdGroups, campaignMatches, schemaKind){
    const targetNames=['興味関心', '興味関心_DMP', '年齢', '年齢_DMP', '従業員規模'];
    const branches=['SPPC', 'CTV'];
    if(schemaKind!=='register-without-ids' || settingCampaigns.length!==1 || settingAdGroups.length!==10 || csvAdGroups.length!==10) return null;
    const campaignMatch=campaignMatches.length===1 ? campaignMatches[0] : null;
    if(!campaignMatch || campaignMatch.status!=='matched') return null;
    const settingCampaign=settingCampaigns[0];
    const csvCampaign=csvCampaigns.find(entity => entity.key===campaignMatch.csvKey);
    if(!csvCampaign) return null;
    const csvCampaignName=String(csvField(csvCampaign, 'campaignName', 'campaign_name') ?? '');
    if(!csvCampaignName) return null;
    if(settingAdGroups.some(group => group.parentKey!==settingCampaign.key)) return null;
    if(csvAdGroups.some(group => group.parentKey!==csvCampaign.key)) return null;

    const identityRows=[];
    for(const group of settingAdGroups){
      const identity=group && group.displayIdentity || {};
      const identityName=String(identity.targetingName ?? '').trim();
      const nameSource=identity.sourceRefs && identity.sourceRefs.targetingName;
      const rawRowDevice=String((group && group.fields && group.fields.rowDevice) ?? '').trim();
      const rowDeviceSource=group && group.sourceRefs && group.sourceRefs.rowDevice;
      if(!targetNames.includes(identityName) || !nameSource || nameSource.rawValue!==identityName || !rawRowDevice || !rowDeviceSource || rowDeviceSource.rawValue!==rawRowDevice) return null;
      const device=resolveSettingAdGroupDevice(group);
      if(!device.resolved) return null;
      const branch=device.device==='ctv' ? 'CTV' : device.device==='android ios pc' ? 'SPPC' : null;
      if(!branch) return null;
      const shortName=`${identityName}_${branch}`;
      if(resolveAdGroupShortDisplayName(group).value!==shortName) return null;
      identityRows.push({ settingKey:group.key, shortName, csvName:`${csvCampaignName}_${shortName}` });
    }
    const settingNameCounts=new Map();
    identityRows.forEach(row => settingNameCounts.set(row.csvName, (settingNameCounts.get(row.csvName) || 0)+1));
    if(identityRows.length!==10 || [...settingNameCounts.values()].some(count => count!==1)) return null;
    const expectedNames=new Set(identityRows.map(row => row.csvName));
    if(expectedNames.size!==10 || targetNames.some(name => branches.some(branch => !expectedNames.has(`${csvCampaignName}_${name}_${branch}`)))) return null;

    const csvCandidatesByName=new Map();
    csvAdGroups.forEach(group => {
      const name=String(csvField(group, 'adGroupName', 'adgroup_name') ?? '');
      if(!expectedNames.has(name)) return;
      const candidates=csvCandidatesByName.get(name) || [];
      candidates.push(group);
      csvCandidatesByName.set(name, candidates);
    });
    if(csvAdGroups.some(group => !expectedNames.has(String(csvField(group, 'adGroupName', 'adgroup_name') ?? '')))) return null;

    const bySettingKey=new Map(identityRows.map(row => [row.settingKey, row]));
    const settingKeyByCsvName=new Map(identityRows.map(row => [row.csvName, row.settingKey]));
    const duplicateCsvNames=new Set([...csvCandidatesByName.entries()].filter(([, candidates]) => candidates.length>1).map(([name]) => name));
    return { bySettingKey, csvCandidatesByName, settingKeyByCsvName, duplicateCsvNames };
  }

  function resolveCandidateContention(levelMatches){
    const owners=new Map();
    levelMatches.forEach(match => {
      if(match.status!=='matched') return;
      match.candidateKeys.forEach(candidateKey => {
        if(!owners.has(candidateKey)) owners.set(candidateKey, []);
        owners.get(candidateKey).push(match);
      });
    });
    owners.forEach(matches => {
      if(matches.length<2) return;
      matches.forEach(match => {
        match.status='ambiguous';
        match.reasonCode='CANDIDATE_CONTENTION';
        match.csvKey=null;
      });
    });
    const reserved=new Set(levelMatches.filter(match=>match.status==='matched').map(match=>match.csvKey));
    levelMatches.filter(match=>match.status==='ambiguous').forEach(match=>{match.candidateKeys=match.candidateKeys.filter(key=>!reserved.has(key));match.csvKey=null;});
  }

  // Exact, delimited targeting-appeal branch tokens are independent identity evidence.
  // This deliberately reads Tag Appeal and the CSV name suffix, never the Device values.
  function resolveTverSettingAdGroupBranchIdentity(setting){
    const value=String(setting && setting.fields && setting.fields.tagAppeal || '').trim();
    const tokens=[...value.matchAll(/(^|[^A-Z0-9])(SPPC|SP|CTV)(?=$|[^A-Z0-9])/gi)].map(match => match[2].toUpperCase());
    if(tokens.length!==1) return null;
    return tokens[0]==='CTV' ? 'CTV' : 'SP';
  }

  function resolveTverCsvAdGroupBranchIdentity(csv){
    const value=String(csvField(csv, 'adGroupName', 'adgroup_name') || '').trim();
    const match=value.match(/(?:^|[_\s-])(SPPC|SP|CTV)$/i);
    if(!match) return null;
    return match[1].toUpperCase()==='CTV' ? 'CTV' : 'SP';
  }

  function resolveTverUniqueParentRemainder(matches,settings,entities,parentMatches){
    const byParent=new Map();settings.forEach(setting=>{if(!byParent.has(setting.parentKey))byParent.set(setting.parentKey,[]);byParent.get(setting.parentKey).push(setting);});
    byParent.forEach((siblings,parentKey)=>{
      const parent=parentMatches.find(m=>m.settingKey===parentKey);if(!parent || parent.status!=='matched') return;
      const local=matches.filter(m=>siblings.some(s=>s.key===m.settingKey));
      if(!local.some(m=>m.status==='matched')) return;
      const unresolved=local.filter(m=>m.status!=='matched');if(unresolved.length!==1 || siblings.find(s=>s.key===unresolved[0].settingKey).businessType) return;
      const reserved=new Set(matches.filter(m=>m.status==='matched').map(m=>m.csvKey));
      const remaining=entities.filter(e=>e.parentKey===parent.csvKey && !reserved.has(e.key) && e.matchable!==false);
      if(remaining.length!==1 || unresolved[0].reasonCode==='CANDIDATE_CONTENTION') return;
      Object.assign(unresolved[0],{status:'matched',csvKey:remaining[0].key,candidateKeys:[remaining[0].key],reasonCode:'UNIQUE_PARENT_REMAINDER_AFTER_CONFIRMED_PAIRS'});
    });
  }

  function applyTverManualPairs(matches,entities,parentMatches,config,settingModel,csvTree){
    const manual=config.manualMapping;
    if(!manual || manual.settingModel!==settingModel || manual.csvTree!==csvTree || !Array.isArray(manual.pairs)) return;
    matches.forEach(match=>{
      const pairs=manual.pairs.filter(p=>p.settingKey===match.settingKey);
      if(pairs.length!==1) return;
      const csv=entities.find(e=>e.key===pairs[0].csvKey);
      if(!csv || csv.level && csv.level!==match.level || csv.identityState==='unresolved-same-name-scope' || config.uncertainCsvScopes && config.uncertainCsvScopes.has(csv.key) || csv.matchable===false) return;
      const collection=match.level==='Campaign' ? settingModel.campaigns : match.level==='Ad Group' ? settingModel.adGroups : settingModel.ads;
      const setting=(collection || []).find(e=>e.key===match.settingKey);if(!setting || setting.businessType) return;
      if(match.level!=='Campaign'){
        const parent=parentMatches.find(m=>m.settingKey===setting.parentKey);
        if(!parent || parent.status!=='matched' || csv.parentKey!==parent.csvKey) return;
      }
      Object.assign(match,{status:'matched',csvKey:csv.key,candidateKeys:[csv.key],reasonCode:'MANUAL_CONFIRMED_CURRENT_INPUT'});
    });
  }

  function applyTverComparisonScopes(matches,entities,parentMatches){
    matches.forEach(match=>{
      if(match.status!=='matched') return;
      // NO014: 行レベル対応が確定した比較は、名称スコープ同一性の降格対象にしない。
      if(match.rowLevelComparison || match.logicalGpIdentity) return;
      const csv=entities.find(e=>e.key===match.csvKey),parent=csv && (parentMatches || []).find(m=>(m.csvKey || m.comparisonScopeKey)===csv.parentKey);
      if(csv && (csv.identityState==='unresolved-same-name-scope' || parent && parent.comparisonScopeKey)){
        match.comparisonScopeKey=csv.key;match.csvKey=null;match.status='ambiguous';match.identityStatus='unconfirmed';match.reasonCode='CSV_NAME_SCOPE_IDENTITY_PENDING';
      }
    });
  }

  function tverCsvIdentityValues(entity,field,matchingName){
    const rows=(entity && entity.rawRows || []).filter(row=>row.values && Object.prototype.hasOwnProperty.call(row.values,field));
    return [...new Set(rows.length ? rows.map(row=>String(row.values[field] ?? '')) : [csvField(entity,matchingName,field)])];
  }

  function maximumTverIdentityMatching(sources,edges,unlimited,banned){
    const owners=new Map(),assignment=new Map();
    const visit=(source,seen)=>{
      for(const target of edges.get(source) || []){
        if(banned && banned.source===source && banned.target===target)continue;
        if(unlimited && unlimited.has(target)){assignment.set(source,target);return true;}
        if(seen.has(target))continue;seen.add(target);
        if(!owners.has(target) || visit(owners.get(target),seen)){owners.set(target,source);assignment.set(source,target);return true;}
      }
      return false;
    };
    sources.forEach(source=>visit(source,new Set()));return assignment;
  }

  function resolveTverIndependentGroupCandidates(setting,model,candidates,csvAds,parentCsv,plans,uncertainScopes,parentScopeUncertain){
    const cache=plans || new Map(),uncertain=uncertainScopes || new Set();
    if(!cache.has(setting.parentKey)){
      const siblings=(model.adGroups || []).filter(g=>g.parentKey===setting.parentKey && !g.businessType);
      const parent=(model.campaigns || []).find(cp=>cp.key===setting.parentKey);
      const anchors=[...new Set([parent && parent.expectedName,...(parentCsv ? tverCsvIdentityValues(parentCsv,'campaign_name','campaignName') : [])].filter(Boolean))];
      const deviceRoles=new Map(siblings.map(g=>{
        const source=g.sourceRefs && g.sourceRefs.rowDevice,raw=String(g.fields && g.fields.rowDevice || ''),device=resolveSettingAdGroupDevice(g);
        const role=source && source.columnName==='デバイス' && source.rowNumber && raw && String(source.rawValue)===raw && device.resolved
          ? device.device==='ctv' ? 'CTV' : device.device==='android ios pc' ? 'SP' : null : null;
        return [g.key,role];
      }));
      const sourceRole=g=>{
        const number=String(g.fields && g.fields.targetingNumber || '');
        const family=siblings.filter(s=>number && String(s.fields && s.fields.targetingNumber || '')===number);
        const roles=family.map(s=>deviceRoles.get(s.key));
        // P25: explicit source rows defining the SAME Targeting on SPPC/CTV are a business split.
        // The actual CSV Device and CPM are never read for identity.
        if(family.length>1 && roles.every(Boolean) && new Set(roles).size===2)return deviceRoles.get(g.key);
        const tokens=[...String(g.fields && g.fields.tagAppeal || '').matchAll(/(^|[^A-Za-z0-9])(SPPC|SP|CTV)(?=$|[^A-Za-z0-9])/g)].map(m=>m[2]);
        return tokens.length===1 ? tokens[0]==='CTV' ? 'CTV' : 'SP' : null;
      };
      const actualRoles=g=>[...new Set(tverCsvIdentityValues(g,'adgroup_name','adGroupName').map(value=>{const match=value.match(/(?:^|[_\s-])(SPPC|SP|CTV)$/);return match ? match[1]==='CTV' ? 'CTV' : 'SP' : null;}))];
      const nameCandidates=g=>{
        const explicit=String(g.expectedName || '');if(explicit){const exact=candidates.filter(c=>tverCsvIdentityValues(c,'adgroup_name','adGroupName').includes(explicit));if(exact.length)return exact;}
        const role=sourceRole(g);
        if(role && siblings.every(sourceRole) && candidates.every(c=>actualRoles(c).every(Boolean)) && siblings.filter(s=>sourceRole(s)===role).length===1){const exact=candidates.filter(c=>actualRoles(c).includes(role));if(exact.length===1)return exact;}
        const target=g.displayIdentity && g.displayIdentity.targetingName,source=g.displayIdentity && g.displayIdentity.sourceRefs && g.displayIdentity.sourceRefs.targetingName;
        if(target===undefined || !source || String(source.rawValue)!==target)return [];
        const same=siblings.filter(s=>s.displayIdentity && s.displayIdentity.targetingName===target);
        const suffixes=same.length===1 ? ['', '_CTV','_SPPC','_SP'] : role ? role==='CTV' ? ['_CTV'] : ['_SPPC','_SP'] : [];
        const names=new Set(anchors.flatMap(anchor=>suffixes.map(suffix=>anchor+(target ? '_'+target : '')+suffix)));
        return candidates.filter(c=>tverCsvIdentityValues(c,'adgroup_name','adGroupName').some(name=>names.has(name)));
      };
      const sourceSignature=g=>{const ads=(model.ads || []).filter(a=>a.parentKey===g.key);return ads.length && ads.every(a=>String(a.expectedName || '')!=='') ? JSON.stringify(ads.map(a=>a.expectedName).sort()) : null;};
      const actualSignature=g=>{const ads=csvAds.filter(a=>a.parentKey===g.key),values=ads.map(a=>tverCsvIdentityValues(a,'creative_name','creativeName'));return ads.length && ads.every(a=>a.matchable!==false) && values.every(names=>names.length===1 && names[0]!=='') ? JSON.stringify(values.map(names=>deriveTverCreativeName(names[0])).sort()) : null;};
      const lineageFits=(source,candidate)=>{
        const signature=sourceSignature(source);if(!signature)return false;
        const expected=JSON.parse(signature),actual=csvAds.filter(a=>a.parentKey===candidate.key);
        if(expected.length!==actual.length || actual.some(a=>a.matchable===false))return false;
        // This only tests the material multiset. It never assigns or merges business Ads by row order.
        const slots=expected.map((_,i)=>i),edges=new Map(slots.map(i=>[i,actual.filter(a=>tverCsvIdentityValues(a,'creative_name','creativeName').map(deriveTverCreativeName).includes(expected[i])).map(a=>a.key)]));
        return maximumTverIdentityMatching(slots,edges).size===expected.length;
      };
      const named=new Map(siblings.map(g=>[g.key,nameCandidates(g)]));
      const lineage=new Map(siblings.map(g=>{const signature=sourceSignature(g);return [g.key,signature && siblings.filter(s=>sourceSignature(s)===signature).length===1 ? candidates.filter(c=>lineageFits(g,c)) : []];}));
      // Build the union of independent identity evidence. No fixed Name-vs-Creative priority.
      // Only pairs present in every maximum matching are confirmed; contradictory alternatives stay local.
      if(siblings.length>candidates.length){
        candidates.filter(c=>!c.id && (c.rawRows || []).length>1).forEach(c=>{
          const corroborated=siblings.some(g=>lineage.get(g.key).length===1 && lineage.get(g.key)[0].key===c.key
            || named.get(g.key).length===1 && named.get(g.key)[0].key===c.key && sourceSignature(g) && actualSignature(c)===sourceSignature(g)
              && siblings.filter(s=>named.get(s.key).length===1 && named.get(s.key)[0].key===c.key).length===1);
          if(!corroborated)uncertain.add(c.key);
        });
      }
      const evidence=new Map(siblings.map(g=>[g.key,[...new Map([...named.get(g.key),...lineage.get(g.key)].map(c=>[c.key,c])).values()]]));
      const edges=new Map(siblings.map(g=>[g.key,evidence.get(g.key).map(c=>c.key)]));
      const unlimited=new Set(candidates.filter(c=>parentScopeUncertain || c.identityState==='unresolved-same-name-scope' || uncertain.has(c.key)).map(c=>c.key));
      const baseline=maximumTverIdentityMatching(siblings.map(g=>g.key),edges,unlimited),plan=new Map();
      siblings.forEach(g=>{
        if(siblings.length===1 && candidates.length===1){
          plan.set(g.key,{status:uncertain.has(candidates[0].key) ? 'ambiguous' : 'matched',reason:uncertain.has(candidates[0].key) ? 'CSV_GROUP_SCOPE_GRAIN_AMBIGUOUS' : 'UNIQUE_INDEPENDENT_GROUP_IDENTITY',candidates,comparisonScopeKey:uncertain.has(candidates[0].key) ? candidates[0].key : undefined});return;
        }
        const chosen=baseline.get(g.key);
        const forced=chosen!==undefined && maximumTverIdentityMatching(siblings.map(s=>s.key),edges,unlimited,{source:g.key,target:chosen}).size<baseline.size;
        if(forced){const selected=candidates.filter(c=>c.key===chosen);plan.set(g.key,{status:uncertain.has(chosen) ? 'ambiguous' : 'matched',reason:uncertain.has(chosen) ? 'CSV_GROUP_SCOPE_GRAIN_AMBIGUOUS' : 'UNIQUE_INDEPENDENT_GROUP_IDENTITY',candidates:selected,comparisonScopeKey:uncertain.has(chosen) ? chosen : undefined});}
        else{
          const selected=evidence.get(g.key);
          const contention=selected.length===1 && siblings.filter(s=>evidence.get(s.key).some(c=>c.key===selected[0].key)).length>1;
          const reason=contention ? 'CANDIDATE_CONTENTION' : selected.length ? 'GROUP_IDENTITY_EVIDENCE_CONFLICT' : candidates.length && candidates.every(c=>uncertain.has(c.key)) ? 'CSV_GROUP_SCOPE_GRAIN_AMBIGUOUS' : 'GROUP_IDENTITY_UNCONFIRMED';
          plan.set(g.key,{status:candidates.length ? 'ambiguous' : 'unmatched',reason,candidates:selected.length ? selected : candidates});
        }
      });
      cache.set(setting.parentKey,plan);
    }
    return cache.get(setting.parentKey).get(setting.key);
  }

  // NO014: Register CSV（IDなし）では Group 名単位の「名称スコープ」に複数行が集約される。
  // 007 のように「同名 Group スコープ × Creative 行」が設定表の複数 Ad Group に対応する場合、
  // 名称スコープの Group 実体 ID は確定できないが、独立証拠だけで行レベルの対応を一意に決められる。
  // 本関数は次をすべて満たす場合に限り、行レベル比較スコープ（A: 行対応）を返す。Group 実体同一性
  // （B）は引き続き未確認であり、ここで ID を生成したり一致と断定したりはしない。
  //   1. 親 CP が一意 matched。
  //   2. CSV 側 Group が全て同一名スコープ（2行以上）で、ID を持たず、スコープ内 Group 業務値が競合しない。
  //   3. 設定側各 Group の P25 接尾辞（_SPPC／_CTV）が確定し、スコープ名が CP 名＋接尾辞で一意。
  //   4. 各スコープの設定 Group 数 = CSV 行数（2以上）。
  //   5. 各設定 Group は Ad を1件だけ持ち、Creative 名で CSV 行へ一意に完全対応できる
  //      （最大マッチングが完全かつ全ペアが強制）。
  // 価格／Device／状態など比較対象の業務値は識別に使わない。
  function resolveTverRegisterRowLevelScopes(settingModel, csvTree, campaignMatches, schemaKind){
    if(schemaKind!=='register-without-ids') return null;
    const plans=new Map();
    const csvCampaigns=Array.isArray(csvTree && csvTree.campaigns) ? csvTree.campaigns : [];
    const csvAdGroups=Array.isArray(csvTree && csvTree.adGroups) ? csvTree.adGroups : [];
    const settingAdGroups=Array.isArray(settingModel && settingModel.adGroups) ? settingModel.adGroups : [];
    const settingAds=Array.isArray(settingModel && settingModel.ads) ? settingModel.ads : [];
    for(const campaignMatch of campaignMatches){
      if(!campaignMatch || campaignMatch.status!=='matched' || !campaignMatch.csvKey) continue;
      const settingCampaign=(settingModel.campaigns || []).find(campaign=>campaign.key===campaignMatch.settingKey);
      const csvCampaign=csvCampaigns.find(campaign=>campaign.key===campaignMatch.csvKey);
      if(!settingCampaign || !csvCampaign) continue;
      const groups=settingAdGroups.filter(group=>group.parentKey===settingCampaign.key && !group.businessType);
      const scopes=csvAdGroups.filter(group=>group.parentKey===csvCampaign.key && group.matchable!==false && !group.id);
      if(!groups.length || !scopes.length) continue;
      if(scopes.some(scope=>(scope.rawRows || []).length<2)) continue;
      const anchor=String(csvField(csvCampaign,'campaignName','campaign_name') || '');
      if(!anchor) continue;
      const suffixByGroup=new Map();
      let suffixResolved=true;
      for(const group of groups){
        const contract=resolveTverGroupNameContract(group,settingModel);
        const suffix=contract && contract.comparable && contract.components ? String(contract.components.deviceSuffix || '') : '';
        if(!suffix || !['SPPC','SP','CTV'].includes(suffix)){suffixResolved=false;break;}
        suffixByGroup.set(group.key,suffix);
      }
      if(!suffixResolved) continue;
      const scopeBySuffix=new Map();
      let scopeResolved=true;
      for(const group of groups){
        const suffix=suffixByGroup.get(group.key);
        if(scopeBySuffix.has(suffix)) continue;
        const exact=String(anchor)+'_'+suffix;
        const matches=scopes.filter(scope=>{
          const name=String(csvField(scope,'adGroupName','adgroup_name') ?? '');
          return name===exact || (name.startsWith(anchor+'_') && name.endsWith('_'+suffix));
        });
        if(matches.length!==1){scopeResolved=false;break;}
        scopeBySuffix.set(suffix,matches[0]);
      }
      if(!scopeResolved) continue;
      const usedScopes=[...new Set([...scopeBySuffix.values()].map(scope=>scope.key))];
      if(usedScopes.length!==scopes.length) continue;
      const groupsByScope=new Map();
      for(const group of groups){
        const scope=scopeBySuffix.get(suffixByGroup.get(group.key));
        const list=groupsByScope.get(scope.key) || [];
        list.push(group);
        groupsByScope.set(scope.key,list);
      }
      let planResolved=true;
      const campaignPlans=new Map();
      for(const [scopeKey,localGroups] of groupsByScope){
        const scope=scopes.find(entry=>entry.key===scopeKey);
        const rows=scope.rawRows || [];
        if(localGroups.length!==rows.length || localGroups.length<2){planResolved=false;break;}
        const edges=new Map();
        for(const group of localGroups){
          const ads=settingAds.filter(ad=>ad.parentKey===group.key);
          const creative=ads.length===1 ? String(ads[0].expectedName || '').trim() : '';
          if(!creative){planResolved=false;break;}
          edges.set(group.key,rows.filter(row=>deriveTverCreativeName((row.values && row.values.creative_name) ?? '').trim()===creative).map(row=>row.rowNumber));
        }
        if(!planResolved) break;
        const sources=localGroups.map(group=>group.key);
        const full=maximumTverIdentityMatching(sources,edges,null,null);
        if(full.size!==sources.length){planResolved=false;break;}
        // 対応が一意であること（全ペアが強制）を確認する。複数の等価対応がある場合は HOLD。
        for(const [groupKey,rowNumber] of full){
          if(maximumTverIdentityMatching(sources,edges,null,{source:groupKey,target:rowNumber}).size===full.size){planResolved=false;break;}
        }
        if(!planResolved) break;
        // NO015: 表示用の行対応情報を行範囲エンティティへ付与（識別には使わない。実体IDは生成しない）。
        scope.rowLevelComparison=true;
        scope.rowLevelScopeName=String(csvField(scope,'adGroupName','adgroup_name') || '');
        scope.rowLevelCsvRowNumbers=rows.map(row=>row.rowNumber).sort((a,b)=>a-b);
        scope.rowLevelSettingCount=localGroups.length;
        scope.rowLevelSettingRows=localGroups.map(group=>{
          const refs=group.sourceRefs || {};
          const source=['rowDevice','targetingNumber','tagAppeal','device'].map(key=>refs[key]).find(candidate=>candidate && candidate.rowNumber!==null && candidate.rowNumber!==undefined);
          return source ? source.rowNumber : null;
        }).filter(number=>number!==null).sort((a,b)=>a-b);
        for(const [groupKey,rowNumber] of full){
          campaignPlans.set(groupKey,{comparisonScopeKey:scope.key,rowNumbers:[rowNumber]});
        }
      }
      if(!planResolved) continue;
      campaignPlans.forEach((value,key)=>plans.set(key,value));
    }
    return plans.size ? plans : null;
  }

  // NO014: 行レベル比較用に、名称スコープ（複数行集約）ではなく対応行の値を持つ
  // Ad Group 比較エンティティを作る。実体 ID は生成せず、比較にだけ使う一時ビュー。
  function registerAdGroupRowMatchingFields(values){
    const raw=values || {};
    return {
      adGroupName:String(raw.adgroup_name ?? ''),
      device:String(raw.device ?? ''),
      price:String(raw.price ?? ''),
      media:String(raw.media ?? ''),
      localBroadcaster:String(raw.local_broadcaster ?? ''),
      gender:String(raw.gender ?? ''),
      startAge:String(raw.start_age ?? ''),
      endAge:String(raw.end_age ?? ''),
      pref:String(raw.pref ?? ''),
      city:String(raw.city ?? ''),
      affinity:String(raw.affinity ?? ''),
      genre:String(raw.genre ?? ''),
      genreExclude:String(raw.genre_exclude ?? ''),
      subgenre:String(raw.subgenre ?? ''),
      subgenreExclude:String(raw.subgenre_exclude ?? ''),
      contentsGroup:String(raw.contents_group ?? ''),
    };
  }
  function createTverRowLevelGroupEntity(scope,rowNumber){
    const rows=Array.isArray(scope && scope.rawRows) ? scope.rawRows : [];
    const row=rows.find(entry=>entry && entry.rowNumber===rowNumber);
    if(!row) return null;
    const values=row.values || {};
    const ownedFields=REGISTER_SOURCE_FIELDS_BY_LEVEL['Ad Group'] || [];
    return {
      ...scope,
      key:`${scope.key}#row:${rowNumber}`,
      fields:{...(scope.fields || {}), ...fieldsForScope(values, ownedFields)},
      matchingFields:{...(scope.matchingFields || {}), ...registerAdGroupRowMatchingFields(values)},
      sourceRefs:{...(scope.sourceRefs || {}), ...sourceRefsForScope(row, ownedFields)},
      sourceEvidence:{fields:Object.fromEntries(ownedFields.map(field=>[field,collectFieldEvidence([row],field)]))},
      rawRows:[row],
      identityState:'row-level',
      // 比較専用ビューなので、名称スコープ集約時の競合情報は持ち越さない（行の値だけで判定する）。
      fieldConflicts:{},
      fieldVariations:{},
      scopeVariants:[{values:fieldsForScope(values, ownedFields),rowNumbers:[rowNumber],sourceEvidence:[row.source]}],
      rowLevelRowNumber:rowNumber,
    };
  }

  // NO015 #40: Survey SP の Group 名が壊れても、一意な Creative だけを独立証拠として
  // Group 実体を1件だけ復元できる（名称は別途「不一致」として検出される）。
  // 条件: 設定側でその Creative が兄弟内で一意、CSV 側でも同名 Creative の Group が一意。
  // 一意でない場合（非接触者2件が同一 Creative 等）は何も返さない＝HOLD。
  function resolveSurveySpGroupUniqueCreativeLineage(setting, model, csvAdGroups, csvAds, parentCsvKey){
    const creativeOfSetting=group=>{
      const ads=(model.ads || []).filter(ad=>ad.parentKey===group.key);
      if(ads.length!==1) return '';
      return String(ads[0].expectedName || '').trim();
    };
    const creative=creativeOfSetting(setting);
    if(!creative) return null;
    const siblings=(model.adGroups || []).filter(group=>group.parentKey===setting.parentKey && group.businessType==='survey-sp');
    if(siblings.filter(group=>creativeOfSetting(group)===creative).length!==1) return null;
    const csvGroups=(csvAdGroups || []).filter(group=>group.parentKey===parentCsvKey && group.matchable!==false);
    const creativeOfCsv=group=>{
      const ads=(csvAds || []).filter(ad=>ad.parentKey===group.key && ad.matchable!==false);
      if(ads.length!==1) return '';
      const values=[...new Set(ads.map(ad=>String(csvField(ad,'creativeName','creative_name') || '').trim()))];
      return values.length===1 ? values[0] : '';
    };
    const matchingGroups=csvGroups.filter(group=>creativeOfCsv(group)===creative);
    if(matchingGroups.length!==1) return null;
    return matchingGroups[0];
  }

  // NO016: 業務確認済みの論理GP（親CP + Targeting + Device）と CSV 名称範囲の対応。
  // 設定側は統合済み GP（gpIdentity.logical）、CSV 側は同一名の複数行範囲。
  // 独立証拠: CP 一致 + P25 接尾辞で範囲一意 + 各 GP の Creative 集合と CSV 行 Creative 集合が一致（全単射）。
  // CSV の実 Group ID は生成しない（論理GP）。条件不足は何も返さない＝HOLD。
  function resolveTverLogicalGpScopes(settingModel, csvTree, campaignMatches, schemaKind){
    if(schemaKind!=='register-without-ids') return null;
    const plans=new Map();
    for(const campaignMatch of campaignMatches || []){
      if(!campaignMatch || campaignMatch.status!=='matched' || !campaignMatch.csvKey) continue;
      const settingCampaign=(settingModel.campaigns || []).find(campaign=>campaign.key===campaignMatch.settingKey);
      const csvCampaign=(csvTree.campaigns || []).find(campaign=>campaign.key===campaignMatch.csvKey);
      if(!settingCampaign || !csvCampaign) continue;
      const groups=(settingModel.adGroups || []).filter(group=>group.parentKey===settingCampaign.key && !group.businessType && group.gpIdentity && group.gpIdentity.logical);
      if(!groups.length) continue;
      const scopes=(csvTree.adGroups || []).filter(scope=>scope.parentKey===csvCampaign.key && scope.matchable!==false && !scope.id);
      if(scopes.length!==groups.length) continue;
      const anchor=String(csvField(csvCampaign,'campaignName','campaign_name') || '');
      if(!anchor) continue;
      const items=[]; let ready=true;
      for(const group of groups){
        const contract=resolveTverGroupNameContract(group,settingModel);
        const suffix=contract && contract.comparable && contract.components ? String(contract.components.deviceSuffix || '') : '';
        const ads=(settingModel.ads || []).filter(ad=>ad.parentKey===group.key);
        if(!suffix || !['SPPC','SP','CTV'].includes(suffix) || ads.length!==2){ready=false;break;}
        const creatives=ads.map(ad=>String(ad.expectedName || '').trim());
        if(creatives.some(value=>!value) || new Set(creatives).size!==creatives.length){ready=false;break;}
        items.push({group,suffix,ads,creatives});
      }
      if(!ready) continue;
      const scopeBySuffix=new Map(); let resolved=true;
      for(const item of items){
        if(scopeBySuffix.has(item.suffix)) continue;
        const exact=anchor+'_'+item.suffix;
        const matches=scopes.filter(scope=>{
          const name=String(csvField(scope,'adGroupName','adgroup_name') || '');
          return name===exact || (name.startsWith(anchor+'_') && name.endsWith('_'+item.suffix));
        });
        if(matches.length!==1){resolved=false;break;}
        scopeBySuffix.set(item.suffix,matches[0]);
      }
      if(!resolved) continue;
      const usedScopes=new Set([...scopeBySuffix.values()].map(scope=>scope.key));
      if(usedScopes.size!==scopes.length) continue;
      const localPlans=new Map(); let bijective=true;
      for(const item of items){
        const scope=scopeBySuffix.get(item.suffix);
        const rows=scope.rawRows || [];
        if(rows.length!==2 || rows.length!==item.creatives.length){bijective=false;break;}
        const rowCreatives=rows.map(row=>deriveTverCreativeName((row.values && row.values.creative_name) || '').trim());
        if(rowCreatives.some(value=>!value) || new Set(rowCreatives).size!==rowCreatives.length){bijective=false;break;}
        if(item.creatives.slice().sort().join('\u0000')!==rowCreatives.slice().sort().join('\u0000')){bijective=false;break;}
        const creativeRows={};
        for(const creative of item.creatives){
          const row=rows.find(candidate=>deriveTverCreativeName((candidate.values && candidate.values.creative_name) || '').trim()===creative);
          if(!row){bijective=false;break;}
          creativeRows[creative]=row.rowNumber;
        }
        if(!bijective) break;
        localPlans.set(item.group.key,{scopeKey:scope.key,creativeRows,rowNumbers:Object.values(creativeRows).map(Number).sort((a,b)=>a-b)});
      }
      if(!bijective) continue;
      localPlans.forEach((value,key)=>plans.set(key,value));
    }
    return plans.size ? plans : null;
  }

  // NO016: 論理GPのCSV名称範囲（複数行）を1つのGP比較エンティティにまとめる。
  // GPフィールドは全行の合意値を代表値とし、行間で異なるフィールドは fieldConflicts に残す。
  // Creative 行（Ad）は別エンティティのまま比較する。実グループIDは生成しない。
  function createTverGpScopeEntity(scope){
    const rows=Array.isArray(scope && scope.rawRows) ? scope.rawRows : [];
    if(!rows.length) return null;
    const ownedFields=REGISTER_SOURCE_FIELDS_BY_LEVEL['Ad Group'] || [];
    const fields={}, sourceEvidence={fields:{}}, conflicts={};
    ownedFields.forEach(field=>{
      const values=[...new Set(rows.map(row=>String(row.values ? row.values[field] : '')))];
      fields[field]=values.length ? values[0] : '';
      sourceEvidence.fields[field]=collectFieldEvidence(rows,field);
      if(values.length>1) conflicts[field]={field,values,sources:collectFieldEvidence(rows,field),rowNumbers:rows.map(row=>row.rowNumber)};
    });
    const rowMatching=rows.map(row=>registerAdGroupRowMatchingFields(row.values || {}));
    const matchingFields={ ...(scope.matchingFields || {}) };
    const matchingKeys=new Set(rowMatching.flatMap(item=>Object.keys(item)));
    matchingKeys.forEach(key=>{
      const values=[...new Set(rowMatching.map(item=>String(item[key] ?? '')))];
      matchingFields[key]=values.length ? values[0] : '';
    });
    const sourceRefs={ ...(scope.sourceRefs || {}) };
    return { ...scope, key:scope.key+'#gp', fields:{ ...(scope.fields || {}), ...fields }, matchingFields,
      sourceRefs, sourceEvidence, rawRows:rows, fieldConflicts:conflicts, fieldVariations:{},
      identityState:'logical-gp-scope', gpScopeRowNumbers:rows.map(row=>row.rowNumber),
      gpConsensus:Object.fromEntries(ownedFields.map(field=>[field,fields[field]])) };
  }

  function matchTverEntities(settingModel, csvTree, options){
    const config=options || {};
    const conversionContext=config.conversionContext || null;
    const ordinaryIdentityPlans=new Map(),uncertainCsvScopes=new Set();
    const settingCampaigns=Array.isArray(settingModel && settingModel.campaigns) ? settingModel.campaigns : [];
    const settingAdGroups=Array.isArray(settingModel && settingModel.adGroups) ? settingModel.adGroups : [];
    const settingAds=Array.isArray(settingModel && settingModel.ads) ? settingModel.ads : [];
    const csvCampaigns=Array.isArray(csvTree && csvTree.campaigns) ? csvTree.campaigns : [];
    const csvAdGroups=Array.isArray(csvTree && csvTree.adGroups) ? csvTree.adGroups : [];
    const csvAds=Array.isArray(csvTree && csvTree.ads) ? csvTree.ads : [];
    const matches=[];
    const bySettingKey=new Map();
    // Edit的同一ID跨父级／身份字段冲突，不能用首行值掩盖；仅限CTV分支消费。
    const ctvIdentityConflict=entity=>entity && (entity.matchable===false || (entity.conflictIssues || []).some(issue=>
      issue.code==='EDIT_PARENT_ID_CONFLICT' || issue.code==='DUPLICATE_ID_FIELD_CONFLICT' && ['campaign_name','adgroup_name','creative_name','creative_id'].includes(issue.field)));

    const ctvChildBelongs=(child,parent,idField)=>child.parentKey===parent.key || parent.id && (child.rawRows || []).some(row=>String(row.values[idField]).trim()===String(parent.id));

    const campaignMatches=settingCampaigns.map(setting => {
      if(setting.businessType==='survey-sp' && setting.surveyIssue) return makeMatch('Campaign',setting,'ambiguous',setting.surveyIssue,[]);
      if(setting.businessType==='survey-ctv'){
        const candidates=csvCampaigns.filter(cp=>(cp.rawRows || []).some(row=>normalizeTverNameForMatching(row.values.campaign_name)===normalizeTverNameForMatching(setting.ctvIdentityName))
          || csvAdGroups.some(g=>ctvChildBelongs(g,cp,'campaign_id') && csvAds.some(a=>ctvChildBelongs(a,g,'adgroup_id') && (a.rawRows || []).some(row=>setting.ctvCreativeNames.includes(String(row.values.creative_name))))));
        if(candidates.some(ctvIdentityConflict)) return makeMatch('Campaign',setting,'ambiguous','CTV_CSV_IDENTITY_CONFLICT',candidates);
        return makeMatch('Campaign',setting,candidates.length===1 ? 'matched' : 'ambiguous',candidates.length===1 ? 'CTV_UNIQUE_CAMPAIGN_LINEAGE' : 'CTV_CAMPAIGN_IDENTITY_UNCONFIRMED',candidates);
      }
      const expectedName=strictText(setting.expectedName || settingField(setting, 'campaignName'));
      if(!expectedName) return makeMatch('Campaign', setting, 'ambiguous', 'MISSING_CAMPAIGN_NAME', []);
      // TVER-CPN-DTMATCH-FIX：Campaign 的「实体识别」与「字段值校验」分离。
      // 稳定身份仅为 Campaign 名（Setting expectedName ⇄ CSV campaign_name 归一后严格一致）。
      // 開始日時／終了日時 不再参与实体识别：否则字段值不一致时反而无法配对，
      // 导致 Setting 侧与 CSV 侧各自变成孤立的 要確認／未匹配 实体，字段比较根本不会执行。
      // 配对成功后，datetime 仍由 buildRunFromModels 的既有字段比较判定 一致／不一致。
      const candidates=csvCampaigns.filter(csv =>
        tverCsvIdentityValues(csv,'campaign_name','campaignName').some(name=>normalizeTverNameForMatching(name)===normalizeTverNameForMatching(expectedName)));
      if(candidates.length===0) return makeMatch('Campaign', setting, 'unmatched', 'NO_HARD_CANDIDATE', candidates);
      if(candidates.length>1) return makeMatch('Campaign', setting, 'ambiguous', 'MULTIPLE_HARD_CANDIDATES', candidates);
      return makeMatch('Campaign', setting, 'matched', 'UNIQUE_HARD_CANDIDATE', candidates);
    });
    applyTverManualPairs(campaignMatches,csvCampaigns,[],config,settingModel,csvTree);
    applyTverComparisonScopes(campaignMatches,csvCampaigns,[]);
    resolveCandidateContention(campaignMatches);
    campaignMatches.forEach(match => { matches.push(match); bySettingKey.set(match.settingKey, match); });
    // NO014: 同名Groupスコープ×Creative行の行レベル比較計画（Group実体IDは未確認のまま）。
    const rowLevelScopePlans=resolveTverRegisterRowLevelScopes(settingModel,csvTree,campaignMatches,config.schemaKind);
    // NO016: 業務確認済みの論理GP（CP+Targeting+Device）とCSV名称範囲の対応計画。
    const logicalGpScopePlans=resolveTverLogicalGpScopes(settingModel,csvTree,campaignMatches,config.schemaKind);

    const adGroupIdentityScope=createTverFix1IdentityScope(settingCampaigns, settingAdGroups, csvCampaigns, csvAdGroups, campaignMatches, config.schemaKind);
    const adGroupMatches=settingAdGroups.map(setting => {
      if(setting.gpMergeIssue) return makeMatch('Ad Group',setting,'ambiguous',setting.gpMergeIssue,[]);
      if(setting.businessType==='survey-sp' && setting.surveyIssue) return makeMatch('Ad Group',setting,'ambiguous',setting.surveyIssue,[]);
      const parentMatch=bySettingKey.get(setting.parentKey);
      if(!parentMatch || parentMatch.status!=='matched' && !parentMatch.comparisonScopeKey) return makeMatch('Ad Group', setting, 'ambiguous', 'PARENT_NOT_UNIQUELY_MATCHED', []);
      const parentCsvKey=(parentMatch.csvKey || parentMatch.comparisonScopeKey);
      const expectedName=strictText(setting.expectedName);
      let candidates=csvAdGroups.filter(csv => csv.parentKey===parentCsvKey && csv.matchable!==false);
      if(setting.businessType==='survey-ctv'){
        const parentCsv=csvCampaigns.find(cp=>cp.key===parentCsvKey);
        candidates=csvAdGroups.filter(g=>ctvChildBelongs(g,parentCsv,'campaign_id'));
        const roleOf=name=> /_非接触者$/.test(name) ? 'noncontact' : /_接触者$/.test(name) ? 'contact' : null;
        const roleGroups=settingAdGroups.filter(g=>g.parentKey===setting.parentKey && g.businessType==='survey-ctv');
        const profiles=candidates.map(csv=>{
          const named=(csv.rawRows || []).map(row=>roleOf(String(row.values.adgroup_name))); 
          const creativeRoles=[...new Set(csvAds.filter(a=>ctvChildBelongs(a,csv,'adgroup_id')).flatMap(a=>roleGroups.filter(g=>(a.rawRows || []).some(row=>g.ctvCreativeName===String(row.values.creative_name))).map(g=>g.surveyRole)))];
          return {csv,signals:[...new Set([...named,...creativeRoles].filter(Boolean))]};
        });
        const relevant=profiles.filter(p=>p.signals.includes(setting.surveyRole));
        if(relevant.some(p=>ctvIdentityConflict(p.csv))) return makeMatch('Ad Group',setting,'ambiguous','CTV_CSV_IDENTITY_CONFLICT',relevant.map(p=>p.csv));
        if(relevant.some(p=>p.signals.length!==1)) return makeMatch('Ad Group',setting,'ambiguous','CTV_ROLE_EVIDENCE_CONFLICT',relevant.map(p=>p.csv));
        const selected=relevant.map(p=>p.csv);
        return makeMatch('Ad Group',setting,selected.length===1 ? 'matched' : 'ambiguous',selected.length===1 ? 'CTV_UNIQUE_ROLE_IDENTITY' : 'CTV_ROLE_IDENTITY_UNCONFIRMED',selected);
      }
      if(!setting.businessType){
        const identity=resolveTverIndependentGroupCandidates(setting,settingModel,candidates,csvAds,csvCampaigns.find(cp=>cp.key===parentCsvKey),ordinaryIdentityPlans,uncertainCsvScopes,Boolean(parentMatch.comparisonScopeKey));
        const result=makeMatch('Ad Group',setting,identity.status,identity.reason,identity.candidates);
        if(identity.status!=='matched')result.csvKey=null;
        if(identity.comparisonScopeKey)result.comparisonScopeKey=identity.comparisonScopeKey;
        // NO016: 業務確認済みの論理GP（1 GP = 2 Creative）を独立証拠で確定できる場合。
        // CSV の実 Group ID ではないため、論理IDとして扱い、IDを捏造しない。
        if(setting.gpIdentity && setting.gpIdentity.logical){
          // NO016: 業務確認済みGP構造では、独立証拠（CP+Targeting+Device+Creative全単射）が
          // 揃った計画がある場合だけ論理GPとして確定する。欠落/重複/余剰は HOLD（強制対応しない）。
          const logicalGpPlan=logicalGpScopePlans && logicalGpScopePlans.get(setting.key);
          if(!logicalGpPlan) return makeMatch('Ad Group', setting, 'ambiguous', 'LOGICAL_GP_IDENTITY_UNCONFIRMED', []);
          Object.assign(result,{status:'matched',csvKey:logicalGpPlan.scopeKey,reasonCode:'LOGICAL_GP_IDENTITY_NO_CSV_ID',
            logicalGpIdentity:true,identityStatus:'logical-gp-no-csv-id',
            gpCreativeRows:logicalGpPlan.creativeRows,gpRowNumbers:logicalGpPlan.rowNumbers});
          return result;
        }
        // NO014: 独立証拠が「行対応一意」を証明できた場合だけ行レベル比較へ進む。
        // Group実体IDは未確認（B）のままで、行対応（A）と混同しない。
        // 既存の独立証拠が実候補を絞り込んでいる（GROUP_IDENTITY_EVIDENCE_CONFLICT 等）場合は適用しない。
        const rowLevelPlan=rowLevelScopePlans && rowLevelScopePlans.get(setting.key);
        if(rowLevelPlan && result.status==='ambiguous' && !result.comparisonScopeKey
          && ['CSV_GROUP_SCOPE_GRAIN_AMBIGUOUS','GROUP_IDENTITY_UNCONFIRMED'].includes(result.reasonCode)){
          Object.assign(result,{comparisonScopeKey:rowLevelPlan.comparisonScopeKey,rowNumbers:rowLevelPlan.rowNumbers,
            rowLevelComparison:true,identityStatus:'row-level-confirmed',reasonCode:'ROW_LEVEL_COMPARISON_CONFIRMED'});
        }
        return result;
      }
      if(expectedName){
        candidates=candidates.filter(csv => csvField(csv, 'adGroupName', 'adgroup_name')===expectedName);
      }else{
        const identityRow=adGroupIdentityScope && adGroupIdentityScope.bySettingKey.get(setting.key);
        let identityCandidates=[];
        if(identityRow){
          identityCandidates=adGroupIdentityScope.csvCandidatesByName.get(identityRow.csvName) || [];
          if(identityCandidates.length>1) return makeMatch('Ad Group', setting, 'ambiguous', 'MULTIPLE_HARD_CANDIDATES', identityCandidates);
          candidates=candidates.filter(csv => {
            const csvName=String(csvField(csv, 'adGroupName', 'adgroup_name') ?? '');
            if(adGroupIdentityScope.duplicateCsvNames.has(csvName)) return false;
            const identityOwner=adGroupIdentityScope.settingKeyByCsvName.get(csvName);
            return !identityOwner || identityOwner===setting.key;
          });
        }
        let settingProfile=conversionContext && typeof conversionContext.getSettingAdGroupProfile==='function'
          ? conversionContext.getSettingAdGroupProfile(setting) : null;
        // 通常Survey的Scenario是待校正字段；只在本类型中以独立price/DMP候选唯一性识别GP。
        const ordinarySurveyProfile=profile=>isTverOrdinarySurveySpScopedGp(setting) && !setting.ordinarySurveySpContext.reason && profile
          ? {...profile,requiredFields:profile.requiredFields.filter(f=>f!=='retargetKind'),optionalFields:profile.optionalFields.filter(f=>f!=='retargetSegmentId')} : profile;
        settingProfile=ordinarySurveyProfile(settingProfile);
        const profileState=resolvedStructuralProfile(settingProfile);
        const candidateProfiles=candidates.map(csv => {
          const profile=conversionContext && typeof conversionContext.getCsvAdGroupProfile==='function'
            ? conversionContext.getCsvAdGroupProfile(csv) : null;
          return { csv, profile:ordinarySurveyProfile(profile) };
        });
        const unknownPotential=candidateProfiles.filter(item => !resolvedStructuralProfile(item.profile).ok
          && !structuralProfilesConflictOnKnownValues(settingProfile, item.profile)).map(item => item.csv);
        const structuralCandidates=profileState.ok ? candidateProfiles.filter(item => resolvedStructuralProfile(item.profile).ok
          && structuralProfilesMatch(settingProfile, item.profile)).map(item => item.csv) : [];
        if(identityCandidates.length===0){
          const settingBranch=resolveTverSettingAdGroupBranchIdentity(setting);
          if(settingBranch){
            const branchCandidates=structuralCandidates.filter(csv => resolveTverCsvAdGroupBranchIdentity(csv)===settingBranch);
            const unknownBranchCandidates=unknownPotential.filter(csv => resolveTverCsvAdGroupBranchIdentity(csv)===settingBranch);
            if(branchCandidates.length===1 && unknownBranchCandidates.length===0){
              return makeMatch('Ad Group', setting, 'matched', 'UNIQUE_TARGETING_BRANCH_NAME', branchCandidates);
            }
          }
        }
        if(identityCandidates.length===1){
          const identityCandidate=identityCandidates[0];
          const otherUnknown=unknownPotential.filter(csv => csv.key!==identityCandidate.key);
          if(otherUnknown.length){
            return makeMatch('Ad Group', setting, 'ambiguous', 'MISSING_ADGROUP_STRUCTURAL_FIELD', [identityCandidate, ...otherUnknown]);
          }
          if(structuralCandidates.length===1 && structuralCandidates[0].key===identityCandidate.key){
            return makeMatch('Ad Group', setting, 'matched', 'UNIQUE_HARD_CANDIDATE', [identityCandidate]);
          }
          return makeMatch('Ad Group', setting, 'matched', 'UNIQUE_STRICT_IDENTITY', [identityCandidate]);
        }
        candidates=[...new Map([...structuralCandidates, ...unknownPotential].map(csv => [csv.key, csv])).values()];
        if(!profileState.ok || unknownPotential.length) return makeMatch('Ad Group', setting, 'ambiguous', 'MISSING_ADGROUP_STRUCTURAL_FIELD', candidates);
        if(candidates.length===0) return makeMatch('Ad Group', setting, 'unmatched', 'NO_HARD_CANDIDATE', candidates);
        if(candidates.length>1) return makeMatch('Ad Group', setting, 'ambiguous', 'MULTIPLE_HARD_CANDIDATES', candidates);
        return makeMatch('Ad Group', setting, 'matched', 'UNIQUE_HARD_CANDIDATE', candidates);
      }
      if(candidates.length===0 && setting.businessType==='survey-sp'){
        // NO015 #40: 名称不一致時のみ、一意な Creative を独立証拠に1件だけ復元する（名称は不一致で検出）。
        const lineage=resolveSurveySpGroupUniqueCreativeLineage(setting,settingModel,csvAdGroups,csvAds,parentCsvKey);
        if(lineage) return makeMatch('Ad Group', setting, 'matched', 'UNIQUE_SURVEY_SP_CREATIVE_LINEAGE', [lineage]);
        // 一意な独立証拠が無い場合は HOLD。名称未校正のリスクを明示する理由コードを付す。
        return makeMatch('Ad Group', setting, 'unmatched', 'SURVEY_SP_NAME_NO_IDENTITY_EVIDENCE', candidates);
      }
      if(candidates.length===0) return makeMatch('Ad Group', setting, 'unmatched', 'NO_HARD_CANDIDATE', candidates);
