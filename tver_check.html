        : '<span class="tver-horizontal-entity-status '+tverHorizontalStatusClass(entityStatus)+'" data-entity-status="'+escapeHtml(entityStatus)+'">'+escapeHtml(entityStatus==='一致' ? '一致' : entityBadge)+'</span>';
      const fixedCells=`<td class="tver-horizontal-fixed tver-horizontal-col-no tver-horizontal-fixed-no" rowspan="2">${escapeHtml(index + 1)}</td><td class="tver-horizontal-fixed tver-horizontal-col-target tver-horizontal-fixed-target" rowspan="2">${escapeHtml(row.displayLabel)}</td>${buildTverHorizontalProjectedNameCellHtml(row, view.level, 'setting')}<td class="tver-horizontal-fixed tver-horizontal-col-comparison tver-horizontal-fixed-comparison" rowspan="2"><span data-entity-status="${escapeHtml(entityStatus)}">${comparisonControl}</span></td>`;

  function buildTverHorizontalTableHtml(viewModel, options){

    const fixedHead='<thead><tr>'
      + buildTverColumnHeader('No.', 'tver-horizontal-fixed tver-horizontal-col-no tver-horizontal-fixed-no', 'no', view.level, storage, false, resolvedWidths)
      + buildTverColumnHeader(targetHeaderLabel, 'tver-horizontal-fixed tver-horizontal-col-target tver-horizontal-fixed-target', 'target', view.level, storage, true, resolvedWidths)
      + buildTverColumnHeader(nameLabel, 'tver-horizontal-fixed tver-horizontal-name-col tver-horizontal-fixed-name', 'name', view.level, storage, true, resolvedWidths)

      + '</div>'

      + '</div></div>'

  function syncTverHorizontalScrollAccess(panel){
    if(!panel || typeof panel.querySelector!=='function') return;
    const source=panel.querySelector('.tver-horizontal-scroll');
    const access=panel.querySelector('.tver-horizontal-scroll-access');
    const track=panel.querySelector('.tver-horizontal-scroll-access-track');
    if(!source || !access || !track) return;
    const scrollWidth=Math.max(0, Number(source.scrollWidth) || 0);
    const clientWidth=Math.max(0, Number(source.clientWidth) || 0);
    const hasOverflow=scrollWidth>clientWidth+1;
    if(track.style) track.style.width=Math.max(scrollWidth, clientWidth) + 'px';
    access.hidden=!hasOverflow;
    if(access.setAttribute) access.setAttribute('aria-hidden', String(!hasOverflow));
    // C3-C5-CR-REOPEN-3 FIX E：Ad/CR 横版字段少（无横向溢出）时，sticky header 右侧
    // 不再渲染整行深蓝底（fit 状态下 dynamic 区域透明，仅 track 实宽着色；fixed 区自带深蓝）。
    // 仅作用于 Ad 层——Campaign / Ad Group 的渲染与行为保持不变。
    const stickyHeader=panel.querySelector('.tver-horizontal-sticky-header');
    if(stickyHeader && stickyHeader.classList && typeof stickyHeader.classList.toggle==='function'){
      const levelTable=panel.querySelector('.tver-horizontal-table[data-level]');
      const level=levelTable && typeof levelTable.getAttribute==='function' ? String(levelTable.getAttribute('data-level') || '') : '';
      if(level==='Ad') stickyHeader.classList.toggle('tver-horizontal-sticky-header-fit', !hasOverflow);
    }
    const sourceScrollLeft=Number.isFinite(Number(source.scrollLeft)) ? Number(source.scrollLeft) : 0;
    if(Number(access.scrollLeft)!==sourceScrollLeft) access.scrollLeft=sourceScrollLeft;
    syncTverHorizontalHeaderHeights(panel);
  }

  function tverHorizontalMeasuredHeight(element){
    if(!element) return 0;
    const rect=typeof element.getBoundingClientRect==='function' ? element.getBoundingClientRect() : null;
    const rectHeight=rect && Number(rect.height);
    if(Number.isFinite(rectHeight) && rectHeight>0) return rectHeight;
    const offsetHeight=Number(element.offsetHeight);
    return Number.isFinite(offsetHeight) && offsetHeight>0 ? offsetHeight : 0;
  }

  function syncTverHorizontalHeaderHeights(panel){
    if(!panel || typeof panel.querySelector!=='function') return 0;
    const row=panel.querySelector('.tver-horizontal-sticky-header-row');
    const fixed=panel.querySelector('.tver-horizontal-sticky-header-fixed');
    const dynamic=panel.querySelector('.tver-horizontal-sticky-header-dynamic');
    const fixedTable=panel.querySelector('.tver-horizontal-sticky-header-fixed-table');
    const dynamicTable=panel.querySelector('.tver-horizontal-sticky-header-dynamic-table');
    const targets=[row, fixed, dynamic, fixedTable, dynamicTable].filter(Boolean);
    if(!targets.length) return 0;
    targets.forEach(element => {
      if(!element.style) return;
      element.style.height='';
      element.style.minHeight='';
    });
    const fixedHeight=Math.max(tverHorizontalMeasuredHeight(fixedTable), tverHorizontalMeasuredHeight(fixed));
    const dynamicHeight=Math.max(tverHorizontalMeasuredHeight(dynamicTable), tverHorizontalMeasuredHeight(dynamic));
    const headerHeight=Math.max(fixedHeight, dynamicHeight);
    if(!(headerHeight>0)) return 0;
    const cssHeight=headerHeight + 'px';
    targets.forEach(element => {
      if(!element.style) return;
      element.style.height=cssHeight;
      element.style.minHeight=cssHeight;
    });
    return headerHeight;
  }

  function syncTverHorizontalStickyPresentation(panel){
    if(!panel || typeof panel.querySelector!=='function') return;
    syncTverHorizontalHeaderHeights(panel);
    const shell=panel.querySelector('.tver-horizontal-scroll-shell');
    const scroll=panel.querySelector('.tver-horizontal-scroll');
    const track=panel.querySelector('[data-tver-sticky-header-track]');
    const bodyTable=panel.querySelector('.tver-horizontal-scroll table[data-level]');
    const header=panel.querySelector('[data-tver-sticky-header]');
    const headerRect=header && typeof header.getBoundingClientRect==='function' ? header.getBoundingClientRect() : null;
    const headerHeight=headerRect && Number.isFinite(Number(headerRect.height)) ? Number(headerRect.height) : header && Number.isFinite(Number(header.offsetHeight)) ? Number(header.offsetHeight) : 0;
    const headerBottom=headerRect && Number.isFinite(Number(headerRect.bottom)) ? Number(headerRect.bottom) : headerHeight;
    if(shell && shell.style && typeof shell.style.setProperty==='function') shell.style.setProperty('--tver-sticky-header-height', headerHeight + 'px');
    if(track){
      const scrollLeft=scroll && Number.isFinite(Number(scroll.scrollLeft)) ? Number(scroll.scrollLeft) : 0;
      track.style.transform='translate3d(' + (-scrollLeft) + 'px,0,0)';
    }
    const label=panel.querySelector('[data-tver-sticky-group]');
    if(!label) return;
    const groupRows=typeof panel.querySelectorAll==='function' ? [...panel.querySelectorAll('.tver-horizontal-scroll .tver-horizontal-group-row')] : [];
    let current=null;
    groupRows.forEach(row => {
      if(row && row.getAttribute && row.getAttribute('data-group-key') && typeof row.getBoundingClientRect==='function' && row.getBoundingClientRect().top<=headerBottom+1) current=row;
    });
    const shellBottom=shell && typeof shell.getBoundingClientRect==='function' ? shell.getBoundingClientRect().bottom : Infinity;
    const text=label.querySelector && label.querySelector('[data-tver-sticky-group-text]');
    if(label.style) label.style.top=headerHeight + 'px';
    if(current && shellBottom>headerBottom){
      if(text) text.textContent=current.textContent || '';
      label.style && (label.style.visibility='visible');
      label.setAttribute && label.setAttribute('aria-hidden','false');
    }else{
      if(text) text.textContent='';
      label.style && (label.style.visibility='hidden');
      label.setAttribute && label.setAttribute('aria-hidden','true');
    }
  }

  const tverHorizontalStickySyncState=new WeakMap();
  function scheduleTverHorizontalStickySync(panel){
    if(!panel) return;
    const view=panel.ownerDocument && panel.ownerDocument.defaultView || (typeof window!=='undefined' ? window : null);
    const raf=view && typeof view.requestAnimationFrame==='function' ? view.requestAnimationFrame.bind(view) : null;
    if(!raf){ syncTverHorizontalStickyPresentation(panel); return; }
    const current=tverHorizontalStickySyncState.get(panel) || { pending:false };
    if(current.pending) return;
    current.pending=true;
    tverHorizontalStickySyncState.set(panel, current);
    raf(() => {
      current.pending=false;
      syncTverHorizontalStickyPresentation(panel);
    });
  }

  function bindTverHorizontalInteractions(panel){
    if(!panel || typeof panel.addEventListener!=='function' || panel.__tverHorizontalEventsBound) return;
    panel.__tverHorizontalEventsBound=true;
    panel.addEventListener('click', event => {
      const target=event && event.target;
      const control=target && typeof target.closest==='function' ? target.closest('[data-action]') : target && target.getAttribute && target.getAttribute('data-action') ? target : null;
      if(!control || (typeof panel.contains==='function' && !panel.contains(control))) return;
      const action=control.getAttribute && control.getAttribute('data-action');
      if(action==='switch-level'){
        const level=control.getAttribute && control.getAttribute('data-level');
        if(!TVER_HORIZONTAL_LEVELS.includes(level) || !tverPageState.run) return;
        tverPageState.activeLevel=level;
        tverPageState.filters={ ...tverPageState.filters, level };
        renderTverRun(tverPageState.run, { activeLevel:level, newLifecycle:true });
      }
      if(action==='reset-column-widths' && tverPageState.run){
        resetTverColumnWidths();
        renderTverRun(tverPageState.run, { activeLevel:tverPageState.activeLevel, filters:tverPageState.filters, newLifecycle:false });
      }
      if(action==='toggle-detail'){
        setTverHorizontalDetailExpanded(panel, control);
        syncTverHorizontalScrollAccess(panel);
      }
      if(action==='toggle-detail-evidence') setTverHorizontalEvidenceExpanded(panel, control);
      if(action==='toggle-result-detail'){
        const wrap=typeof control.closest==='function' ? control.closest('.tver-result-lines') : null;
        const detailPanel=wrap && typeof wrap.querySelector==='function' ? wrap.querySelector('[data-result-detail]') : null;
        if(detailPanel){
          const next=detailPanel.hidden!==false;
          detailPanel.hidden=!next;
          control.setAttribute && control.setAttribute('aria-expanded', String(next));
          control.classList && control.classList.toggle && control.classList.toggle('is-open', next);
          syncTverHorizontalScrollAccess(panel);
        }
      }
    });
    panel.addEventListener('dblclick', event => {
      const target=event && event.target;
      const cell=target && typeof target.closest==='function' ? target.closest('[data-action="toggle-cell"]') : target && target.getAttribute && target.getAttribute('data-action')==='toggle-cell' ? target : null;
      if(!cell || (typeof panel.contains==='function' && !panel.contains(cell))) return;
      cell.classList && cell.classList.toggle('tver-horizontal-cell-expanded');
      event.preventDefault && event.preventDefault();
    });
    panel.addEventListener('keydown', event => {
      const target=event && event.target;
      if(!target || target.getAttribute && target.getAttribute('data-action')!=='switch-level') return;
      if(event.key!=='Enter' && event.key!==' ') return;
      event.preventDefault && event.preventDefault();
      target.click && target.click();
    });
    panel.addEventListener('pointerdown', event => {
      const target=event && event.target;
      const handle=target && typeof target.closest==='function' ? target.closest('[data-action="resize-column"]') : target && target.getAttribute && target.getAttribute('data-action')==='resize-column' ? target : null;
      if(!handle || (typeof panel.contains==='function' && !panel.contains(handle))) return;
      const table=typeof handle.closest==='function' ? handle.closest('table') : null;
      const level=table && table.getAttribute ? table.getAttribute('data-level') : '';
      const tables=panel && typeof panel.querySelectorAll==='function'
        ? [...panel.querySelectorAll('table[data-level="' + level + '"]')]
        : table ? [table] : [];
      const shell=panel && typeof panel.querySelector==='function' ? panel.querySelector('.tver-horizontal-scroll-shell') : null;
      const columnKey=handle.getAttribute && handle.getAttribute('data-column-key');
      const column=table && typeof table.querySelectorAll==='function'
        ? [...table.querySelectorAll('col[data-column-key]')].find(item => item.getAttribute && item.getAttribute('data-column-key')===columnKey)
        : null;
      const startWidth=column && column.style && parseFloat(column.style.width) || getTverColumnWidth(level, columnKey);
      const doc=panel.ownerDocument || (typeof document!=='undefined' ? document : null);
      if(!doc || typeof doc.addEventListener!=='function' || !column || !column.style) return;
      event.preventDefault && event.preventDefault();
      const storage=getTverColumnStorage();
      const move=moveEvent => {
        const width=setTverColumnWidth(level, columnKey, startWidth + Number(moveEvent.clientX || 0) - Number(event.clientX || 0), storage);
        column.style.width=`${width}px`;
        column.style.minWidth=`${width}px`;
        const getWidth=key => {
          const candidate=[...table.querySelectorAll('col[data-column-key]')].find(item => item.getAttribute && item.getAttribute('data-column-key')===key);
          return candidate && candidate.style ? parseFloat(candidate.style.width) || getTverColumnWidth(level, key, storage) : getTverColumnWidth(level, key, storage);
        };
        tables.forEach(tableItem => {
          const matchingColumn=typeof tableItem.querySelectorAll==='function'
            ? [...tableItem.querySelectorAll('col[data-column-key]')].find(item => item.getAttribute && item.getAttribute('data-column-key')===columnKey)
            : null;
          const headers=typeof tableItem.querySelectorAll==='function' ? [...tableItem.querySelectorAll('th[data-column-key]')] : [];
          headers.filter(item => item.getAttribute('data-column-key')===columnKey).forEach(item => {
            item.style.width=width + 'px';
            item.style.minWidth=width + 'px';
          });
          if(matchingColumn && matchingColumn.style){
            matchingColumn.style.width=width + 'px';
            matchingColumn.style.minWidth=width + 'px';
          }
        });
        const dynamicWidth=Math.max(0, ...tables.map(tableItem => {
          const dynamicColumns=typeof tableItem.querySelectorAll==='function' ? [...tableItem.querySelectorAll('col[data-column-key]')] : [];
          return dynamicColumns
            .filter(item => !['no', 'target', 'name', 'comparison'].includes(item.getAttribute && item.getAttribute('data-column-key')))
            .reduce((total, item) => total + (item.style && parseFloat(item.style.width) || 0), 0);
        }));
        const noWidth=getWidth('no');
        const targetWidth=getWidth('target');
        const nameWidth=getWidth('name');
        const comparisonWidth=getWidth('comparison');
        const fixedWidth=noWidth + targetWidth + nameWidth + comparisonWidth;
        const tableWidth=fixedWidth + dynamicWidth;
        const styleTargets=[...tables, shell].filter(Boolean);
        styleTargets.forEach(target => {
          target.style.setProperty('--tver-no-width', noWidth + 'px');
          target.style.setProperty('--tver-target-width', targetWidth + 'px');
          target.style.setProperty('--tver-name-width', nameWidth + 'px');
          target.style.setProperty('--tver-comparison-width', comparisonWidth + 'px');
          target.style.setProperty('--tver-fixed-width', fixedWidth + 'px');
          target.style.setProperty('--tver-dynamic-width', dynamicWidth + 'px');
          target.style.setProperty('--tver-table-width', tableWidth + 'px');
        });
        syncTverHorizontalScrollAccess(panel);
        syncTverHorizontalHeaderHeights(panel);
      };
      const stop=() => {
        doc.removeEventListener && doc.removeEventListener('pointermove', move);
        doc.removeEventListener && doc.removeEventListener('pointerup', stop);
      };
      doc.addEventListener('pointermove', move);
      doc.addEventListener('pointerup', stop, { once:true });
    });
    const sync=event => {
      const source=panel.querySelector && panel.querySelector('.tver-horizontal-scroll');
      const access=panel.querySelector && panel.querySelector('.tver-horizontal-scroll-access');
      const target=event && event.target;
      if(source && access && target===access && Number(source.scrollLeft)!==Number(access.scrollLeft)) source.scrollLeft=access.scrollLeft;
      if(source && access && target===source && Number(access.scrollLeft)!==Number(source.scrollLeft)) access.scrollLeft=source.scrollLeft;
      syncTverHorizontalScrollAccess(panel);
      scheduleTverHorizontalStickySync(panel);
    };
    panel.addEventListener('scroll', sync, true);
    const view=panel.ownerDocument && panel.ownerDocument.defaultView || (typeof window!=='undefined' ? window : null);
    if(view && typeof view.addEventListener==='function'){
      view.addEventListener('resize', sync);
    }
    sync();
  }

  // 只读汇总：供批量真实验证脚本（tests/tver_real_file.verify.js）输出每案指标。
  // 不修改任何比对/匹配/规则结论，仅从已构建的 run 抽取统计。
  function summarizeValidationRun(run){
    const safe=run || {};
    const settingCounts=safe.settingCounts || { Campaign:0, 'Ad Group':0, Ad:0 };
    const csvCounts=safe.csvCounts || { Campaign:0, 'Ad Group':0, Ad:0 };
    const matchedCounts={ Campaign:0, 'Ad Group':0, Ad:0 };
    const matching=safe.matching || {};
    (matching.matches || []).forEach(match => {
      if(match && match.status==='matched' && Object.prototype.hasOwnProperty.call(matchedCounts, match.level)) matchedCounts[match.level]+=1;
    });
    const entries=Array.isArray(safe.entries) ? safe.entries : [];
    const representativeDifferences=entries
      .filter(entry => entry && (entry.comparisonStatus==='不一致' || entry.comparisonStatus==='需确认' || entry.comparisonStatus==='未匹配'))
      .slice(0, 3)
      .map(entry => ({ level:entry.level, targetName:entry.targetName, field:entry.field, comparisonStatus:entry.comparisonStatus, reason:entry.reason || '' }));
    return {
      schemaKind: safe.schemaKind || '',
      businessRole: safe.businessRole || '',
      parsedCounts: {
        setting: { Campaign:settingCounts.Campaign, 'Ad Group':settingCounts['Ad Group'], Ad:settingCounts.Ad },
        csv: { Campaign:csvCounts.Campaign, 'Ad Group':csvCounts['Ad Group'], Ad:csvCounts.Ad },
      },
      matchedCounts,
      statusCounts: safe.statusCounts || {},
      representativeDifferences,
    };
  }

  function tverDisplayTreeStatusCount(counts, status){

  function buildTverDisplayTreeStatusHtml(counts){

      return `<span class="tver-tree-status-badge status-${escapeHtml(status)}"><span>${escapeHtml(statusDisplayLabel(status))}</span><strong>${escapeHtml(count)}</strong></span>`;

  function buildTverEntryDisplayLabelIndex(displayTree){
    const index=new Map();
    const visit=node => {
      if(!node || typeof node!=='object') return;
      const label=String(node.displayLabel || node.displayName || '');
      const entryIndexes=Array.isArray(node.entryIndexes) ? node.entryIndexes : [];
      entryIndexes.forEach(entryIndex => {
        if(Number.isInteger(entryIndex) && !index.has(entryIndex)) index.set(entryIndex, label);
      });
      (Array.isArray(node.children) ? node.children : []).forEach(visit);
    };
    const tree=displayTree && typeof displayTree==='object' ? displayTree : {};
    (Array.isArray(tree.roots) ? tree.roots : []).forEach(visit);
    (Array.isArray(tree.unattached) ? tree.unattached : []).forEach(visit);
    return index;
  }

  function buildTverEntityFieldTableHtml(node, entries, filters){
    const safe=node && typeof node==='object' ? node : {};
    const safeEntries=Array.isArray(entries) ? entries : [];
    const criteria=buildTverEntryFilterCriteria(filters);
    const indexes=(Array.isArray(safe.entryIndexes) ? safe.entryIndexes : []).filter(entryIndex => Number.isInteger(entryIndex) && entryIndex>=0 && entryIndex<safeEntries.length && safeEntries[entryIndex] && matchesTverEntryFilters(safeEntries[entryIndex], criteria));
    const rows=indexes.map(entryIndex => {
      const entry=safeEntries[entryIndex];
      const status=entry.displayStatus || entry.comparisonStatus || '';
      const reason=entry.reason || entry.conservativeReason || '';
      const ruleBasis=entry.ruleBasis || '';
      return `<tr data-entry-index="${escapeHtml(entryIndex)}"><td>${escapeHtml(entry.field)}</td><td class="result-status">${escapeHtml(statusDisplayLabel(status))}</td><td>${escapeHtml(formatTverDisplayValue(entry, 'setting'))}</td><td>${escapeHtml(formatTverDisplayValue(entry, 'csv'))}</td><td>${escapeHtml(reason)}${ruleBasis ? `<div class="detail">${escapeHtml(ruleBasis)}</div>` : ''}</td></tr>`;
    }).join('');

  }

  function buildTverDisplayTreeNodeHtml(node, entries, filters){
    const safe=node && typeof node==='object' ? node : {};
    const level=String(safe.level || '');
    const nodeKey=String(safe.nodeKey ?? '');
    const children=Array.isArray(safe.children) ? safe.children : [];
    const expanded=level==='Campaign';

  function buildTverDisplayTreeHtml(displayTree, entries, filters){
    const tree=displayTree && typeof displayTree==='object' ? displayTree : {};

  function tverTreeNodeFromToggle(toggle){

  function setTverTreeNodeExpanded(node, expanded){
    if(!node || typeof node.querySelector!=='function') return false;

  function renderTverRun(run, options){
    const config=options || {};
    const filters={ ...defaultFilters(), ...(config.filters || tverPageState.filters) };

    const activeLevel=TVER_HORIZONTAL_LEVELS.includes(requestedLevel) ? requestedLevel : 'Campaign';
    const effectiveFilters={ ...filters, level:activeLevel };
    const shown=filterTverDisplayEntries(run, effectiveFilters);

  function identifyTverSettingWorkbook(workbook, options){
    const config=options || {};
    const availableSheetNames=workbook && Array.isArray(workbook.SheetNames) ? [...workbook.SheetNames] : [];
    if(!availableSheetNames.length) return {ok:false,role:'setting',code:'SETTING_SHEETS_EMPTY',workbook:null,model:null,candidate:null,availableSheetNames:[],validation:{ok:false,code:'SETTING_SHEETS_EMPTY',message:'ブック内にSheetがありません。'},message:'設定表のSheetを読み込めません。'};
    const selectedSheetName=typeof config.selectedSheetName==='string' ? config.selectedSheetName : '';
    if(!selectedSheetName){
      return {ok:true,role:'setting',code:'SETTING_SHEET_REQUIRED',workbook,model:null,candidate:null,availableSheetNames,selectedSheetName:'',validation:{ok:false,code:'SETTING_SHEET_REQUIRED',message:'参照シート名（必須）を選択してください。'},message:'Excelを読み込みました。参照シートを選択してください。'};
    }
    const model=parseTverSettingWorkbook(workbook,{...config,selectedSheetName,fileName:config.fileName || ''});
    const issue=settingParseBlockingIssue(model);
    const validation=issue
      ? {ok:false,code:issue.code,issue,message:'参照シート「'+selectedSheetName+'」を確認できません（'+issue.code+'）。'}
      : {ok:true,code:null,message:'参照シートを確認しました。'};
    return {ok:true,role:'setting',code:issue && issue.code || null,workbook,model,candidate:model.selectedSheetName ? {sheetName:model.selectedSheetName} : null,availableSheetNames,selectedSheetName,validation,message:validation.message};
  }

  function identifyTverCsvText(text, options){
    const config=options || {};
    const parsed=parseCsvText(text, config);
    const issues=parsed && Array.isArray(parsed.parseIssues) ? parsed.parseIssues : [];
    const schema=parsed && parsed.schema || {};
    if(!schema.kind || issues.some(issue => issue && issue.code==='CSV_SCHEMA_UNRECOGNIZED')){
      return { ok:false, role:'csv', code:'CSV_SCHEMA_UNRECOGNIZED', parsedCsv:null, schemaKind:null, message:'CSVとして識別できません（TVer CSV Schemaを確認できません）。' };
    }
    return { ok:true, role:'csv', code:null, parsedCsv:parsed, schemaKind:schema.kind, message:`${schema.kind} として識別しました。` };
  }

  function tverLastVisibleSheetName(workbook){
    const names=workbook && Array.isArray(workbook.SheetNames) ? workbook.SheetNames : [];
    for(let index=names.length-1;index>=0;index-=1) if(isVisibleSheet(workbook,names[index])) return names[index];
    return '';
  }

  async function identifyTverSettingFile(file, options){
    const config=options || {};
    if(!file || !/\.xlsx$/i.test(file.name || '')) return tverFileRecognitionFailure(file, 'setting', 'UNSUPPORTED_FILE_FORMAT', '対応外形式です（.xlsx と .csv のみ使用できます）。');
    try{
      const reader=config.readSettingWorkbook || readSettingWorkbook;
      const workbook=await reader(file);
      const requested=typeof config.selectedSheetName==='string' ? config.selectedSheetName : '';
      const selectedSheetName=requested || tverLastVisibleSheetName(workbook);
      if(!selectedSheetName){
        const message='設定表に表示中のSheetがありません。表示中のSheetを確認してください。';
        const info=identifyTverSettingWorkbook(workbook,{...config,fileName:file.name || '',selectedSheetName:''});
        return { ...info, code:'SETTING_VISIBLE_SHEETS_EMPTY', selectedSheetName:'', validation:{ok:false,code:'SETTING_VISIBLE_SHEETS_EMPTY',message}, message, file };
      }
      return { ...identifyTverSettingWorkbook(workbook, { ...config, fileName:file.name || '', selectedSheetName }), file };
    }catch(error){
      return tverFileRecognitionFailure(file, 'setting', 'SETTING_FILE_READ_ERROR', `識別できないファイルです（${fileNameDescription(file)}）。`);
    }
  }

  async function identifyTverCsvFile(file, options){
    const config=options || {};
    if(!file || !/\.csv$/i.test(file.name || '')) return tverFileRecognitionFailure(file, 'csv', 'UNSUPPORTED_FILE_FORMAT', '対応外形式です（.xlsx と .csv のみ使用できます）。');
    try{
      const reader=config.readCsvFile || readCsvFile;
      const text=await reader(file);
      return { ...identifyTverCsvText(text, { ...config, fileName:file.name || '' }), file, text };
    }catch(error){
      return tverFileRecognitionFailure(file, 'csv', 'CSV_FILE_READ_ERROR', `識別できないファイルです（${fileNameDescription(file)}）。`);
    }
  }

  function buildTverFileRecognitionMessage(result){
    const recognition=result || {};
    const setting=recognition.setting;
    const csv=recognition.csv;
    const lines=['設定表：'+fileNameDescription(setting && setting.file),'CSV：'+fileNameDescription(csv && csv.file)];
    if(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('setting')) lines.push('設定表が複数選択されています。1つだけ選択してください。');
    if(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('csv')) lines.push('CSVが複数選択されています。1つだけ選択してください。');
    if(Array.isArray(recognition.unsupported) && recognition.unsupported.length) lines.push('対応外形式：'+recognition.unsupported.map(item=>fileNameDescription(item.file)).join('、')+'（.xlsx と .csv のみ）');
    if(Array.isArray(recognition.unrecognized) && recognition.unrecognized.length) lines.push('識別できないファイル：'+recognition.unrecognized.map(item=>fileNameDescription(item.file)).join('、'));
    if(!setting && !(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('setting'))) lines.push('設定表が未選択です。');
    if(!csv && !(Array.isArray(recognition.conflicts) && recognition.conflicts.includes('csv'))) lines.push('CSVが未選択です。');
    if(recognition.settingValidation && recognition.settingValidation.code==='SETTING_VISIBLE_SHEETS_EMPTY') lines.push(recognition.settingValidation.message);
    else if(recognition.ok && !recognition.selectedSheetName) lines.push('参照シート名（必須）を選択してください。');
    else if(recognition.ok && recognition.settingValidation && !recognition.settingValidation.ok) lines.push(recognition.settingValidation.message || '参照シートを確認できません。');
    else if(recognition.ok) lines.push('設定表とCSVを識別しました。チェック開始できます。');
    return lines.join('\n');
  }

  async function identifyTverFiles(files, options){
    const fileList=Array.from(files || []).filter(Boolean);
    const config=options || {};
    const inspected=await Promise.all(fileList.map(file=>{
      if(/\.xlsx$/i.test(file.name || '')) return identifyTverSettingFile(file,config);
      if(/\.csv$/i.test(file.name || '')) return identifyTverCsvFile(file,config);
      return Promise.resolve(tverFileRecognitionFailure(file,'unknown','UNSUPPORTED_FILE_FORMAT','対応外形式です（.xlsx と .csv のみ使用できます）。'));
    }));
    const settings=inspected.filter(item=>item && item.ok && item.role==='setting');
    const csvs=inspected.filter(item=>item && item.ok && item.role==='csv');
    const unsupported=inspected.filter(item=>item && item.code==='UNSUPPORTED_FILE_FORMAT');
    const unrecognized=inspected.filter(item=>item && !item.ok && item.code!=='UNSUPPORTED_FILE_FORMAT');
    const conflicts=[];
    if(settings.length>1) conflicts.push('setting');
    if(csvs.length>1) conflicts.push('csv');
    const result={
      ok:unsupported.length===0 && unrecognized.length===0 && conflicts.length===0 && settings.length===1 && csvs.length===1,
      files:fileList,inspected,settings,csvs,unsupported,unrecognized,conflicts,
      setting:settings.length===1 && !conflicts.includes('setting') ? settings[0] : null,
      csv:csvs.length===1 && !conflicts.includes('csv') ? csvs[0] : null,
      selectedSheetName:settings.length===1 ? settings[0].selectedSheetName || '' : typeof config.selectedSheetName==='string' ? config.selectedSheetName : '',
      settingValidation:settings.length===1 && !conflicts.includes('setting') ? settings[0].validation : null,
    };
    result.message=buildTverFileRecognitionMessage(result);
    return result;
  }

  // NO030：CP/Sheet 検索の軽量索引。各 Sheet の主業務表ヘッダと CP 列だけを 1 回走査し、
  // 全 Sheet の業務比較（parse + match）は入力のたびに実行しない。
  function buildTverSheetCpIndex(workbook){
    if(!workbook || !Array.isArray(workbook.SheetNames)) return [];
    const entries=[];
    workbook.SheetNames.forEach(sheetName => {
      if(!isVisibleSheet(workbook, sheetName)) return;
      let rows=[];
      try { rows=getSheetRows(workbook, sheetName); } catch(error) { return; }
      let headerRowIndex=-1;
      for(let rowIndex=0; rowIndex<Math.min(rows.length,120); rowIndex+=1){
        const cells=new Set((rows[rowIndex] || []).map(value => String(value ?? '').trim()));
        if(cells.has('発注CPN名') && cells.has('ターゲティング番号')){ headerRowIndex=rowIndex; break; }
      }
      if(headerRowIndex<0) return;
      const headers=(rows[headerRowIndex] || []).map(value => String(value ?? '').trim());
      const columnIndex=name => headers.indexOf(name);
      const cpNameColumn=columnIndex('発注CPN名');
      const appealColumn=columnIndex('CPN訴求');
      const startColumn=columnIndex('開始日時(yyyy/mm/dd hh:mm)');
      const endColumn=columnIndex('終了日時(yyyy/mm/dd hh:mm)');
      if(cpNameColumn<0) return;
      const seen=new Set();
      for(let rowIndex=headerRowIndex+1; rowIndex<rows.length; rowIndex+=1){
        const row=rows[rowIndex] || [];
        if(isSectionBoundary(row)) break;
        const cpName=String(row[cpNameColumn] ?? '').trim();
        if(!cpName) continue;
        const appeal=appealColumn>=0 ? String(row[appealColumn] ?? '').trim() : '';
        const start=startColumn>=0 ? String(row[startColumn] ?? '').trim() : '';
        const end=endColumn>=0 ? String(row[endColumn] ?? '').trim() : '';
        const generatedName=buildCampaignExpectation({ campaignName:cpName, campaignAppeal:appeal, startDateTime:start, endDateTime:end });
        const key=[sheetName, cpName, appeal, start, end].join('|');
        if(seen.has(key)) continue;
        seen.add(key);
        entries.push({ sheetName, cpName, appeal, generatedName:generatedName || '', key, searchText:[sheetName, cpName, appeal, generatedName || ''].join(' ').toLowerCase() });
      }
    });
    return entries;
  }
  // NO030：検索文字列から Sheet 名一致と CP 一致を別項目として返す（同名 CP は Sheet ごとに列挙）。
  function filterTverCpSearchEntries(query, entries, sheetNames){
    const lower=String(query || '').trim().toLowerCase();
    if(!lower) return [];
    const items=[];
    (sheetNames || []).filter(name => String(name).toLowerCase().includes(lower)).forEach(sheetName => {
      items.push({ kind:'sheet', label:'Sheet：'+sheetName, sheetName });
    });
    (entries || []).filter(entry => String(entry.searchText || '').includes(lower)).slice(0,60).forEach(entry => {
      items.push({ kind:'cp', label:'CP：'+entry.cpName+(entry.appeal ? ' / CPN訴求：'+entry.appeal : '')+'（Sheet：'+entry.sheetName+'）', sheetName:entry.sheetName, cpName:entry.cpName, appeal:entry.appeal, generatedName:entry.generatedName });
    });
    return items;
  }

  function filterTverSheetOptions(doc){
    const search=getElement(doc,'setting-sheet-search');
    const select=getElement(doc,'setting-sheet-name');
    if(!select) return 0;
    const query=String(search && search.value || '');
    const selected=select.value;
    let visibleCount=0;
    Array.from(select.options || []).forEach(option=>{
      if(!option.value){ option.hidden=false; return; }
      option.hidden=query!=='' && !option.value.includes(query);
      if(!option.hidden) visibleCount+=1;
    });
    if(selected) select.value=selected;
    const empty=getElement(doc,'setting-sheet-search-empty');
    if(empty) empty.hidden=!(query && visibleCount===0);
    return visibleCount;
  }

  function handleTverSheetSearchKeydown(event, doc){
    if(!event || !['ArrowUp','ArrowDown','Enter'].includes(event.key)) return;
    const search=getElement(doc,'setting-sheet-search');
    const select=getElement(doc,'setting-sheet-name');
    if(!search || !select || String(search.value || '')==='') return;
    const visibleOptions=Array.from(select.options || []).filter(option => option.value && !option.hidden);
    if(!visibleOptions.length){event.preventDefault();return;}
    const currentIndex=visibleOptions.findIndex(option => option.value===select.value);
    if(event.key==='Enter'){
      if(currentIndex>=0) return;
      event.preventDefault();
      select.value=visibleOptions[0].value;
      select.dispatchEvent(new Event('change',{bubbles:true}));
      return;
    }
    const step=event.key==='ArrowDown' ? 1 : -1;
    const nextIndex=currentIndex<0 ? (step>0 ? 0 : visibleOptions.length-1) : Math.max(0,Math.min(visibleOptions.length-1,currentIndex+step));
    event.preventDefault();
    if(nextIndex===currentIndex) return;
    select.value=visibleOptions[nextIndex].value;
    select.dispatchEvent(new Event('change',{bubbles:true}));
  }

  function buildTverUsageLogPayload(run){
    const counts=run && run.statusCounts || {};
    const count=status => Number.isFinite(Number(counts[status])) ? Number(counts[status]) : 0;
    const consistent=count('一致');
    const notation=count('表記ゆれ一致');
    const mismatch=count('不一致');
    const review=count('需确认');
    const unmatched=count('未匹配');
    return {
      tool:'TVer設定チェック',
      diffCount:mismatch + review + unmatched,
      criticalCount:mismatch + unmatched,
      note:`一致:${consistent} 表記ゆれ一致:${notation} 不一致:${mismatch} 需確認:${review} 未匹配:${unmatched}`,
    };
  }

  function recordTverUsage(run){
    if(typeof sendLog!=='function') return;
    const payload=buildTverUsageLogPayload(run);
    try{
      const request=sendLog(payload.tool, payload.diffCount, payload.criticalCount, payload.note);
      if(request && typeof request.then==='function'){
        return request
          .then(result => console.log('✅ TVer使用日志上报结果:', result))
          .catch(error => console.warn('⚠️ TVer使用日志上报失败（不影响QC）:', error));
      }
      return request;
    }catch(error){
      console.warn('⚠️ TVer使用日志上报失败（不影响QC）:', error);
      return undefined;
    }
  }

  function tverAuthAllowed(){
    // FIX6-B: fail-closed. module missing / fn absent / expired / throws -> block.
    if(typeof getValidSession !== 'function') return false;
    try { if(!getValidSession()) return false; } catch(e){ return false; }

  function mergeTverUploadFiles(existing,incoming){
    const newSetting=incoming.some(file=>/\.xlsx$/i.test(file && file.name || ''));
    const newCsv=incoming.some(file=>/\.csv$/i.test(file && file.name || ''));
    const retained=Array.from(existing || []).filter(file=>{
      if(newSetting && /\.xlsx$/i.test(file && file.name || '')) return false;
      if(newCsv && /\.csv$/i.test(file && file.name || '')) return false;
      return true;
    });
    return [...retained,...incoming];
  }

  async function setPageFiles(files, doc, options){
    if(!tverAuthAllowed()){if(typeof checkAuth==='function'){try{checkAuth();}catch(e){}}return {ok:false,message:'AUTH_REQUIRED',files:[],setting:null,csv:null};}
    const incoming=Array.from(files || []).filter(Boolean);
    if(!incoming.length) return {ok:false,message:'ファイルを選択してください。',files:tverPageState.uploadFiles || [],setting:null,csv:null};
    const replacingSetting=incoming.some(file=>/\.xlsx$/i.test(file.name || ''));
    const selectedSheetName=replacingSetting ? '' : tverPageState.selectedSheetName || '';
    if(replacingSetting){const search=getElement(doc,'setting-sheet-search');if(search)search.value='';}
    tverPageState.uploadFiles=mergeTverUploadFiles(tverPageState.uploadFiles,incoming);
    tverPageState.settingFile=null;
    tverPageState.csvFile=null;
    tverPageState.settingWorkbook=null;
    tverPageState.availableSheetNames=replacingSetting ? [] : (tverPageState.availableSheetNames || []);
    tverPageState.selectedSheetName=selectedSheetName;
    tverPageState.selectedSettingValidation=null;
    tverPageState.selectedSettingModel=null;
    tverPageState.recognitionPending=true;
    tverPageState.run=null;
    tverPageState.busy=false;
    tverPageState.runToken=(Number(tverPageState.runToken) || 0)+1;
    tverPageState.recognition={ok:false,files:tverPageState.uploadFiles,setting:null,csv:null,selectedSheetName,settingValidation:null,message:'ファイルを識別しています。'};
    const token=(Number(tverPageState.recognitionToken) || 0)+1;
    tverPageState.recognitionToken=token;
    clearTverResults(doc);
    showPageNotice('',false,doc);
    renderTverFileRecognition(doc);
    updateActionButtons(doc);
    const result=await identifyTverFiles(tverPageState.uploadFiles,{...(options || {}),selectedSheetName});
    if(token!==tverPageState.recognitionToken) return result;
    tverPageState.recognitionPending=false;
    tverPageState.recognition=result;
    tverPageState.settingFile=result.setting && result.setting.file || null;
    tverPageState.csvFile=result.csv && result.csv.file || null;
    tverPageState.settingWorkbook=result.setting && result.setting.workbook || null;
    try { tverPageState.sheetCpIndex=tverPageState.settingWorkbook ? buildTverSheetCpIndex(tverPageState.settingWorkbook) : null; } catch(error) { tverPageState.sheetCpIndex=null; }
    tverPageState.availableSheetNames=result.setting && result.setting.availableSheetNames || [];
    tverPageState.selectedSheetName=result.selectedSheetName || '';
    tverPageState.selectedSettingValidation=result.setting && result.setting.validation || null;
    tverPageState.selectedSettingModel=result.setting && result.setting.model || null;
    result.selectedSheetName=tverPageState.selectedSheetName;
    result.settingValidation=tverPageState.selectedSettingValidation;
    result.message=buildTverFileRecognitionMessage(result);
    renderTverFileRecognition(doc);
    if(result.ok && tverPageState.selectedSettingValidation && !tverPageState.selectedSettingValidation.ok) showPageNotice(tverPageState.selectedSettingValidation.message,Boolean(tverPageState.selectedSheetName),doc);
    else if(!result.ok && result.files.length) showPageNotice(result.message,true,doc);
    else showPageNotice('',false,doc);
    updateActionButtons(doc);
    return result;
  }

  async function readSettingWorkbook(file){
    if(typeof XLSX==='undefined' || !XLSX.read) throw new Error('ローカルSheetJSを読み込めません。');
    const bytes=await file.arrayBuffer();
    return XLSX.read(bytes, { type:'array', cellDates:false });
  }

  async function readCsvFile(file){
    if(typeof file.text==='function') return file.text();
    const bytes=await file.arrayBuffer();
    return new TextDecoder('utf-8').decode(bytes);
  }

  function settingParseBlockingIssue(model){
    return (model && model.diagnostics || []).find(issue => ['SETTING_SHEET_REQUIRED','SETTING_SHEET_NOT_FOUND','SETTING_HEADER_NOT_FOUND','SETTING_HEADER_AMBIGUOUS','SETTING_BUSINESS_HEADER_MISSING','SETTING_BUSINESS_HEADER_DUPLICATE','SETTING_TAG_APPEAL_ALIAS_CONFLICT'].includes(issue.code));
  }

  async function runTverCheck(options){
    if(!tverAuthAllowed()){if(typeof checkAuth==='function'){try{checkAuth();}catch(e){}}return {ok:false,message:'AUTH_REQUIRED'};}
    const config=options || {};
    const doc=config.document===undefined ? (typeof document!=='undefined' ? document : null) : config.document;
    const settingFile=config.settingFile || tverPageState.settingFile;
    const csvFile=config.csvFile || tverPageState.csvFile;
    const directArtifacts=config.settingWorkbook!==undefined || config.csvText!==undefined || config.settingFile!==undefined || config.csvFile!==undefined;
    let selectedSheetName=typeof config.selectedSheetName==='string' ? config.selectedSheetName : directArtifacts ? '' : hasRecognizedTverFiles() ? tverPageState.selectedSheetName : '';
    if(!selectedSheetName){
      const message='参照シート名（必須）を選択してください。';
      showPageNotice(message,true,doc);
      return {ok:false,message,code:'SETTING_SHEET_REQUIRED'};
    }
    if(!directArtifacts && !hasRecognizedTverFiles()){
      const message=tverPageState.recognition && tverPageState.recognition.message || '設定表とCSVの両方を選択してください。';
      showPageNotice(message,true,doc);
      return {ok:false,message};
    }
    if(config.settingWorkbook===undefined && !settingFile || config.csvText===undefined && !csvFile){
      const message='設定表とCSVの両方を選択してください。';
      showPageNotice(message,true,doc);
      return {ok:false,message};
    }
    const runToken=(Number(tverPageState.runToken) || 0)+1;
    tverPageState.runToken=runToken;
    tverPageState.busy=true;
    updateActionButtons(doc);
    showPageNotice('チェックしています。しばらくお待ちください。',false,doc);
    try{
      const workbook=config.settingWorkbook || (config.settingFile ? await readSettingWorkbook(settingFile) : tverPageState.settingWorkbook || await readSettingWorkbook(settingFile));
      const csvText=config.csvText!==undefined ? config.csvText : await readCsvFile(csvFile);
      if(runToken!==tverPageState.runToken) return {ok:false,cancelled:true};
      const settingModel=parseTverSettingWorkbook(workbook,{fileName:config.settingFileName || settingFile && settingFile.name || '',selectedSheetName});
      const settingIssue=settingParseBlockingIssue(settingModel);
      if(settingIssue) throw new Error('設定表または参照シートを確認できません（'+settingIssue.code+'）。');
      const parsedCsv=parseCsvText(csvText,{fileName:config.csvFileName || csvFile && csvFile.name || ''});
      if(!parsedCsv.schema.kind) throw new Error('CSV Schemaを識別できません。');
      if(parsedCsv.parseIssues.some(issue=>issue.code==='CSV_SCHEMA_UNRECOGNIZED')) throw new Error('CSV Schemaを識別できません。');
      const dictionaryState=validateIdDictionaries(getTverIdDictionaries());
      if(!dictionaryState.valid) throw new Error('ID主データの検証に失敗しました。');
      const csvTree=parsedCsv.schema.kind==='edit-with-ids' ? buildEditTree(parsedCsv) : buildRegisterTree(parsedCsv);
      const matching=matchTverEntities(settingModel,csvTree,{schemaKind:parsedCsv.schema.kind,conversionContext:createTverConversionContext(parsedCsv.schema.kind,csvTree)});
      settingModel.comparisonStage=['initial-setting','delivery-check','in-operation'].includes(config.comparisonStage) ? config.comparisonStage : 'unknown';
      const run=buildRunFromModels(settingModel,csvTree,matching,parsedCsv);
      if(runToken!==tverPageState.runToken) return {ok:false,cancelled:true};
      run.inputContext={settingModel,csvTree,parsedCsv,runToken,recognitionToken:tverPageState.recognitionToken,pairs:[]};
      tverPageState.run=run;
      tverPageState.activeLevel='Campaign';
      tverPageState.filters=defaultFilters();
      renderTverRun(run,{document:doc,activeLevel:'Campaign',filters:tverPageState.filters,newLifecycle:true});
      recordTverUsage(run);
      showPageNotice('',false,doc);
      return { ok:true, run };
    }catch(error){
      if(runToken!==tverPageState.runToken) return {ok:false,cancelled:true};
      const message=error && error.message ? error.message : 'チェック中にエラーが発生しました。';
      showPageNotice(message,true,doc);
      return {ok:false,message};
    }finally{
      if(runToken===tverPageState.runToken){tverPageState.busy=false;updateActionButtons(doc);}
    }
  }

  function makeSyntheticExampleRun(){
    const run=buildComparisonRun({ fields:[
      { field:'budget', settingValue:'Synthetic planned value', csvValue:'Synthetic downloaded value', ruleBasis:'strict' },
      { field:'device', settingValue:'SP／PC', csvValue:'android ios pc', ruleBasis:'TVER_260605_DEVICE_SP_PC' },
      { field:'city', settingValue:'Synthetic City', csvValue:'Synthetic City', ruleBasis:'strict' },
      { field:'entity', settingValue:'Synthetic unmatched setting', csvValue:'', ruleBasis:'SYNTHETIC', comparisonStatus:'未匹配' },
    ]});
    run.entries.forEach((entry, index) => { entry.level=index<2?'Campaign':'Ad'; entry.targetName=`Synthetic Target ${index+1}`; entry.reason=entry.conservativeReason || (index===0?'値が一致しません':''); entry.sourceRefs={ setting:{ fileName:'synthetic-setting.xlsx', sheetName:'配信設計', rowNumber:index+2, columnName:entry.field, rawValue:entry.settingRawValue }, csv:{ fileName:'synthetic-download.csv', sheetName:null, rowNumber:index+2, columnName:entry.field, rawValue:entry.csvRawValue } }; });
    run.schemaKind='register-without-ids'; run.businessRole='登録CSV：入稿内容の整合性チェックです。\n管理画面に正しく登録済みであることを証明するものではありません。'; return run;
  }

  function triggerExceptionDownload(csv, options){
    const config=options || {};
    const doc=config.document || (typeof document!=='undefined' ? document : null);
    const BlobCtor=config.BlobCtor || (typeof Blob!=='undefined' ? Blob : null);
    const URLApi=config.URLApi || (typeof URL!=='undefined' ? URL : null);
    const schedule=config.schedule || setTimeout;
    if(!doc || !doc.body || !doc.createElement || !BlobCtor || !URLApi || !URLApi.createObjectURL) return null;
    const blob=new BlobCtor([csv], { type:'text/csv;charset=utf-8' });
    const objectUrl=URLApi.createObjectURL(blob);
    const link=doc.createElement('a');
    link.href=objectUrl;
    link.download=config.fileName || 'tver_check_exceptions.csv';
    doc.body.appendChild(link);
    link.click();
    if(typeof link.remove==='function') link.remove(); else if(link.parentNode) link.parentNode.removeChild(link);
    schedule(() => { if(URLApi.revokeObjectURL) URLApi.revokeObjectURL(objectUrl); }, 1000);
    return objectUrl;
  }

  function safeExportExceptionCsv(doc){
    if(!tverPageState.run || typeof Blob==='undefined' || typeof URL==='undefined' || !URL.createObjectURL){ showPageNotice('CSVを出力できる結果がありません。', true, doc); return; }
    const csv=buildExceptionCsv(tverPageState.run, { filters:tverPageState.filters });
    if(tverPageState.objectUrl && URL.revokeObjectURL) URL.revokeObjectURL(tverPageState.objectUrl);
    const now=new Date(); const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
    tverPageState.objectUrl=triggerExceptionDownload(csv, { document:doc, fileName:`tver_check_exceptions_${stamp}.csv` });
    if(!tverPageState.objectUrl) showPageNotice('この環境ではCSVを出力できません。', true, doc);
  }

  function safeExportTverResultCsv(doc){
    if(!tverAuthAllowed() || !tverPageState.run || tverPageState.busy) return null;
    const csv=buildTverResultCsv(tverPageState.run);
    if(tverPageState.objectUrl && URL.revokeObjectURL) URL.revokeObjectURL(tverPageState.objectUrl);
    const now=new Date();const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
    tverPageState.objectUrl=triggerExceptionDownload(csv,{document:doc,fileName:`tver-check-results-all_${stamp}.csv`});
    if(!tverPageState.objectUrl) showPageNotice('この環境ではCSVを出力できません。',true,doc);
    return tverPageState.objectUrl;
  }

  function clearTverPage(state, options){
    const current=state || tverPageState;
    const config=options || {};
    const revoke=config.revokeObjectUrl || (typeof URL!=='undefined' && URL.revokeObjectURL ? URL.revokeObjectURL.bind(URL) : null);
    if(current.objectUrl && revoke) revoke(current.objectUrl);
    const cleared={settingFile:null,csvFile:null,settingWorkbook:null,sheetCpIndex:null,availableSheetNames:[],selectedSheetName:'',selectedSettingValidation:null,selectedSettingModel:null,recognitionPending:false,uploadFiles:[],recognition:null,recognitionToken:(Number(current.recognitionToken) || 0)+1,runToken:(Number(current.runToken) || 0)+1,run:null,error:'',busy:false,activeLevel:'Campaign',filters:defaultFilters(),objectUrl:null};
    if(!state) tverPageState=cleared;
    const doc=config.document===undefined ? (typeof document!=='undefined' ? document : null) : config.document;
    if(doc){
      const input=getElement(doc,'tver-file-input'); if(input) input.value='';
      ['setting-file-state','csv-file-state'].forEach(id=>{const target=getElement(doc,id);if(target) target.textContent=id==='setting-file-state'?'設定表：未選択':'CSV：未選択';target && target.classList && target.classList.remove('success');});
      const stage=getElement(doc,'comparison-stage');if(stage)stage.value='unknown';
      const sheet=getElement(doc,'setting-sheet-name'); if(sheet){sheet.innerHTML='<option value="" selected>ファイル選択後にSheetを選択</option>';sheet.value='';sheet.disabled=true;}
      const sheetSearch=getElement(doc,'setting-sheet-search'); if(sheetSearch) sheetSearch.value='';
      const sheetSearchEmpty=getElement(doc,'setting-sheet-search-empty'); if(sheetSearchEmpty) sheetSearchEmpty.hidden=true;
      const cpSearchResults=getElement(doc,'setting-cp-search-results'); if(cpSearchResults){cpSearchResults.innerHTML='';cpSearchResults.hidden=true;}
      const recognition=getElement(doc,'upload-recognition-state'); if(recognition){recognition.textContent='.xlsx と .csv を選択してください。';recognition.classList && recognition.classList.remove('success');recognition.classList && recognition.classList.remove('error');}
      const zone=getElement(doc,'tver-upload-zone'); if(zone && zone.classList) zone.classList.remove('drag-over');
      clearTverResults(doc); showPageNotice('',false,doc); updateActionButtons(doc);
    }
    return cleared;
  }

  function selectTverComparisonStage(value,doc){
    if(!['unknown','initial-setting','delivery-check','in-operation'].includes(value)) return {ok:false,code:'COMPARISON_STAGE_NOT_FOUND'};
    tverPageState.runToken++;tverPageState.busy=false;tverPageState.run=null;clearTverResults(doc);
    const stage=getElement(doc,'comparison-stage');if(stage)stage.value=value;updateActionButtons(doc);
    return {ok:true,comparisonStage:value};
  }

  function bindTverPage(){
    if(typeof document==='undefined') return;
    const input=getElement(document,'tver-file-input');
    const zone=getElement(document,'tver-upload-zone');
    if(input && zone){
      input.addEventListener && input.addEventListener('change',event=>setPageFiles(event.target.files,document));
      ['dragenter','dragover'].forEach(eventName=>zone.addEventListener && zone.addEventListener(eventName,event=>{event.preventDefault();zone.classList && zone.classList.add('drag-over');}));
      ['dragleave','drop'].forEach(eventName=>zone.addEventListener && zone.addEventListener(eventName,event=>{event.preventDefault();zone.classList && zone.classList.remove('drag-over');}));
      zone.addEventListener && zone.addEventListener('drop',event=>setPageFiles(event.dataTransfer && event.dataTransfer.files,document));
    }
    const sheetSearch=getElement(document,'setting-sheet-search'); if(sheetSearch){sheetSearch.addEventListener && sheetSearch.addEventListener('input',()=>{filterTverSheetOptions(document);renderTverCpSearchResults(document);});sheetSearch.addEventListener && sheetSearch.addEventListener('keydown',event=>{const container=getElement(document,'setting-cp-search-results');if(!container||container.hidden)return;const first=container.querySelector('button[data-sheet]');if(!first)return;if(event.key==='Enter'){event.preventDefault();first.click();}else if(event.key==='ArrowDown'){event.preventDefault();first.focus();}});}const cpResults=getElement(document,'setting-cp-search-results'); if(cpResults) cpResults.addEventListener && cpResults.addEventListener('click',event=>{const target=event.target;const button=target&&typeof target.closest==='function'?target.closest('button[data-sheet]'):null;if(!button)return;selectTverSearchResult(document,button.getAttribute('data-sheet'));});
    const sheet=getElement(document,'setting-sheet-name'); if(sheet){sheet.addEventListener && sheet.addEventListener('change',event=>selectTverSheet(event.target.value,document));sheet.addEventListener && sheet.addEventListener('keydown',event=>handleTverSheetSearchKeydown(event,document));}
    const stage=getElement(document,'comparison-stage');
    if(stage) stage.addEventListener('change',event=>selectTverComparisonStage(event.target.value,document));
    const coveragePanel=getElement(document,'tver-result-summary');
    if(coveragePanel) coveragePanel.addEventListener('click',event=>{if(event.target && event.target.getAttribute && event.target.getAttribute('data-action')==='export-results-all'){safeExportTverResultCsv(document);return;}if(event.target && event.target.getAttribute && event.target.getAttribute('data-action')==='confirm-manual-mapping'){const result=confirmTverManualMappings(document);if(!result.ok)showPageNotice(result.code,true,document);return;}if(event.target && event.target.getAttribute && event.target.getAttribute('data-action')==='export-coverage' && isTverLocalAcceptanceMode() && tverPageState.run) triggerExceptionDownload(buildTverCoverageCsv(tverPageState.run),{fileName:'tver-field-coverage.csv',document});});
    const runButton=getElement(document,'run-check'); if(runButton) runButton.addEventListener('click',()=>runTverCheck({selectedSheetName:tverPageState.selectedSheetName,comparisonStage:'unknown'}));
    const resetButton=getElement(document,'reset-check'); if(resetButton) resetButton.addEventListener('click',()=>clearTverPage());
    updateActionButtons(document);
  }

  bindTverPage();
  })();
  </script>
