      creative:creative ? (creative.state==='ambiguous' ? { state:'ambiguous', value:null, mappings:creative.mappings, sourceRef:sourceRefs.materialName || null, derivedFrom:creativeDerivedFrom } : { state:'unique', fileName:creative.fileName, sourceRef:creative.sourceRefs.fileName, derivedFrom:creativeDerivedFrom }) : { ...missing('SETTING_CREATIVE_NOT_FOUND', sourceRefs.materialName), derivedFrom:creativeDerivedFrom },
      landingPage:resolvedLandingPage,
      tracking,
      creativeId:{ state:'setting-source-not-provided', value:null },
    };
  }

  function buildEvidenceBlocks(rows, fileName, sheetName){
    const evidenceBlocks={ changeHistory:[], operationMemo:[], otherSettings:[] };
    rows.forEach((row, rowIndex) => {
      const markerColumn=(row || []).findIndex(value => String(value ?? '').trim()==='▼運用メモ欄');
      if(markerColumn===-1) return;
      let foundValue=false;
      for(let columnIndex=markerColumn+1; columnIndex<(row || []).length; columnIndex+=1){
        const rawValue=String(row[columnIndex] ?? '');
        if(rawValue==='') continue;
        evidenceBlocks.operationMemo.push(makeSettingSource(fileName, sheetName, rowIndex+1, '▼運用メモ欄', rawValue));
        foundValue=true;
      }
      if(!foundValue) evidenceBlocks.operationMemo.push(makeSettingSource(fileName, sheetName, rowIndex+1, '▼運用メモ欄', row[markerColumn]));
    });
    const section=locateSection(rows, '変更履歴');
    if(!section) return evidenceBlocks;
    for(let rowIndex=section.rowIndex+1; rowIndex<section.endRowIndex; rowIndex+=1){
      const headers=blockHeaderIndex(rows[rowIndex]);
      if(!['変更履歴', '運用メモ', 'その他設定'].some(header => headers[header]!==undefined)) continue;
      for(let dataRowIndex=rowIndex+1; dataRowIndex<section.endRowIndex; dataRowIndex+=1){
        const dataRow=rows[dataRowIndex] || [];
        if(!dataRow.some(value => String(value ?? '')!=='')) continue;
        if(headers['変更履歴']!==undefined) evidenceBlocks.changeHistory.push(blockSource(fileName, sheetName, dataRowIndex+1, '変更履歴', dataRow, headers));
        if(headers['運用メモ']!==undefined) evidenceBlocks.operationMemo.push(blockSource(fileName, sheetName, dataRowIndex+1, '運用メモ', dataRow, headers));
        if(headers['その他設定']!==undefined) evidenceBlocks.otherSettings.push(blockSource(fileName, sheetName, dataRowIndex+1, 'その他設定', dataRow, headers));
      }
      break;
    }
    return evidenceBlocks;
  }

  function campaignDateCode(value, includeYear){
    const match=String(value ?? '').match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if(!match) return null;
    const month=match[2].padStart(2, '0');
    const day=match[3].padStart(2, '0');
    return includeYear ? `${match[1].slice(-2)}${month}${day}` : `${month}${day}`;
  }

  function buildCampaignExpectation(fields){
    const start=campaignDateCode(fields.startDateTime, true);
    const end=campaignDateCode(fields.endDateTime, false);
    if(!fields.campaignName || !start || !end) return null;
    return `${fields.campaignName}_${start}-${end}${fields.campaignAppeal ? `_${fields.campaignAppeal}` : ''}`;
  }

  function addCampaignDailyBudgetSource(campaign, source){
    if(!campaign || !source) return;
    const fields=campaign.sourceEvidence && campaign.sourceEvidence.fields || (campaign.sourceEvidence={ fields:{} }).fields;
    const evidence=Array.isArray(fields.initialDailyBudget) ? fields.initialDailyBudget : [];
    if(!evidence.some(item => item.fileName===source.fileName && item.sheetName===source.sheetName && item.rowNumber===source.rowNumber && item.columnName===source.columnName)) evidence.push(source);
    fields.initialDailyBudget=uniqueSourceRefs(evidence);
    const values=[...new Set(fields.initialDailyBudget.map(item => String(item.rawValue ?? '').trim()).filter(Boolean))];
    campaign.fieldStates={ ...(campaign.fieldStates || {}), initialDailyBudget:values.length===0 ? 'missing' : values.length===1 ? 'available' : 'ambiguous' };
    if(values.length===1){
      campaign.fields.initialDailyBudget=values[0];
      campaign.sourceRefs.initialDailyBudget=fields.initialDailyBudget.find(item => String(item.rawValue ?? '').trim()===values[0]) || null;
    }else if(values.length>1){
      campaign.fields.initialDailyBudget=values.join(' / ');
      campaign.sourceRefs.initialDailyBudget=null;
    }else{
      campaign.fields.initialDailyBudget='';
      campaign.sourceRefs.initialDailyBudget=fields.initialDailyBudget[0] || null;
    }
  }

  const campaignBudgetSourceEvidenceByCampaign=new WeakMap();
  function addCampaignBudgetSource(campaign, source){
    if(!campaign || !source) return;
    const evidence=campaignBudgetSourceEvidenceByCampaign.get(campaign) || [];
    if(!evidence.some(item=>item.fileName===source.fileName && item.sheetName===source.sheetName && item.rowNumber===source.rowNumber && item.columnName===source.columnName)) evidence.push(source);
    campaignBudgetSourceEvidenceByCampaign.set(campaign,evidence);
    const rawValues=evidence.map(item=>String(item.rawValue ?? '').trim());
    const nonEmpty=rawValues.filter(value=>value!=='');
    const uniqueValues=[...new Set(nonEmpty)];
    const hasBlank=rawValues.some(value=>value==='');
    const ambiguous=evidence.length>1 && (uniqueValues.length>1 || (hasBlank && nonEmpty.length>0));
    // Keep the historical single-value evidence shape. Expand evidence only when conflicting rows require review.
    if(!ambiguous) return;
    const fields=campaign.sourceEvidence && campaign.sourceEvidence.fields || (campaign.sourceEvidence={fields:{}}).fields;
    fields.campaignBudget=uniqueSourceRefs(evidence);
    campaign.fieldStates={...(campaign.fieldStates || {}),campaignBudget:'ambiguous'};
    campaign.fields.campaignBudget=rawValues.join(' / ');
    campaign.sourceRefs.campaignBudget=null;
  }

  function appendTverSurveySpModel(model, rows, fileName, sheetName, businessHeaderIndex){
    const section=locateSection(rows, 'TVerSurvey');
    if(!section) return;
    const issues=[];
    model.surveyDiagnostics=issues;
    const cell=(r,c,label)=>({ ...makeSettingSource(fileName,sheetName,r+1,label,(rows[r] || [])[c]), columnNumber:c+1 });
    const scan=(label,start,end)=>{
      const found=[];
      for(let r=start;r<end;r+=1) (rows[r] || []).forEach((v,c)=>{ if(String(v ?? '').trim()===label) found.push({r,c}); });
      return found;
    };
    const issue=(code,sources)=>{
      const item={code,sheetName,sourceRefs:uniqueSourceRefs(sources || [])};
      issues.push(item); model.diagnostics.push(item);
    };
    const pair=(label,start,end)=>{
      const found=scan(label,start,end);
      const sources=found.map(({r,c})=>cell(r,c+1,label));
      const values=[...new Set(sources.map(s=>String(s.rawValue).trim()))];
      return { value:values.length===1 ? values[0] : null, sources, found };
    };
    const basic=locateSection(rows,'基本情報');
    const enabled=pair('TVerSurvey',basic ? basic.rowIndex+1 : 0,businessHeaderIndex);
    const oldMarker=scan('旧システム',section.rowIndex+1,section.endRowIndex)[0];
    const newEnd=oldMarker ? oldMarker.r : section.endRowIndex;
    const tap=pair('新TAP',section.rowIndex+1,newEnd);
    const oldEnabled=oldMarker && scan('SP',oldMarker.r+1,section.endRowIndex).some(({r,c})=>String((rows[r] || [])[c+1]).trim()==='あり');
    const ctvEnabled=scan('CTV',section.rowIndex+1,section.endRowIndex).some(({r,c})=>String((rows[r] || [])[c+1]).trim()==='あり');
    if(oldEnabled || ctvEnabled) issue('SURVEY_CTV_OR_LEGACY_DEFERRED',[]);
    if(enabled.value!=='あり' || tap.value!=='あり'){
      if(tap.value==='あり' || enabled.value==='あり') issue('SURVEY_ENABLE_OR_VERSION_UNCONFIRMED',[...enabled.sources,...tap.sources]);
      return;
    }
    const tapRow=tap.found[0];
    const sp=scan('SP',tapRow.r+1,newEnd).filter(({r,c})=>String((rows[r] || [])[c+1]).trim()==='接触者');

  // 独立CTV合同：标签定位；Segment/ASR/Device/Price不参与实体身份识别。

      ['url','tracking_url_start','tracking_url_first_quartile','tracking_url_midpoint','tracking_url_third_quartile','tracking_url_complete'].forEach(field=>{adContracts[field]={...rule(field,'',70),notRequired:true};});

  // NO016: 業務確認済み GP 構造（GP = 親CP + Targeting + Device、1 GP に複数 Creative）。
  // 設定表が「Creative 行ごとに 1 Group」で生成されている場合、同一 GP キーの行を 1 GP へ統合する。
  // 統合は設定モデル内の論理構造のみ。CSV 側の実グループ ID は生成しない。
  function tverSettingGpBucketKey(group){
    const targeting=group && group.fields && group.fields.targeting || {};
    const targetingValues=['targetingNumber','auction_type','device','media','dataAccumulation','gender','age','region','audience','uid_suffix','genre','subgenre','bidSegment','segment','otherSettings','adOtherSettings'].map(key=>String(targeting[key] ?? ''));
    const device=String((group && group.fields && group.fields.rowDevice) ?? '').trim();
    return JSON.stringify([group && group.parentKey || '', targetingValues, device]);
  }
  function consolidateTverSettingGpStructure(model){
    if(!model || !Array.isArray(model.adGroups) || !Array.isArray(model.ads)) return model;
    const adsByParent=new Map();
    model.ads.forEach(ad=>{ const list=adsByParent.get(ad.parentKey) || []; list.push(ad); adsByParent.set(ad.parentKey,list); });
    const buckets=new Map();
    model.adGroups.forEach(group=>{
      if(!group || group.businessType) return;
      const ads=adsByParent.get(group.key) || [];
      if(ads.length!==1) return;
      const creative=String(ads[0].expectedName || '').trim();
      if(!creative) return;
      const key=tverSettingGpBucketKey(group);
      const bucket=buckets.get(key) || [];
      bucket.push({group,ads,creative});
      buckets.set(key,bucket);
    });
    const removed=new Set(), mergedGroups=[], consolidation=[];
    buckets.forEach((members,key)=>{
      if(members.length<2) return;
      const creatives=members.map(member=>member.creative);
      if(new Set(creatives).size!==creatives.length) return; // 同一GP内Creative名重複は自動統合しない
      const base=members[0].group;
      // NO017: a shared bucket is not permission to discard independent identity evidence.
      const distinct=read=>new Set(members.map(member=>String(read(member.group) ?? '')).filter(value=>value!=='')).size>1;
      const deviceValues=members.map(member=>resolveSettingAdGroupDevice(member.group));
      const rowDeviceConflict=members.some(({group})=>{
        const row=group.rowFields && group.rowFields.device;
        if(!row || row.state==='column-absent')return false;
        const rowValue=canonicalizeTverExplicitDevice(row.rawValue),identityValue=canonicalizeTverExplicitDevice(group.fields && group.fields.rowDevice);
        return row.state!=='available' || rowValue.state!=='known' || rowValue.value!==identityValue.value
          || (row.sources || []).some(source=>String(source.rawValue)!==String(row.rawValue));
      });
      const identityConflict=rowDeviceConflict || distinct(group=>group.expectedName)
        || distinct(group=>group.fields && group.fields.adgroup_id)
        || distinct(group=>group.displayIdentity && group.displayIdentity.targetingName)
        || deviceValues.some(value=>!value.resolved)
        || new Set(deviceValues.map(value=>value.device)).size!==1;
      if(identityConflict){
        const reason=identityConflict ? 'SETTING_GP_IDENTITY_CONFLICT' : 'SETTING_GP_ROW_CARDINALITY_UNCONFIRMED';
        members.forEach(member=>{member.group.gpMergeIssue=reason;});
        return;
      }
      const allAds=members.flatMap(member=>member.ads).sort((left,right)=>{
        const leftRow=left.sourceRefs && left.sourceRefs.creativeFileName ? Number(left.sourceRefs.creativeFileName.rowNumber)||0 : 0;
        const rightRow=right.sourceRefs && right.sourceRefs.creativeFileName ? Number(right.sourceRefs.creativeFileName.rowNumber)||0 : 0;
        return leftRow-rightRow;
      });
      const mergedKey='adgroup-gp:'+key;
      const gpRows=members.map(member=>{
        const group=member.group, refs=group.sourceRefs || {};
        const rowSource=['rowDevice','targetingNumber','tagAppeal','device'].map(name=>refs[name]).find(source=>source && source.rowNumber!==null && source.rowNumber!==undefined) || null;
        return {settingKey:group.key, rowNumber:rowSource?rowSource.rowNumber:null, creative:member.creative,
          tagAppeal:String(group.fields&&group.fields.tagAppeal||''), startDateTime:String(group.fields&&group.fields.startDateTime||''),
          endDateTime:String(group.fields&&group.fields.endDateTime||''),
          fields:group.fields, rowFields:group.rowFields, sourceRefs:group.sourceRefs, sourceEvidence:group.sourceEvidence };
      });
      const fieldConflicts={},rowFields={},fieldEvidence={};
      const aliases={startDateTime:'adgroup_start_datetime',endDateTime:'adgroup_end_datetime',videoDuration:'tver_video_duration',region:'pref',segment:'dmp_segment'};
      const names=new Set(members.flatMap(({group})=>[...Object.keys(group.fields || {}),...Object.keys(group.fields && group.fields.targeting || {}),...Object.keys(group.rowFields || {})]));
      // Tag appeal and adOtherSettings belong to the Creative binding, not a GP common expectation.
      ['targeting','tagAppeal','adOtherSettings','rowDevice','targetingNumber'].forEach(field=>names.delete(field));
      names.forEach(name=>{
        const field=aliases[name] || name;
        const rows=members.map(({group})=>{
          const row=group.rowFields && group.rowFields[field];
          const explicit=row && row.state!=='column-absent';
          const value=explicit ? row.state==='conflict' ? row.rawValues : [row.rawValue]
            : [(group.fields && group.fields[name]) ?? (group.fields && group.fields.targeting || {})[name] ?? ''];
          const sources=explicit ? row.sources : uniqueSourceRefs([...(group.sourceEvidence && group.sourceEvidence.fields && group.sourceEvidence.fields[name] || []),group.sourceRefs && group.sourceRefs[name]]);
          return {values:value.map(value=>String(value ?? '')),sources:sources || []};
        });
        const values=[...new Set(rows.flatMap(row=>row.values))],sources=uniqueSourceRefs(rows.flatMap(row=>row.sources));
        fieldEvidence[field]=sources;
        if(values.length>1)fieldConflicts[field]={field,values,sources,rowNumbers:gpRows.map(row=>row.rowNumber)};
      });
      members.forEach(({group})=>Object.entries(group.rowFields || {}).forEach(([field,row])=>mergeTverSettingRowField(rowFields,field,{...row,sources:[...(row.sources || [])]})));
      const sourceFields={};
      members.forEach(({group})=>Object.entries(group.sourceEvidence && group.sourceEvidence.fields || {}).forEach(([field,sources])=>{sourceFields[field]=uniqueSourceRefs([...(sourceFields[field] || []),...sources]);}));
      const mergedGroup={ ...base, key:mergedKey, parentKey:base.parentKey,
        fields:{ ...(base.fields || {}) }, displayIdentity:base.displayIdentity, sourceRefs:{ ...(base.sourceRefs || {}) },
        gpIdentity:{ parentKey:base.parentKey, bucketKey:key, logical:true, rowDevice:String(base.fields && base.fields.rowDevice || ''),
          targetingName:String(base.displayIdentity && base.displayIdentity.targetingName || '') },
        gpConsolidatedFrom:members.map(member=>member.group.key),
        gpMergeIssue:members.length!==2 ? 'SETTING_GP_ROW_CARDINALITY_UNCONFIRMED' : null,
        rowFields, sourceEvidence:{...(base.sourceEvidence || {}),fields:sourceFields,rowFields},
        gpRows, gpFieldEvidence:fieldEvidence, gpFieldConflicts:fieldConflicts };
      allAds.forEach(ad=>{ ad.parentKey=mergedKey; });
      members.forEach(member=>removed.add(member.group.key));
      mergedGroups.push({group:mergedGroup, firstIndex:model.adGroups.indexOf(base)});
      consolidation.push({mergedKey, logical:true, csvGroupIdProvided:false, parentKey:base.parentKey,
        targetingName:String(base.displayIdentity && base.displayIdentity.targetingName || ''),
        rowDevice:String(base.fields && base.fields.rowDevice || ''),
        creatives, settingRows:gpRows.map(row=>row.rowNumber).sort((a,b)=>a-b), adCount:allAds.length});
    });
    if(!mergedGroups.length) return model;
    mergedGroups.sort((left,right)=>left.firstIndex-right.firstIndex);
    const mergedByFirstIndex=new Map(mergedGroups.map(item=>[item.firstIndex, item.group]));
    const ordered=[];
    model.adGroups.forEach((group,index)=>{
      if(mergedByFirstIndex.has(index)){ ordered.push(mergedByFirstIndex.get(index)); return; }
      if(removed.has(group.key)) return;
      ordered.push(group);
    });
    model.adGroups=ordered;
    model.gpConsolidation=consolidation;
    return model;
  }

  function parseTverSettingWorkbook(workbook, options){
    const fileName=options && options.fileName ? options.fileName : '';
    const explicitSheetName=options && typeof options.selectedSheetName==='string' ? options.selectedSheetName : '';
    const visibleSheets=workbook && Array.isArray(workbook.SheetNames) ? workbook.SheetNames.filter(sheetName=>isVisibleSheet(workbook,sheetName)) : [];
    const selectedSheetName=explicitSheetName;
    const found=findSettingHeaderCandidates(workbook,{maxRows:100,selectedSheetName});
    if(found.diagnostics && found.diagnostics.length) return emptySettingModel(found.diagnostics);
    if(found.candidates.length===0) return emptySettingModel([{code:'SETTING_HEADER_NOT_FOUND',message:'発注CPN名 と ターゲティング番号 を含む表頭がありません'}]);
    if(!selectedSheetName) return emptySettingModel([{code:'SETTING_SHEET_REQUIRED'}]);
    if(found.candidates.length!==1) return emptySettingModel([{code:'SETTING_HEADER_AMBIGUOUS',message:'選択したSheet内に表頭候補が複数あります',candidates:found.candidates}]);

    const candidate=found.candidates[0];
    const templateFormat=detectTverSettingTemplateFormat(candidate.headers);
    const rows=getSheetRows(workbook, candidate.sheetName);
    const headerIndex={};
    const headerCounts={};
    candidate.headers.forEach((header, index) => {
      const text=String(header ?? '').trim();
      if(!text) return;
      headerCounts[text]=(headerCounts[text] || 0)+1;
      if(headerIndex[text]===undefined) headerIndex[text]=index;
    });
    const duplicateBusinessHeaders=[...new Set([...SETTING_BUSINESS_HEADERS,...SETTING_OPTIONAL_ALIAS_HEADERS].filter(header => headerCounts[header]>1))];
    if(duplicateBusinessHeaders.length){
      const duplicateFields=duplicateBusinessHeaders.map(header=>{
        const columns=candidate.headers.map((value,index)=>String(value ?? '').trim()===header ? index : -1).filter(index=>index>=0);
        const sources=[];
        for(let sourceRowIndex=candidate.rowIndex+1;sourceRowIndex<rows.length;sourceRowIndex+=1){
          const sourceRow=rows[sourceRowIndex] || [];
          if(isSectionBoundary(sourceRow)) break;
          if(!sourceRow.some(value=>String(value ?? '').trim()!=='')) continue;
          columns.forEach(columnIndex=>{
            const source=makeSettingSource(fileName,candidate.sheetName,sourceRowIndex+1,header,sourceRow[columnIndex]);
            source.columnNumber=columnIndex+1;
            sources.push(source);
          });
        }
        return {field:SETTING_HEADER_FIELD_NAMES[header] || header,header,columns:columns.map(columnIndex=>({columnNumber:columnIndex+1,rawHeader:String(candidate.headers[columnIndex] ?? '')})),sources};
      });

    }
    const presentTagAppealHeaders=[SETTING_TAG_APPEAL_LEGACY_HEADER,SETTING_TAG_APPEAL_PRIMARY_HEADER,...SETTING_TAG_APPEAL_SECONDARY_HEADERS]

        const sourceRow=rows[sourceRowIndex] || [];
        if(isSectionBoundary(sourceRow)) break;

        presentTagAppealHeaders.forEach(header=>{
          const columnNumber=headerIndex[header]+1;
          const source=makeSettingSource(fileName,candidate.sheetName,sourceRowIndex+1,header,sourceRow[columnNumber-1]);
          source.columnNumber=columnNumber;
          sources.push(source);

    }

      return headerIndex[header]===undefined;

      measurementTagTagSetUsage:tagSetUsage,
      evidenceBlocks:buildEvidenceBlocks(rows, fileName, candidate.sheetName),
    };
     const fieldHeaders={ campaignName:'発注CPN名', campaignAppeal:'CPN訴求', campaignBudget:'CPN予算', startDateTime:'開始日時(yyyy/mm/dd hh:mm)', endDateTime:'終了日時(yyyy/mm/dd hh:mm)', initialDailyBudget:'初期設定日予算', otherSettings:'その他設定', changeHistory:'変更履歴' };
     const campaignContractValues=findSettingCvValues(rows, fileName, candidate.sheetName, candidate.rowIndex);

      };
      const creativeDerivedFrom=creative && creative.state==='unique' ? uniqueSourceRefs([adSourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.fileName]) : [];
      const landingPageDerivedFrom=creative && creative.state==='unique' ? uniqueSourceRefs([adSourceRefs.landingPageName, adSourceRefs.materialName, creative.sourceRefs.materialName, creative.sourceRefs.landingPageUrl]) : [];
      const ad={
        key:`${adGroup.key}|material:${materialName}|row:${rowNumber}`, level:'Ad', parentKey:adGroup.key,
        fields:{ materialName, landingPageName, tagAppeal:String(row[headerIndex[tagAppealHeader]] ?? ''), creativeFileName:creative && creative.state==='unique' ? creative.fileName : null, landingPageUrl:creative && creative.state==='unique' ? creative.landingPageUrl : null }, rowFields:adRowFields,
        sourceRefs:adSourceRefs,
        sourceEvidence:{ fields:Object.fromEntries(Object.entries(adSourceRefs).map(([field, source]) => [field, uniqueSourceRefs([source])])), rowFields:adRowFields, derived:{ creativeFileName:{ derivedFrom:creativeDerivedFrom, primarySource:adSourceRefs.creativeFileName || null }, landingPageUrl:{ derivedFrom:landingPageDerivedFrom, primarySource:adSourceRefs.landingPageUrl || null } } },
        expectedName:creative && creative.state==='unique' ? deriveTverCreativeName(creative.fileName) : null, nameRuleId:'TVER_260605_AD_CREATIVE_LINK', nameComponents:{ materialName, creativeFileName:creative && creative.state==='unique' ? creative.fileName : null },
      };
      if(startTagIndex){
        const column=headerIndex[SETTING_TAG_APPEAL_SECONDARY_HEADERS[0]];
        const appealSource={ ...makeSettingSource(fileName,candidate.sheetName,rowNumber,SETTING_TAG_APPEAL_SECONDARY_HEADERS[0],(physicalRows[rowIndex] || [])[column] ?? ''),columnNumber:column+1 };
        ad.trackingStart={appealSource,mapping:startTagIndex.get(String(appealSource.rawValue).trim()) || null};
      }
      ad.trackingQuartiles={};
      [['tracking_url_first_quartile','25%'],['tracking_url_midpoint','50%'],['tracking_url_third_quartile','75%']].forEach(([field,point])=>{
        const header='タグ訴求('+point+')',column=headerIndex[header];
        if(column!==undefined) ad.trackingQuartiles[field]={appealSource:makeSettingCellSource(fileName,candidate.sheetName,rowNumber,header,column,row[column] ?? '',workbook)};
      });
      ads.push(ad);
    }
    const model={ campaigns, adGroups, ads, diagnostics, sourceIndex, selectedSheetName:candidate.sheetName, templateFormat, templateVersion:'260605' };
    model.coverageFacts=readTverCoverageFacts(rows,fileName,candidate.sheetName,workbook);
    const ctvHandled=appendTverSurveyCtvModel(model,rows,fileName,candidate.sheetName,candidate.rowIndex);
    if(!ctvHandled){
      appendTverSurveySpModel(model,rows,fileName,candidate.sheetName,candidate.rowIndex);
      attachTverOrdinarySurveySpContext(model,rows,fileName,candidate.sheetName,candidate.rowIndex);
    }
    // NO016: 業務確認済みGP構造へ統合（CP+Targeting+Device、1GP複数Creative）。
    consolidateTverSettingGpStructure(model);
    return model;
  }

  // FIX4-C：只建立通常SP的P56证据链，不修改已验收的BLS角色合同。
  function attachTverOrdinarySurveySpContext(model,rows,fileName,sheetName,headerIndex){
    const section=locateSection(rows,'TVerSurvey');
    if(!section) return;
    const read=(label,start,end,offset=1)=>{
      const sources=[];
      for(let r=start;r<end;r+=1) (rows[r] || []).forEach((v,c)=>{
        if(String(v ?? '').trim()===label) sources.push({...makeSettingSource(fileName,sheetName,r+1,label,(rows[r] || [])[c+offset]),columnNumber:c+offset+1});
      });
      const values=[...new Set(sources.map(s=>String(s.rawValue).trim()))];
      return {sources,value:values.length===1 ? values[0] : null};
    };
    const basic=locateSection(rows,'基本情報');
    const enabled=read('TVerSurvey',basic ? basic.rowIndex+1 : 0,headerIndex);
    const legacy=rows.findIndex((row,r)=>r>section.rowIndex && r<section.endRowIndex && row.some(v=>String(v).trim()==='旧システム'));
    const end=legacy<0 ? section.endRowIndex : legacy;
    const tap=read('新TAP',section.rowIndex+1,end);
    // 明确关闭不扩展旧版/CTV规则；矛盾来源保留review。
    if(enabled.value==='なし' && tap.value!=='あり' || tap.value==='なし') return;
    if(![...enabled.sources,...tap.sources].some(s=>String(s.rawValue).trim()==='あり')) return;
    const sp=read('SP',section.rowIndex+1,end);
    const ctv=read('CTV',section.rowIndex+1,end);
    if(!sp.sources.length && ctv.sources.some(s=>['あり','接触者'].includes(String(s.rawValue).trim()))
      && ctv.sources.every(s=>['あり','接触者','非接触者'].includes(String(s.rawValue).trim()))) return;
    const contactSp=sp.sources.filter(s=>String(s.rawValue).trim()==='接触者');
    const scenario=read('シナリオ',section.rowIndex+1,end,2);
    const hint=read('BLSキャンペーン名',section.rowIndex+1,end);
    const date=read('アンケート開始日',section.rowIndex+1,end);
    const dateParts=String(date.value || '').match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
    const stamp=dateParts ? dateParts[1].slice(2)+dateParts[2].padStart(2,'0')+dateParts[3].padStart(2,'0') : '';
    const ordinary=model.campaigns.filter(c=>!c.businessType);
    const parents=ordinary.filter(c=>hint.sources.length
      ? hint.value===`${c.fields.campaignName}_${stamp}` || model.campaigns.some(s=>s.businessType==='survey-sp' && s.surveyParentKey===c.key && s.expectedName===hint.value)
      : true);
    const reason=enabled.value!=='あり' || tap.value!=='あり' ? 'SURVEY_ENABLE_OR_VERSION_UNCONFIRMED'
      : contactSp.length!==1 || sp.sources.some(s=>!['接触者','非接触者'].includes(String(s.rawValue).trim())) ? 'SURVEY_SP_DEVICE_OR_ROLE_UNCONFIRMED'
      : parents.length!==1 ? 'SURVEY_PARENT_CAMPAIGN_NOT_UNIQUE'
      : scenario.sources.length!==1 || !isValidTverId(scenario.value) ? 'SURVEY_CONTACT_SEGMENT_UNCONFIRMED' : null;
    const sources=uniqueSourceRefs([...enabled.sources,...tap.sources,...sp.sources,...ctv.sources,...scenario.sources,...hint.sources,...date.sources]);
    const candidateParentKeys=parents.map(parent=>parent.key);
    if(parents.length!==1) model.diagnostics.push({
      code:'SURVEY_NORMAL_SP_PARENT_SCOPE_UNCONFIRMED',reasonCode:'SURVEY_PARENT_CAMPAIGN_NOT_UNIQUE',comparisonStatus:'需确认',
      message:`Survey親Campaignの関連付けが未確認です（候補${parents.length}件）。${parents.length ? '候補以外の通常GPにはSurveyチェックを適用しません。' : '通常GPの元の比較結果を保持しています。設定表の親Campaign指定を確認してください。'}`,
      candidateParentKeys:[...candidateParentKeys],sourceRefs:uniqueSourceRefs([...sources,...parents.map(parent=>parent.sourceRefs.campaignName)]),
    });
    model.adGroups.filter(g=>!g.businessType && candidateParentKeys.includes(g.parentKey)).forEach(g=>{
      const device=resolveSettingAdGroupDevice(g);
      if(device.resolved && device.device==='ctv') return;
      // 清单SP/PC虽不能决定既有通用Device值，仍能证明“含SP”；未知row-level/Tag不得回退。
      const fields=g.fields || {};
      const listHasSp=!fields.rowDevice && !fields.tagAppeal && parseTverDeviceSet(fields.targeting && fields.targeting.device).has('sp');
      const mobile=device.resolved && String(device.device).split(' ').some(d=>['android','ios'].includes(d)) || listHasSp;
      g.ordinarySurveySpContext={candidateParentKeys:[...candidateParentKeys],segmentId:scenario.value,sources:uniqueSourceRefs([...sources,...(device.sourceEvidence || [])]),
        reason:reason || (!mobile ? 'SURVEY_NORMAL_SP_DEVICE_APPLICABILITY_UNCONFIRMED' : null)};
    });
  }

  // FIX1：创建与消费context均按候选父CP限定，拒绝遗留/错误挂载的跨CP上下文。
  function isTverOrdinarySurveySpScopedGp(setting){
    const context=setting && setting.ordinarySurveySpContext;
    return Boolean(setting && setting.level==='Ad Group' && !setting.businessType && context
      && Array.isArray(context.candidateParentKeys) && context.candidateParentKeys.includes(setting.parentKey));
  }

  function isValidTverId(value){
    return /^\d+$/.test(String(value ?? '').trim());
  }

  function addEntityConflict(entity, diagnostics, code, field, previousValue, nextValue, rowNumber){
    if(previousValue===nextValue) return;
    const issue={ code, field, previousValue, nextValue, rowNumber };
    entity.conflictIssues.push(issue);
    diagnostics.push({ ...issue, entityKey:entity.key });
  }

  function makeCsvEntity(key, level, fields, source, parentKey){
    return {
      key, level, id:fields.id || null, parentKey:parentKey || null, fields,
      sourceRefs:{ csv:source }, rawRows:[], occurrenceIndex:null,
      conflictIssues:[], validationIssues:[], matchable:true, orphanReason:null,
    };
  }

  const CAMPAIGN_FIELDS = [
    'campaign_name', 'start_datetime', 'end_datetime', 'budget', 'daily_budget', 'hourly_bid_weight',
    'campaign_status', 'consumption_type', 'cv_point', 'report_target_flag',
  ];
  const ADGROUP_FIELDS = [
    'adgroup_name', 'adgroup_start_datetime', 'adgroup_end_datetime', 'daily_freq_cap', 'auction_type',
    'price', 'adgroup_status', 'device', 'media', 'local_broadcaster', 'bls_start_datetime',
    'bls_end_datetime', 'contact_bls_survey_id', 'non_contact_bls_survey_id', 'gender', 'start_age',
    'end_age', 'pref', 'city', 'affinity', 'demography', 'annual_income', 'tv_usage_tendency',
    'carrier', 'uid_suffix', 'genre', 'genre_exclude', 'subgenre', 'subgenre_exclude', 'contents_group',
    'bid_segment', 'upload_segment_expansion_threshold', 'bid_segment_exclude', 'dmp_segment',
    'dmp_segment_expansion_threshold', 'dmp_segment_exclude', 'store_segment', 'bls_store_segment',
  ];
  // C3-C4-1：Register GP原始配置用于聚合及取值，与旧matchingFields独立。
  // Edit不提供视频尺，继续使用既有ADGROUP_FIELDS及ID聚合。
  const REGISTER_ADGROUP_FIELDS = ['tver_video_duration', ...ADGROUP_FIELDS];
  const AD_FIELDS = [
    'creative_id', 'creative_name', 'url', 'tracking_url_start', 'tracking_url_first_quartile',
    'tracking_url_midpoint', 'tracking_url_third_quartile', 'tracking_url_complete', 'start_time',
    'end_time', 'status',
  ];

  function fieldsForScope(values, fields){
    const output={};
    fields.forEach(field => { output[field]=String(values[field] ?? ''); });
    return output;
  }

  function sourceRefsForScope(row, fields){
    const output={};
    fields.forEach(field => { output[field]=row.sourceRefs ? row.sourceRefs[field] : row.source; });
    return output;
  }

  // A17-1：仅收集 Register 原始字段来源。这里绝不解释空值、选择业务字段值或改变实体聚合。
  function sourceRefIdentity(source){
    if(!source) return '';
    return JSON.stringify([source.fileName ?? '', source.sheetName ?? null, source.rowNumber ?? null, source.columnName ?? '', source.rawValue ?? '']);
  }

  function uniqueSourceRefs(sources){
    const seen=new Set();
    return (sources || []).filter(source => {
      if(!source) return false;
      const key=sourceRefIdentity(source);
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function collectFieldEvidence(rawRows, field){
    const sources=[];
    (rawRows || []).forEach(row => {
      const source=row && row.sourceRefs && row.sourceRefs[field];
      if(source) sources.push(source);
    });
    return uniqueSourceRefs(sources);
  }

  // Register 的 primary 只可对应当前既有 entity.fields 原文；不得用首行或首个非空值回退。
  function selectPrimaryEvidenceForRawValue(evidence, rawValue){
    const expected=String(rawValue ?? '');
    return (evidence || []).find(source => String(source.rawValue ?? '')===expected) || null;
  }

  const REGISTER_PRIMARY_FIELD_MAP={
    Campaign:{
      campaign_name:'campaignName', start_datetime:'startDateTime', end_datetime:'endDateTime', budget:'budget',
      daily_budget:'dailyBudget', hourly_bid_weight:'hourlyBidWeight', campaign_status:'campaignStatus', consumption_type:'consumptionType', report_target_flag:'reportTargetFlag',
    },
    'Ad Group':{
      adgroup_name:'adGroupName', device:'device', price:'price', media:'media', local_broadcaster:'localBroadcaster', gender:'gender',
      start_age:'startAge', end_age:'endAge', pref:'pref', city:'city', affinity:'affinity', genre:'genre', genre_exclude:'genreExclude',
      subgenre:'subgenre', subgenre_exclude:'subgenreExclude', contents_group:'contentsGroup',
    },
    Ad:{
      creative_name:'creativeName', url:'landingPageUrl', tracking_url_start:'trackingUrlStart', tracking_url_first_quartile:'trackingUrlFirstQuartile',
      tracking_url_midpoint:'trackingUrlMidpoint', tracking_url_third_quartile:'trackingUrlThirdQuartile', tracking_url_complete:'trackingUrlComplete',
      status:'status',
    },
  };

  // A17-1C：Register 原始 evidence 仅属于其 CSV 实体层级；绝不把下级字段伪装成父级原始来源。
  const REGISTER_SOURCE_FIELDS_BY_LEVEL=Object.freeze({
    Campaign:['budget_type', ...CAMPAIGN_FIELDS],
    'Ad Group':REGISTER_ADGROUP_FIELDS,
    Ad:AD_FIELDS,
  });

  function attachRegisterSourceEvidence(entity){
    const fields={};
    const ownedFields=REGISTER_SOURCE_FIELDS_BY_LEVEL[entity && entity.level] || [];
    ownedFields.forEach(field => { fields[field]=collectFieldEvidence(entity && entity.rawRows, field); });
    entity.sourceEvidence={ ...(entity.sourceEvidence || {}), fields };
    const primaryMap=REGISTER_PRIMARY_FIELD_MAP[entity && entity.level] || {};
    Object.entries(primaryMap).forEach(([csvField, entityField]) => {
      // sourceRefs.csv 是既有实体 primary，不改写；仅补齐此前不存在的字段 primary。
      if(entity.sourceRefs && entity.sourceRefs[csvField]!==undefined) return;
      const primary=selectPrimaryEvidenceForRawValue(fields[csvField], entity && entity.fields && entity.fields[entityField]);
      if(primary) entity.sourceRefs[csvField]=primary;
    });
  }

  function tverCsvScopeSemanticValue(field,raw){
    if(field==='cv_point'){
      const parsed=parseTverCvPointCollection(raw,false);return {known:!parsed.reason && parsed.value!==null,value:parsed.value,ruleId:'TVER_FIX4_CV_POINT_ID_SET'};
    }
    let parsed=null;
    if(['budget','daily_budget'].includes(field))parsed=normalizeTverBudgetForComparison(raw);
    else if(['start_datetime','end_datetime','adgroup_start_datetime','adgroup_end_datetime'].includes(field))parsed=normalizeTverDateTimeForComparison(raw);
    else if(field==='price')parsed=normalizeTverPriceForMatching(raw);
    else if(field==='device')parsed=normalizeTverDevice(raw);
    return parsed ? {known:parsed.state==='known' && parsed.value!==null,value:parsed.value,ruleId:parsed.ruleId || 'TVER_CONFIRMED_FIELD_CANONICAL'} : {known:false,value:null};
  }

  function tverCsvScopeSemanticConsensus(field,values){
    const parsed=values.map(value=>tverCsvScopeSemanticValue(field,value));
    if(!parsed.length || parsed.some(value=>!value.known) || new Set(parsed.map(value=>String(value.value))).size!==1)return null;
    return {value:String(parsed[0].value),ruleId:parsed[0].ruleId};
  }

  function auditScopeConflicts(entity, row, fields, diagnostics){
    fields.forEach(field => {
      const next=String(row.values[field] ?? '');
      if(!tverCsvScopeSemanticConsensus(field,[String(entity.fields[field] ?? ''),next]))addEntityConflict(entity, diagnostics, 'DUPLICATE_ID_FIELD_CONFLICT', field, entity.fields[field], next, row.rowNumber);
    });
  }

  function buildEditTree(parsedCsv){
    const diagnostics=[];
    const campaigns=[];
    const adGroups=[];
    const ads=[];
    const orphans=[];
    const entityByKey={};
    const rowLedger={};
    const campaignById=new Map();
    const adGroupById=new Map();
    const adById=new Map();
    const rows=parsedCsv && Array.isArray(parsedCsv.rows) ? parsedCsv.rows : [];

    rows.forEach(row => {
      const values=row.values || {};
      const ids=[
        { field:'campaign_id', level:'Campaign' },
        { field:'adgroup_id', level:'Ad Group' },
        { field:'ad_id', level:'Ad' },
      ];
      const invalid=ids.find(item => !isValidTverId(values[item.field]));
      if(invalid){
        const rawValue=String(values[invalid.field] ?? '');
        const validationIssue={
          code:rawValue.trim()==='' ? 'MISSING_ID' : 'INVALID_ID',
          field:invalid.field,
          rawValue,
          source:row.source,
        };
        const orphan={
          key:`orphan:${row.rowNumber}:${invalid.level}`,
          level:invalid.level,
          id:null,
          parentKey:null,
          fields:{ ...values },
          sourceRefs:{ csv:row.source },
          rawRows:[row],
          occurrenceIndex:row.occurrenceIndex,
          conflictIssues:[],
          validationIssues:[validationIssue],
          matchable:false,
          orphanReason:validationIssue,
          displayHint:'CSV側未匹配',
        };
        orphans.push(orphan);
        entityByKey[orphan.key]=orphan;
        rowLedger[row.rowNumber]={ disposition:'orphan', entityKey:orphan.key };
        diagnostics.push({ ...validationIssue, entityKey:orphan.key });
        return;
      }

      const campaignId=String(values.campaign_id).trim();
      const adGroupId=String(values.adgroup_id).trim();
      const adId=String(values.ad_id).trim();
      let campaign=campaignById.get(campaignId);
      if(!campaign){
        campaign=makeCsvEntity(`campaign:${campaignId}`, 'Campaign', {
          id:campaignId, ...fieldsForScope(values, CAMPAIGN_FIELDS),
        }, row.source, null);
        campaign.sourceRefs={ ...sourceRefsForScope(row, CAMPAIGN_FIELDS), campaign_id:row.sourceRefs.campaign_id };
        campaignById.set(campaignId, campaign);
        campaigns.push(campaign);
        entityByKey[campaign.key]=campaign;
      }else{
        auditScopeConflicts(campaign, row, CAMPAIGN_FIELDS, diagnostics);
      }
      campaign.rawRows.push(row);

      let adGroup=adGroupById.get(adGroupId);
      if(!adGroup){
        adGroup=makeCsvEntity(`adgroup:${adGroupId}`, 'Ad Group', {
          id:adGroupId, campaignId, ...fieldsForScope(values, ADGROUP_FIELDS),
        }, row.source, campaign.key);
        adGroup.sourceRefs={ ...sourceRefsForScope(row, ADGROUP_FIELDS), campaign_id:row.sourceRefs.campaign_id, adgroup_id:row.sourceRefs.adgroup_id };
        adGroupById.set(adGroupId, adGroup);
        adGroups.push(adGroup);
        entityByKey[adGroup.key]=adGroup;
      }else{
        addEntityConflict(adGroup, diagnostics, 'EDIT_PARENT_ID_CONFLICT', 'campaign_id', adGroup.fields.campaignId, campaignId, row.rowNumber);
        auditScopeConflicts(adGroup, row, ADGROUP_FIELDS, diagnostics);
      }
      adGroup.rawRows.push(row);

      let ad=adById.get(adId);
      if(!ad){
        ad=makeCsvEntity(`ad:${adId}`, 'Ad', {
          id:adId, adGroupId, ...fieldsForScope(values, AD_FIELDS),
        }, row.source, adGroup.key);
        ad.sourceRefs={ ...sourceRefsForScope(row, AD_FIELDS), adgroup_id:row.sourceRefs.adgroup_id, ad_id:row.sourceRefs.ad_id };
        adById.set(adId, ad);
        ads.push(ad);
        entityByKey[ad.key]=ad;
      }else{
        addEntityConflict(ad, diagnostics, 'EDIT_PARENT_ID_CONFLICT', 'adgroup_id', ad.fields.adGroupId, adGroupId, row.rowNumber);
        auditScopeConflicts(ad, row, AD_FIELDS, diagnostics);
      }
      ad.rawRows.push(row);
      rowLedger[row.rowNumber]={ disposition:'normal-leaf', entityKey:ad.key };
    });

    [...campaigns,...adGroups,...ads].forEach(entity=>{
      const fields=entity.level==='Campaign' ? CAMPAIGN_FIELDS : entity.level==='Ad Group' ? ADGROUP_FIELDS : AD_FIELDS;
      entity.sourceEvidence={fields:Object.fromEntries(fields.map(field=>[field,collectFieldEvidence(entity.rawRows,field)]))};
      entity.fieldConflicts={};entity.fieldVariations={};
      fields.forEach(field=>{const values=[...new Set(entity.rawRows.map(row=>String(row.values[field] ?? '')))];if(values.length>1){const semantic=tverCsvScopeSemanticConsensus(field,values),details={field,values,sources:collectFieldEvidence(entity.rawRows,field),rowNumbers:entity.rawRows.map(row=>row.rowNumber)};if(semantic)entity.fieldVariations[field]={...details,...semantic};else entity.fieldConflicts[field]=details;}});
      if(entity.conflictIssues.some(issue=>issue.code==='EDIT_PARENT_ID_CONFLICT')) entity.matchable=false;
    });

    return {
      schema:parsedCsv ? parsedCsv.schema : null,
      campaigns, adGroups, ads, entityByKey, orphans, rowLedger, diagnostics,
      comparisonInputs:{ csvEntities:ads, csvOnly:orphans },
    };
  }

  function signatureFor(fields){
    return JSON.stringify(fields);
  }

  function buildRegisterTree(parsedCsv){
    const diagnostics=[];
    const campaigns=[];
    const adGroups=[];
    const ads=[];
    const entityByKey={};
    const rowLedger={};
    const campaignBySignature=new Map();
    const adGroupBySignature=new Map();
    const occurrenceByFullRowSignature=new Map();
    const rows=parsedCsv && Array.isArray(parsedCsv.rows) ? parsedCsv.rows : [];

    rows.forEach(row => {
      const values=row.values || {};
      const campaignFields={
        campaignName:String(values.campaign_name ?? ''),
        startDateTime:String(values.start_datetime ?? ''),
        endDateTime:String(values.end_datetime ?? ''),
        budget:String(values.budget ?? ''),
        reportTargetFlag:String(values.report_target_flag ?? ''),
        dailyBudget:String(values.daily_budget ?? ''),
        hourlyBidWeight:String(values.hourly_bid_weight ?? ''),
        campaignStatus:String(values.campaign_status ?? ''),
        consumptionType:String(values.consumption_type ?? ''),
      };
      const campaignSignature=signatureFor({campaignName:campaignFields.campaignName,missingIdentity:campaignFields.campaignName ? null : row.rowNumber});
      let campaign=campaignBySignature.get(campaignSignature);
      if(!campaign){
        campaign=makeCsvEntity(`register-campaign:${campaignSignature}`, 'Campaign', campaignFields, row.source, null);
        campaign.candidateSignature=campaignSignature;
        campaign.matchingFields={ ...campaignFields };
        campaignBySignature.set(campaignSignature, campaign);
        campaigns.push(campaign);
        entityByKey[campaign.key]=campaign;
      }
      campaign.rawRows.push(row);

      const adGroupFields={
        parentCampaignSignature:campaignSignature,
        adGroupName:String(values.adgroup_name ?? ''),
        device:String(values.device ?? ''),
        price:String(values.price ?? ''),
        media:String(values.media ?? ''),
        localBroadcaster:String(values.local_broadcaster ?? ''),
        gender:String(values.gender ?? ''),
        startAge:String(values.start_age ?? ''),
        endAge:String(values.end_age ?? ''),
        pref:String(values.pref ?? ''),
        city:String(values.city ?? ''),
        affinity:String(values.affinity ?? ''),
        genre:String(values.genre ?? ''),
        genreExclude:String(values.genre_exclude ?? ''),
        subgenre:String(values.subgenre ?? ''),
        subgenreExclude:String(values.subgenre_exclude ?? ''),
        contentsGroup:String(values.contents_group ?? ''),
      };
      const adGroupSignature=signatureFor(adGroupFields);
      const adGroupRawFields=fieldsForScope(values, REGISTER_ADGROUP_FIELDS);
      const aggregationSignature=signatureFor({parentCampaignSignature:campaignSignature,adGroupName:adGroupFields.adGroupName,missingIdentity:adGroupFields.adGroupName ? null : row.rowNumber});
      let adGroup=adGroupBySignature.get(aggregationSignature);
      if(!adGroup){
        adGroup=makeCsvEntity(`register-adgroup:${aggregationSignature}`, 'Ad Group', { ...adGroupRawFields, ...adGroupFields }, row.source, campaign.key);
        adGroup.aggregationSignature=aggregationSignature;
        adGroup.candidateSignature=adGroupSignature;
        adGroup.matchingFields={ ...adGroupFields };
        adGroup.sourceRefs={ ...adGroup.sourceRefs, ...sourceRefsForScope(row, REGISTER_ADGROUP_FIELDS) };
        adGroupBySignature.set(aggregationSignature, adGroup);
        adGroups.push(adGroup);
        entityByKey[adGroup.key]=adGroup;
      }
      adGroup.rawRows.push(row);

      const adMatchingFields={
        parentAdGroupSignature:adGroupSignature,
        creativeName:String(values.creative_name ?? ''),
        landingPageUrl:String(values.url ?? ''),
        trackingUrlStart:String(values.tracking_url_start ?? ''),
        trackingUrlFirstQuartile:String(values.tracking_url_first_quartile ?? ''),
        trackingUrlMidpoint:String(values.tracking_url_midpoint ?? ''),
        trackingUrlThirdQuartile:String(values.tracking_url_third_quartile ?? ''),
        trackingUrlComplete:String(values.tracking_url_complete ?? ''),
      };
      const candidateSignature=signatureFor(adMatchingFields);
      const fullRowSignature=signatureFor(values);
      const occurrenceIndex=(occurrenceByFullRowSignature.get(fullRowSignature) || 0)+1;
      occurrenceByFullRowSignature.set(fullRowSignature, occurrenceIndex);

      // （snake 命名与 edit tree 的 AD_FIELDS 对齐；不改变 candidateSignature / matchingFields / 聚合语义）。
      const ad=makeCsvEntity(`register-ad:${row.rowNumber}`, 'Ad', { ...adMatchingFields, start_time:String(values.start_time ?? ''), end_time:String(values.end_time ?? ''), status:String(values.status ?? '') }, row.source, adGroup.key);
      ad.candidateSignature=candidateSignature;
      ad.matchingFields={ ...adMatchingFields };
      ad.occurrenceIndex=occurrenceIndex;
      ad.rawRows.push(row);
      ads.push(ad);
      entityByKey[ad.key]=ad;
      rowLedger[row.rowNumber]={ disposition:'normal-leaf', entityKey:ad.key };
    });

    // A17-1：在 Register 建树完成后附加来源证据；不改变任何 fields／signature／matchingFields。
    [...campaigns, ...adGroups, ...ads].forEach(entity=>{
      attachRegisterSourceEvidence(entity);
      entity.fieldConflicts={};entity.fieldVariations={};
      const fields=REGISTER_SOURCE_FIELDS_BY_LEVEL[entity.level] || [];
      fields.forEach(field=>{
        const values=[...new Set(entity.rawRows.map(row=>String(row.values[field] ?? '')))];
        if(values.length>1){
          const semantic=tverCsvScopeSemanticConsensus(field,values);
          const conflict={field,values,sources:collectFieldEvidence(entity.rawRows,field),rowNumbers:entity.rawRows.map(row=>row.rowNumber)};
          if(semantic){entity.fieldVariations[field]={...conflict,...semantic};return;}
          entity.fieldConflicts[field]=conflict;
          diagnostics.push({code:'REGISTER_SCOPE_FIELD_CONFLICT',level:entity.level,entityKey:entity.key,field,rowNumbers:conflict.rowNumbers});
        }
      });
      // A name scope is a comparison envelope, never proof that no-ID same-name objects are one.
      const variants=new Map();
      entity.rawRows.forEach(row=>{const values=fieldsForScope(row.values,fields),key=signatureFor(values);if(!variants.has(key))variants.set(key,{values,rowNumbers:[],sourceEvidence:[]});const variant=variants.get(key);variant.rowNumbers.push(row.rowNumber);variant.sourceEvidence.push(row.source);});
      entity.scopeVariants=[...variants.values()];
      entity.identityState=Object.keys(entity.fieldConflicts).length ? 'unresolved-same-name-scope' : 'name-scope';
    });

    return {
      schema:parsedCsv ? parsedCsv.schema : null,
      campaigns, adGroups, ads, entityByKey, orphans:[], rowLedger, diagnostics,
      comparisonInputs:{ csvEntities:ads, csvOnly:[] },
    };
  }

  function decodeBase64Utf8(text){
    const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const bytes=[];
    let buffer=0;
    let bits=0;
    for(const character of String(text ?? '')){
      if(character==='=') break;
      const index=alphabet.indexOf(character);
      if(index<0) continue;
      buffer=(buffer<<6)|index;
      bits+=6;
      if(bits>=8){
        bits-=8;
        bytes.push((buffer>>bits)&255);
      }
    }
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
  }

  function normalizeDictionaryId(rawId){
    return String(rawId ?? '').trim();

  function validateEmbeddedIdDictionaries(dictionaries, expectedCounts, expectedSentinels){
    const counts={};
    const issues=[];
    const countRules=expectedCounts || TVER_ID_DICTIONARY_COUNTS;
    const sentinelRules=expectedSentinels || TVER_ID_SENTINELS;
    Object.entries(countRules).forEach(([type, expectedCount]) => {
      const entries=dictionaries && dictionaries[type];
      counts[type]=Array.isArray(entries) ? entries.length : 0;
      if(!Array.isArray(entries)){
        issues.push({ code:'ID_DICTIONARY_CATEGORY_MISSING', type });
        return;
      }
      if(entries.length!==expectedCount) issues.push({ code:'ID_DICTIONARY_COUNT_INVALID', type, expectedCount, actualCount:entries.length });
      const ids=new Set();
      entries.forEach((entry, index) => {
        const rawId=String((entry && (entry.rawId ?? entry.id)) ?? '');
        const id=normalizeDictionaryId(entry && entry.id!==undefined ? entry.id : rawId);
        const name=String((entry && entry.name) ?? '').trim();
        if(!rawId || !id || !name) issues.push({ code:'ID_DICTIONARY_VALUE_INVALID', type, index });
        if(ids.has(id)) issues.push({ code:'ID_DICTIONARY_NORMALIZED_ID_DUPLICATE', type, id });
        ids.add(id);
      });
      const sentinels=sentinelRules[type];
      if(sentinels && entries.length){
        const first=normalizeDictionaryId(entries[0].id);
        const last=normalizeDictionaryId(entries[entries.length-1].id);
        if(first!==sentinels[0] || last!==sentinels[1]) issues.push({ code:'ID_DICTIONARY_SENTINEL_INVALID', type, expected:sentinels, actual:[first,last] });
      }
    });
    return { valid:issues.length===0, templateVersion:TVER_TEMPLATE_VERSION, counts, issues };
  }

  function validateIdDictionaries(dictionaries){

    if(!result.valid) throw new Error(`ID_DICTIONARY_INVALID:${result.issues.map(issue => issue.code).join(',')}`);
    return result;
  }

  // NEW FMT：主業務表 row-level「デバイス」列の canonical 化。
  // ios / android / pc / ctv のみを受理し、区切り・順序・重複に鈍感な canonical を返す。
  // 未知 token は推測せず state='unknown'（＝要確認）、空は state='empty'。
  // 既存の parseTverDeviceSet / normalizeTverDevice（SP／PC・CTV 表記）には一切手を入れない。
  const TVER_EXPLICIT_DEVICE_TOKENS=Object.freeze(['android', 'ctv', 'ios', 'pc']);
  function canonicalizeTverExplicitDevice(rawValue){
    const raw=String(rawValue ?? '').trim();
    if(!raw) return { rawValue:raw, value:null, state:'empty', tokens:[] };
    const tokens=raw.split(/[\s,、，/／|｜;；・]+/).map(token => token.trim().toLowerCase()).filter(Boolean);
    const seen=new Set();
    for(const token of tokens){
      if(!TVER_EXPLICIT_DEVICE_TOKENS.includes(token)) return { rawValue:raw, value:null, state:'unknown', tokens };
      seen.add(token);
    }
    if(!seen.size) return { rawValue:raw, value:null, state:'empty', tokens:[] };
    const ordered=TVER_EXPLICIT_DEVICE_TOKENS.filter(token => seen.has(token));
    return { rawValue:raw, value:ordered.join(' '), state:'known', tokens:ordered };
  }

  function normalizeTverVideoDuration(value){
    const seconds=typeof value==='number' ? value : Number(String(value ?? '').trim());
    if(!Number.isInteger(seconds)) return null;
    if(seconds>=6 && seconds<=10) return '6';
    if(seconds>=11 && seconds<=22) return '15';
    if(seconds>=23 && seconds<=37) return '30';
    if(seconds>=38 && seconds<=52) return '45';
    if(seconds>=53 && seconds<=60) return '60';
    return null;
  }

  function parseTverVideoDuration(rawValue){
    const raw=String(rawValue ?? '');
    const direct=raw.match(/^(6|15|30|45|60)$/);
    if(direct) return { rawValue:raw, value:direct[1], state:'known', ruleId:'TVER_260605_VIDEO_DURATION_DIRECT' };
    const ranged=raw.match(/^(6|15|30|45|60)秒\((\d+)-(\d+)秒\)$/);
    if(!ranged) return { rawValue:raw, value:null, state:'unknown', ruleId:null };
    const registeredRanges={
      '6':{ start:'6', end:'10', ruleId:'TVER_260605_VIDEO_DURATION_6_10' },
      '15':{ start:'11', end:'22', ruleId:'TVER_260605_VIDEO_DURATION_11_22' },
      '30':{ start:'23', end:'37', ruleId:'TVER_260605_VIDEO_DURATION_23_37' },
      '45':{ start:'38', end:'52', ruleId:'TVER_260605_VIDEO_DURATION_38_52' },
      '60':{ start:'53', end:'60', ruleId:'TVER_260605_VIDEO_DURATION_53_60' },

    if(!match) return [validationIssue('INVALID_DATETIME', field, rawValue, source)];
    const year=Number(match[1]);
    const month=Number(match[2]);
    const day=Number(match[3]);
    const hour=Number(match[4]);
    const minute=Number(match[5]);
    const second=match[6]===undefined ? 0 : Number(match[6]);
    if(!isValidCalendarDate(year, month, day) || hour>23 || minute>59 || second>59) return [validationIssue('INVALID_DATETIME', field, rawValue, source)];

    if(minute!==0 && minute!==30) issues.push(validationIssue('DATETIME_NOT_30_MINUTE_GRANULARITY', field, rawValue, source));

  // 真实⑤⑥⑦⑧ CSV 存在 H:M 形態（例「0:0」）；越界（hour>23/minute>59/second>59）
  // 与 3 桁以上桁数は拒否（「12:345」「24:00」「00:60」等）。validateAdTime と
  // normalizeTverAdTimeForComparison は同一解析を共有し、判定ずれを起こさない。
  function parseTverAdTimeComponents(rawValue){
    const match=String(rawValue ?? '').trim().match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
    if(!match) return null;
    const hour=Number(match[1]);
    const minute=Number(match[2]);
    const second=match[3]===undefined ? 0 : Number(match[3]);
    if(hour>23 || minute>59 || second>59) return null;
    return { hour, minute, second };
  }

  function validateAdTime(field, rawValue, source){

    // C3-C5-CR-REOPEN-5 FIX A：更に H:M（例「0:0」）形態を含む 1~2 桁入力を共有解析で受理。
    // canonical 化後統一校验；end_time 默认契約 23:59 豁免模板粒度检查。
    const parsed=parseTverAdTimeComponents(rawValue);
    if(!parsed) return [validationIssue('INVALID_AD_TIME', field, rawValue, source)];
    const canonical=`${String(parsed.hour).padStart(2,'0')}:${String(parsed.minute).padStart(2,'0')}`;
    if(field==='end_time' && canonical==='23:59') return [];
    if(parsed.minute!==0 && parsed.minute!==30) return [validationIssue('AD_TIME_NOT_TEMPLATE_GRANULARITY', field, rawValue, source)];
    return [];
  }

  // 上層は原値で保守比較（validateAdTime と同共享解析のため判定ずれなし）。
  function normalizeTverAdTimeForComparison(rawValue){
    const parsed=parseTverAdTimeComponents(rawValue);

  function validateUrl(field, rawValue, source){

    const macros=raw.match(/\{[^}]*\}/g) || [];
    macros.forEach(macro => {

  function normalizeTverDateTimeForComparison(rawValue){

      ...(input || {}),

    const gpPeriodGuard=resolveTverGpPeriodGuard(comparisonInput, settingRawValue, csvRawValue);
    const gpAgeGuard=resolveTverGpAgeGuard(comparisonInput, settingRawValue, csvRawValue);

      ...(input && input.csvConflictRawValues ? (input.sourceEvidence && input.sourceEvidence.csv || []).flatMap(source=>validateField({field,value:source.rawValue,source})) : validateField({ field, value:csvValidationValue, source:input && input.csvSource })).map(issue => ({ ...issue, side:'CSV値' })),

    entries.forEach(entry => { if(entry.displayStatus) statusCounts[entry.displayStatus]+=1; });

  function parseTverIdSet(rawValue){
    const raw=String(rawValue ?? '');

  }

  // NO005：ID 集合の差分は「順序に依存しない集合比較」で求める。表示順だけ数値昇順に整える
  // （数値でない ID は文字列順）。'08' と '8' を同一視する変換は行わない。
  function tverSortIdsForDisplay(idList){
    const list=[...(idList || [])];
    return list.sort((left, right) => {
      const leftNumber=Number(left);
      const rightNumber=Number(right);
      const leftNumeric=left!=='' && Number.isFinite(leftNumber);
      const rightNumeric=right!=='' && Number.isFinite(rightNumber);
      if(leftNumeric && rightNumeric) return leftNumber-rightNumber || String(left).localeCompare(String(right));
      if(leftNumeric!==rightNumeric) return leftNumeric ? -1 : 1;
      return String(left).localeCompare(String(right));
    });

  function buildTverIdSetDiff(expectedValue, actualValue){

    const expectedSet=new Set(expectedIds);
    const actualSet=new Set(actualIds);
    return {
      expectedIds, actualIds,
      missingIds:expectedIds.filter(id => !actualSet.has(id)),
      extraIds:actualIds.filter(id => !expectedSet.has(id)),

  }

  function sameTverIdSet(left, right){

  function compareTverIdSets(settingValue, csvValue, dictionaryType){

    if(!dictionary) return { status:'dictionary-unavailable', dictionaryType, setting, csv };
    const known=new Set(dictionary.map(entry => entry.id));
    const unknownIds=[...setting.include.ids, ...setting.exclude.ids, ...csv.include.ids, ...csv.exclude.ids].filter(id => !known.has(id));
    if(unknownIds.length) return { status:'unknown-id', dictionaryType, setting, csv, unknownIds:[...new Set(unknownIds)].sort() };

  function tverA17CsvFieldName(schemaKind, logicalField){

  function tverA17CanonicalIdSet(rawValue, dictionaryType){
    const raw=strictText(rawValue).trim();
    if(!raw) return null;

    const known=new Set(dictionary.map(entry => entry.id));

  function tverA17CanonicalNames(rawValue, dictionaryType){
    const raw=strictText(rawValue).trim();
    if(!raw) return null;
    const dictionary=TVER_ID_DICTIONARIES[dictionaryType] || [];
    const byName=new Map(dictionary.map(entry => [entry.name, entry.id]));
    // NO030：subgenre は旧名称別名と英語 ID の直接指定も同一視する（改名で過去テンプレートを壊さない）。
    if(dictionaryType==='subgenre') Object.entries(TVER_SUBGENRE_ALIASES).forEach(([alias, id]) => byName.set(alias, id));
    const names=raw.split(/[、,，\s]+/).map(value => value.trim()).filter(Boolean);
    const ids=names.map(name => byName.has(name) ? byName.get(name) : (dictionary.some(entry => entry.id===name) ? name : null));
    if(!names.length || ids.some(id => !id)) return null;
    return [...new Set(ids)].sort().join(' ');
  }

  function tverA17GenreCanonical(rawValue){
    const raw=strictText(rawValue).trim();
    if(!raw) return null;

    const byName=new Map(dictionary.map(entry => [normalize(entry.name), entry.id]));
    const names=raw.split(/[、,，\s]+/).map(value => value.trim()).filter(Boolean);
    if(!names.length) return null;
    const ids=names.map(name => byName.get(normalize(name)) || (dictionary.some(entry => entry.id===name) ? name : null));
    return ids.every(Boolean) ? [...new Set(ids)].sort().join(' ') : null;
  }

  function tverA17PrefCanonicalValue(rawValue){

    if(!annotationMarker){ const resolved=tverA17CanonicalNames(raw, 'pref'); return resolved!==null ? resolved : tverPrefCanonicalIds(raw); }
    const currentValue=raw.slice(0, annotationMarker.index).trim();

  const TVER_C3_C4_4D_TARGETING_SPECS=Object.freeze({

  const TVER_C3_C4_4D_ANNUAL_INCOME_CODES=Object.freeze({ '600万円以上':'6', '800万円以上':'8', '1000万円以上':'10' });

  function tverC344NormalizeWhitespace(rawValue){

  const TVER_ASR_ORDER='0123456789ABCDEF';
  // NO032：ASR は 0〜F の固定順。全角/半角・範囲記号差を許容し、矢印は「初期設定＝左側」だけを読む。
  function tverAsrNormalizeText(rawValue){
    return String(rawValue ?? '')
      .replace(/[０-９Ａ-Ｆａ-ｆ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
      .replace(/[～〜]/g, '~')
      .replace(/[→⇒]/g, '->')
      .replace(/[\s\u3000]+/g, ' ')
      .trim();
  }
  function tverAsrParseCollection(rawValue){
    const normalized=tverAsrNormalizeText(rawValue);
    if(!normalized) return { value:'', ids:[], duplicate:false, initialOnly:false };
    const parts=normalized.split(/\s*->\s*/);
    const text=parts[0].trim();
    const initialOnly=parts.length>1;
    let tokens=[];
    if(/^[0-9A-F]のみ$/.test(text)){
      tokens=[text.charAt(0)];
    }else{
      const range=text.match(/^([0-9A-F])\s*~\s*([0-9A-F])$/);
      if(range){
        const start=TVER_ASR_ORDER.indexOf(range[1]);
        const end=TVER_ASR_ORDER.indexOf(range[2]);
        if(start<0 || end<0 || start>end) return { value:null, ids:null, duplicate:false, initialOnly };
        tokens=TVER_ASR_ORDER.slice(start,end+1).split('');
      }else{
        const items=text.split(/[\s,]+/).filter(Boolean);
        if(!items.length || items.some(token => !/^[0-9A-F]$/.test(token))) return { value:null, ids:null, duplicate:false, initialOnly };
        tokens=items;
      }
    }
    const duplicate=new Set(tokens).size!==tokens.length;
    const sorted=[...new Set(tokens)].sort((left,right)=>TVER_ASR_ORDER.indexOf(left)-TVER_ASR_ORDER.indexOf(right));
    return { value:sorted.join(' '), ids:sorted, duplicate, initialOnly };

  function resolveSettingC344TargetingForComparison(entity, field){

    if(!sources.length) return tverA17TargetingResult({

    const candidates=businessSources.map(source => ({

      normalizedValue:tverC344NormalizeWhitespace(source.rawValue),
      canonicalValue:tverC344SettingCanonical(field, source.rawValue),
    }));
    const semanticKeys=new Set(candidates.map(candidate => candidate.canonicalValue===null

  }

  function parseTverAgeExpression(rawValue){
    const raw=strictText(rawValue).trim();

    if(closed){

      const maxAge=Number(closed[2]);

      return { canonicalValue:`${minAge}-${TVER_TARGETING_MAX_AGE}`, minAge, maxAge:TVER_TARGETING_MAX_AGE, upperOpen:true, ruleId:'TVER_C3_C4_4B_AGE_OPEN_UPPER_BOUND' };

      primarySource:null, sourceEvidence:[], derivedFrom:[], ruleBasis:null, diagnostics:[], shouldGenerate:false,

    };
  }

  function tverA17BusinessRawValue(sources){
    return [...new Set((sources || []).map(source => strictText(source && source.rawValue).trim()).filter(Boolean))].join(' | ');

  function tverC343RuleSource(field, rawValue, ruleId){
    return {
      fileName:'embedded:TVER_260605', sheetName:'C3-C4-3 GP contract', rowNumber:0,
      columnName:field, rawValue:String(rawValue ?? ''), ruleId,
    };
  }

  function tverC343StatusHintSource(entity){
    const identity=entity && entity.displayIdentity || {};
    if(identity.sourceRefs && identity.sourceRefs.statusHint) return identity.sourceRefs.statusHint;
    const targeting=entity && entity.sourceEvidence && entity.sourceEvidence.targeting || {};

  function resolveSettingAdGroupStatus(entity){
    const row=resolveTverRowField(entity,'adgroup_status');if(row) return row;
    const identity=entity && entity.displayIdentity;
    // 没有 C3-C4-2 identity 时继续保留旧的“当前状态证据未提供”语义。
    if(!identity) return tverA17TargetingResult({ ruleBasis:'TVER_C3_C4_3_ADGROUP_STATUS_FROM_TARGETING_STATUS_HINT', diagnostics:[{ code:'SETTING_STATUS_HINT_NOT_PROVIDED' }] });
    const statusHint=strictText(identity.statusHint).trim();
    const source=tverC343StatusHintSource(entity);
    const off=/^初動\s*[:：]?\s*(?:OFF|ＯＦＦ|オフ)$/i.test(statusHint);
    const value=off ? '0' : '1';
    const displayValue=off ? '初動OFF' : '通常';
    const evidence=uniqueSourceRefs([source]);
    return tverA17TargetingResult({
      rawValue:value, displayValue, canonicalValue:value, evidenceState:'available', comparable:true,
      primarySource:source, sourceEvidence:evidence, derivedFrom:evidence,
      ruleBasis:'TVER_C3_C4_3_ADGROUP_STATUS_FROM_TARGETING_STATUS_HINT', diagnostics:[], shouldGenerate:true,
    });
  }

  function tverC343OtherSettingsSources(entity){
    const evidence=entity && entity.sourceEvidence || {};
    const fields=evidence.fields || {};

    return uniqueSourceRefs([

  function resolveSettingAdGroupAuctionType(entity){
    const directEvidence=entity && entity.sourceEvidence && entity.sourceEvidence.fields && entity.sourceEvidence.fields.auction_type || [];
    const directSources=uniqueSourceRefs([...(Array.isArray(directEvidence) ? directEvidence : []), entity && entity.sourceRefs && entity.sourceRefs.auction_type]);
    const directValues=directSources.map(source => strictText(source && source.rawValue).trim()).filter(Boolean);
    if(directValues.length){
      const directKnown=[...new Set(directValues.filter(value => /^[12]$/.test(value)))];
      if(directKnown.length===1 && directKnown.length===directValues.length){
        const selected=directSources.find(source => strictText(source.rawValue).trim()===directKnown[0]);

        sourceEvidence:directSources, derivedFrom:directSources, ruleBasis:'TVER_C3_C4_3_AUCTION_EXPLICIT',
        diagnostics:[{ code:'AUCTION_TYPE_SPECIAL_SETTING_UNCONFIRMED' }], shouldGenerate:true });
    }
    const sources=tverC343OtherSettingsSources(entity);
    const business=sources.filter(source => strictText(source && source.rawValue).trim()!=='');
    const auctionSources=business.filter(source => /auction_type|オークション|入札方式|入札タイプ/i.test(strictText(source.rawValue)));
    if(!auctionSources.length){
      const ruleSource=tverC343RuleSource('auction_type', '1', 'TVER_C3_C4_3_AUCTION_DEFAULT_1');
      // NEW FMT：「オークションタイプ」行が存在して空の場合、その空セルを supporting evidence として保持する。
      // 値 '1' は rule-derived であり、セル値 '1' を偽造しない（primary は rule source のまま）。
      const blankAuctionEvidence=directSources.filter(source => source && source.columnName==='オークションタイプ' && strictText(source.rawValue).trim()==='');
      return tverA17TargetingResult({ rawValue:'1', canonicalValue:'1', evidenceState:'available', comparable:true,
        primarySource:ruleSource, sourceEvidence:uniqueSourceRefs([...sources, ...blankAuctionEvidence, ruleSource]), derivedFrom:uniqueSourceRefs([ruleSource]),
        ruleBasis:'TVER_C3_C4_3_AUCTION_DEFAULT_1', diagnostics:[], shouldGenerate:true });
    }
    const candidates=auctionSources.map(source => {
      const match=strictText(source.rawValue).match(/(?:auction_type|オークション(?:タイプ|設定)?|入札(?:方式|タイプ)?)\s*[:：=]?\s*([12])(?:\D|$)/i);
      return { source, canonicalValue:match ? match[1] : null };
    });
    const known=[...new Set(candidates.filter(candidate => candidate.canonicalValue!==null).map(candidate => candidate.canonicalValue))];
    if(known.length===1 && candidates.every(candidate => candidate.canonicalValue===known[0])){
      const selected=candidates.find(candidate => candidate.canonicalValue===known[0]);
      return tverA17TargetingResult({ rawValue:strictText(selected.source.rawValue), canonicalValue:known[0], evidenceState:'available', comparable:true,
        primarySource:selected.source, sourceEvidence:sources, derivedFrom:sources,
        ruleBasis:'TVER_C3_C4_3_AUCTION_EXPLICIT', diagnostics:[], shouldGenerate:true });
    }
    return tverA17TargetingResult({ rawValue:tverA17BusinessRawValue(auctionSources), evidenceState:'ambiguous', comparable:false,
      sourceEvidence:sources, derivedFrom:sources, ruleBasis:'TVER_C3_C4_3_AUCTION_EXPLICIT',
      diagnostics:[{ code:'AUCTION_TYPE_SPECIAL_SETTING_UNCONFIRMED' }], shouldGenerate:true });
