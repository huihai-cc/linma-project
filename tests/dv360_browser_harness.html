<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>DV360 local browser harness</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;}
  </style>
</head>
<body>
<script>
  const expiry = Date.now() + 60 * 60 * 1000;
  localStorage.setItem('qc_session', JSON.stringify({
    token: btoa('local-browser-test|' + expiry),
    user: { name: 'Local Browser Test', email: 'local@test.invalid' }
  }));
</script>
<iframe
  id="dv360-frame"
  title="DV360 設定チェック"
  src="../dv360_check.html"
  onload="localStorage.removeItem('qc_session')">
</iframe>
</body>
</html>
